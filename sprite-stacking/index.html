<!DOCTYPE html>

<title>Sprite Stacking: Gang Perumahan</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }

  #hud.min label { display: none; }
  #hudToggle { background: none; border: 0; color: #fff; font: inherit; padding: 0; cursor: pointer; text-decoration: underline; opacity: .7; }
  #acts { position: fixed; right: 8px; top: 52px; display: none; flex-direction: column; gap: 4px; z-index: 4; }
  body.human #acts { display: flex; }
  #acts button { background: #000a; color: #fff; border: 1px solid #fff3; border-radius: 7px; padding: 5px 8px; font: 12px system-ui; min-width: 76px; display: flex; justify-content: space-between; gap: 6px; }
  #acts button small { opacity: .55; }
  #acts button.on { background: #2a5bd7; }

  #help { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); background: #000a; padding: 5px 10px; border-radius: 8px; font-size: 12px; white-space: nowrap; z-index: 4; }
  .touch { position: fixed; bottom: 18px; display: none; gap: 10px; z-index: 4; }

<script>

  D: '#3d4250', // sendi/kaki

  E: '#5ff2ff', // mata
  P: '#5ff2ff', // lampu dada
  r: '#ff4a4a', // lampu antena
};
// Ukuran: panjang 10 (x), lebar 14 (y), tinggi 22 (z)
const ROBOT_VIEWS = {

    '.KSSSSSSVK',

/* =====================================================================
   0. INTI SPRITE STACKING
   Model = grid voxel L×W×H. Slice ke-z = gambar tampak-atas lapisan z.
   Render: gambar slice dari bawah ke atas, tiap slice naik 1 px, semua
   diputar dengan sudut yang sama.
   ===================================================================== */
const TAU = Math.PI * 2;
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function hash(x, y, z) {
  let h = (x * 374761393 + y * 668265263 + z * 2147483647) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function rng(seed) { let s = (seed >>> 0) || 1; return () => (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296; }
const hexRGB = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const clamp255 = v => Math.max(0, Math.min(255, Math.round(v)));
const mixc = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
// 4 tingkat warna (gelap -> terang) dari satu warna dasar
function ramp(hex) {
  const c = hexRGB(hex);
  return [mixc(c.map(v => v * 0.55), [40, 24, 64], 0.18), c.map(v => v * 0.8), c, mixc(c, [255, 248, 228], 0.3)].map(a => a.map(clamp255));
}
const RAMP_CACHE = {};
const R = hex => RAMP_CACHE[hex] || (RAMP_CACHE[hex] = ramp(hex));

/* buildVox: fill(x,y,z) -> material (atau null); color(x,y,z,m,exp,at) -> [r,g,b].
   exp = sisi mana yang terbuka (top, xp, xn, yp, yn). */
function buildVox(L, W, H, fill, color, o = {}) {
  const bb = o.bbox || [0, 0, 0, L - 1, W - 1, H - 1];
  const grid = new Array(L * W * H);
  const I = (x, y, z) => (z * W + y) * L + x;
  for (let z = bb[2]; z <= bb[5]; z++) for (let y = bb[1]; y <= bb[4]; y++) for (let x = bb[0]; x <= bb[3]; x++) {
    const m = fill(x, y, z);
    if (m) grid[I(x, y, z)] = m;
  }
  const at = (x, y, z) => (x < 0 || y < 0 || z < 0 || x >= L || y >= W || z >= H) ? null : grid[I(x, y, z)];
  const slices = [];
  const shadow = makeCanvas(L, W), sctx = shadow.getContext('2d'), sdata = sctx.createImageData(L, W);
  let top = -1;
  for (let z = 0; z <= bb[5]; z++) {
    let img = null;
    for (let y = bb[1]; y <= bb[4]; y++) for (let x = bb[0]; x <= bb[3]; x++) {
      const m = grid[I(x, y, z)];
      if (!m) continue;
      const e = { top: !at(x, y, z + 1), xp: !at(x + 1, y, z), xn: !at(x - 1, y, z), yp: !at(x, y + 1, z), yn: !at(x, y - 1, z) };
      const c = color(x, y, z, m, e, at);
      if (!img) img = new ImageData(L, W);
      const k = (y * L + x) * 4;
      img.data[k] = c[0]; img.data[k + 1] = c[1]; img.data[k + 2] = c[2]; img.data[k + 3] = 255;
      sdata.data[k + 3] = 255;
    }
    if (img) { const cv = makeCanvas(L, W); cv.getContext('2d').putImageData(img, 0, 0); slices[z] = cv; top = z; }
    else slices[z] = null;
  }
  slices.length = top + 1;
  sctx.putImageData(sdata, 0, 0);
  const model = { L, W, H: slices.length, slices, shadow };
  if (o.views) model.vc = projectViews(L, W, slices.length, at, color);
  return model;
}

// Tampak 4 sisi diproyeksikan dari voxel (untuk tutorial)
function projectViews(L, W, H, at, color) {
  const proj = (w, h, fn) => {
    const c = makeCanvas(w, h), g = c.getContext('2d'), img = g.createImageData(w, h);
    for (let v = 0; v < h; v++) for (let u = 0; u < w; u++) {
      const col = fn(u, v); if (!col) continue;
      const k = (v * w + u) * 4; img.data[k] = col[0]; img.data[k + 1] = col[1]; img.data[k + 2] = col[2]; img.data[k + 3] = 255;
    }
    g.putImageData(img, 0, 0); return c;
  };
  const first = cells => {
    for (const [x, y, z] of cells) {
      const m = at(x, y, z);
      if (m) return color(x, y, z, m, { top: !at(x, y, z + 1), xp: !at(x + 1, y, z), xn: !at(x - 1, y, z), yp: !at(x, y + 1, z), yn: !at(x, y - 1, z) }, at);
    }
    return null;
  };
  const range = (n, rev) => [...Array(n).keys()].map(i => rev ? n - 1 - i : i);
  return {
    top:   proj(L, W, (x, y) => first(range(H, true).map(z => [x, y, z]))),
    side:  proj(L, H, (x, r) => first(range(W).map(y => [x, y, H - 1 - r]))),
    front: proj(W, H, (c, r) => first(range(L, true).map(x => [x, W - 1 - c, H - 1 - r]))),
    back:  proj(W, H, (c, r) => first(range(L).map(x => [x, c, H - 1 - r]))),
  };
}

// Pewarnaan "kotak": atas paling terang, sisi depan/kanan sedang, sisi lain gelap
function boxColor(look) {
  return (x, y, z, m, e) => {
    const r = look(m);
    let i = e.top ? 3 : (e.xp || e.yp) ? 2 : 1;
    if (z === 0 && !e.top) i = Math.max(0, i - 1);
    return r[i];
  };
}
// Pewarnaan "organik": normal permukaan dari tetangga kosong -> cahaya -> 4 tingkat warna
const LIGHT = (() => { const v = [0.35, -0.45, 0.82], l = Math.hypot(...v); return v.map(c => c / l); })();
const NOFF = [];
for (let k = -2; k <= 2; k++) for (let j = -2; j <= 2; j++) for (let i = -2; i <= 2; i++) {
  const d = i * i + j * j + k * k;
  if (d && d <= 6) NOFF.push([i, j, k, 1 / d]);
}
function organicColor(look) {
  return (x, y, z, m, e, at) => {
    const r = look(m);
    if (r.length === 1) return r[0];
    if (!(e.top || e.xp || e.xn || e.yp || e.yn)) return r[1];
    let nx = 0, ny = 0, nz = 0;
    for (const [i, j, k, w] of NOFF) if (!at(x + i, y + j, z + k)) { nx += i * w; ny += j * w; nz += k * w; }
    const l = Math.hypot(nx, ny, nz) || 1;
    const v = 0.38 + 0.62 * Math.max(0, (nx * LIGHT[0] + ny * LIGHT[1] + nz * LIGHT[2]) / l);
    return r[v < 0.5 ? 0 : v < 0.72 ? 1 : v < 0.9 ? 2 : 3];
  };
}
const boxHex = boxColor(R), organicHex = organicColor(R);

/* RENDER inti. model.lift = naik (lompat / duduk di bale), model.yaw = putaran tambahan (jurus putar). */
function drawStack(ctx, m, x, y, angle, spacing = 1, scale = 1, extraLift = 0) {
  const sx = Math.round(x), sy = Math.round(y - ((m.lift || 0) + extraLift) * spacing * scale);
  const a = angle + (m.yaw || 0), c = Math.cos(a) * scale, s = Math.sin(a) * scale;
  const ox = -m.L / 2, oy = -m.W / 2;
  for (let i = 0; i < m.slices.length; i++) {
    const sl = m.slices[i];
    if (!sl) continue;
    ctx.setTransform(c, s, -s, c, sx, sy - i * spacing * scale);
    ctx.drawImage(sl, ox, oy);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
function drawShadow(ctx, m, x, y, angle, scale = 1) {
  const off = (m.shadowOff || 2) * scale, a = angle + (m.yaw || 0);
  const c = Math.cos(a) * scale, s = Math.sin(a) * scale;
  ctx.globalAlpha = 0.26;
  ctx.setTransform(c, s, -s, c, Math.round(x) + off, Math.round(y) + off);
  ctx.drawImage(m.shadow, -m.L / 2, -m.W / 2);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
}

// Font piksel 3×5 untuk tulisan di gapura, warung, mushola
const FONT = {
  A: '010101111101101', B: '110101110101110', D: '110101101101110', E: '111100110100111', G: '011100101101011',
  H: '101101111101101', I: '111010010010111', J: '001001001101010', K: '101101110101101', L: '100100100100111',
  M: '101111111101101', N: '110101101101101', O: '010101101101010', R: '110101110101101', S: '011100010001110',
  T: '111010010010010', U: '101101101101111', W: '101101111111101', ' ': '000000000000000',
};
function textMask(str, sc, gap) {
  const cw = 3 * sc + gap, w = str.length * cw - gap, h = 5 * sc;
  return { w, h, at(u, v) {

      const lo = Math.min(a[2], b[2]), hi = Math.max(a[2], b[2]);
      if (z >= lo && z <= hi && hi > lo) xs.push(a[0] + (b[0] - a[0]) * (z - a[2]) / (b[2] - a[2]));

  };
  const lowerFn = (p, x, y, z) => {
    for (const l of legs) {
      if (st.shoeStyle === 'sandal') {
        if (capsule(p, l.ankle, l.toe, 1.15 * S, 1.05 * S) >= 0) return p[2] < Math.min(l.ankle[2], l.toe[2]) - 0.5 * S ? 'sole' : 'skin';
      } else if (capsule(p, l.ankle, l.toe, 1.3 * S, 1.15 * S) >= 0) return 'shoe';
    }
    const wx = p[0] - pelvis[0], wy = p[1] - pelvis[1], wz = p[2] - pelvis[2];
    const t = ((wx * up[0] + wz * up[2]) / S + 1.0) / 9;
    if (t >= 0 && t < 0.2) {
      const ry = 2.6 + 0.9 * t, rx = 1.9 + 0.35 * t;
      if (((wx * fwd[0] + wz * fwd[2]) / S / rx) ** 2 + (wy / S / ry) ** 2 <= 1) return bottomMat(x, y, z);
    }
    if ((bs === 'sarung' || bs === 'skirt') && p[2] <= zTopSk && p[2] >= zBotSk) {
      const xs = [pelvis[0], ...legX(legs[0], p[2]), ...legX(legs[1], p[2])];
      const xmin = Math.min(...xs), xmax = Math.max(...xs), fl = (zTopSk - p[2]) / (zTopSk - zBotSk || 1);
      const pad = (1.9 + 0.5 * fl) * S, hy = (2.8 + 0.5 * fl) * S, hx = (xmax - xmin) / 2 + pad, xc = (xmin + xmax) / 2;
      if (((p[0] - xc) / hx) ** 2 + ((p[1] - cy) / hy) ** 2 <= 1) return bottomMat(x, y, z);
    }
    for (const l of legs) {
      if (capsule(p, l.hip, l.knee, 1.65 * S, 1.4 * S) >= 0) return (bs === 'pants' || bs === 'shorts') ? 'bottom' : 'skin';
      const t2 = capsule(p, l.knee, l.ankle, 1.4 * S, 1.2 * S);
      if (t2 >= 0) return bs === 'pants' || (bs === 'shorts' && t2 < 0.12) ? 'bottom' : 'skin';
    }
    return null;
  };
  const p = [0, 0, 0];
  const mat = (x, y, z) => {
    p[0] = x + 0.5; p[1] = y + 0.5; p[2] = z + 0.5;
    let m = null;
    if (part !== 'lower') m = upperFn(p, x, y, z);
    if (!m && part !== 'upper') m = lowerFn(p, x, y, z);
    return m;
  };
  // kotak batas supaya hanya area tubuh yang dihitung
  const sp = [[pelvis, 4.6], [neck, 4.2], [head, 6.6]];
  for (const a of arms) sp.push([a.sh, 2], [a.elbow, 2], [a.hand, 2]);
  const lr = bs === 'sarung' || bs === 'skirt' ? 3.8 : 2.4;
  for (const l of legs) sp.push([l.hip, lr], [l.knee, lr], [l.ankle, lr], [l.toe, 2.2]);
  if (P.sword > 0.5) sp.push([add(Rr.hand, bd, 14 * S), 1.4], [add(Rr.hand, bd, -1.2 * S), 1.2], [add(Rr.hand, bd, 1.3 * S), 2]);
  if (P.broom > 0.5) sp.push([add(Rr.hand, brd, 14 * S), 3], [add(Rr.hand, brd, -3 * S), 1]);
  if (P.orb > 0) sp.push([orbPos, P.orb + 0.5]);
  const lo = [0, 1, 2].map(i => Math.min(...sp.map(([c, r]) => c[i] - r * S)));
  const hi = [0, 1, 2].map(i => Math.max(...sp.map(([c, r]) => c[i] + r * S)));
  const dims = [L, W, H];
  const bbox = [...lo.map((v, i) => Math.max(0, Math.floor(v))), ...hi.map((v, i) => Math.min(dims[i] - 1, Math.ceil(v)))];
  return { mat, L, W, H, bbox, lift: P.jump * S, pelvisZ: pelvis[2], yaw: P.yaw };
}

   kind: 'loco' (jalan dll), 'upper' (badan atas saja -> bisa sambil jalan), 'full' (seluruh badan).
   hit: { t: saat kena (0..1), r: jangkauan, arc: lebar sudut }. move: kecepatan gerak saat aksi. */
function keyed(keys) {
  let acc = Object.assign({}, POSE0);
  const full = keys.map(([t, p]) => [t, acc = Object.assign({}, acc, p)]);
  return t => {
    let i = 0;
    while (i < full.length - 2 && t > full[i + 1][0]) i++;

  };
}

/* ---------- Cache frame + antrian build ----------
   Frame dibangun saat pertama dibutuhkan. NPC memakai antrian (dibangun sedikit
   demi sedikit tiap frame) supaya game tidak tersendat. */
const FR = new Map(), QUEUE = [], QSET = new Set();
function buildHumanFrame(sid, anim, i, part, views = false) {
  const A = ANIMS[anim], t = A.loop ? i / A.n : i / Math.max(1, A.n - 1), st = STYLES[sid];
  const sh = humanShape(A.pose(t), st, part);
  const m = buildVox(sh.L, sh.W, sh.H, sh.mat, st.color, { bbox: sh.bbox, views });
  m.lift = sh.lift; m.pelvisZ = sh.pelvisZ; m.yaw = sh.yaw; m.shadowOff = 2;
  return m;
}
function hframe(sid, anim, i, part = 'all', sync = true) {
  const k = sid + '|' + anim + '|' + part + '|' + i;
  const m = FR.get(k);
  if (m) return m;
  if (sync) { const b = buildHumanFrame(sid, anim, i, part); FR.set(k, b); return b; }
  if (!QSET.has(k)) { QSET.add(k); QUEUE.push([k, sid, anim, i, part]); }
  return null;
}
function pumpQueue(ms) {
  const t0 = performance.now();
  while (QUEUE.length && performance.now() - t0 < ms) {
    const [k, sid, anim, i, part] = QUEUE.shift();
    QSET.delete(k);
    if (!FR.has(k)) FR.set(k, buildHumanFrame(sid, anim, i, part));
  }
}
function queueAnim(sid, anim, part = 'all') { for (let i = 0; i < ANIMS[anim].n; i++) hframe(sid, anim, i, part, false); }

// Gabungkan badan bawah (dari gerakan jalan) + badan atas (dari serangan), per slice.
// Tinggi pinggul disamakan dengan menggeser indeks slice badan atas.
const COMP = new WeakMap();
function composite(lower, upper) {
  let m1 = COMP.get(lower); if (!m1) COMP.set(lower, m1 = new Map());
  let c = m1.get(upper); if (c) return c;
  const dz = Math.round(lower.pelvisZ - upper.pelvisZ), n = Math.max(lower.slices.length, upper.slices.length + dz);
  const slices = [];
  for (let z = 0; z < n; z++) {
    const a = lower.slices[z], b = upper.slices[z - dz];
    if (!a && !b) { slices.push(null); continue; }
    const cv = makeCanvas(lower.L, lower.W), g = cv.getContext('2d');
    if (a) g.drawImage(a, 0, 0);
    if (b) g.drawImage(b, 0, 0);
    slices.push(cv);
  }
  const shadow = makeCanvas(lower.L, lower.W), g = shadow.getContext('2d');
  g.drawImage(lower.shadow, 0, 0); g.drawImage(upper.shadow, 0, 0);
  c = { L: lower.L, W: lower.W, H: n, slices, shadow, lift: 0, yaw: upper.yaw || 0, shadowOff: 2 };
  m1.set(upper, c);
  return c;
}

const CAT_KINDS = {

  belang:{ fur: '#f2efe8', fur2: '#2a2a2a', belly: '#f2efe8', pattern: 'spot' },
  hitam: { fur: '#2c2a30', fur2: '#1c1a20', belly: '#efece6', pattern: 'chest' },

function catShape(ph, k, sit) {
  const L = 24, W = 12, H = 17, cy = 6;
  const s = Math.sin(ph), c = Math.cos(ph);
  const body = [11, cy, 7.2], head = [18.2, cy, 10.5];
  const legsP = [[14.5, -1.4, 0], [14.5, 1.4, 1], [7.5, -1.4, 1], [7.5, 1.4, 0]];
  const ramps = { fur: R(k.fur), fur2: R(k.fur2), belly: R(k.belly), eye: fixedRamp('#3a6a2a'), nose: fixedRamp('#e88a8a'), ear: R('#e8a0a0') };
  const fill = (x, y, z) => {
    const p = [x + 0.5, y + 0.5, z + 0.5];
    const furMat = () => {
      if (k.pattern === 'stripe' && x % 3 === 0) return 'fur2';
      if (k.pattern === 'spot' && hash(x >> 2, y >> 2, z >> 2) < 0.35) return 'fur2';
      if (k.pattern === 'chest' && p[0] > 15 && p[2] < 9 && Math.abs(p[1] - cy) < 1.5) return 'belly';
      return 'fur';
    };
    // kepala + telinga + mata
    const hd = sub(p, head);
    if ((hd[0] / 3.2) ** 2 + (hd[1] / 3.0) ** 2 + (hd[2] / 2.7) ** 2 <= 1) {
      if (hd[0] > 2.2 && Math.abs(hd[2] - 0.4) < 0.7 && Math.abs(Math.abs(hd[1]) - 1.2) < 0.55) return 'eye';
      if (hd[0] > 2.6 && hd[2] < -0.3 && hd[2] > -1.3 && Math.abs(hd[1]) < 0.6) return 'nose';
      return furMat();
    }
    for (const sy of [-1, 1]) if (capsule(p, [head[0], cy + sy * 1.6, head[2] + 1.8], [head[0] - 0.2, cy + sy * 1.9, head[2] + 4.2], 1.1, 0.25) >= 0) return 'fur';
    // badan
    if (((p[0] - body[0]) / 6) ** 2 + ((p[1] - body[1]) / 2.7) ** 2 + ((p[2] - body[2] - (sit ? -1 : 0)) / 2.7) ** 2 <= 1) return furMat();

// Rumah: depan menghadap +x, teras di depan, atap genteng limasan/pelana, kadang ada toren air
function makeHouse(o) {

  const L = d + ov * 2, W = w + ov * 2;
  const roofN = o.gable ? Math.ceil(W / 4) : Math.ceil(Math.min(L, W) / 4);
  const topK = o.gable ? Math.floor((W - 1) / 4) : Math.floor((Math.min(L, W) - 1) / 4);

  const bx0 = ov, bx1 = ov + d - te - 1, by0 = ov, by1 = ov + w - 1, tx1 = ov + d - 1;

      if (z === tZ + 3) return Math.abs(dx) <= 4 && Math.abs(dy) <= 4 ? '#6a6a6a' : null;
      if (z <= tZ + 11) return dx * dx + dy * dy <= 12 ? o.tankC : null;
      if (z === tZ + 12) return dx * dx + dy * dy <= 3 ? o.tankC : null;

      if (!inside) return null;

      if (k === topK) return o.ridge;
      if (o.gable && (x === 0 || x === L - 1)) return '#ece6d8';

    if (x === bx1) {   // dinding depan: pintu, jendela, roster
      if (y >= cyD - 6 && y <= cyD + 6 && z <= 29) {
        if (y === cyD - 6 || y === cyD + 6 || z === 29) return '#f2efe6';
        if (y === cyD + 4 && z === 14) return '#e0c060';

      if (wv) return wv;
      if (z >= 28 && z <= 31 && ((y >= by0 + 4 && y <= by0 + 15) || (y >= by1 - 15 && y <= by1 - 4))) return (y % 3 === 0 || z % 2 === 0) ? o.wall : '#4a4a4a';

  }, boxHex);

// Gawang mini untuk lapangan
function makeGoal() {

    if (z >= 16 && z <= 17 && x <= 1) return '#f4f4f4';

// Tong sampah
function makeBin(col) {

/* =====================================================================
   5. DUNIA: jalan aspal + selokan, 4 gang conblock, rumah berjajar,
   warung, mushola, pos ronda, lapangan, tiang listrik & kabel.
   ===================================================================== */
const WW = 1960, WH = 1480;
const ROAD_Y0 = 700, ROAD_Y1 = 772, SEL = 12, GW = 40, YARD = 26;
const GANGS = [260, 760, 1260, 1700];
const PARTS = [[50, ROAD_Y0 - SEL], [ROAD_Y1 + SEL, WH - 50]];
const HGANG = [330, 1130];
const GANG_NAMES = [['MELATI', 'DAHLIA'], ['MAWAR', 'KENANGA'], ['KAMBOJA', 'TERATAI'], ['ANGGREK', 'SEROJA']];
const FIELD = [390, 820, 630, 990];
// jenis permukaan: 0 tanah/rumput, 1 aspal, 2 conblock, 3 keramik halaman, 4 air selokan, 5 beton, 6 tanah lapangan
const surf = new Uint8Array(WW * WH);
const ground = makeCanvas(WW, WH), gctx = ground.getContext('2d');
const objects = [], colliders = [], cables = [], npcs = [], cats = [], houses = [];
function setSurf(x0, y0, x1, y1, t) {
  x0 = Math.max(0, Math.round(x0)); y0 = Math.max(0, Math.round(y0)); x1 = Math.min(WW, Math.round(x1)); y1 = Math.min(WH, Math.round(y1));
  for (let y = y0; y < y1; y++) surf.fill(t, y * WW + x0, y * WW + x1);
}
const surfAt = (x, y) => (x < 0 || y < 0 || x >= WW || y >= WH) ? 0 : surf[(y | 0) * WW + (x | 0)];
function addBox(cx, cy, hw, hh) { colliders.push({ t: 'b', x: cx, y: cy, hw, hh }); }
function addCircle(cx, cy, r) { colliders.push({ t: 'c', x: cx, y: cy, r }); }
function addObj(model, x, y, a = 0, extra = {}) { const o = Object.assign({ model, x, y, a }, extra); objects.push(o); return o; }
function vnoise(x, y, s) {
  const gx = Math.floor(x / s), gy = Math.floor(y / s), fx = x / s - gx, fy = y / s - gy;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = hash(gx, gy, 5), b = hash(gx + 1, gy, 5), c = hash(gx, gy + 1, 5), d = hash(gx + 1, gy + 1, 5);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

function buildWorld() {
  const r = rng(20251117);
  const pick = a => a[Math.floor(r() * a.length)];
  // --- permukaan dasar ---
  setSurf(0, ROAD_Y0, WW, ROAD_Y1, 1);
  setSurf(0, ROAD_Y0 - SEL, WW, ROAD_Y0, 4); setSurf(0, ROAD_Y1, WW, ROAD_Y1 + SEL, 4);
  setSurf(0, ROAD_Y0 - SEL, WW, ROAD_Y0 - SEL + 2, 5); setSurf(0, ROAD_Y0 - 2, WW, ROAD_Y0, 5);
  setSurf(0, ROAD_Y1, WW, ROAD_Y1 + 2, 5); setSurf(0, ROAD_Y1 + SEL - 2, WW, ROAD_Y1 + SEL, 5);
  for (const hy of HGANG) setSurf(GANGS[0], hy - GW / 2, GANGS[3], hy + GW / 2, 2);
  for (const gx of GANGS) {
    for (const [y0, y1] of PARTS) setSurf(gx - GW / 2, y0, gx + GW / 2, y1, 2);
    setSurf(gx - GW / 2, ROAD_Y0 - SEL, gx + GW / 2, ROAD_Y0, 5);

  }
  setSurf(FIELD[0], FIELD[1], FIELD[2], FIELD[3], 6);
  // selokan menghalangi kecuali di jembatan mulut gang

    for (const gx of [...GANGS, WW + GW]) { const x1 = gx - GW / 2; if (x1 > x0) addBox((x0 + x1) / 2, yy, (x1 - x0) / 2, SEL / 2 - 1); x0 = gx + GW / 2; }
  }

  // --- model rumah (beberapa varian dipakai berulang) ---
  const walls = ['#a8dcc4', '#f0e2b6', '#f4b892', '#aecbe8', '#f2bccb', '#ecebe4', '#f2d878', '#c8e29a', '#d8c4f0'];
  const roofs = [
    { roof: '#b5532e', roofB: '#a64a28', roof2: '#8e3e22', ridge: '#7a3420' },
    { roof: '#9c4a30', roofB: '#8e4229', roof2: '#74351f', ridge: '#5e2a18' },
    { roof: '#4a6a9a', roofB: '#42608c', roof2: '#344c70', ridge: '#2a3c5a' },
    { roof: '#7a7e84', roofB: '#6e7278', roof2: '#5a5e64', ridge: '#4a4e54' },
    { roof: '#c46a3a', roofB: '#b45e32', roof2: '#984e28', ridge: '#7a3e20' },
  ];
  const doors = [['#7a4a2a', '#5e3820'], ['#5a3a2a', '#432a1e'], ['#8a5a3a', '#6e4630'], ['#2f4a6a', '#243a54']];
  const variants = [];
  for (let i = 0; i < 9; i++) {
    const dd = pick(doors);
    variants.push({ w: pick([56, 60, 64]), d: pick([60, 66]), wall: walls[i % walls.length], ...roofs[i % roofs.length],
      door: dd[0], door2: dd[1], frame: pick(['#f2efe6', '#8a5a30', '#3a3a3a']), plinth: pick(['#8a8070', '#9a6a5a', '#6a6a6a']),
      tank: r() < 0.55, tankC: pick(['#2d6cc4', '#e07a2a', '#3a9a5a']), gable: r() < 0.35 });
  }
  for (const v of variants) { v.model = makeHouse(v); v.model.shadowOff = 9; }
  const ironCols = ['#2a6a4a', '#2a2a2a', '#e8e8e8', '#8a6a2a', '#3a4a7a'];
  const fenceCache = {};
  const fenceModel = (w, c) => fenceCache[w + c] || (fenceCache[w + c] = makeFence(w, c, Math.floor(w / 2) - 9, Math.floor(w / 2) + 9));
  const pots = [makePot(0), makePot(1)];
  const motorCols = ['#d23a3a', '#2a5ad0', '#222226', '#f2f2f2', '#e8a020'];

  const bins = [makeBin('#2a7a4a'), makeBin('#2a5aa0')];

  // --- rumah di kiri-kanan tiap gang, menghadap gang ---

      if (hg && !(s < 0 && gx === GANGS[0]) && !(s > 0 && gx === GANGS[3])) { y = hg + GW / 2 + 6; continue; }
      const a = s > 0 ? Math.PI : 0;
      const hx = gx + s * (GW / 2 + YARD + v.d / 2), hy = y + w / 2;
      addObj(v.model, hx, hy, a, { kind: 'house' });
      addBox(hx - 6 * Math.cos(a), hy, (v.d - 12) / 2, w / 2);
      houses.push({ gx, s, pi, x: hx, y: hy, w, d: v.d });
      const ex = gx + s * GW / 2, fx = gx + s * (GW / 2 + YARD);
      setSurf(Math.min(ex, fx), y, Math.max(ex, fx), y + w, 3);
      const fenceX = gx + s * (GW / 2 + 2.5), ic = pick(ironCols);
      addObj(fenceModel(w, ic), fenceX, hy, 0, { kind: 'fence' });
      addBox(fenceX, y + (w / 2 - 9) / 2, 1.5, (w / 2 - 9) / 2);
      addBox(fenceX, y + w - (w / 2 - 9) / 2, 1.5, (w / 2 - 9) / 2);
      if (r() < 0.65) { const px = gx + s * (GW / 2 + YARD - 6); for (const py of [y + 6, y + w - 6]) if (r() < 0.75) { addObj(pick(pots), px, py, r() * TAU); addCircle(px, py, 5); } }
      if (r() < 0.4) { const mx = gx + s * (GW / 2 + 13), my = y + w * 0.22; addObj(pick(motors), mx, my, Math.PI / 2 + (r() - 0.5) * 0.4); addBox(mx, my, 6, 16); }
      if (r() < 0.25) { const bx = gx + s * (GW / 2 - 6), by = y + 4; addObj(pick(bins), bx, by, 0); addCircle(bx, by, 5); }
      y += w + 10 + Math.floor(r() * 8);
    }
  }

  // --- bangunan khusus di tepi jalan ---
  const warung1 = makeWarung('#2d6fc4'), warung2 = makeWarung('#e0782a');
  addObj(warung1, 510, 650, Math.PI / 2, { kind: 'house' }); addBox(510, 640, 30, 18); addBox(510, 671, 27, 3);
  addObj(warung2, 1010, 832, -Math.PI / 2, { kind: 'house' }); addBox(1010, 842, 30, 18); addBox(1010, 811, 27, 3);
  const mus = makeMushola(); mus.shadowOff = 10;
  addObj(mus, 1010, 637, Math.PI / 2, { kind: 'house' }); addBox(1010, 632, 40, 40);
  const pos = makePosRonda(); pos.shadowOff = 6;
  addObj(pos, 1450, 652, Math.PI / 2, { kind: 'house' }); addBox(1450, 652, 16, 18);
  const ger = makeGerobak(); addObj(ger, 612, 674, Math.PI); addBox(612, 674, 18, 9);

  for (const [fx, fy] of [[1525, 676], [1088, 676], [430, 676], [1560, 800]]) { addObj(flag, fx, fy, Math.PI / 2); addCircle(fx, fy, 2); }
  const goal = makeGoal();
  addObj(goal, FIELD[0] + 6, (FIELD[1] + FIELD[3]) / 2, 0); addObj(goal, FIELD[2] - 6, (FIELD[1] + FIELD[3]) / 2, Math.PI);

  // --- gapura di mulut gang ---
  GANGS.forEach((gx, i) => {

    for (const yy of [ROAD_Y0 - SEL - 6, ROAD_Y1 + SEL + 6]) { addBox(gx - 27, yy, 3, 3); addBox(gx + 27, yy, 3, 3); }
  });

  // --- tiang listrik + kabel ---
  const pole = makePole();
  const clear = (x, y, rad) => colliders.every(c => c.t === 'c' ? Math.hypot(c.x - x, c.y - y) > c.r + rad
    : Math.abs(c.x - x) > c.hw + rad || Math.abs(c.y - y) > c.hh + rad);
  const poleLine = (pts0, a) => {
    let prev = null;
    const pts = pts0.filter(([x, y]) => clear(x, y, 5));
    for (const [x, y] of pts) {
      addObj(pole, x, y, a); addCircle(x, y, 3);
      const ends = [-6.5, 5.5].map(o => [x - Math.sin(a) * o, y + Math.cos(a) * o]);
      if (prev) for (let k = 0; k < 2; k++) cables.push([prev[k], ends[k]]);
      prev = ends;
    }
  };
  for (const yy of [ROAD_Y0 - SEL - 5, ROAD_Y1 + SEL + 5]) {
    const pts = [];
    for (let x = 90; x < WW; x += 150) if (GANGS.every(g => Math.abs(x - g) > 45)) pts.push([x, yy]);
    poleLine(pts, 0);
  }
  for (const gx of GANGS) for (const [y0, y1] of PARTS) {
    const pts = [];
    for (let y = y0 + 70; y < y1 - 40; y += 160) if (HGANG.every(h => Math.abs(y - h) > 40)) pts.push([gx + 16, y]);
    poleLine(pts, Math.PI / 2);
  }

  // --- pohon, jemuran di halaman belakang ---
  const mangos = [makeMango(3), makeMango(11), makeMango(29)], bananas = [makeBanana(5), makeBanana(17)];
  const jemuran = [makeJemuran(2), makeJemuran(9)];
  const free = (x, y, rad) => colliders.every(c => c.t === 'c' ? Math.hypot(c.x - x, c.y - y) > c.r + rad
    : Math.abs(c.x - x) > c.hw + rad || Math.abs(c.y - y) > c.hh + rad) && surfAt(x, y) === 0;
  for (let i = 0; i < 1400; i++) {

    if (x > FIELD[0] - 10 && x < FIELD[2] + 10 && y > FIELD[1] - 10 && y < FIELD[3] + 10) continue;

    else if (kind < 0.92 && free(x, y, 22)) { const a = r() < 0.5 ? 0 : Math.PI / 2; addObj(pick(jemuran), x, y, a); addCircle(x - Math.sin(a) * 18, y + Math.cos(a) * 18, 2); addCircle(x + Math.sin(a) * 18, y - Math.cos(a) * 18, 2); }
  }
  paintGround();
}

function paintGround() {
  const img = gctx.createImageData(WW, WH), d = img.data;
  const C = h => hexRGB(h);
  const grass = ['#5f9a3e', '#6aa846', '#548d36', '#79b552'].map(C), soil = ['#9c7b52', '#8f6f48', '#a8885c'].map(C);
  const asph = ['#4a4a50', '#45454b', '#515157'].map(C), con = ['#b4b0a6', '#a9a59b', '#bfbab0'].map(C), conRed = C('#b07a5a'), mortar = C('#8c8a84'), kerb = C('#d2cdc2');
  const tile = C('#ddd5c6'), tile2 = C('#d5ccbc'), tileL = C('#c4baa8'), water = C('#3e4a36'), water2 = C('#56664a'), conc = C('#b8b3a8'), conc2 = C('#aaa59a');
  const fieldC = ['#b08a5a', '#a88252', '#b89464'].map(C), line = C('#eeeeea'), dash = C('#d8d4c4');
  const midY = (ROAD_Y0 + ROAD_Y1) / 2;
  for (let y = 0; y < WH; y++) for (let x = 0; x < WW; x++) {
    const p = y * WW + x, t = surf[p], n = hash(x, y, 7);
    let c;
    if (t === 0) {
      const g = vnoise(x, y, 46) + (vnoise(x, y, 9) - 0.5) * 0.35;
      c = g > 0.5 ? grass[n < 0.12 ? 0 : n < 0.8 ? 1 : n < 0.95 ? 2 : 3] : soil[n < 0.3 ? 0 : n < 0.85 ? 1 : 2];
    } else if (t === 1) {
      c = asph[n < 0.7 ? 0 : n < 0.85 ? 1 : 2];
      if (Math.abs(y - midY) < 1.5 && x % 30 < 14 && n < 0.85) c = dash;
    } else if (t === 2) {
      const row = Math.floor(y / 3), off = (row % 2) * 3;
      const edge = surf[p - 1] !== 2 || surf[p + 1] !== 2 || surf[p - WW] !== 2 || surf[p + WW] !== 2 || surf[p - 2] !== 2 || surf[p + 2] !== 2;
      if (edge) c = kerb;
      else if (y % 3 === 0 || (x + off) % 6 === 0) c = mortar;
      else { const b = hash(Math.floor((x + off) / 6), row, 9); c = b < 0.12 ? conRed : con[b < 0.5 ? 0 : b < 0.8 ? 1 : 2]; }
    } else if (t === 3) {
      c = (x % 8 === 0 || y % 8 === 0) ? tileL : (hash(x >> 3, y >> 3, 4) < 0.5 ? tile : tile2);
    } else if (t === 4) c = n < 0.07 ? water2 : water;
    else if (t === 5) c = n < 0.3 ? conc2 : conc;
    else {
      c = fieldC[n < 0.4 ? 0 : n < 0.8 ? 1 : 2];
      const fx = x - FIELD[0], fy = y - FIELD[1], fw = FIELD[2] - FIELD[0], fh = FIELD[3] - FIELD[1];
      if (fx < 3 || fy < 3 || fw - fx <= 3 || fh - fy <= 3 || Math.abs(fx - fw / 2) < 1.5 || Math.abs(Math.hypot(fx - fw / 2, fy - fh / 2) - 26) < 1.2) c = line;
    }
    const k = p * 4; d[k] = c[0]; d[k + 1] = c[1]; d[k + 2] = c[2]; d[k + 3] = 255;
  }
  gctx.putImageData(img, 0, 0);
}

// Grid spasial untuk tabrakan
const CELL = 128, cgrid = new Map();
function indexColliders() {
  for (const c of colliders) {
    const hw = c.t === 'c' ? c.r : c.hw, hh = c.t === 'c' ? c.r : c.hh;
    for (let gy = Math.floor((c.y - hh) / CELL); gy <= Math.floor((c.y + hh) / CELL); gy++)
      for (let gx = Math.floor((c.x - hw) / CELL); gx <= Math.floor((c.x + hw) / CELL); gx++) {
        const k = gx + ',' + gy; if (!cgrid.has(k)) cgrid.set(k, []); cgrid.get(k).push(c);
      }
  }
}
// Dorong entitas (lingkaran radius r) keluar dari semua penghalang. Return true jika menabrak.
function collide(e, r) {
  let hit = false;
  const seen = new Set();
  for (let gy = Math.floor((e.y - r) / CELL); gy <= Math.floor((e.y + r) / CELL); gy++)
    for (let gx = Math.floor((e.x - r) / CELL); gx <= Math.floor((e.x + r) / CELL); gx++) {
      for (const c of cgrid.get(gx + ',' + gy) || []) {
        if (seen.has(c)) continue; seen.add(c);
        if (c.t === 'c') {
          const dx = e.x - c.x, dy = e.y - c.y, d = Math.hypot(dx, dy), m = c.r + r;
          if (d < m && d > 0.001) { e.x = c.x + dx / d * m; e.y = c.y + dy / d * m; hit = true; }
        } else {
          const qx = Math.max(c.x - c.hw, Math.min(c.x + c.hw, e.x)), qy = Math.max(c.y - c.hh, Math.min(c.y + c.hh, e.y));
          const dx = e.x - qx, dy = e.y - qy, d = Math.hypot(dx, dy);
          if (d < r) {
            hit = true;
            if (d > 0.001) { e.x = qx + dx / d * r; e.y = qy + dy / d * r; }
            else { // di dalam kotak: keluar lewat sisi terdekat
              const ox = c.hw - Math.abs(e.x - c.x), oy = c.hh - Math.abs(e.y - c.y);
              if (ox < oy) e.x = c.x + Math.sign(e.x - c.x || 1) * (c.hw + r); else e.y = c.y + Math.sign(e.y - c.y || 1) * (c.hh + r);
            }
          }
        }
      }
    }
  e.x = Math.max(r, Math.min(WW - r, e.x)); e.y = Math.max(r, Math.min(WH - r, e.y));
  return hit;
}

  const list = COMBOS[a];
  if (!list) return;
  if (bot.action && FAMILY[bot.action] === a) {          // sedang menyerang: antre jurus berikutnya (combo)
    if (bot.at > animDur(bot.action) * 0.4) bot.queued = list[(list.indexOf(bot.action) + 1) % list.length];
    return;
  }
  if (bot.action) return;

  startAction(list[chain ? (bot.last.idx + 1) % list.length : 0]);
}
function humanSpeed() {
  let base = bot.mode === 'crawl' ? 0.35 : bot.mode === 'crouch' ? 0.5 : keys.run ? 2.1 : 1;
  if (bot.action) {
    const A = ANIMS[bot.action];
    base *= A.kind === 'upper' ? (keys.run ? 0.55 : 0.75) : (A.move ?? 0);
  }
  return base;
}
function updateHuman(dt) {
  if (bot.action) {
    const A = ANIMS[bot.action], dur = animDur(bot.action);
    bot.at += dt;
    if (A.hit && !bot.hitDone && bot.at >= A.hit.t * dur) { bot.hitDone = true; doHit(A.hit); }
    if (bot.at >= dur) {
      if (A.hold) bot.at = dur;
      else {
        const fam = FAMILY[bot.action];
        if (fam) bot.last = { fam, idx: COMBOS[fam].indexOf(bot.action), end: bot.time };
        if (bot.queued) startAction(bot.queued); else { bot.action = null; syncActionBar(); }
      }
    }
  }
  const loco = bot.mode === 'crawl' ? 'crawl' : bot.mode === 'crouch' ? 'crouch' : bot.moving ? (keys.run ? 'run' : 'walk') : 'idle';
  const L = ANIMS[loco];

function playerModel() {
  if (opts.char === 'car') return CAR;

  if (bot.action) {

function doHit(h) {

    const dx = n.x - bot.x, dy = n.y - bot.y, d = Math.hypot(dx, dy);
    if (d > h.r + 6 || d < 0.01) continue;

// gerak 8 arah relatif layar -> dunia (ikut sudut kamera)
function inputDir() {
  let ix = keys.right - keys.left, iy = keys.down - keys.up;
  if (!ix && !iy) return null;
  const l = Math.hypot(ix, iy); ix /= l; iy /= l;
  const c = Math.cos(cam.a), s = Math.sin(cam.a);
  return [ix * c - iy * s, ix * s + iy * c];
}
function updateWalker(dt) {
  const d = inputDir();
  bot.moving = false;
  if (d) {
    const sp = (surfAt(bot.x, bot.y) === 0 ? 38 : 46) * (opts.char === 'human' ? humanSpeed() : 1);
    const target = Math.atan2(d[1], d[0]);
    if (opts.char === 'robot' || !bot.action || ANIMS[bot.action].kind === 'upper' || bot.action === 'jump') {
      bot.a += Math.atan2(Math.sin(target - bot.a), Math.cos(target - bot.a)) * Math.min(1, dt * 12);
    }
    if (sp > 0) { bot.x += d[0] * sp * dt; bot.y += d[1] * sp * dt; bot.moving = true; }
  }
  if (opts.char === 'robot' && bot.moving) bot.phase += dt * 2;

  if (opts.char === 'human') updateHuman(dt);
  for (const n of npcs) { const dx = bot.x - n.x, dy = bot.y - n.y, dd = Math.hypot(dx, dy); if (dd < 13 && dd > 0.01 && !n.zoff) { bot.x = n.x + dx / dd * 13; bot.y = n.y + dy / dd * 13; } }

function updateCar(dt) {
  const fx = Math.cos(car.a), fy = Math.sin(car.a);
  let fwd = car.vx * fx + car.vy * fy, lat = -car.vx * fy + car.vy * fx;
  const grass = surfAt(car.x, car.y) === 0;
  if (keys.up) fwd += (grass ? 110 : 190) * dt;
  if (keys.down) fwd -= (fwd > 0 ? 260 : 90) * dt;
  const maxF = grass ? 60 : 165;
  fwd = Math.max(-50, Math.min(maxF + Math.max(0, fwd - maxF) * 0.97, fwd));
  fwd *= Math.pow(grass ? 0.35 : 0.72, dt);
  lat *= Math.pow(0.004, dt);
  const steer = keys.right - keys.left;

  const nx = Math.cos(car.a), ny = Math.sin(car.a);
  car.vx = nx * fwd - ny * lat; car.vy = ny * fwd + nx * lat;

  const ox = car.x, oy = car.y;
  if (collide(car, 13)) { car.vx = (car.x - ox) * 8 + car.vx * 0.3; car.vy = (car.y - oy) * 8 + car.vy * 0.3; }
  for (const c of cats) if (Math.hypot(c.x - car.x, c.y - car.y) < 60) catScare(c, false);

    gctx.fillStyle = 'rgba(25,25,28,0.5)';
    for (const sd of [-10, 10]) gctx.fillRect((car.x - nx * 18 - ny * sd) | 0, (car.y - ny * 18 + nx * sd) | 0, 1, 1);

  document.getElementById('speed').textContent = Math.round(Math.abs(fwd) * 0.6) + ' km/j';
}

/* ---------- NPC ---------- */
function spawnNPCs() {
  const mk = (style, x, y, beh, extra = {}) => { const n = Object.assign({ style, x, y, a: Math.PI / 2, beh, t: Math.random() * 3, state: 'ok', st: 0, wait: Math.random() * 2, target: null, greet: 2 + Math.random() * 4, home: [x, y], speed: 20 }, extra); npcs.push(n); return n; };
  mk('ibuHijab', 260, 200, 'wander', { seg: [260, 80, 260, 650] });
  mk('pakRT', 900, 736, 'wander', { seg: [120, 736, 1840, 736], speed: 18 });
  mk('anakSD', 480, 900, 'wander', { area: FIELD, speed: 30, runner: true });
  mk('anakSDcw', 560, 880, 'wander', { area: FIELD, speed: 26 });
  mk('pemuda', 1260, 300, 'wander', { seg: [1260, 80, 1260, 650], speed: 22 });
  mk('mbak', 1700, 1000, 'wander', { seg: [1700, 820, 1700, 1400] });
  mk('ibuHijab2', 760, 1200, 'wander', { seg: [300, 1130, 1660, 1130], speed: 18 });
  mk('tukangBakso', 600, 690, 'idle', { a: -Math.PI / 2, waver: true });
  mk('bapakPeci', 1442, 645, 'sit', { a: Math.PI / 2, zoff: 11 });

  mk('pemuda', 455, 676, 'sit', { a: Math.PI / 2, lines: ['Ngopi dulu, bro.', 'Gorengan masih anget!'] });
  const h = houses.find(q => q.gx === 760 && q.s === -1 && q.pi === 0 && q.y > 380) || houses[0];
  mk('ibuDaster', h.gx + h.s * (GW / 2 + 13), h.y + 12, 'sweep', { a: h.s > 0 ? Math.PI : 0 });
  for (const n of npcs) hframe(n.style, 'idle', 0);   // frame cadangan dibuat langsung
}
function npcHit(n) {
  if (n.state !== 'ok') return;
  n.state = 'fall'; n.st = 0; n.t = 0; n.target = null;
  n.a = Math.atan2(bot.y - n.y, bot.x - n.x);            // menghadap penyerang -> jatuh ke belakang
  if (!n.zoff) { n.x -= Math.cos(n.a) * 8; n.y -= Math.sin(n.a) * 8; collide(n, 6); }
  queueAnim(n.style, 'fall'); queueAnim(n.style, 'getup');
  say(n, HIT_LINES[Math.floor(Math.random() * HIT_LINES.length)]);
}
function updateNPC(n, dt) {
  n.t += dt;
  const px = opts.char === 'car' ? car.x : bot.x, py = opts.char === 'car' ? car.y : bot.y;
  const dp = Math.hypot(px - n.x, py - n.y);
  if (n.state === 'fall') { n.st += dt; if (n.st > animDur('fall') + 1.4) { n.state = 'getup'; n.st = 0; n.t = 0; } return; }
  if (n.state === 'getup') { n.st += dt; if (n.st > animDur('getup')) { n.state = 'ok'; n.t = 0; } return; }
  n.greet -= dt;
  if (dp < 48 && n.greet <= 0) {
    const ls = n.lines || LINES[n.style];
    say(n, ls[Math.floor(Math.random() * ls.length)]);
    n.greet = 9 + Math.random() * 8;
    if (n.beh === 'wander' || n.beh === 'idle') { n.look = 2.2; n.target = null; n.wait = 2.2; }
  }
  n.moving = false;
  if (n.look > 0) { n.look -= dt; n.a = Math.atan2(py - n.y, px - n.x); }
  if (n.beh === 'wander' && !(n.look > 0)) {
    if (!n.target) {
      if ((n.wait -= dt) <= 0) {
        if (n.area) n.target = [n.area[0] + 10 + Math.random() * (n.area[2] - n.area[0] - 20), n.area[1] + 10 + Math.random() * (n.area[3] - n.area[1] - 20)];
        else { const u = Math.random(), s = n.seg; n.target = [s[0] + (s[2] - s[0]) * u + (Math.random() - 0.5) * 12, s[1] + (s[3] - s[1]) * u + (Math.random() - 0.5) * 12]; }
      }
    } else {
      const dx = n.target[0] - n.x, dy = n.target[1] - n.y, d = Math.hypot(dx, dy);
      if (d < 3) { n.target = null; n.wait = 1 + Math.random() * 3.5; }
      else {
        const sp = n.speed * (n.runner && d > 60 ? 2 : 1);
        n.running = n.runner && d > 60;
        n.x += dx / d * sp * dt; n.y += dy / d * sp * dt; n.moving = true;
        n.a += Math.atan2(Math.sin(Math.atan2(dy, dx) - n.a), Math.cos(Math.atan2(dy, dx) - n.a)) * Math.min(1, dt * 8);
        const ox = n.x, oy = n.y;
        if (collide(n, 6) && Math.hypot(n.x - ox, n.y - oy) > 0.3 && Math.random() < 0.02) n.target = null;
      }
    }
  }
  if (!n.zoff && dp < 13 && dp > 0.01) { n.x = px + (n.x - px) / dp * 13; n.y = py + (n.y - py) / dp * 13; }
}
function npcModel(n) {
  let anim, f, A;
  if (n.state === 'fall' || n.state === 'getup') { anim = n.state; A = ANIMS[anim]; f = Math.min(A.n - 1, Math.floor(n.st * A.fps)); }
  else {

/* ---------- kucing ---------- */
function spawnCats() {
  for (const k in CAT_KINDS) {
    CAT_FRAMES[k] = { walk: [0, 1, 2, 3].map(i => catShape(i / 4 * TAU, CAT_KINDS[k], false)), sit: [0, 1].map(i => catShape(i * Math.PI, CAT_KINDS[k], true)) };
  }
  const spots = [[260, 450], [760, 560], [1260, 900], [1700, 300], [560, 676], [1450, 690], [760, 1300]];
  spots.forEach(([x, y], i) => cats.push({ kind: Object.keys(CAT_KINDS)[i % 3], x, y, a: Math.random() * TAU, home: [x, y], target: null, wait: Math.random() * 3, flee: 0, t: Math.random() * 5 }));
}
function catScare(c, hit) {
  if (c.flee > 0.5) return;
  const px = opts.char === 'car' ? car.x : bot.x, py = opts.char === 'car' ? car.y : bot.y;
  const a = Math.atan2(c.y - py, c.x - px) + (Math.random() - 0.5) * 0.8;
  c.target = [c.x + Math.cos(a) * 90, c.y + Math.sin(a) * 90]; c.flee = 1.6;
  say(c, hit ? 'Hssss!' : CAT_LINES[Math.floor(Math.random() * 2)], 1.6);
}
function updateCat(c, dt) {
  c.t += dt; c.flee -= dt; c.moving = false;
  const px = opts.char === 'car' ? car.x : bot.x, py = opts.char === 'car' ? car.y : bot.y;
  const dp = Math.hypot(px - c.x, py - c.y);
  if (dp < 34 && (keys.run || bot.action) && opts.char === 'human') catScare(c, false);
  if (!c.target) { if ((c.wait -= dt) <= 0) { const a = Math.random() * TAU, r = Math.random() * 60; c.target = [c.home[0] + Math.cos(a) * r, c.home[1] + Math.sin(a) * r]; } return; }
  const dx = c.target[0] - c.x, dy = c.target[1] - c.y, d = Math.hypot(dx, dy);
  if (d < 3) { c.target = null; c.wait = 2 + Math.random() * 5; if (c.flee > 0) c.home = [c.x, c.y]; return; }
  const sp = c.flee > 0 ? 80 : 14;
  c.x += dx / d * sp * dt; c.y += dy / d * sp * dt; c.moving = true;
  c.a += Math.atan2(Math.sin(Math.atan2(dy, dx) - c.a), Math.cos(Math.atan2(dy, dx) - c.a)) * Math.min(1, dt * 10);

}
const catModel = c => c.moving ? CAT_FRAMES[c.kind].walk[Math.floor(c.t * (c.flee > 0 ? 14 : 6)) % 4] : CAT_FRAMES[c.kind].sit[Math.floor(c.t * 1.2) % 2];

/* =====================================================================
   7. RENDER: tanah diputar kamera, semua objek diurutkan dari belakang
   ke depan (posisi y di layar), lalu kabel listrik & balon dialog.
   ===================================================================== */
const gameCanvas = document.getElementById('game'), ctx = gameCanvas.getContext('2d');
let VW = 240, VH = 320, PX = 2;
function resizeGame() {
  const w = innerWidth, h = innerHeight;
  PX = Math.max(1, Math.round(Math.min(w, h) / 230));
  VW = Math.ceil(w / PX); VH = Math.ceil(h / PX);
  gameCanvas.width = VW; gameCanvas.height = VH;
  gameCanvas.style.width = VW * PX + 'px'; gameCanvas.style.height = VH * PX + 'px';
}
const bubbleLayer = document.getElementById('bubbles'), bubblePool = [];

function updateCamera(dt, tx, ty, ta) {
  const k = 1 - Math.pow(0.0008, dt);
  cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
  const want = opts.rotCam ? ta + Math.PI / 2 : 0;
  cam.a += Math.atan2(Math.sin(want - cam.a), Math.cos(want - cam.a)) * (1 - Math.pow(0.02, dt));
  if (!opts.rotCam) {
    const hw = VW / 2, hh = VH / 2;
    cam.x = Math.max(hw, Math.min(WW - hw, cam.x)); cam.y = Math.max(hh, Math.min(WH - hh, cam.y));
  }
}

function render() {
  ctx.imageSmoothingEnabled = false;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#4f7f36'; ctx.fillRect(0, 0, VW, VH);
  const cx = Math.round(VW / 2), cy = Math.round(VH * (opts.rotCam ? 0.62 : 0.5));
  const ca = Math.cos(-cam.a), sa = Math.sin(-cam.a), sp = opts.spacing;
  const toScreen = (x, y) => { const dx = x - cam.x, dy = y - cam.y; return [cx + dx * ca - dy * sa, cy + dx * sa + dy * ca]; };

  ctx.setTransform(ca, sa, -sa, ca, cx, cy);
  ctx.translate(-Math.round(cam.x), -Math.round(cam.y));
  ctx.drawImage(ground, 0, 0);
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  const list = [];
  const push = (o, model, x, y, a, lift = 0, ent = null) => {
    const [sx, sy] = toScreen(x, y), r = Math.max(model.L, model.W) * 0.75;
    if (sx < -r || sx > VW + r || sy < -r || sy - (model.H + lift) * sp - r > VH) return;
    list.push({ model, sx, sy, a: a - cam.a, lift, ent });
  };
  for (const o of objects) push(o, o.model, o.x, o.y, o.a);
  for (const n of npcs) push(n, npcModel(n), n.x, n.y, n.a, n.zoff || 0, n);
  for (const c of cats) push(c, catModel(c), c.x, c.y, c.a, 0, c);
  const pl = opts.char === 'car' ? car : bot;
  push(pl, playerModel(), pl.x, pl.y, pl.a, 0, pl);
  list.sort((a, b) => a.sy - b.sy);
  if (opts.shadow) for (const d of list) drawShadow(ctx, d.model, d.sx, d.sy - d.lift * sp, d.a);
  for (const d of list) drawStack(ctx, d.model, d.sx, d.sy, d.a, sp, 1, d.lift);

  // kabel listrik (di ketinggian puncak tiang)
  ctx.fillStyle = 'rgba(28,28,34,0.85)';
  const zc = 74 * sp;
  for (const [a, b] of cables) {
    const [x0, y0] = toScreen(a[0], a[1]), [x1, y1] = toScreen(b[0], b[1]);
    if ((x0 < 0 && x1 < 0) || (x0 > VW && x1 > VW) || (y0 - zc < 0 && y1 - zc < 0) || (y0 - zc > VH && y1 - zc > VH)) continue;
    const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0));
    for (let i = 0; i <= n; i++) { const t = i / n; ctx.fillRect(Math.round(x0 + (x1 - x0) * t), Math.round(y0 + (y1 - y0) * t - zc + 7 * 4 * t * (1 - t)), 1, 1); }
  }

  // balon dialog (HTML, supaya teks tajam)
  let bi = 0;
  for (const d of list) {
    const e = d.ent;
    if (!e || !e.bubble || e.bubble.until < bot.time) continue;
    let el = bubblePool[bi];
    if (!el) { el = document.createElement('div'); el.className = 'bubble'; bubbleLayer.appendChild(el); bubblePool.push(el); }
    if (el.textContent !== e.bubble.text) el.textContent = e.bubble.text;
    el.style.display = '';
    el.style.left = d.sx * PX + 'px';
    el.style.top = (d.sy - (d.model.H + d.lift + 4) * sp) * PX + 'px';
    bi++;
  }
  for (; bi < bubblePool.length; bi++) bubblePool[bi].style.display = 'none';
}

/* ---------- loop ---------- */
let last = performance.now(), current = 'game', ready = false;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (ready) {
    bot.time += dt;
    if (current === 'game') {
      if (opts.char === 'car') updateCar(dt); else updateWalker(dt);
      for (const n of npcs) updateNPC(n, dt);
      for (const c of cats) updateCat(c, dt);
      const p = opts.char === 'car' ? car : bot;
      updateCamera(dt, p.x + (opts.char === 'car' ? car.vx * 0.3 : 0), p.y + (opts.char === 'car' ? car.vy * 0.3 : 0), p.a);
      render();
    } else renderTut(t / 1000);
    pumpQueue(current === 'game' ? 5 : 12);
  }
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
const ACTKEY = { Space: 'jump', KeyJ: 'punch', KeyK: 'kick', KeyL: 'slash', KeyU: 'cast', KeyH: 'fall', KeyQ: 'crouch', KeyE: 'crawl' };
addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (KEYMAP[e.code]) { keys[KEYMAP[e.code]] = true; e.preventDefault(); }
  if (ACTKEY[e.code] && !e.repeat) { doAction(ACTKEY[e.code]); e.preventDefault(); }
  if (e.key === 'Shift') { keys.run = true; syncActionBar(); }
  if (e.code === 'KeyC') { opts.rotCam = !opts.rotCam; document.getElementById('optCam').checked = opts.rotCam; }
});
addEventListener('keyup', e => { if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = false; if (e.key === 'Shift') { keys.run = false; syncActionBar(); } });
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) document.body.classList.add('is-touch');
document.querySelectorAll('.touch button').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); keys[k] = true; b.classList.add('down'); };
  const off = e => { e.preventDefault(); keys[k] = false; b.classList.remove('down'); };
  b.addEventListener('pointerdown', on);
  for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) b.addEventListener(ev, off);
});
function syncActionBar() {
  document.querySelectorAll('#acts button[data-a]').forEach(b => b.classList.toggle('on', b.dataset.a === bot.mode || (b.dataset.a === 'run' && keys.run)));
}
document.querySelectorAll('#acts button').forEach(b => {
  const a = b.dataset.a;
  if (b.dataset.hold) {
    b.addEventListener('pointerdown', e => { e.preventDefault(); keys.run = true; syncActionBar(); });
    for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) b.addEventListener(ev, () => { keys.run = false; syncActionBar(); });
  } else b.addEventListener('pointerdown', e => { e.preventDefault(); doAction(a); });
});
function updateHelp() {
  document.body.classList.toggle('human', opts.char === 'human');
  document.getElementById('help').textContent = opts.char === 'car'
    ? '← → belok · ↑ gas · ↓ rem/mundur · C kamera'
    : opts.char === 'robot' ? 'Panah / WASD jalan · C kamera'
    : 'WASD jalan · Shift lari · J/K/L tekan berulang = combo · C kamera';
}
document.getElementById('optChar').onchange = e => {
  const prev = opts.char === 'car' ? car : bot;
  opts.char = e.target.value;
  const now = opts.char === 'car' ? car : bot;
  now.x = prev.x; now.y = prev.y; now.a = prev.a; car.vx = car.vy = 0;
  bot.action = null; bot.mode = 'stand';
  updateHelp(); syncActionBar(); e.target.blur();
};
document.getElementById('optCam').onchange = e => opts.rotCam = e.target.checked;
document.getElementById('optShadow').onchange = e => opts.shadow = e.target.checked;
document.getElementById('optSpace').oninput = e => opts.spacing = +e.target.value;
document.getElementById('hudToggle').onclick = () => document.getElementById('hud').classList.toggle('min');
if (innerWidth < 600) document.getElementById('hud').classList.add('min');

/* =====================================================================
   8. TUTORIAL: model -> slice -> tumpuk & putar
   ===================================================================== */
const STEPS = [
  { title: () => tutChar === 'human' ? 'Manusia: rangka + bentuk bulat' : `Gambar ${tutChar === 'car' ? 'mobil' : 'robot'} dari 4 sisi`,
    text: () => { const m = tutModel(); return tutChar === 'human'
      ? `Model organik ${m.L}×${m.W}×${m.H} voxel: kepala, rambut, badan, lengan & kaki dari elipsoid dan kapsul, lalu tiap voxel diberi cahaya. Tampak di atas adalah proyeksinya.`
      : `Atas, samping, depan, belakang (${m.L}×${m.W}×${m.H}). Voxel ada jika keempat siluet sama-sama berisi di titik itu.`; } },
  { title: 'Tiap lapisan tinggi menjadi satu slice',
    text: () => `Baris ke-z dari tampak samping = lapisan ke-z, digambar sebagai tampak ATAS. ${tutModel().slices.length} lapisan → ${tutModel().slices.length} gambar slice.` },
  { title: 'Tumpuk slice berjarak 1 px lalu putar',
    text: () => tutChar === 'human'
      ? 'Tiap frame gerakan = pose rangka berbeda = set slice sendiri. Serangan "badan atas" digabung dengan kaki yang sedang berjalan, slice per slice.'
      : 'Gambar slice dari bawah ke atas; tiap slice digeser 1 px ke atas layar dan diputar dengan sudut sama.' },
];
let step = 0, tutChar = 'human', tutAngle = 0.5;
const tutCanvas = document.getElementById('tutCanvas'), tctx = tutCanvas.getContext('2d');
const TW = 220, TH = 210;
function resizeTut() {
  tutCanvas.width = TW; tutCanvas.height = TH;
  const px = Math.max(1, Math.floor(Math.min((innerWidth - 24) / TW, (innerHeight - 300) / TH)));
  tutCanvas.style.width = TW * px + 'px'; tutCanvas.style.height = TH * px + 'px';
}
const VCACHE = {};
function viewCanvas(rows, pal) {
  const c = makeCanvas(rows[0].length, rows.length), x = c.getContext('2d');
  rows.forEach((r, y) => [...r].forEach((ch, i) => { if (pal[ch]) { x.fillStyle = pal[ch]; x.fillRect(i, y, 1, 1); } }));
  return c;
}
function tutModel() {
  if (tutChar === 'car') return CAR;
  if (tutChar === 'robot') return ROBOT;
  const sid = document.getElementById('tStyle').value;
  const k = 'v|' + sid;
  return VCACHE[k] || (VCACHE[k] = buildHumanFrame(sid, 'idle', 0, 'all', true));
}
function tutViews() {
  if (tutChar === 'human') return tutModel().vc;
  const k = 'views|' + tutChar;
  if (!VCACHE[k]) { const m = tutModel(), v = {}; for (const s of ['top', 'side', 'front', 'back']) v[s] = viewCanvas(m.views[s], m.pal); VCACHE[k] = v; }
  return VCACHE[k];
}
function renderTut(t) {
  const c = tctx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.imageSmoothingEnabled = false;
  c.fillStyle = '#ffffff'; c.fillRect(0, 0, TW, TH);
  const M = tutModel(), VC = tutViews(), L = M.L, W = M.W, H = M.slices.length;
  const blit = (img, x, y, s = 1) => c.drawImage(img, Math.round(x), Math.round(y), img.width * s, img.height * s);
  if (step === 0 && tutChar === 'human') {
    // tampak depan besar supaya detail wajah terlihat, samping & belakang di kanan
    const s = Math.max(1, Math.min(4, Math.floor((TH - 16) / H), Math.floor((TW - 20 - L * 2) / W)));
    const x0 = Math.round((TW - (W * s + 8 + L * 2)) / 2), y0 = Math.round((TH - H * s) / 2);
    blit(VC.front, x0, y0, s);
    blit(VC.side, x0 + W * s + 8, y0, 2);
    blit(VC.back, x0 + W * s + 8 + Math.round((L - W)), y0 + H * 2 + 6 > TH ? y0 : y0 + H * 2 + 6, 2);
  } else if (step === 0) {
    const s = Math.max(1, Math.min(3, Math.floor((TW - 30) / (W * 3 + L)), Math.floor((TH - 30) / Math.max(L, H))));
    const parts = [[VC.top, W, L, true], [VC.side, L, H], [VC.front, W, H], [VC.back, W, H]];
    const total = parts.reduce((a, p) => a + p[1] * s, 0) + 6 * 3;
    let x = Math.round((TW - total) / 2);
    const base = Math.round(TH / 2 + Math.max(L, H) * s / 2);
    for (const [img, w, h, rot] of parts) {
      if (rot) { c.save(); c.translate(x + w * s / 2, base - h * s / 2); c.rotate(-Math.PI / 2); c.drawImage(img, -h * s / 2, -w * s / 2, h * s, w * s); c.restore(); }
      else blit(img, x, base - h * s, s);
      c.fillStyle = '#bbb'; c.fillRect(x, base + 4, w * s, 1);
      x += w * s + 6;
    }
  } else if (step === 1) {
    const z = Math.floor(t * 3) % H, row = H - 1 - z;
    const s = H * 2 <= 90 ? 2 : 1;
    blit(VC.side, 6, 6, s);
    c.fillStyle = 'rgba(255,200,0,0.5)'; c.fillRect(4, 6 + row * s, L * s + 4, s);
    const bs = Math.max(1, Math.min(3, Math.floor(90 / W), Math.floor(100 / L)));
    const bx = TW - L * bs - 8;
    c.fillStyle = '#999'; c.fillRect(12 + L * s, 6 + row * s, bx - 16 - L * s, 1);
    c.fillStyle = '#eee'; c.fillRect(bx - 2, 4, L * bs + 4, W * bs + 4);
    if (M.slices[z]) blit(M.slices[z], bx, 6, bs);
    // contoh beberapa slice
    const gy0 = Math.max(10 + H * s, 10 + W * bs) + 6, cs = L > 30 ? 0.5 : 1;
    const cw = Math.ceil(L * cs) + 3, ch = Math.ceil(W * cs) + 3, per = Math.floor((TW - 8) / cw), rows = Math.max(1, Math.floor((TH - gy0 - 4) / ch));
    const shown = Math.min(H, per * rows), stepZ = H / shown;
    for (let i = 0; i < shown; i++) {
      const zi = Math.floor(i * stepZ), gx = 4 + (i % per) * cw, gy = gy0 + Math.floor(i / per) * ch;
      c.fillStyle = zi <= z && z < Math.floor((i + 1) * stepZ) ? '#ffd24a' : '#eee';
      c.fillRect(gx - 1, gy - 1, Math.ceil(L * cs) + 2, Math.ceil(W * cs) + 2);
      if (M.slices[zi]) c.drawImage(M.slices[zi], gx, gy, L * cs, W * cs);
    }
  } else {
    if (document.getElementById('tAuto').checked) {
      tutAngle += 0.9 / 60;
      document.getElementById('tAngle').value = Math.round((tutAngle * 180 / Math.PI) % 360);
    }
    const sp = +document.getElementById('tSpace').value;
    let model = M;
    if (tutChar === 'robot') model = ROBOT_FRAMES[Math.floor(t * 6) % 4];
    if (tutChar === 'human') {
      const name = document.getElementById('tAnim').value, A = ANIMS[name], sid = document.getElementById('tStyle').value;
      const total = A.n + (A.loop ? 0 : Math.round(A.fps * 0.6));
      model = hframe(sid, name, Math.min(A.n - 1, Math.floor(t * A.fps) % total));
    }
    const hgt = (model.H + (model.lift || 0)) * sp;
    const s = hgt * 2 + Math.max(L, W) * 2 > TH - 6 ? 1 : 2;
    const baseY = Math.round(TH / 2 + (hgt * s) / 2 - 4);
    drawShadow(c, model, TW / 2, baseY, tutAngle, s);
    drawStack(c, model, TW / 2, baseY, tutAngle, sp, s);
  }
}
function setStep(i) {
  step = i;
  document.querySelectorAll('#tutCtl .btn').forEach(b => b.classList.toggle('on', +b.dataset.step === i));
  const v = f => typeof f === 'function' ? f() : f;
  document.getElementById('tutTitle').textContent = v(STEPS[i].title);
  document.getElementById('tutText').textContent = v(STEPS[i].text);
  document.getElementById('tutSliders').style.visibility = i === 2 ? 'visible' : 'hidden';
  document.getElementById('tAnimWrap').style.display = tutChar === 'human' ? '' : 'none';
  document.getElementById('tStyleWrap').style.display = tutChar === 'human' ? '' : 'none';
}
document.querySelectorAll('#tutCtl .btn').forEach(b => b.onclick = () => setStep(+b.dataset.step));
document.getElementById('tSpace').oninput = e => document.getElementById('tSpaceV').textContent = e.target.value;
document.getElementById('tAngle').oninput = e => { document.getElementById('tAuto').checked = false; tutAngle = e.target.value * Math.PI / 180; };
for (const k in ANIMS) document.getElementById('tAnim').add(new Option(ANIMS[k].name, k));
for (const k in STYLES) document.getElementById('tStyle').add(new Option(STYLES[k].name, k));
document.getElementById('tAnim').value = 'walk';
document.getElementById('tChar').onchange = e => { tutChar = e.target.value; setStep(step); };
document.getElementById('tStyle').onchange = () => setStep(step);

function show(which) {
  current = which;
  document.getElementById('scrGame').classList.toggle('on', which === 'game');
  document.getElementById('scrTut').classList.toggle('on', which === 'tut');
  document.getElementById('tabGame').classList.toggle('on', which === 'game');
  document.getElementById('tabTut').classList.toggle('on', which === 'tut');
  if (which === 'tut') setStep(step);
}
document.getElementById('tabGame').onclick = () => show('game');
document.getElementById('tabTut').onclick = () => show('tut');
addEventListener('resize', () => { resizeGame(); resizeTut(); });

/* ---------- start ---------- */
resizeGame(); resizeTut(); updateHelp();
requestAnimationFrame(frame);
setTimeout(() => {
  const t0 = performance.now();
  buildWorld(); indexColliders(); spawnNPCs(); spawnCats();
  for (const a of ['idle', 'walk', 'run']) queueAnim('player', a);
  for (const a of ['walk', 'run']) queueAnim('player', a, 'lower');
  hframe('player', 'idle', 0);
  console.log('world built in', Math.round(performance.now() - t0), 'ms; objects', objects.length);
  ready = true;
  document.getElementById('loading').style.display = 'none';
  if (location.hash === '#tut') show('tut');
}, 30);
</script>
</body>
