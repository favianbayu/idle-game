 | \"Tebak Peta\" | Pin lokasi kota/wilayah pada peta buta | Peta kota menampilkan jalan pintas dan lokasi item |\n| **Ekonomi** | \"Pasar Untung\" | Beli-jual barang di grafik harga naik-turun | Bunga tabungan +, harga bahan warkop lebih murah |\n| **Penjaskes** | \"Sprint & Lompat\" | Tekan bergantian untuk lari, tahan untuk lompat; variasi futsal, basket, lari estafet | Stamina, Kelincahan |\n| **Seni Budaya** | \"Ritme Gamelan\" | Tekan tombol sesuai ketukan (rhythm game), variasi melukis garis | Ngamen lebih laku, mini game band, hati Sekar |\n| **Prakarya** | \"Rakit & Anyam\" | Ikuti pola untuk menganyam/merakit; tempat membuat **Gelang Benang** | Keterampilan, upgrade kamar lebih murah |\n\nMini game tambahan sekolah: **Upacara** (ritme baris), **Pramuka** (simpul tali, semaphore), **Jumat Bersih** (sapu &\nangkut sampah), **Piket kelas** (hapus papan tulis, buang sampah), **Agama** (hafalan doa pendek berbentuk mencocokkan).\n\n## Nilai\n\n- Skor mini game 0-100 dikonversi ke nilai harian. Rapor = 40% harian + 20% ulangan harian + 40% ujian semester.\n- Huruf rapor: A (≥90), B (≥80), C (≥70), D (≥60), E (<60).\n- **Bonus**: Mood tinggi +10%, belajar bareng Tegar/Nadia +10%, ngantuk -15%, lapar -10%.\n- **Remedial**: nilai < 60 boleh diulang sekali dengan Bu Ratna (pelajaran apa pun), maksimal nilai 70.\n- **Kenaikan kelas**: rata-rata ≥ 60 dan tidak ada lebih dari 3 nilai E.\n\n## Ujian\n\n| Ujian | Kapan | Bentuk |\n|---|---|---|\n| Ulangan harian | Minggu 2 tiap bulan | Mini game versi sulit, satu kali tanpa latihan |\n| UTS | Minggu 3 semester | 3 mini game berturut-turut, waktu lebih pendek |\n| UAS | Minggu 6 semester | Semua pelajaran inti, hari ujian tanpa kegiatan lain |\n| Ujian Akhir | Kelas XII semester 2 | Mode \"maraton\" 6 mini game, menentukan kelulusan dan ending beasiswa |\n\nBocoran soal bisa dibeli dari Kevin (Rp 20.000): nilai +15, tapi risiko ketahuan 40%.\n\n## Ekskul (sore)\n\n| Ekskul | Hari | Mini game | Bonus |\n|---|---|---|---|\n| Futsal | Senin, Rabu, Jumat | Pertandingan 5 lawan 5 (kontrol tim sederhana) | Kelincahan, hati Uti |\n| Basket | Senin, Selasa, Kamis | 3x3, tembakan berwaktu | Kelincahan, hati Dimas |\n| Band | Selasa, Kamis | Rhythm game | Mood, hati Sekar |\n| Silat | Selasa, Kamis (GOR) | Latihan jurus (combo) | Kekuatan, jurus baru, hati Wulan |\n| Jurnalistik | Rabu | Foto & tulis berita | Kecerdasan, hati Jojo & Rizal |\n| OSIS | Senin, Rabu, Kamis | Manajemen acara (atur jadwal & anggaran) | Reputasi Sekolah, hati Nadia |\n| Pramuka | Rabu sore & perkemahan | Survival kecil | Keterampilan |\n\n## Mini game luar sekolah\n\n| Mini game | Lokasi | Hasil |\n|---|---|---|\n| **Kopi keliling** | Seluruh kota | Dorong gerobak, layani pembeli dengan meracik pesanan cepat; uang |\n| **Jaga warkop** | Warkop Simpang | Antrean pesanan bergelombang (gaya restoran sibuk); uang & reputasi Usaha |\n| **Servis bengkel** | Bengkel Mas Fajar | Urutan bongkar-pasang komponen; uang & Keterampilan |\n| **Ojek** | Pusat Kota | Antar penumpang tepat waktu tanpa melanggar lampu merah; uang |\n| **Balap motor** | Jalan Lingkar | Balap 3 lap melawan 3 pembalap, drift, nitro sederhana |\n| **Balap sepeda** | Hari bebas kendaraan, jalan kampung | Stamina dan rute pintas |\n| **Futsal kampung** | Lapangan kampung | Liga Minggu |\n| **Ngamen** | Alun-alun, angkot | Rhythm game; uang receh |\n| **Memancing** | Kali Cendana | Tarik-ulur benang; ikan untuk dijual/masak |\n| **Pasar malam** | Alun-alun Sabtu | Tembak kaleng, lempar gelang, bianglala (kencan) |\n| **Catur pos ronda** | Pos ronda | Teka-teki catur 3 langkah; hati warga |\n| **Layangan** | Tanggul Bantaran | Adu layangan; anak kampung |\n"}, {"id": "60-upgrade", "file": "60-upgrade.md", "title": "60. Sistem Upgrade", "md": "# 60. Sistem Upgrade\n\nSemua upgrade **terlihat berubah di dunia** (model voxel diganti) dan memberi efek angka. Upgrade dibeli di tempat terkait\ndan butuh waktu pengerjaan (dihitung hari game). Diskon dari hubungan: Uti (motor), Mas Fajar (semua kendaraan), Tegar\n(kamar & warkop level akhir), Mei (buku), Gilang (bahan warkop).\n\n## Sepeda\n\n| Level | Nama | Harga | Kecepatan | Efek & tampilan |\n|---|---|---|---|---|\n| 1 | Sepeda onthel Om | Gratis | 1.4x jalan | Hitam berkarat, keranjang depan, bel \"kring\" |\n| 2 | Onthel servis | Rp 75.000 | 1.6x | Rantai baru, cat ulang hijau, lampu dinamo (bisa malam) |\n| 3 | Sepeda gunung bekas | Rp 350.000 | 1.9x | Bisa lewat jalan tanah & tangga pendek, suspensi |\n| 4 | BMX | Rp 600.000 | 1.8x | Trik di skatepark (mini game Gilang), lompat pagar rendah |\n| 5 | Sepeda balap | Rp 1.200.000 | 2.3x | Menang lomba sepeda kota, tidak bisa lewat jalan rusak |\n\nAksesori sepeda: keranjang besar (+2 slot barang, Rp 40.000), boncengan (bawa NPC, kencan sepeda, Rp 30.000), lampu LED\n(Rp 25.000), stiker (+gaya, Rp 7.000).\n\n## Motor\n\nDidapat mulai Bab 4 (umur 16, SIM C di Bab 6; sebelum itu risiko ditilang).\n\n| Level | Nama | Harga | Top speed | Efek & tampilan |\n|---|---|---|---|---|\n| 1 | Bebek tua | Rp 2.500.000 (atau motor Mas Danu dari arc Uti) | 70 km/j | Asap knalpot, susah starter pagi (mini game engkol) |\n| 2 | Bebek servis | +Rp 400.000 | 80 | Starter lancar, lampu terang |\n| 3 | Bebek modif | +Rp 900.000 | 95 | Velg racing, knalpot racing (+gaya, warga -) |\n| 4 | Sport 150cc bekas | Rp 8.000.000 | 120 | Bisa ikut liga resmi, nitro kecil |\n| 5 | Motor balap custom | +Rp 3.500.000 | 140 | Desain cat bebas, nomor balap, final balap Bab 9-12 |\n\nKomponen upgrade terpisah (tiap motor): **mesin** (kecepatan), **ban** (cengkeraman hujan), **rem** (tikungan), **suspensi**\n(jalan rusak), **knalpot** (akselerasi & gaya), **cat** (gaya). Masing-masing 3 tingkat.\n\nHelm: half-face Rp 75.000, full-face Rp 250.000 (mengurangi pingsan saat kecelakaan 50%), helm custom Kirana (event).\n\n## HP\n\n| Level | Nama | Harga | Fitur |\n|---|---|---|---|\n| 1 | HP jadul retak | Gratis | Telepon, SMS, peta sederhana, jam |\n| 2 | HP Android murah | Rp 800.000 | Aplikasi Obrol (chat NPC), peta wilayah, kamera |\n| 3 | HP menengah | Rp 2.000.000 | Peta gosip (Jojo), aplikasi ojek (kerja ojek), m-banking |\n| 4 | HP bagus | Rp 4.500.000 | Rekam video (konten untuk uang), jadwal NPC lengkap, foto kencan |\n\n## Kamar\n\n| Level | Nama | Harga | Efek |\n|---|---|---|---|\n| 1 | Kamar sempit | - | Tidur: Energi 80 |\n| 2 | Kasur busa & meja belajar | Rp 300.000 | Energi 90, belajar di rumah (nilai +5%) |\n| 3 | Kipas & rak buku | Rp 500.000 | Mood +5 tiap pagi, simpan 20 item |\n| 4 | Kamar dicat & poster | Rp 700.000 | Pesona +1, bisa mengundang teman (hati +10 per kunjungan) |\n| 5 | Kamar loteng baru | Rp 2.500.000 | Pindah ke loteng warkop: kamar luas, jendela atap, Energi 100, tempat kencan rumah |\n\nDekorasi bebas: lampu tumbler, karpet, meja gambar, gitar, akuarium cupang (dari Kirana), maket (dari Tegar).\n\n## Warkop Simpang (properti idle utama)\n\n| Level | Nama | Biaya | Penghasilan pasif/hari | Tampilan |\n|---|---|---|---|---|\n| 1 | Gerobak kopi | - | Rp 20.000 | Gerobak kayu, 2 kursi plastik |\n| 2 | Warung tenda | Rp 1.500.000 | Rp 60.000 | Tenda biru, 3 meja, lampu bohlam |\n| 3 | Warung semi permanen | Rp 5.000.000 | Rp 150.000 | Dinding bata setengah, TV nobar, menu makanan |\n| 4 | Warkop dua lantai | Rp 15.000.000 | Rp 350.000 | Lantai atas lesehan, mural Andra, live music |\n| 5 | Kafe Simpang | Rp 35.000.000 | Rp 700.000 | Kafe modern-tradisional, roasting sendiri, cabang di pasar |\n\nUpgrade kecil warkop: mesin kopi (rasa +), kulkas (minuman dingin), etalase (gorengan), wifi (pelanggan lama duduk), speaker,\npegawai (Laras untuk sarapan, Bimo koki, Bram paruh waktu di epilog). Penghasilan pasif masuk saat pemain tidur.\n\n## Properti lain\n\n| Properti | Buka di | Biaya | Penghasilan |\n|---|---|---|---|\n| Gerobak kopi keliling kedua | Bab 3 | Rp 800.000 | Rp 30.000/hari (dijalankan anak kampung) |\n| Bengkel bersama Mas Fajar | Bab 10 | Rp 6.000.000 | Rp 120.000/hari, upgrade motor -15% |\n| Lapak pasar (bersama Laras) | Bab 10 | Rp 2.000.000 | Rp 80.000/hari |\n| Kos kecil (Bu Narti menjual) | Bab 12 | Rp 25.000.000 | Rp 250.000/hari |\n\n## Outfit\n\nToko baju pasar (murah), butik Pusat Kota (mahal), dan buatan Sasha (event). Outfit memberi **Gaya** (bagian dari Pesona) dan\ndisukai/dibenci NPC tertentu.\n\n| Outfit | Harga | Gaya | Catatan |\n|---|---|---|---|\n| Hoodie abu | Rp 80.000 | +1 | Netral |\n| Jaket denim | Rp 150.000 | +2 | Disukai Sekar, Andra |\n| Jaket Lampu Kota | Masuk geng | +2 | Warga netral, guru tidak suka |\n| Kemeja batik bagus | Rp 200.000 | +2 | Disukai Nadia, guru, Om Darto |\n| Kaus band | Rp 70.000 | +1 | Disukai Sekar, Uti |\n| Jersey basket | Rp 120.000 | +1 | Disukai Dimas |\n| Setelan kencan | Rp 350.000 | +3 | Semua romance +10% di kencan |\n| Jaket buatan Sasha | Event 8 hati | +4 | Unik |\n"}, {"id": "61-keuangan", "file": "61-keuangan.md", "title": "61. Keuangan", "md": "# 61. Keuangan\n\n## Mata uang & tampilan\n\n- Rupiah (Rp). Uang tunai di dompet + saldo tabungan (bank atau celengan).\n- HUD menampilkan uang tunai. Saldo bank terlihat di HP (level 3) atau di bank.\n- Dompet bisa hilang kalau pemain pingsan di jalan malam (kehilangan 30% uang tunai) kecuali reputasi Jalanan tinggi.\n\n## Pemasukan\n\n| Sumber | Kisaran | Waktu |\n|---|---|---|\n| Uang saku Om Darto | Rp 15.000/hari sekolah | Pagi (berhenti kalau Om marah) |\n| Kiriman Ibu | Rp 100.000/bulan + paket | Tanggal 1 |\n| Kopi keliling | Rp 3.000-5.000 untung per cup, 15-40 cup | Sore |\n| Jaga warkop (bantu Om) | Gaji Rp 25.000 + tip | Malam |\n| Penghasilan pasif properti | Lihat `60-upgrade.md` | Saat tidur |\n| Bengkel | Rp 30.000-80.000 per sesi | Sore |\n| Ojek | Rp 8.000-25.000 per order | Sore/malam (motor & HP 3) |\n| Ngamen | Rp 1.000-20.000 per lagu | Malam |\n| Balap resmi | Rp 200.000-2.000.000 hadiah | Minggu |\n| Balap liar | Taruhan Rp 50.000-500.000 (berisiko) | Malam |\n| Misi kecil NPC | Rp 5.000-100.000 | Kapan saja |\n| Lomba sekolah/kota | Rp 100.000-1.000.000 | Event |\n| Jual ikan, barang bekas | Rp 2.000-30.000 | Kapan saja |\n| Beasiswa prestasi | Rp 500.000/semester (nilai > 85) | Rapor |\n\n## Pengeluaran rutin\n\n| Pengeluaran | Harga |\n|---|---|\n| Makan di warung / kantin | Rp 8.000-15.000 |\n| Gorengan, cilok | Rp 1.000-5.000 |\n| Bensin | Rp 10.000 per 2 hari (motor) |\n| Pulsa/kuota | Rp 25.000/minggu (HP 2+) |\n| Bahan kopi keliling | Rp 2.000 per cup |\n| Fotokopi, buku, iuran kelas | Rp 5.000-35.000 |\n| Kencan | Rp 20.000-150.000 tergantung tempat |\n| Kado | Lihat `03-sistem-hati.md` |\n| Servis motor | Rp 50.000/bulan |\n| Denda tilang | Rp 100.000 |\n| Klinik | Rp 50.000-150.000 |\n\n## Tabungan\n\n- **Celengan ayam** di kamar: aman, tanpa bunga, dibuka dengan dipecah (animasi lucu).\n- **Tabungan pelajar** di bank Pusat Kota (Bu Wati): bunga 1%/bulan (Ekonomi tinggi: 2%). Tarik tunai di ATM.\n- **Target tabungan** di HP: pemain menulis target (motor, kado, Gelang Benang) dan progres terlihat.\n\n## Utang\n\n| Pemberi | Bunga | Catatan |\n|---|---|---|\n| **Pak Gito** (utang Om Darto) | 10%/bulan | Total awal Rp 12.000.000. Ditagih tiap Jumat (min. Rp 150.000). Lunas = event & ending |\n| **Mak Iyah** (gorengan) | 0% | Maks Rp 20.000, kalau tidak dibayar seminggu Mak Iyah menolak |\n| **Teman** (Bimo, Uti) | 0% | Maks Rp 50.000, telat bayar = hati -20 |\n| **Koperasi sekolah** | 2%/bulan | Maks Rp 500.000, butuh reputasi Sekolah > 30 |\n| **Pinjol** (iklan di HP) | 30%/bulan | Jebakan: penagih datang ke rumah, Om marah, reputasi Warga -20 |\n\n## Harga contoh di kota\n\n| Barang | Harga |\n|---|---|\n| Es kopi susu Warkop Simpang | Rp 8.000 |\n| Kopi hitam | Rp 4.000 |\n| Nasi uduk Laras | Rp 5.000 |\n| Bakso Pak Pras | Rp 12.000 |\n| Mi ayam | Rp 12.000 |\n| Martabak manis | Rp 25.000 |\n| Tiket bianglala | Rp 10.000 |\n| Gelang Benang (pasar malam) | Rp 15.000 |\n| Benang untuk Gelang (Prakarya) | Rp 3.000 |\n| Buku pelajaran bekas | Rp 20.000 |\n\n## Keseimbangan\n\n- Minggu pertama pemain sulit menabung (uang saku hampir habis untuk makan). Kopi keliling adalah jalan keluar pertama.\n- Target ekonomi per tahun: tahun 1 melunasi sebagian utang & warkop level 2-3, tahun 2 motor & warkop 3-4, tahun 3\n  warkop 5 atau properti lain.\n- Uang tidak bisa membeli hati secara langsung: memberi uang tunai ke NPC selalu `marah` atau tidak berefek.\n"}, {"id": "70-animasi-berantem", "file": "70-animasi-berantem.md", "title": "70. Animasi Berantem", "md": "# 70. Animasi Berantem\n\nPrinsip: **mudah dimainkan, enak dilihat**. Dua tombol serang + satu tombol hindar + satu tombol pegang. Kombinasi dan\nwaktu yang membuat dalamnya. Tidak ada darah: lawan kalah = pingsan (bintang berputar) atau kabur.\n\n## Kontrol\n\n| Tombol | Aksi |\n|---|---|\n| **A** (pukul) | Pukulan ringan cepat |\n| **B** (tendang) | Tendangan, lebih lambat tapi jangkauan panjang |\n| **X** (hindar) | Guling/geser ke arah stik; tahan = tangkis (block) |\n| **Y** (pegang) | Pegang/kunci lawan, ambil senjata improvisasi |\n| **RT** (kunci target) | Kamera dan arah serangan mengunci ke satu lawan |\n| **LT + tombol** | Jurus spesial (butuh meter **Nyali** penuh) |\n\nDi keyboard: J pukul, K tendang, L hindar, I pegang, Tab kunci target, Shift + tombol = jurus.\n\n## Meter\n\n- **Darah/Stamina** pemain (bar hijau): habis = pingsan, bangun di rumah/UKS.\n- **Meter Nyali** (bar oranye): terisi dari serangan yang kena, tangkis tepat, dan provokasi. Penuh = jurus spesial.\n- **Pusing lawan** (bintang kecil di atas kepala): terisi dari combo. Penuh = lawan limbung, bisa dikunci atau dibanting.\n\n## Gerakan dasar\n\n| Gerakan | Input | Animasi voxel | Frame (12 fps) |\n|---|---|---|---|\n| Jab | A | Tangan depan maju, badan sedikit miring | 4 (1 antisipasi, 2 kena, 1 kembali) |\n| Straight | A, A | Tangan belakang memutar pinggul | 5 |\n| Hook | A, A, A | Lengan melengkung, badan memutar 45° | 6 |\n| Tendangan depan | B | Lutut naik, kaki lurus ke depan | 6 |\n| Tendangan samping | → + B | Badan miring, kaki menyamping (jangkauan 1.5 petak) | 7 |\n| Sapuan kaki | ↓ + B | Jongkok, kaki menyapu lingkaran, lawan jatuh | 8 |\n| Tangkis | Tahan X | Kedua lengan di depan wajah; tangkis tepat waktu (6 frame awal) = **parry**, lawan terdorong | 2 + tahan |\n| Guling | X + arah | Guling ke arah stik, kebal 4 frame | 8 |\n| Mundur cepat | X tanpa arah | Lompat kecil ke belakang | 5 |\n| Provokasi | Tekan stik | Tepuk dada / \"sini!\" (Nyali +, tapi terbuka) | 10 |\n\n## Combo\n\n| Nama | Input | Hasil |\n|---|---|---|\n| **Tiga Kopi** | A, A, A | Jab, straight, hook. Pusing +30 |\n| **Ojek Lewat** | A, A, B | Dua pukulan lalu tendangan samping, lawan terpental 1 petak |\n| **Sapu Pasar** | A, ↓ + B | Pukulan lalu sapuan, lawan jatuh (bisa diinjak? **Tidak**: menyerang yang jatuh = reputasi -) |\n| **Angkot Ngerem** | B, B | Dua tendangan depan, mendorong lawan ke dinding (wall bounce) |\n| **Bel Pulang** | A, A, A, B | Combo akhir: tendangan berputar, kena semua lawan dalam 1 petak |\n| **Balas Tangkis** | Parry lalu A | Counter cepat, kerusakan x1.5 |\n\n## Pegangan & kuncian\n\n| Kuncian | Input | Animasi |\n|---|---|---|\n| Kerah | Y dekat lawan | Pegang kerah, lawan meronta (tekan A berulang untuk pukul perut) |\n| Dorong | Y lalu arah | Dorong lawan ke arah itu (ke dinding, tong sampah, kolam) |\n| Banting bahu | Y lalu B | Angkat dan banting lewat bahu, lawan terbaring 2 detik |\n| Kunci lengan | Y saat lawan pusing | Pelintir lengan ke belakang, lawan menyerah (pertarungan selesai lebih awal, reputasi +) |\n| Headlock | Y dari belakang | Rangkul leher main-main, lawan pusing perlahan |\n| Lepas pegangan | Tekan X berulang | Saat pemain dipegang lawan |\n\n## Senjata improvisasi\n\nTidak ada senjata tajam (aturan Lampu Kota). Senjata improvisasi rusak setelah beberapa pukulan.\n\n| Benda | Ditemukan | Efek | Tahan |\n|---|---|---|---|\n| Sapu | Kelas, halaman | Jangkauan panjang, sapuan lebar (memakai sistem animasi sapu) | 6 pukulan |\n| Penggaris kayu | Kelas | Cepat, kerusakan kecil | 8 |\n| Tas ransel | Pemain sendiri | Ayunan memutar, pukul mundur | Tak terbatas (kerusakan kecil) |\n| Kursi plastik | Kantin, warkop | Kerusakan besar, sekali pakai (patah) | 1-2 |\n| Tong sampah | Gang | Dilempar (kena Fisika: jarak), atau dipakai topi lawan (lawan buta 2 detik) | 1 |\n| Ember | Kamar mandi, kampung | Pasang di kepala lawan | 1 |\n| Helm | Motor | Pukulan berat lambat | 4 |\n| Galon kosong | Rumah Gilang | Lempar, memantul | 1 |\n| Bola futsal/basket | Lapangan | Tendang/lempar, memantul ke lawan lain | Tak terbatas |\n| Bom asap (racikan Kimia) | Racikan | Kabur atau serangan kejutan | 1 |\n\n## Jurus spesial (meter Nyali penuh)\n\n| Jurus | Dari | Animasi |\n|---|---|---|\n| **Tendangan Senja** | Default | Lompat berputar, tendangan menyapu, efek garis oranye |\n| **Sapuan Kabut** | Wulan 4 hati | Gerak rendah, menyapu 3 lawan sekaligus, debu putih |\n| **Kunci Daun Teh** | Wulan 2 hati | Kuncian silat cepat, lawan langsung menyerah |\n| **Bunga Teh Mekar** | Wulan 6 hati | Combo 7 serangan silat, kamera melambat, kelopak hijau |\n| **Gas Pol** | Lampu Kota (Bang Jaka) | Lari menabrak dengan bahu, menembus barisan |\n| **Ojek Ekspres** | Mas Fajar | Lempar kunci pas lalu tendang |\n| **Upper Gorengan** | Bimo 6 hati (lucu) | Uppercut dengan efek gorengan terbang |\n| **Lonceng** | Bab 13 | Pukulan ke tanah, gelombang suara lonceng, semua lawan pusing |\n\n## Keroyokan\n\n- Maksimal **5 lawan aktif**. Lawan menunggu giliran membentuk lingkaran (hanya 2 yang menyerang bersamaan) supaya\n  tidak frustrasi.\n- Indikator serangan: tanda \"!\" merah di atas lawan 0.5 detik sebelum memukul (waktu untuk tangkis/hindar).\n- **Teman membantu**: Uti, Arga, Bimo (6+ hati), anggota Lampu Kota bisa dipanggil (tombol arah atas) sekali per\n  pertarungan. Mereka mengambil satu atau dua lawan.\n- Kabur: lari keluar layar 5 detik tanpa terkena = selesai, dengan konsekuensi reputasi.\n\n## Tipe lawan\n\n| Tipe | Contoh | Perilaku |\n|---|---|---|\n| Penggertak | Anak geng Bram | Lambat, sering provokasi, mudah dipukul |\n| Petarung | Rio | Kuat, tangkis sering, harus dipegang |\n| Licik | Kevin | Menghindar, lempar barang, memanggil teman |\n| Pembalap | Anak Serigala Besi | Cepat, tendangan, rentan sapuan |\n| Preman dewasa | Anak buah Pak Gito, preman terminal | Darah tebal, pukulan berat, lambat |\n| Satpam bayaran | Proyek Pak Haris | Bertameng tongkat (tanpa senjata tajam), formasi |\n\n## Bos\n\n| Bos | Bab | Pola | Kelemahan |\n|---|---|---|---|\n| **Rio** | Bab 2 | Serudukan (tangkis lalu counter) | Lelah setelah 3 serudukan |\n| **Bram** | Bab 5 | Combo cepat, provokasi, memanggil Rio & Kevin di 50% | Parry tepat; serangan saat dia provokasi |\n| **Kobar** | Bab 6 | Rantai motor (diayun, bukan tajam), tendangan berat, di jembatan | Dorong ke pagar jembatan |\n| **Bang Jaka** (ujian) | Bab 3 | Adil, satu lawan satu, mengajarkan tangkis | Tutorial tingkat lanjut |\n| **Preman terminal** | Bab 3 | Tutorial keroyokan (Wulan masuk menolong) | |\n| **Pak Bondan** | Bab 13 | Kepala keamanan proyek, 3 fase: tinju, bantingan, memanggil anak buah | Kunci lengan setelah pusing; jurus Lonceng |\n\n## Kamera & efek\n\n- Kamera sedikit mendekat saat combo ke-3, **hit-stop** 2 frame saat pukulan kena, guncangan layar ringan saat bantingan.\n- Efek: garis gerak putih, bintang kecil (pusing), debu saat jatuh, angka kerusakan opsional (bisa dimatikan).\n- Lawan kalah: animasi duduk pusing dengan bintang berputar atau lari terbirit-birit sambil memegang celana.\n"}, {"id": "71-animasi-game", "file": "71-animasi-game.md", "title": "71. Animasi Game", "md": "# 71. Animasi Game\n\nSemua animasi untuk renderer voxel sprite-stacking (tokoh 36 voxel). Kecepatan dasar 12 fps. Kode animasi mengikuti gaya\n`buildHumanFrame(sid, anim, i, part, views)` yang sudah ada (contoh animasi yang sudah ada: jalan, pukul, tendang, pedang,\nsapu, guling, naik motor/sepeda/mobil).\n\n## Gerak dasar\n\n| Kode | Animasi | Frame | Catatan |\n|---|---|---|---|\n| `idle` | Diam bernapas, bahu naik-turun | 4 | Variasi tiap 8 detik: lihat jam, garuk kepala, regangkan badan |\n| `walk` | Jalan | 8 | Tas berayun |\n| `run` | Lari | 8 | Badan condong, lengan ditekuk |\n| `sprint` | Lari kencang | 6 | Debu di kaki, keringat (Energi turun) |\n| `sneak` | Mengendap | 8 | Badan merunduk, saat bolos/menghindari Pak Wawan |\n| `jump` | Lompat | 6 | Lompat pagar rendah, selokan |\n| `climb` | Memanjat | 8 | Pagar sekolah, tangga menara, pohon |\n| `fall` | Jatuh | 4 | Terpeleset genangan, jatuh sepeda |\n| `getup` | Bangun | 6 | Setelah jatuh/pingsan |\n| `sit` | Duduk | 2 + idle | Kursi, bangku, lantai (bersila) |\n| `squat` | Jongkok | 2 + idle | Ngobrol di pinggir jalan, memeriksa motor |\n| `lie` | Tidur/berbaring | 2 + napas | Kasur, rumput, UKS |\n| `swim` | Berenang | 8 | Kali Cendana saat event banjir |\n| `umbrella_walk` | Jalan berpayung | 8 | Hujan |\n| `carry` | Membawa barang | 8 | Kardus, galon, termos (kedua tangan di depan) |\n| `push` | Mendorong | 8 | Gerobak kopi, motor mogok |\n\n## Sekolah\n\n| Kode | Animasi | Frame |\n|---|---|---|\n| `write` | Menulis di meja | 4 |\n| `raise_hand` | Angkat tangan | 3 + tahan |\n| `sleep_desk` | Tidur di meja, kepala di lengan, gelembung \"zzz\" | 4 |\n| `blackboard` | Menulis/menghapus papan tulis | 6 |\n| `salute` | Hormat bendera (upacara) | 3 + tahan |\n| `march` | Baris-berbaris | 8 |\n| `sweep` | Menyapu (animasi sapu yang sudah ada) | 8 |\n| `read` | Membaca buku | 2 + balik halaman 4 |\n| `sneak_cheat` | Melirik kertas teman (menyontek) | 4 |\n| `pushup` | Push-up hukuman | 6 |\n| `stand_punish` | Berdiri di depan kelas, satu kaki | 2 + goyang |\n| `pass_note` | Mengoper kertas | 5 |\n\n## Kerja & usaha\n\n| Kode | Animasi | Frame |\n|---|---|---|\n| `brew_coffee` | Menyeduh kopi: tuang air, aduk, saring | 10 |\n| `serve` | Menyerahkan gelas/piring | 5 |\n| `cart_push` | Dorong gerobak kopi keliling + bel | 8 |\n| `shout_sell` | Teriak jualan, tangan di mulut | 4 |\n| `count_money` | Menghitung uang | 6 |\n| `wrench` | Memutar kunci pas | 6 |\n| `under_bike` | Berbaring di bawah motor | 4 |\n| `wipe` | Lap meja | 6 |\n| `cook` | Memasak di wajan (bersama Bimo/Laras) | 8 |\n| `fish_cast` / `fish_pull` | Lempar dan tarik pancing | 6 / 6 |\n| `busk` | Ngamen gitar/ukulele | 8 |\n\n## Kendaraan\n\n| Kode | Animasi | Frame |\n|---|---|---|\n| `bike_ride` | Kayuh sepeda (sudah ada) | 8 |\n| `bike_stand` | Berdiri mengayuh (tanjakan, sprint) | 8 |\n| `bike_trick` | Trik BMX: bunny hop, manual | 8 |\n| `moto_ride` | Naik motor (sudah ada) | 4 |\n| `moto_lean` | Miring di tikungan | 3 |\n| `moto_kickstart` | Engkol motor (mini game) | 6 |\n| `moto_wheelie` | Wheelie | 6 |\n| `moto_crash` | Jatuh dari motor, guling di aspal | 10 |\n| `passenger` | Dibonceng (NPC di belakang memeluk pinggang saat 6+ hati, pegang jok saat rendah) | 4 |\n| `helmet_on` / `helmet_off` | Pakai/lepas helm (aksesori helm yang sudah ada) | 5 |\n| `angkot_ride` | Duduk di angkot, bergoyang | 4 |\n\n## Sosial & emosi\n\n| Kode | Animasi | Frame |\n|---|---|---|\n| `wave` | Melambai | 6 |\n| `nod` / `shake` | Mengangguk / menggeleng | 4 / 4 |\n| `laugh` | Tertawa memegang perut | 6 |\n| `cry` | Menangis, mengusap mata | 6 |\n| `angry_stomp` | Menghentakkan kaki | 4 |\n| `shy` | Menunduk, garuk kepala / memainkan jari | 4 |\n| `blush` | Partikel pipi merah (overlay) | - |\n| `shock` | Terlonjak, tanda \"!\" | 3 |\n| `think` | Tangan di dagu, tanda \"?\" | 2 + tahan |\n| `give_gift` | Menyodorkan kado dengan dua tangan | 5 |\n| `receive_gift` | Menerima, reaksi sesuai kategori | 5 |\n| `hug` | Pelukan (event 6/8 hati) | 6 |\n| `high_five` | Tos | 5 |\n| `fist_bump` | Adu kepalan (geng, Uti) | 4 |\n| `handshake` | Salaman / salim ke guru (cium tangan) | 5 |\n| `selfie` | Foto bareng HP | 4 |\n| `phone_talk` / `phone_type` | Telepon / mengetik chat | 4 / 4 |\n| `tie_bracelet` | Mengikat Gelang Benang (event 8 hati
