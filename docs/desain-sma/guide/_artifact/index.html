ng kotak dan kaus oblong putih |\n| Jalan-jalan | Kemeja flanel abu, jeans hitam, boots |\n| Hujan | Ponco hitam, tetap naik motor |\n\n## Watak\n\n- Pendiam, setia, penolong yang tidak mau diterima kasih.\n- Mengenal setiap sudut sekolah dan kota, tahu jalan tikus.\n- **Kelemahan**: menyimpan semua sendiri, mudah dijadikan kambing hitam karena tampangnya.\n- **Rahasia**: merawat taman bunga kecil di belakang Gedung Lama yang dulu ditanam ibunya.\n\n## Hobi & kesukaan\n\n- Hobi: merawat motor tua, berkebun bunga, memanjat menara pemancar untuk melihat kota, memotret lampu jalan.\n- Makanan: nasi kucing, kopi tubruk, kacang rebus.\n- Tempat favorit: menara pemancar, markas Lampu Kota, taman rahasia di belakang Gedung Lama.\n\n| Kado | Item |\n|---|---|\n| Favorit (+80) | Bibit bunga melati (pasar, Rp 15.000), kamera saku bekas |\n| Disukai (+45) | Gorengan, stiker motor, kopi tubruk, kacang rebus |\n| Biasa (+20) | Es kopi susu |\n| Dibenci (-40) | Barang mewah, cokelat (\"terlalu manis\"), mainan senjata |\n\n## Cara bicara\n\n- Sedikit, pendek, gue/lu ke teman, \"saya\" ke guru. Banyak menjawab dengan anggukan (bubble \"...\").\n- Kata khas: \"...\", \"Hm.\", \"Ikut gue.\", \"Nggak usah makasih.\"\n\n> \"...\" (mengangguk, lalu memberikan helm cadangan)\n> \"Dari atas sini, kota keliatan kayak lampu natal. Ibu gue dulu bilang gitu.\"\n\n## Kebiasaan & jadwal\n\n| Waktu | Hari sekolah | Akhir pekan |\n|---|---|---|\n| 05.00-06.30 | Membuka gerbang dan menyapu halaman bersama kakek | Merawat taman rahasia |\n| 06.30-14.00 | Kelas X-1, istirahat di belakang Gedung Lama | Bengkel Mas Fajar |\n| 14.00-18.00 | Membantu kakek, bengkel Mas Fajar | Markas Lampu Kota |\n| 20.00-23.00 | Markas Lampu Kota, menara pemancar | Ronda bersama warga |\n\nKebiasaan: menyiul nada lagu lama, mengusap bekas luka alis, selalu berdiri di dekat pintu.\n\n## Interaksi dengan pemain\n\n- Hati naik dari misi geng, naik motor malam, membantu kakeknya, membawa gorengan.\n- Arga membuka **jalan tikus** di peta (jalur pintas rahasia) saat 4 hati.\n- Kalau pemain menolak Lampu Kota, hati tetap bisa naik lewat jalur sekolah (membantu Pak Ujang dan taman).\n- Bantuan misi: menjadi kunci masuk loteng Gedung Lama (lonceng dan akta tanah).\n\n## Hubungan dengan tokoh lain\n\nCucu **Pak Ujang**, adik kesayangan **Bang Jaka**, rekan **Mas Fajar** dan **Uti** di bengkel. Dicurigai **Pak Wawan**.\nPernah berkelahi dengan **Kobar**, saling hormat.\n\n## Event hati\n\n### 2 hati: \"Helm Cadangan\"\n- **Syarat**: 2 hati, hujan sore, gerbang sekolah.\n- **Adegan**: Pemain kehujanan. Arga berhenti di depan pemain, menyodorkan helm cadangan tanpa kata.\n- **Pilihan**: Naik dan pegang jaketnya (+80) / \"Makasih, tapi aku jalan aja\" (+30) / Tanya \"Kenapa nolong?\" (+50, jawab\n  \"...Kebetulan lewat.\").\n- **Hasil**: membuka \"Nebeng pulang\" dan chat malam pendek.\n\n### 4 hati: \"Taman di Belakang Gedung Lama\"\n- **Syarat**: 4 hati, istirahat kedua, belakang Gedung Lama.\n- **Adegan**: Pemain menemukan Arga menyiram bunga. Dia malu tertangkap.\n- **Pilihan**: Ikut menyiram, diam (+100) / \"Kamu suka bunga?\" sambil tersenyum (+80) / \"Nggak nyangka anak geng...\"\n  (-50).\n- **Hasil**: Arga bercerita tentang ibunya. Kencan \"Menara pemancar\" terbuka.\n\n### 6 hati: \"Dijebak\"\n- **Syarat**: 6 hati, Bab 7, markas Lampu Kota lalu kantor polisi.\n- **Adegan**: Arga dituduh menyerang anak STM. Bukti palsu. Dia menolak membela diri: \"Percuma.\"\n- **Pilihan**: Cari bukti bersama Jojo (misi, +100, Arga dibebaskan) / Jamin di depan polisi bersama Pak Ujang (+80) /\n  Ragu (+0, Arga diskors seminggu).\n- **Hasil**: Arga pertama kali tertawa lepas. Cemburu aktif (diam, tapi muncul di mana pun pemain berkencan).\n\n### 8 hati: \"Puncak Menara\" (romance) / \"Saudara Jalanan\" (sahabat)\n- **Syarat**: 8 hati, Gelang Benang, malam tahun baru atau malam 17 Agustus, menara pemancar.\n- **Adegan (romance)**: Kembang api di bawah mereka. Arga memberi setangkai melati dari tamannya: \"Gue nggak pinter\n  ngomong. Ini aja ya.\"\n- **Pilihan**: Ikat gelang (pacaran) / Ikrar saudara jalanan, tukar jaket (sahabat).\n- **Hasil**: epilog Arga menjadi penjaga sekolah baru yang juga montir; taman kecil jadi taman sekolah.\n\n## Contoh obrolan & reaksi\n\n| Situasi | Bubble / dialog |\n|---|---|\n| Sapaan | \"...\" (mengangguk). Saat 6+ hati: \"Udah makan?\" |\n| Pemain dikeroyok | Muncul dari belakang, masuk pertarungan sebagai pembantu |\n| Pemain melanggar aturan Lampu Kota | `marah` \"Bukan gitu caranya.\" |\n| Pemain kasih bibit bunga | `malu` pertama kali; lesung pipit terlihat |\n| Ulang tahun (30 Januari) | Tidak pernah merayakan; kalau diingat, `kaget` |\n\n## Prompt portrait\n\n```\nTokoh: 16-year-old Indonesian boy, lean and muscular, dark tan skin, buzz-cut hair, thin scar cutting through his right\neyebrow, tired watchful dark eyes, a dimple on the left when he smiles, worn dark brown leather jacket over a rolled-up\ncream school shirt. Quiet, protective look. Key colors leather brown, smoke grey, lamp yellow.\n```\n"}, {"id": "22-rizal", "file": "22-rizal.md", "title": "22. Rizal Pratama", "md": "# 22. Rizal Pratama\n\n| | |\n|---|---|\n| Umur / kelas | 15, SMA 3 kelas X-2 (sekelas pemain) |\n| Peran | Penulis cerpen, sekretaris OSIS, kutu buku romantis |\n| Tinggal | **Dalam peta**: Pusat Kota, kontrakan 2 petak di gang belakang Ruko Pelita |\n| Keluarga | Ibu tunggal (kasir minimarket shift malam), nenek tinggal di kampung (luar peta) |\n| Romance | Pemain cewek |\n| Warna kunci | Cokelat sweater `#8a6a4a`, biru tinta `#2e4a7a`, krem |\n| Gaya voxel | `sidepart`, kacamata, sweater rompi |\n\n## Penampilan\n\nTinggi 1.3, kurus, kulit kuning langsat, rambut belah samping yang selalu jatuh ke dahi. Kacamata bingkai tipis kotak.\nWajah lembut, bulu mata panjang. Jari selalu belepotan tinta pulpen. Suka menunduk saat berjalan.\n\n## Pakaian\n\n| Situasi | Pakaian |\n|---|---|\n| Sekolah | Seragam rapi, rompi rajut cokelat di atasnya (bahkan saat panas), tas selempang kanvas penuh buku |\n| OSIS | Jas almamater, pulpen di saku dan di telinga |\n| Di rumah | Kaus kebesaran bertuliskan festival literasi, sarung |\n| Jalan-jalan | Kemeja kotak cokelat, celana bahan, sepatu kanvas cokelat |\n| Lomba menulis | Kemeja batik ayahnya (satu-satunya peninggalan) |\n| Hujan | Payung hitam besar yang dia bagi dengan siapa pun |\n\n## Watak\n\n- Lembut, romantis, perhatian pada detail kecil.\n- Lucu dengan cara tak sengaja (terlalu serius soal hal sepele).\n- **Kelemahan**: tidak percaya diri, mengalah terus, takut konfrontasi.\n- **Rahasia**: menulis surat untuk ayahnya (yang meninggalkan keluarga) di buku, tidak pernah dikirim.\n\n## Hobi & kesukaan\n\n- Hobi: menulis cerpen, membaca puisi, mengoleksi kata langka di buku kecil, menonton film lama di HP.\n- Makanan: roti sobek cokelat, teh manis hangat, mi ayam.\n- Tempat favorit: perpustakaan, Toko Buku Pena, taman kota dekat air mancur, warung mi ayam.\n\n| Kado | Item |\n|---|---|\n| Favorit (+80) | Buku puisi (Rp 35.000), pulpen tinta bagus |\n| Disukai (+45) | Buku apa pun, roti sobek, teh, bunga, buku catatan |\n| Biasa (+20) | Es kopi susu, cokelat |\n| Dibenci (-40) | Gorengan (minyak di halaman buku), stiker motor |\n\n## Cara bicara\n\n- Aku/kamu, kalimat indah dan baku saat gugup, puitis tanpa sengaja.\n- Kata khas: \"Secara harfiah...\", \"Itu kata yang bagus.\", \"Maaf, aku melamun.\", \"Boleh aku tulis?\"\n\n> \"Kamu tahu kata 'senandika'? Bicara pada diri sendiri. Aku sering. Sekarang aku bicara sama kamu. Berarti kemajuan.\"\n> \"Maaf, aku melamun. Matahari sore bikin semuanya kayak paragraf penutup.\"\n\n## Kebiasaan & jadwal\n\n| Waktu | Hari sekolah | Akhir pekan |\n|---|---|---|\n| 06.15-14.00 | Kelas X-2, istirahat di perpustakaan | Perpustakaan daerah |\n| 14.00-16.30 | Ruang OSIS, ruang mading | Toko Buku Pena |\n| 16.30-19.00 | Menunggu ibunya berangkat kerja, masak | Taman kota menulis |\n| 19.00-23.00 | Menulis di kontrakan | Klub sastra (Sabtu malam, kafe) |\n\nKebiasaan: menulis di punggung tangan saat tidak ada kertas, membenarkan kacamata dengan dua jari, menghitung suku kata.\n\n## Interaksi dengan pemain\n\n- Hati naik dari mini game **Bahasa Indonesia**, membaca cerpennya dan memberi pendapat, membantu mading.\n- Bisa diajak menulis bersama: membuka lomba menulis kota (hadiah uang dan Kecerdasan +).\n- Bantuan misi: di Bab 13 menulis artikel opini yang dimuat koran kota dan membuat surat resmi untuk DPRD.\n\n## Hubungan dengan tokoh lain\n\nPartner OSIS **Nadia**, rekan mading **Jojo**, pelanggan **Toko Buku Pena** (dekat dengan **Mei**). Murid kesayangan\n**Bu Sinta**. Tetangga gang **Jojo**.\n\n## Event hati\n\n### 2 hati: \"Halaman yang Basah\"\n- **Syarat**: 2 hati, hujan, taman kota.\n- **Adegan**: Kertas cerpen Rizal terbang dan jatuh ke kolam air mancur.\n- **Pilihan**: Ceburkan kaki dan ambil (+80) / Bantu menulis ulang dari ingatannya (+60) / Tertawa (-20).\n- **Hasil**: Rizal meminta pemain jadi \"pembaca pertama\". Membuka \"Baca cerpen\".\n\n### 4 hati: \"Diplagiat\"\n- **Syarat**: 4 hati, Bab 5, ruang mading.\n- **Adegan**: Cerpen Rizal menang lomba atas nama kakak kelas (teman Bram). Rizal memilih diam.\n- **Pilihan**: Kumpulkan draf tulisan tangan sebagai bukti (misi, +100) / Bujuk dia lapor ke Bu Sinta (+80) / \"Nanti\n  nulis lagi aja\" (+10).\n- **Hasil**: kencan \"Perpustakaan daerah\" dan \"Klub sastra\" terbuka.\n\n### 6 hati: \"Surat untuk Ayah\"\n- **Syarat**: 6 hati, malam, kontrakan Rizal (ibunya kerja).\n- **Adegan**: Pemain menemukan buku surat untuk ayah. Rizal mengakui dia tahu ayahnya tinggal di kota sebelah.\n- **Pilihan**: Tawarkan menemani mengirim satu surat (+100) / \"Kamu nggak berutang apa-apa ke dia\" (+80) / Baca tanpa\n  izin (-50).\n- **Hasil**: Rizal menulis cerpen baru tentang pemain. Cemburu aktif (diam-diam, puisi sedih di mading).\n\n### 8 hati: \"Cerpen Terakhir\" (romance) / \"Dua Penulis\" (sahabat)\n- **Syarat**: 8 hati, Gelang Benang, sore, taman kota air mancur.\n- **Adegan (romance)**: Rizal memberikan cerpen berjudul \"Gadis dari Lereng Wangi\". Kalimat terakhir: \"Dan aku memintanya\n  menjadi kalimat pertama di bab berikutnya.\" Dia menatap pemain: \"Itu... kamu. Kamu mau?\"\n- **Pilihan**: Ikat gelang (pacaran) / Tulis bab berikutnya bersama sebagai sahabat (sahabat).\n- **Hasil**: epilog buku kumpulan cerpen Rizal terbit, dipersembahkan untuk pemain.\n\n## Contoh obrolan & reaksi\n\n| Situasi | Bubble / dialog |\n|---|---|\n| Sapaan | \"Selamat pagi. Hari ini kata pilihanku: 'baskara'. Artinya matahari.\" |\n| Pemain berantem | `cemas` \"Kekerasan itu... plot yang membosankan.\" |\n| Pemain nilai Bahasa jelek | `senyum` \"Aku bisa bantu. Gratis. Bayar pakai cerita.\" |\n| Pemain kasih buku puisi | `jatuhcinta` bila 6+ hati |\n| Ulang tahun (28 Oktober) | Ingin diberi surat tulisan tangan |\n\n## Prompt portrait\n\n```\nTokoh: 15-year-old Indonesian boy, slim, light skin, soft face with long eyelashes, side-parted black hair falling over his\nforehead, thin square glasses, ink stains on fingers, brown knitted sweater vest over a cream school shirt, a pen behind\nhis ear. Gentle bookish look. Key colors sweater brown, ink blue, cream.\n```\n"}, {"id": "23-tegar", "file": "23-tegar.md", "title": "23. Tegar Hutomo", "md": "# 23. Tegar Hutomo\n\n| | |\n|---|---|\n| Umur / kelas | 15, SMA 3 kelas X-2 (ketua kelas pemain) |\n| Peran | Ketua kelas, juara umum, kaku, ditekan orang tua masuk kedokteran |\n| Tinggal | **Dalam peta**: Perumahan Bukit Asri, rumah modern abu gelap Blok B-3 dengan pagar tinggi |\n| Keluarga | Ayah dokter bedah, ibu dokter anak, kakak perempuan mahasiswa kedokteran di luar negeri |\n| Romance | Pemain cewek (sahabat untuk pemain cowok, salah satu dari lima sahabat) |\n| Warna kunci | Abu tua `#4a4f57`, biru langit `#8fb6d9`, putih |\n| Gaya voxel | `sidepart`, kacamata, seragam sangat rapi |\n\n## Penampilan\n\nTinggi 1.3, badan sedang, kulit putih pucat. Rambut hitam lurus belah samping disisir dengan minyak rambut. Kacamata\nbingkai hitam tebal. Wajah selalu serius, kantong mata gelap (kurang tidur). Saat dilepas kacamatanya, wajahnya terlihat\njauh lebih muda dan lembut.\n\n## Pakaian\n\n| Situasi | Pakaian |\n|---|---|\n| Sekolah | Seragam disetrika tajam, ikat pinggang kulit, dasi (satu-satunya yang pakai dasi tiap hari), sepatu pantofel |\n| Les | Kemeja biru langit, celana bahan, tas ransel penuh buku latihan soal |\n| Di rumah | Piama setelan biru tua yang rapi |\n| Jalan-jalan | Polo shirt abu, celana chino, sepatu kets putih yang belum pernah kotor |\n| Lomba olimpiade | Jas almamater dan papan nama |\n| Hujan | Jas hujan lengkap atas-bawah, tas dibungkus plastik |\n\n## Watak\n\n- Kaku, perfeksionis, rajin, sering terdengar sombong padahal tidak bermaksud.\n- Sebenarnya lucu dengan humor garing yang tidak ada yang mengerti.\n- **Kelemahan**: tidak bisa bilang tidak, stres berat, tidak tahu caranya bersenang-senang.\n- **Rahasia**: jago main game balap di warnet dan sangat ingin jadi arsitek, bukan dokter.\n\n## Hobi & kesukaan\n\n- Hobi: mengerjakan soal, menyusun lego arsitektur, main game balap diam-diam, menggambar denah rumah.\n- Makanan: sandwich dari rumah (bosan), diam-diam suka seblak dan cilok.\n- Tempat favorit: perpustakaan, ruang kelas kosong, warnet di Pusat Kota (rahasia).\n\n| Kado | Item |\n|---|---|\n| Favorit (+80) | Set lego arsitektur (Rp 75.000), buku arsitektur |\n| Disukai (+45) | Buku, cilok, teh, pensil mekanik, voucher warnet |\n| Biasa (+20) | Cokelat, roti |\n| Dibenci (-40) | Es kopi susu dan kopi apa pun (dilarang ayah, dan memang tidak bisa minum kopi), gorengan |\n\n## Cara bicara\n\n- Aku/kamu, baku, presisi angka. \"Secara statistik...\". Lelucon garing yang dia sendiri tertawakan.\n- Kata khas: \"Secara statistik...\", \"Itu tidak efisien.\", \"Tolong kumpulkan PR.\", \"Hah. Hah. Lucu, kan?\"\n\n> \"Secara statistik, kemungkinan kamu lulus ulangan ini 42 persen. Mau dinaikkan? Aku punya rencana.\"\n> \"Aku... nggak pernah ditanya mau jadi apa. Kamu yang pertama.\"\n\n## Kebiasaan & jadwal\n\n| Waktu | Hari sekolah | Akhir pekan |\n|---|---|---|\n| 06.00-14.00 | Datang paling awal (bersaing dengan Nadia), kelas X-2 | Les intensif 08.00-12.00 |\n| 14.00-17.00 | Les di Pusat Kota (tiap hari) | Olimpiade/latihan soal |\n| 17.00-18.00 | **Warnet** diam-diam (Selasa, Jumat) | |\n| 19.00-00.00 | Belajar di kamar | Lego |\n\nKebiasaan: mendorong kacamata ke atas, menata pensil sejajar, menggigit kuku saat stres, sakit maag saat ujian.\n\n## Interaksi dengan pemain\n\n- Ketua kelas: memberi tugas piket, mengumpulkan PR, bisa melaporkan bolos (kecuali hati 4+).\n- **Kelompok belajar**: belajar bareng Tegar sebelum ulangan = bonus nilai +10%.\n- Pemain bisa membantu Tegar bilang \"tidak\" atau membiarkannya (arc Bab 12).\n- Bantuan misi: di Bab 13 membuat maket \"sekolah tetap di tempat\" dan perhitungan biaya yang mempermalukan proposal relokasi.\n\n## Hubungan dengan tokoh lain\n\nSahabat **Dimas** sejak SMP, rival akademis **Nadia**, tetangga **Sekar** dan **Sasha**. Diam-diam takut pada **Bram**.\nSatu-satunya yang berani menyapanya akrab: **Bimo**.\n\n## Event hati\n\n### 2 hati: \"Warnet Rahasia\"\n- **Syarat**: 2 hati, Selasa/Jumat 17.00, warnet Pusat Kota.\n- **Adegan**: Pemain memergoki Tegar memecahkan rekor game balap. Tegar memohon tidak bilang siapa-siapa.\n- **Pilihan**: Tantang balapan di game (mini game, +80) / Janji rahasia (+60) / Ancam lapor (-50, tapi Tegar membantu PR).\n- **Hasil**: membuka \"Main di warnet\" dan obrolan pribadi.\n\n### 4 hati: \"Denah Rumah\"\n- **Syarat**: 4 hati, perpustakaan, istirahat kedua.\n- **Adegan**: Tegar menggambar denah di belakang buku Biologi. \"Ini rumah... buat kakekku. Kalau aku arsitek.\"\n- **Pilihan**: \"Kenapa nggak jadi arsitek?\" (+100) / Minta dibuatkan denah kamar sendiri (+80, bonus upgrade kamar -10%) /\n  \"Dokter kan lebih kaya\" (-20).\n- **Hasil**: kencan \"Toko lego\" dan \"Pameran arsitektur\" terbuka.\n\n### 6 hati: \"Rumah Sakit\"\n- **Syarat**: 6 hati, Bab 12 (kelas XII), malam, UKS lalu rumah sakit.\n- **Adegan**: Tegar pingsan setelah tidak tidur 3 hari menjelang tryout kedokteran. Ayahnya datang dan malah memeriksa nilai.\n- **Pilihan**: Bantu Tegar bicara jujur ke orang tuanya (+100, Tegar memilih arsitektur) / Bela Tegar di depan ayahnya\n  (Nyali 7, +80) / Diam (+0, Tegar terus ke kedokteran dan hancur di epilog).\n- **Hasil**: Tegar menangis dan tertawa sekaligus. Cemburu aktif (dengan menghitung \"statistik\" saingan).\n\n### 8 hati: \"Maket Kecil\" (romance) / \"Arsitek & Klien Pertama\" (sahabat)\n- **Syarat**: 8 hati, Gelang Benang, malam, kamar Tegar penuh maket.\n- **Adegan (romance)**: Tegar memperlihatkan maket rumah kecil dengan dua figur. \"Secara statistik, peluang aku ditolak\n  58 persen. Tapi aku mau coba yang 42.\"\n- **Pilihan**: Ikat gelang (pacaran) / Jadi klien pertama: \"Desainin warkop Om Darto\" (sahabat, kafe level maks -30%).\n- **Hasil**: epilog Tegar kuliah arsitektur, mendesain gedung baru SMA 3 di lahan yang sama.\n\n## Contoh obrolan & reaksi\n\n| Situasi | Bubble / dialog |\n|---|---|\n| Sapaan | \"Selamat pagi. PR Matematika dikumpulkan jam 7.15.\" |\n| Pemain bolos (hati < 4) | `marah` \"Aku wajib mencatat ini.\" |\n| Pemain bolos (hati 4+) | `cemas` \"Aku... nggak lihat apa-apa. Cepat masuk.\" |\n| Pemain kasih kopi | `sedih` \"Aku nggak boleh. Dan nggak bisa.\" |\n| Ulang tahun (12 Desember) | Ulang tahunnya selalu diganti les; senang diajak ke warnet |\n\n## Prompt portrait\n\n```\nTokoh: 15-year-old Indonesian boy, average build, pale skin, black hair neatly side-parted and combed with pomade, thick\nblack-framed glasses, dark under-eye circles, very neat cream school shirt with a grey tie and class-leader badge.\nSerious, tired honor-student look. Key colors dark grey, sky blue, white.\n```\n"}, {"id": "24-jojo", "file": "24-jojo.md", "title": "24. Jojo (Yohanes Sitompul)", "md": "# 24. Jojo (Yohanes Sitompul)\n\n| | |\n|---|---|\n| Umur / kelas | 15, SMA 3 kelas X-2 (sekelas pemain) |\n| Peran | Fotografer mading, tukang gosip, pemegang \"peta gosip\" |\n| Tinggal | **Dalam peta**: Pusat Kota, lantai 2 di atas studio \"Foto Kilat\" milik pamannya |\n| Keluarga | Paman (fotografer pernikahan), bibi, dua sepupu kecil. Orang tua di Medan (luar peta), dia dititipkan |\n| Romance | Pemain cewek (sahabat untuk pemain cowok, salah satu dari lima sahabat) |\n| Warna kunci | Hijau army `#5c6b3c`, oranye `#e8843a`, hitam kamera |\n| Gaya voxel | `mohawk` kecil, rompi fotografer, kamera di leher |\n\n## Penampilan\n\nTinggi 1.28, kurus jangkung, kulit sawo matang, rambut mohawk kecil yang diberi gel (ditegur tiap Senin). Mata besar\npenuh rasa ingin tahu, senyum lebar dengan gigi rapi. Kamera DSLR tua selalu tergantung di leher. Tahi lalat kecil di bawah\nmata kanan.\n\n## Pakaian\n\n| Situasi | Pakaian |\n|---|---|\n| Sekolah | Seragam dikeluarkan sedikit, rompi fotografer hijau army penuh saku, kamera di leher |\n| Liputan | Rompi, topi kupluk oranye, ransel kamera, sepatu kets lusuh |\n| Di rumah | Kaus batak bertuliskan \"Horas!\", celana pendek |\n| Jalan-jalan | Kemeja hawaii oranye, celana kargo, sandal gunung |\n| Acara foto nikahan (kerja) | Kemeja hitam, celana hitam, kartu kru |\n| Hujan | Kamera dibungkus plastik dulu, dirinya belakangan |\n\n## Watak\n\n- Ramai, kepo, lucu, tahu semua gosip sebelum orang lain.\n- Di balik itu punya rasa keadilan yang kuat dan ingin karyanya \"berarti\".\n- **Kelemahan**: mulut ember, kadang menyebar gosip tanpa cek, ingin diakui.\n- **Rahasia**: kangen orang tua dan menelepon ibunya tiap malam pukul 21.00 tepat, satu-satunya saat dia diam.\n\n## Hobi & kesukaan\n\n- Hobi: memotret, mengedit foto, nongkrong di kantin mendengarkan gosip, karaoke lagu batak.\n- Makanan: mi gomak (dari bibinya), bakso, es jeruk.\n- Tempat favorit: ruang mading, atap studio Foto Kilat, kantin (meja tengah), alun-alun.\n\n| Kado | Item |\n|---|---|\n| Favorit (+80) | Roll film / kartu memori (Rp 50.000), lensa bekas |\n| Disukai (+45) | Bakso, es jeruk, gorengan, info gosip baru (pilihan dialog khusus) |\n| Biasa (+20) | Es kopi susu, cokelat |\n| Dibenci (-40) | Buku pelajaran (\"Kau mau aku tidur?\"), kado yang dibungkus terlalu rapi (\"Nggak bisa difoto bagus\") |\n\n## Cara bicara\n\n- Gue/lu dengan logat Medan: \"Kau\", \"Bah!\", \"Macam mana?\". Cepat, bersemangat, banyak gestur.\n- Kata khas: \"Bah!\", \"Breaking news!\", \"Off the record ya...\", \"Senyum! Klik!\"\n\n> \"Bah! Breaking news! Kau tahu siapa yang jalan sama siapa semalam? Nah, off the record ya...\"\n> \"Foto ini... bukan buat gosip. Ini buat orang tahu yang sebenarnya.\"\n\n## Kebiasaan & jadwal\n\n| Waktu | Hari sekolah | Akhir pekan |\n|---|---|---|\n| 06.30-14.00 | Kelas X-2, istirahat di kantin meja tengah | Kerja foto nikahan dengan paman |\n| 14.00-17.00 | Ruang mading, berkeliling memotret | Alun-alun, pasar malam |\n| 17.00-21.00 | Studio Foto Kilat, edit foto | Liputan bebas |\n| 21.00 | Telepon ibu (tidak bisa diganggu) | |\n\nKebiasaan: memotret semua hal termasuk makanan pemain, mencatat gosip di buku kecil berwarna oranye, tertawa keras.\n\n## Interaksi dengan pemain\n\n- Membuka **peta gosip** di HP (lihat rumor yang sedang menyebar) saat 2 hati.\n- Membuka **misi foto** (memotret tempat/orang tertentu, hadiah uang) saat 4 hati.\n- Bisa menyebarkan gosip tentang pemain: kalau hati rendah, gosip pacaran ganda menyebar lebih cepat.\n- Bantuan misi: foto-fotonya kunci membongkar proyek relokasi (Bab 11-13).\n\n## Hubungan dengan tokoh lain\n\nRekan mading **Rizal**, fotografer band **Sekar**, sering ribut dengan **Uti**. Musuh alami **Bram** (sering dipalak).\nKenal semua NPC pengisi kota karena memotret mereka.\n\n## Event hati\n\n### 2 hati: \"Foto yang Salah\"\n- **Syarat**: 2 hati, kantin.\n- **Adegan**: Jojo memasang foto aib siswa kelas lain di mading demi ramai. Anak itu menangis.\n- **Pilihan**: Ajak Jojo minta maaf dan copot foto (+80, Jojo malu tapi berterima kasih) / Copot sendiri diam-diam\n  (+50) / Ikut tertawa (-50, reputasi -).\n- **Hasil**: peta gosip terbuka. Jojo berjanji cek dulu sebelum menyebar.\n\n### 4 hati: \"Jam Sembilan Malam\"\n- **Syarat**: 4 hati, 20.50, atap studio Foto Kilat.\n- **Adegan**: Jojo yang biasanya berisik berbicara pelan di telepon dengan ibunya dalam bahasa Batak. Dia menangis setelahnya.\n- **Pilihan**: Duduk di sampingnya tanpa bicara (+100) / \"Kau kangen, kan?\" (+80) / Memotretnya (-50).\n- **Hasil**: misi foto terbuka. Kencan \"Hunting foto\" terbuka.\n\n### 6 hati: \"Klise Terbakar\"\n- **Syarat**: 6 hati, Bab 11, studio Foto Kilat.\n- **Adegan**: Orang suruhan Pak Haris merusak studio dan kamera Jojo. Kartu memori berisi bukti hilang.\n- **Pilihan**: Kejar pelaku (mini game kejar & berantem, +100, kartu kembali) / Bantu pulihkan file dari laptop\n  (Kecerdasan 6, +80) / Hibur dan belikan kamera bekas (+60, bukti hilang, rute lebih sulit).\n- **Hasil**: Jojo bersumpah \"liputan yang beneran penting\". Cemburu aktif (dia memotret siapa pun yang dekat pemain).\n\n### 8 hati: \"Album Tiga Tahun\" (romance) / \"Liputan Bareng\" (sahabat)\n- **Syarat**: 8 hati, Gelang Benang, sore, ruang mading.\n- **Adegan (romance)**: Jojo memberikan album berisi foto pemain dari hari pertama: pemain di gerbang, di warkop, saat\n  menang, saat sedih. \"Off the record... dari semua foto yang gue ambil, objek favorit gue cuma satu.\"\n- **Pilihan**: Ikat gelang, lalu ambil kamera dan potret dia balik (pacaran) / Jadi partner liputan (sahabat).\n- **Hasil**: epilog Jojo jadi jurnalis foto, fotonya tentang SMA 3 masuk pameran nasional.\n\n## Contoh obrolan & reaksi\n\n| Situasi | Bubble / dialog |\n|---|---|\n| Sapaan | \"Senyum! Klik! Bah, matamu merem.\" |\n| Pemain menang berantem | `tertawa` \"Mantap! Halaman depan minggu ini!\" |\n| Pemain pacaran dengan orang lain | `sinis` \"Gue udah tahu dari dua hari lalu.\" |\n| Pemain beri info gosip | `kaget` \"Serius kau? Dari mana?!\" (+20) |\n| Ulang tahun (19 April) | Minta foto bersama seluruh kelas |\n\n## Prompt portrait\n\n```\nTokoh: 15-year-old Batak Indonesian boy, tall and skinny, brown skin, small gelled mohawk, big curious eyes, small mole\nunder the right eye, wide toothy grin, army green photographer vest with many pockets over an untucked cream school\nshirt, old DSLR camera on a strap around his neck. Energetic, nosy look. Key colors army green, orange, camera black.\n```\n"}, {"id": "25-bram", "file": "25-bram.md", "title": "25. Bram (Bramantyo Megantara)", "md": "# 25. Bram (Bramantyo Megantara)\n\n| | |\n|---|---|\n| Umur / kelas | 17, SMA 3 kelas XI-1, **tinggal kelas** di akhir Bab 5 lalu seangkatan dengan pemain |\n| Peran | Rival utama tahun 1-2, anak developer PT Graha Megantara, **jalur penebusan** |\n| Tinggal | **Dalam peta**: Perumahan Bukit Asri, rumah terbesar di puncak bukit (Blok Utama), kaca dan beton putih |\n| Keluarga | Ayah Pak Haris Megantara, ibu sudah lama pergi ke luar negeri. Tinggal dengan ayah dan pembantu |\n| Romance | Pemain cewek |\n| Warna kunci | Hitam `#1c1c22`, merah anggur `#7a1f2b`, perak jam `#b8bcc4` |\n| Gaya voxel | `sidepart` klimis, jam tangan, kemeja bermerek |\n\n## Penampilan\n\nTinggi 1.36, tegap, kulit kuning langsat bersih. Rambut hitam klimis disisir ke belakang, satu helai selalu jatuh di dahi.\nRahang tegas, mata tajam yang meremehkan. Jam tangan perak mahal. Kalau diperhatikan, ada bekas lebam samar di lengan\nyang selalu ditutupi.\n\n## Pakaian\n\n| Situasi | Pakaian |\n|---|---|\n| Sekolah | Seragam bahan mahal dipermak pas, kancing atas terbuka, jam perak, sepatu kulit Italia |\n| Bersama geng | Jaket bomber hitam berbordir merah anggur, kacamata hitam |\n| Basket | Jersey hitam pribadi (bukan seragam tim), sepatu limited edition |\n| Di rumah | Kaus polos hitam, celana training, sering di gym rumah |\n| Acara kantor ayah | Jas hitam setelan yang terlihat menyesakkan |\n| Hujan | Diantar sopir, tidak pernah basah (Bab penebusan: pertama kali kehujanan dan tertawa) |\n\n## Watak\n\n- Arogan, suka memalak dan mempermalukan, karismatik dan pintar membaca kelemahan orang.\n- Di dalamnya marah dan takut: ayahnya keras, kasar, dan hanya peduli hasil.\n- **Kelemahan**: tidak bisa minta maaf, harga diri setinggi gedung ayahnya.\n- **Rahasia**: menyimpan foto ibunya, bermain piano saat rumah kosong, dan tahu soal izin palsu proyek sejak kelas XI.\n\n## Hobi & kesukaan\n\n- Hobi: basket, gym, piano (rahasia), mengendarai mobil sport ayah tanpa izin.\n- Makanan: steak di restoran hotel (di depan orang), nasi goreng warung dekat rumah lama ibunya (rahasia).\n- Tempat favorit: meja pojok AC kantin, lapangan basket malam, ruang piano di rumah, warung nasi goreng Pusat Kota.\n\n| Kado | Item |\n|---|---|\n| Favorit (+80) | Partitur piano lama (Toko Buku Pena, Rp 30.000), foto dirinya dan ibunya (didapat dari event Jojo) |\n| Disukai (+45) | Nasi goreng warung, bola basket, cokelat |\n| Biasa (+20) | Es kopi susu |\n| Dibenci (-40) | Barang murah yang ditunjukkan di depan geng, gorengan, kado dari pemain sebelum 2 hati (dibuang) |\n\n## Cara bicara\n\n- Gue/lu, sinis, menyindir dengan senyum. Memanggil pemain \"Anak Kampung\" sampai event 4 hati.\n- Kata khas: \"Lu tahu gue siapa?\", \"Murahan.\", \"Cih.\", \"Jangan sok akrab.\"\n- Setelah penebusan: masih sinis, tapi lelucon pahitnya diarahkan ke diri sendiri.\n\n> \"Anak Kampung. Kopi lu nggak level. Sama kayak lu.\"\n> \"Bokap gue bilang semua orang punya harga. Gue pengen tahu harga gue berapa... ternyata murah.\"\n\n## Kebiasaan & jadwal\n\n| Waktu | Hari sekolah | Akhir pekan |\n|---|---|---|\n| 06.50 | Datang dengan mobil sport, parkir di depan gerbang | Gym rumah, kantor ayah |\n| 07.00-14.00 | Kelas, sering bolos ke kantin pojok AC | Mal bersama geng (Sabtu) |\n| 14.00-17.00 | Basket, memalak di belakang Gedung B | Lapangan basket malam (sendiri) |\n| 20.00-22.00 | Rumah, piano kalau ayah pergi | Warung nasi goreng (rahasia) |\n\nKebiasaan: memutar jam tangan, menepuk bahu orang terlalu keras, berhenti bicara saat ponselnya menampilkan \"Papa\".\n\n## Interaksi dengan pemain\n\n- Tahun 1: bos kecil. Memalak, menantang berantem (bos Bab 2 dan Bab 5).\n- Hati tidak bisa naik sebelum Bab 5 kecuali lewat event rahasia di lapangan basket malam.\n- Setelah tinggal kelas (Bab 5), dendam memuncak tapi rahasianya mulai terlihat.\n- **Bab 13**: memilih membantu ayahnya atau membocorkan dokumen. Hati 6+ = membocorkan. Hati 8 = dia sendiri bersaksi.\n- Romance hanya bisa dimulai setelah event 4 hati (penebusan).\n\n## Hubungan dengan tokoh lain\n\nPemimpin geng **Rio**, **Kevin**, **Sasha**. Anak **Pak Haris**. Rival basket **Dimas**. Paling sering mengganggu **Jojo**,\n**Bimo**, dan **Tegar**.\n\n## Event hati\n\n### 2 hati: \"Lapangan Basket Jam 10 Malam\"\n- **Syarat**: 2 hati (atau bertemu setelah Bab 4), 22.00, lapangan basket sekolah.\n- **Adegan**: Bram berlatih sendirian, menembak terus meleset. Ponselnya berdering \"Papa\", dia melempar bola ke pagar.\n- **Pilihan**: Ambil bola dan tantang 1 lawan 1 (+80) / Diam di pinggir lapangan (+50) / Ejek balik (+0, berantem).\n- **Hasil**: Bram berhenti memalak pemain (geng tetap). Obrolan malam terbuka.\n\n### 4 hati: \"Tinggal Kelas\"\n- **Syarat**: 4 hati, akhir Bab 5, rooftop parkiran mal.\n- **Adegan**: Bram baru dipukul ayahnya karena tinggal kelas. Dia menunggu di rooftop parkiran, lebam di pipi.\n- **Pilihan**: Duduk di sampingnya dan bagi minuman (+100) / \"Gue nggak kasihan, tapi gue di sini\" (+80) / Laporkan ke\n  guru BK (+30, Bram marah tapi dikemudian hari berterima kasih).\n- **Hasil**: penebusan dimulai. Bram berhenti memanggil \"Anak Kampung\". Kencan terbuka (rahasia dari geng).\n\n### 6 hati: \"Dokumen di Laci Papa\"\n- **Syarat**: 6 hati, Bab 12, rumah Bram malam.\n- **Adegan**: Bram menunjukkan map berisi izin relokasi palsu. \"Kalau gue kasih ke lu, gue kehilangan semuanya.\"\n- **Pilihan**: \"Kamu nggak sendirian\" (+100, Bram memfoto dokumen) / \"Itu pilihan kamu\" (+60) / Ambil paksa (berantem\n  dengan Bram, -50, dokumen didapat tapi Bram tidak bersaksi).\n- **Hasil**: Bram memainkan piano untuk pemain. Cemburu aktif (sangat posesif, harus dikelola lewat dialog).\n\n### 8 hati: \"Piano di Rumah Kaca\" (romance) / \"Kakak Kelas yang Pulang\" (sahabat)\n- **Syarat**: 8 hati, Gelang Benang, setelah Bab 13 (Bram sudah bersaksi), rumah kontrakan kecil yang dia sewa sendiri.\n- **Adegan (romance)**: Bram meninggalkan rumah ayahnya, tinggal di kontrakan dengan piano bekas. \"Gue nggak punya\n  apa-apa lagi. Cuma ini. Sama, kalau lu mau... gue.\"\n- **Pilihan**: Ikat gelang (pacaran) / Ikrar sahabat: \"Mulai dari nol bareng\" (sahabat).\n- **Hasil**: epilog Bram kuliah musik sambil kerja paruh waktu di Warkop Simpang, menyetir motor bekas.\n\n## Contoh obrolan & reaksi\n\n| Situasi | Bubble / dialog |\n|---|---|\n| Sapaan (sebelum penebusan) | `sinis` \"Minggir, Anak Kampung.\" |\n| Sapaan (sesudah) | `biasa` \"Lu lagi. Ya udah, duduk.\" |\n| Pemain mengalahkannya berantem | `marah` \"Ini belum selesai.\" (sesudah 4 hati: tertawa sambil memegang rahang) |\n| Pemain mendekati Dimas | `sinis` \"Selera lu jelek.\" (cemburu) |\n| Ulang tahun (3 Maret) | Pesta mewah yang tidak didatangi ayahnya; lebih senang diajak makan nasi goreng |\n\n## Prompt portrait\n\n```\nTokoh: 17-year-old Indonesian boy, tall and well built, fair skin, black hair slicked back with one strand falling over\nthe forehead, sharp jaw, sharp contemptuous eyes, expensive tailored cream school shirt with top button open, silver\nluxury watch, black bomber jacket with wine-red embroidery over the shoulders. Arrogant rich-kid rival look with hidden\nsadness. Key colors black, wine red, silver.\n```\n"}, {"id": "26-andra", "file": "26-andra.md", "title": "26. Andra Pamungkas", "md": "# 26. Andra Pamungkas\n\n| | |\n|---|---|\n| Umur / sekolah | 16, STM Karya Bangsa jurusan Bangunan kelas X |\n| Peran | Pelukis mural, anggota Serigala Besi, jembatan damai dua geng |\n| Tinggal | **Dalam peta, pinggir selatan**: rumah nenek, rumah bata merah beratap genteng tua di tepi sawah |\n| Keluarga | Nenek (penjual jamu gendong). Ayah di penjara (pencurian), ibu kerja di pabrik kota lain |\n| Romance | Pemain cewek |\n| Warna kunci | Cat semprot kuning `#f2c12e`, biru elektrik `#2d6cdf`, abu beton `#9a9a95` |\n| Gaya voxel | `curly` diikat, kaus penuh cat, kaleng semprot |\n\n## Penampilan\n\nTinggi 1.32, tubuh sedang, kulit cokelat. Rambut ikal sebahu diikat setengah ke atas, beberapa helai jatuh. Tangan dan\nlengan selalu kena cat. Mata cokelat hangat dengan alis tebal, senyum malas. Tindik kecil di telinga kiri, tato temporer\nspidol di lengan yang selalu dia gambar ulang.\n\n## Pakaian\n\n| Situasi | Pakaian |\n|---|---|\n| Sekolah STM | Kemeja putih dengan logo STM, lengan digulung, celana abu kena cat, sepatu boots |\n| Melukis mural | Kaus putih penuh cipratan cat, overall jeans satu tali dilepas, masker setengah, topi terbalik |\n| Serigala Besi | Rompi jeans dengan patch kepala serigala, kaus hitam |\n| Di rumah | Sarung dan kaus partai bekas (lucu) |\n| Jalan-jalan | Kemeja bunga oversize terbuka, kaus putih, celana kulot hitam, sandal gunung |\n| Hujan | Tidak peduli, hanya menutupi buku sketsa dengan badan |\n\n## Watak\n\n- Santai, humoris, filosofis, melihat seni di mana-mana.\n- Tidak suka kekerasan tapi setia pada Serigala Besi karena merekalah \"keluarga\" saat ayahnya ditangkap.\n- **Kelemahan**: malas untuk hal yang tidak dia sukai, tidak percaya masa depannya sendiri (\"anak napi\").\n- **Rahasia**: setiap mural yang dia buat menyembunyikan wajah kecil ayahnya di salah satu sudut.\n\n## Hobi & kesukaan\n\n- Hobi: mural, sketsa wajah orang di angkot, main bass, membantu nenek meracik jamu.\n- Makanan: jamu beras kencur nenek, nasi pecel, es dawet.\n- Tempat favorit: tembok kosong di bawah jembatan layang, sawah belakang rumah, studio musik sekolah (sebagai tamu band).\n\n| Kado | Item |\n|---|---|\n| Favorit (+80) | Set cat semprot (Rp 60.000), buku sketsa besar |\n| Disukai (+45) | Stiker, es dawet, nasi pecel, senar bass |\n| Biasa (+20) | Es kopi susu, gorengan |\n| Dibenci (-40) | Barang mewah, buku pelajaran, apa pun yang berhubungan dengan polisi (borgol mainan) |\n\n## Cara bicara\n\n- Gue/lu santai dengan logat Jawa: \"Yo wis\", \"Piye?\", \"Selow\". Kalimat panjang filosofis lalu ditutup lelucon.\n- Kata khas: \"Selow.\", \"Yo wis.\", \"Tembok itu kanvas yang belum ngaku.\", \"Gue lukis lu ya?\"\n\n> \"Tembok itu kanvas yang belum ngaku. Kayak lu. Selow, itu pujian.\"\n> \"Orang lihat gue, lihat bapak gue. Makanya gue ngecat tembok. Biar mereka lihat yang lain.\"\n\n## Kebiasaan & jadwal\n\n| Waktu | Hari sekolah | Akhir pekan |\n|---|---|---|\n| 05.00-06.30 | Membantu nenek menyiapkan jamu | Membantu nenek keliling jamu |\n| 07.00-14.00 | STM Karya Bangsa (luar sekolah pemain) | Mural pesanan (kafe, warung) |\n| 14.00-18.00 | Mural di bawah jembatan layang | Studio musik SMA 3 (Sabtu, latihan bareng Sekar) |\n| 20.00-23.00 | Nongkrong Serigala Besi | Pasar malam, sketsa wajah berbayar |\n\nKebiasaan: menggambar di apa saja (tisu, tangan orang), bersiul, mengocok kaleng semprot saat berpikir.\n\n## Interaksi dengan pemain\n\n- Bertemu di Bab 4 saat pemain menyelamatkannya dari razia Satpol (atau saat diadu domba dengan Lampu Kota).\n- Hati naik dari menemani melukis, jadi model sketsa, membawa es dawet, menghindari konflik geng.\n- Pemain bisa memesan mural untuk Warkop Simpang (+10% pengunjung).\n- Bantuan misi: di Bab 7 jadi saksi bahwa kedua geng diadu domba. Di Bab 13 membuat mural raksasa \"SMA 3 Tetap di Sini\".\n\n## Hubungan dengan tokoh lain\n\nTeman kecil **Kirana**, anak buah **Kobar** (dianggap adik), bassist tamu band **Sekar**, teman seniman **Mei**. Neneknya\nkenal **Bu Narti**.\n\n## Event hati\n\n### 2 hati: \"Tembok Kosong\"\n- **Syarat**: 2 hati, sore, bawah jembatan layang selatan.\n- **Adegan**: Andra melukis, Satpol datang. Dia lari meninggalkan buku sketsanya.\n- **Pilihan**: Selamatkan buku sketsa dan sembunyikan (+80) / Ajak lari bareng (mini game kejar, +60) / Laporkan (-50).\n- **Hasil**: Andra mengajak pemain jadi \"asisten cat\". Membuka \"Melukis bareng\".\n\n### 4 hati: \"Wajah Kecil di Sudut\"\n- **Syarat**: 4 hati, mural selesai, malam.\n- **Adegan**: Pemain menemukan wajah kecil tersembunyi di sudut mural. Andra mengaku itu ayahnya.\n- **Pilihan**: \"Lu kangen dia?\" (+100) / \"Gambarnya bagus\" (+60) / \"Napi kok dilukis?\" (-50).\n- **Hasil**: kencan \"Sawah malam\" dan \"Sketsa di pasar malam\" terbuka.\n\n### 6 hati: \"Dua Geng, Satu Tembok\"\n- **Syarat**: 6 hati, Bab 7, gudang terbengkalai.\n- **Adegan**: Lampu Kota dan Serigala Besi siap tawuran. Andra berdiri di tengah dengan kaleng semprot.\n- **Pilihan**: Berdiri bersama Andra dan beberkan bukti adu domba (+100, tawuran batal) / Tarik Andra keluar (+60,\n  tawuran tetap terjadi) / Ikut tawuran (-50).\n- **Hasil**: kedua geng mengecat tembok bersama (mini game cat). Cemburu aktif (dia melukis pemain dan yang lain dengan\n  wajah lucu).\n\n### 8 hati: \"Mural Kita\" (romance) / \"Studio Berdua\" (sahabat)\n- **Syarat**: 8 hati, Gelang Benang, subuh, tembok jembatan layang.\n- **Adegan (romance)**: Andra membuka terpal: mural raksasa pemain dan dirinya duduk di atas lonceng sekolah. Kali ini\n  wajah kecil di sudut adalah wajah pemain. \"Sekarang yang gue sembunyiin di semua lukisan gue... lu.\"\n- **Pilihan**: Ikat gelang (pacaran) / Buka studio mural bersama (sahabat).\n- **Hasil**: epilog Andra lulus STM dan menjadi seniman mural kota; ayahnya bebas dan menonton pamerannya.\n\n## Contoh obrolan & reaksi\n\n| Situasi | Bubble / dialog |\n|---|---|\n| Sapaan | \"Selow. Gue lukis lu ya? Diem.\" |\n| Pemain ikut tawuran | `sedih` \"Yo wis, kalau itu pilihan lu...\" |\n| Pemain kasih cat semprot | `tertawa` \"Lu ngerti gue banget!\" |\n| Pemain dari Lampu Kota (awal) | `sinis` \"Lampu Kota... cahayanya redup tuh.\" |\n| Ulang tahun (20 Juni) | Senang dibawakan nasi pecel dan menemani melukis semalaman |\n\n## Prompt portrait\n\n```\nTokoh: 16-year-old Javanese Indonesian boy from a vocational school, brown skin, shoulder-length curly hair half tied up\nwith loose curls, warm brown eyes, thick brows, lazy smile, small earring on the left ear, paint-splattered white t-shirt\nwith a denim overall strap, spray-paint stains on arms. Laid-back artist look.\nKey colors spray yellow, electric blue, concrete grey.\n```\n"}, {"id": "27-gilang", "file": "27-gilang.md", "title": "27. Gilang Ramadhan", "md": "# 27. Gilang Ramadhan\n\n| | |\n|---|---|\n| Umur / sekolah | 17, putus sekolah saat kelas XI, ikut paket C malam di PKBM |\n| Peran | Pengantar galon, skater, paling jenaka di kota |\n| Tinggal | **Dalam peta**: Kampung Bantaran, rumah panggung kayu cat hijau di bantaran Kali Cendana |\n| Keluarga | Ayah tukang becak, ibu buruh cuci, empat adik. Gilang anak sulung |\n| Romance | Pemain cewek |\n| Warna kunci | Biru galon `#3d9be0`, kuning `#f5d13a`, putih kusam |\n| Gaya voxel | `messy`, topi terbalik, skateboard, galon di pundak |\n\n## Penampilan\n\nTinggi 1.34, ramping berotot dari mengangkat galon, kulit cokelat gelap terbakar matahari. Rambut hitam berantakan di bawah\ntopi terbalik. Senyum lebar dengan gigi depan sedikit renggang. Lutut dan siku penuh plester dari jatuh skateboard. Mata\nberbinar jahil.\n\n## Pakaian\n\n| Situasi | Pakaian |\n|---|---|\n| Kerja antar galon | Kaus biru bertuliskan \"Depot Air Segar\", celana pendek, sandal jepit, handuk di leher |\n| Skate | Kaus kebesaran bergambar kartun, celana kargo robek, sepatu skate yang solnya diikat karet |\n| Paket C malam | Kemeja kotak satu-satunya, dikancing sampai atas dengan serius |\n| Di rumah | Telanjang dada plus sarung (lucu), atau kaus robek |\n| Jalan-jalan | Jaket windbreaker kuning-biru bekas pasar loak, topi terbalik |\n| Hujan | Galon dijadikan payung (lelucon khasnya) |\n\n## Watak\n\n- Jenaka, ramah, cepat akrab dengan siapa pun, pekerja keras tanpa mengeluh.\n- Optimis keterlaluan, menertawakan kesulitannya sendiri.\n- **Kelemahan**: malu soal putus sekolah, merasa \"kalah\" dari anak SMA, gampang menyerah di pelajaran.\n- **Rahasia**: menabung untuk adiknya kuliah, bukan untuk dirinya; buku tabungannya disimpan di dalam galon kosong.\n\n## Hobi & kesukaan\n\n- Hobi: skateboard, membuat video lucu, memancing di Kali Cendana, main gitar kentrung.\n- Makanan: gorengan (raja gorengan), nasi telur kecap, es teh plastik.\n- Tempat favorit: skatepark taman kota, tepi Kali Cendana, warung Mak Iyah.\n\n| Kado | Item |\n|---|---|\n| Favorit (+80) | Roda skateboard baru (Rp 45.000), sepatu skate |\n| Disukai (+45) | Gorengan, nasi telur, es teh, stiker, joran pancing |\n| Biasa (+20) | Es kopi susu, cokelat |\n| Dibenci (-40) | Buku (\"Gue alergi, serius\"), apa pun yang dikasih dengan nada kasihan |\n\n## Cara bicara\n\n- Gue/lu ceplas-ceplos, logat Betawi pinggiran: \"Kagak\", \"Ape\", \"Mantul\". Plesetan dan pantun spontan.\n- Kata khas: \"Galon datang, rezeki melayang!\", \"Kagak ape-ape!\", \"Mantul!\", \"Pantun dulu dong.\"\n\n> \"Ke pasar beli terasi, pulangnya mampir ke Kali. Lu cantik banget hari ini, gue sampe lupa naruh galon tadi.\"\n> \"Gue kagak sekolah, bukan berarti gue kagak belajar. Gue belajar ngangkat galon 19 liter. Lu bisa?\"\n\n## Kebiasaan & jadwal\n\n| Waktu | Hari sekolah | Akhir pekan |\n|---|---|---|\n| 06.00-13.00 | Antar galon keliling kota (terlihat di semua wilayah) | Antar galon pagi |\n| 13.00-17.00 | Skatepark taman kota | Lomba skate kecil / bikin video |\n| 17.00-19.00 | Memancing di Kali Cendana | Memancing |\n| 19.00-21.00 | Paket C di PKBM (Senin, Rabu, Jumat) | Pasar malam (ngamen kentrung) |\n\nKebiasaan: menyapa semua orang dengan nama, bersiul saat mengangkat galon, melompat pinggiran trotoar dengan skateboard.\n\n## Interaksi dengan pemain\n\n- Muncul di Bab 1 mengantar galon ke Warkop Simpang (NPC pertama yang bercanda dengan pemain).\n- Hati naik dari skate bareng, memancing, membawa gorengan, mengajari pelajaran paket C.\n- Pemain bisa mengajari Gilang (memakai nilai sendiri): tiap sesi belajar +30 hati dan kemajuan paket C.\n- Bonus: Gilang mengantar galon dan bahan warkop gratis (biaya operasional warkop -5%).\n- Bantuan misi: di Bab 13 mengerahkan pengantar galon, tukang becak, dan anak skate menyebar selebaran ke seluruh kota.\n\n## Hubungan dengan tokoh lain\n\nTetangga dan sahabat **Laras** (saling meledek), murid paket C bersama **Mas Fajar**, langganan **Mak Iyah**, kenal semua\norang di kota termasuk NPC pengisi. Pernah diusir dari mal oleh **Bram**.\n\n## Event hati\n\n### 2 hati: \"Galon Menggelinding\"\n- **Syarat**: 2 hati, siang, jalan menurun Perkampungan Kenanga.\n- **Adegan**: Galon Gilang lepas dan menggelinding ke jalan. Mini game mengejar galon.\n- **Pilihan**: Kejar dan tangkap (mini game, +80) / Hadang motor yang lewat (+60) / Tertawa sampai sakit perut (+50,\n  Gilang ikut tertawa).\n- **Hasil**: Gilang mengajak skate. Membuka \"Skate bareng\".\n\n### 4 hati: \"Kelas Malam\"\n- **Syarat**: 4 hati, Senin/Rabu/Jumat 20.30, PKBM.\n- **Adegan**: Pemain melihat Gilang di kelas paket C, duduk paling belakang, tidak bisa mengerjakan soal Matematika.\n- **Pilihan**: Duduk di sebelahnya dan bantu (+100) / Tunggu di luar dengan es teh (+80) / \"Lu sekolah lagi?\" dengan\n  kaget (-20, Gilang malu).\n- **Hasil**: membuka \"Belajar bareng Gilang\". Kencan \"Mancing malam\" terbuka.\n\n### 6 hati: \"Buku Tabungan dalam Galon\"\n- **Syarat**: 6 hati, Bab 10, rumah panggung Gilang (banjir Kali Cendana).\n- **Adegan**: Banjir masuk rumah. Gilang menyelamatkan adik-adiknya lalu panik mencari galon tabungannya yang hanyut.\n- **Pilihan**: Terjun mengambil galon (Kelincahan 6, +100) / Bantu evakuasi tetangga dulu (+80, galon ditemukan\n  besoknya oleh Laras) / Tawarkan pinjaman (-20).\n- **Hasil**: Gilang pertama kali menangis di depan orang. Cemburu aktif (pantun sedih).\n\n### 8 hati: \"Ijazah\" (romance) / \"Pantun Persahabatan\" (sahabat)\n- **Syarat**: 8 hati, Gelang Benang, hari pengumuman paket C, tepi Kali Cendana sore.\n- **Adegan (romance)**: Gilang lulus paket C. Dia memegang ijazah di satu tangan dan galon di tangan lain. \"Pantun\n  terakhir. Beli galon di depot Segar, isinya air dari pegunungan. Gue udah lulus, gue udah tegar, sekarang gue berani\n  bilang... jadi pacar gue, mau kagak?\"\n- **Pilihan**: Ikat gelang (pacaran) / Balas dengan pantun persahabatan (sahabat).\n- **Hasil**: epilog Gilang membuka depot air dan skatepark kecil di Kampung Bantaran.\n\n## Contoh obrolan & reaksi\n\n| Situasi | Bubble / dialog |\n|---|---|\n| Sapaan | \"Galon datang, rezeki melayang! Eh, elu.\" |\n| Pemain jatuh dari sepeda | `tertawa` lalu langsung menolong: \"Kagak ape-ape! Gue jatoh tiap hari.\" |\n| Pemain kasih buku | `bingung` \"Ini... buat ganjel pintu, kan?\" |\n| Pemain menang balap sepeda | `kaget` \"Mantul! Ajarin gue!\" |\n| Ulang tahun (10 Juni) | Senang dibawakan gorengan sebanyak umurnya |\n\n## Prompt portrait\n\n```\nTokoh: 17-year-old Indonesian boy, lean and muscular from hard work, dark sun-tanned skin, messy black hair under a\nbackwards cap, wide grin with a small gap in the front teeth, bandages on elbows, blue t-shirt printed \"Depot Air Segar\"\nwith a small towel around the neck. Cheerful, cheeky street-kid look. Key colors water-gallon blue, yellow, faded white.\n```\n"}, {"id": "30-npc-pendukung", "file": "30-npc-pendukung.md", "title": "30. NPC Pendukung Cerita", "md": "# 30. NPC Pendukung Cerita\n\nTokoh pendukung punya portrait (remaja 12 ekspresi, dewasa 6 ekspresi), jadwal, dan **meter persahabatan 0-8** dengan\naturan yang sama seperti sistem hati, tapi tidak bisa dipacari. Event 8 hati selalu \"ikatan keluarga/sahabat\" dan\nmemberi bonus permanen.\n\n## Ringkasan\n\n| Tokoh | Umur | Peran | Tinggal | Ekspresi |\n|---|---|---|---|---|\n| Om Darto | 42 | Paman, pemilik Warkop Simpang | Perkampungan Kenanga (rumah + warkop) | 6 |\n| Cici | 8 | Sepupu, anak Om Darto | Perkampungan Kenanga | 12 |\n| Ibu pemain | 40 | Ibu di desa, lewat telepon | **Luar peta**: Desa Lereng Wangi | 6 |\n| Bimo Prasetyo | 15 | Sahabat sebangku, anak tukang bakso | Perkampungan Kenanga (rumah + gerobak bakso) | 12 |\n| Mas Fajar | 20 | Montir, anggota senior Lampu Kota | Kampung Bantaran (kamar di bengkel) | 12 |\n| Bang Jaka | 24 | Ketua Lampu Kota | Kali Cendana (markas gudang, kamar atas) | 6 |\n| Kobar | 19 | Ketua Serigala Besi, kakak Kirana | Selatan (bengkel Wijaya Motor) | 12 |\n| Bu Narti | 55 | Tetangga, pemilik kos, tukang gosip | Perkampungan Kenanga | 6 |\n| Pak RT Slamet | 50 | Ketua RT Kenanga | Perkampungan Kenanga | 6 |\n| Pak Haris Megantara | 50 | Bos PT Graha Megantara, antagonis besar | Bukit Asri (rumah Bram) / kantor Pusat Kota | 6 |\n| Pak Gito | 48 | Rentenir | Pusat Kota (ruko kredit di pasar) | 6 |\n| Rio | 17 | Geng Bram, tukang pukul | Bukit Asri | 12 |\n| Kevin | 17 | Geng Bram, otak licik | Pusat Kota (apartemen) | 12 |\n| Bu Hartini | 55 | Kepala sekolah | Pusat Kota (rumah tua dekat alun-alun) | 6 |\n| Bu Ratna | 45 | Matematika, wali kelas X | Bukit Asri (rumah biasa di pinggir) | 6 |\n| Pak Hendro | 40 | Penjaskes, pelatih futsal | Kawasan Sekolah (mes guru) | 6 |\n| Pak Wawan | 50 | Guru BK & kesiswaan | Perkampungan Kenanga | 6 |\n| Bu Sinta | 35 | Bahasa Indonesia, pembina mading | Pusat Kota | 6 |\n| Mr. Anton | 28 | Bahasa Inggris, pembina debat | Pusat Kota (kos) | 6 |\n| Pak Gunadi | 58 | Fisika & Kimia | Kampung Bantaran (rumah penuh alat) | 6 |\n| Bu Melati | 33 | Seni Budaya, pembina band | Bukit Asri | 6 |\n| Pak Ujang | 67 | Penjaga sekolah, kakek Arga | Kawasan Sekolah (rumah dinas) | 6 |\n| Mak Iyah | 60 | Warung belakang sekolah | Kawasan Sekolah (warung + rumah) | 6 |\n| Ama | 72 | Nenek Mei | Pusat Kota (Toko Buku Pena) | 6 |\n\n---\n\n## Om Darto\n\n- **Penampilan**: badan gempal, perut buncit, rambut cepak beruban di samping, kumis tebal, tangan bertato bunga kecil\n  (sisa zaman Lampu Kota). Kaus oblong belel, sarung di pundak, sandal jepit. Saat kerja: celemek hijau Warkop Simpang.\n- **Watak**: hangat, humoris, gampang percaya orang, payah urusan uang. Malu mengakui masa lalunya di klub motor.\n- **Hobi**: meracik kopi, memelihara burung perkutut, main catur di pos ronda, menyanyi lagu dangdut lama sambil menyapu.\n- **Cara bicara**: \"Le/Nduk\" untuk pemain, logat Jawa kental. \"Kopi itu kayak hidup, Le. Pahit dulu, baru wangi.\"\n- **Kebiasaan**: bangun 04.30 menyalakan kompor, menghitung uang sambil mengernyit, tidur siang di kursi warkop.\n- **Interaksi**: pemberi misi utama warkop, penasehat. Saat persahabatan tinggi, warkop memberi gaji harian lebih besar.\n- **Portrait prompt**: `42-year-old Indonesian man, stocky with a round belly, grey-sided crew cut, thick moustache,\n  small faded flower tattoo on the forearm, worn white t-shirt with a green coffee-shop apron, sarong over one shoulder.`\n- **Event persahabatan**:\n  - 2: \"Utang Pertama\". Pemain memergoki Om menyembunyikan surat tagihan Pak Gito. Pilihan jujur membahasnya membuka\n    misi pelunasan.\n  - 4: \"Foto di Laci\". Foto Om muda bersama jaket Lampu Kota. Om bercerita tentang kecelakaan balap liar yang menewaskan\n    sahabatnya.\n  - 6: \"Kopi Racikan Rahasia\". Om mengajari resep kopi \"Simpang Tengah Malam\" (menu spesial warkop, harga x2).\n  - 8: \"Anak Sendiri\". Om memberi kunci cadangan warkop dan berkata pemain sudah seperti anaknya. Bonus: warkop\n    menghasilkan +15% permanen; ending usaha terbuka penuh.\n\n## Cici\n\n- **Penampilan**: anak 8 tahun, rambut dikuncir dua tinggi dengan ikat rambut stroberi, gigi depan ompong, seragam SD\n  merah putih atau kaus kartun dan rok tutu.\n- **Watak**: cerewet, ingin tahu, gampang merajuk, sangat sayang pemain (\"Kak!\").\n- **Hobi**: menggambar, main masak-masakan, menonton kartun, mengoleksi stiker.\n- **Cara bicara**: \"Kak! Kak! Kakkk!\", banyak bertanya \"kenapa?\".\n- **Interaksi**: mini game **Les PR** (bantu PR Cici: soal SD bertema lucu). Menaikkan Kecerdasan sedikit dan Mood.\n- **Portrait prompt**: `8-year-old Indonesian girl, high twin tails with strawberry hair ties, missing front tooth, round\n  cheeks, red-and-white elementary school uniform.`\n- **Event**: 2 \"PR Gambar Keluarga\" (Cici menggambar pemain sebagai kakak), 4 \"Hilang di Pasar Malam\" (cari Cici), 6\n  \"Sakit Demam\" (pemain menjaganya semalaman, Om pulang telat), 8 \"Pentas SD\" (Cici menyebut pemain sebagai pahlawannya;\n  Mood maksimal +10 permanen).\n\n## Ibu pemain\n\n- **Penampilan** (hanya portrait lewat video call): kerudung bergo cokelat, wajah lelah tapi tersenyum, latar dinding bambu.\n- **Watak**: lembut, khawatir, bangga. Telepon tiap Minggu malam.\n- **Interaksi**: bertanya nilai dan kabar. Jawaban jujur/bohong memengaruhi Mood dan event. Mengirim paket dari desa\n  (beras, kerupuk, sambal) tiap bulan: item kado bagus untuk NPC.\n- **Event**: 2 \"Kiriman Pertama\", 4 \"Ayah Menelepon\" (suara ayah pertama kali), 6 \"Ibu Sakit\" (pilihan pulang ke desa\n  selama 3 hari, kehilangan hari sekolah), 8 \"Ibu Datang ke Wisuda\" (ending).\n\n## Bimo Prasetyo\n\n- **Penampilan**: gendut, rambut keriting tebal, pipi bulat, seragam sesak di perut, kancing hampir lepas. Di rumah kaus\n  bergambar mangkuk bakso dari usaha bapaknya.\n- **Watak**: ceria, penakut, setia, ingin dianggap berani. Jago masak.\n- **Hobi**: memasak, makan, nonton acara masak, main game HP.\n- **Cara bicara**: \"Bro! Bro! Bro!\", gue/lu, takut-takut: \"Kita kabur aja yuk...\"\n- **Interaksi**: teman sebangku sejak hari pertama (hati awal 2). Bonus resep warkop. Arc kecelakaan balap Bab 9.\n- **Portrait prompt**: (lihat `karakter/portrait/bimo_480*.png`) `15-year-old chubby Indonesian boy, thick curly black\n  hair, round cheeks, cheerful wide smile, cream school shirt tight over the belly.`\n- **Event**: 2 \"Bakso Gratis\", 4 \"Takut Gelap\" (jaga malam di sekolah), 6 \"Balap Liar\" (cegah atau temani; kecelakaan Bab\n  9 tergantung pilihan), 8 \"Koki Warkop\" (Bimo jadi koki tetap, menu makanan warkop terbuka semua).\n\n## Mas Fajar\n\n- **Penampilan**: rambut jabrik, kaus kerja penuh oli, celana jeans robek, handuk di leher, gelang karet di tangan.\n- **Watak**: kakak yang keras di luar, sabar mengajar mesin, malu karena putus sekolah.\n- **Cara bicara**: \"Dek\", \"Santai, ini bisa\", logat Sunda campur Jawa.\n- **Interaksi**: pintu masuk Lampu Kota, kerja di bengkel (mini game servis), partner usaha bengkel.\n- **Portrait prompt**: `20-year-old Indonesian mechanic, spiky black hair, oil-stained work t-shirt, towel around neck,\n  friendly tired smile.`\n- **Event**: 2 \"Servis Gratis\", 4 \"Buku Paket C\" (pemain menemukan buku Fajar), 6 \"Ujian\" (antar Fajar ke ujian paket C,\n  kejar waktu), 8 \"Bengkel Bersama\" (partner properti bengkel; upgrade kendaraan -15%).\n\n## Bang Jaka\n\n- **Penampilan**: tinggi besar, rambut gondrong diikat, jenggot tipis, jaket hitam berlis kuning Lampu Kota, sepatu boots.\n- **Watak**: keras, lurus, pelindung. Menyimpan penyesalan tidak lulus SMA.\n- **Cara bicara**: pendek dan berat. \"Aturan itu ada buat ngelindungin lu, bukan ngekang.\"\n- **Interaksi**: pemberi misi geng, penguji (berantem satu lawan satu untuk masuk geng).\n- **Event**: 2 \"Ujian Masuk\", 4 \"Empat Aturan\" (pemain menegakkan aturan pada anggota lain), 6 \"Ditangkap\" (Jaka ditangkap\n  saat razia, pemain harus memimpin Lampu Kota satu minggu), 8 \"Jaket Wakil\" (pemain jadi wakil ketua; anggota geng\n  selalu membantu saat keroyokan).\n\n## Kobar\n\n- **Penampilan**: mohawk hitam-merah, rompi jeans dengan patch serigala, rantai dompet, tubuh kekar, bekas jahitan di dagu.\n- **Watak**: meledak-ledak, sangat protektif pada Kirana, sebenarnya cerdas soal mesin.\n- **Cara bicara**: \"Anak SMA!\" (memanggil pemain), suka mengaum tertawa.\n- **Interaksi**: bos jalanan tahun 1-2 (bos berantem Bab 6), sekutu tahun 3.\n- **Event**: 2 \"Tantangan Jembatan\", 4 \"Adu Domba\" (bukti dari Andra), 6 \"Kirana Hilang\" (cari Kirana yang kabur), 8\n  \"Sumpah Dua Geng\" (Serigala Besi jadi sekutu permanen).\n\n## Bu Narti\n\n- **Penampilan**: hijab bergo bunga-bunga, daster batik, sandal jepit, kipas tangan, kacamata baca di ujung hidung.\n- **Watak**: tukang gosip, baik hati, cerewet. Tahu semua yang terjadi di kampung.\n- **Cara bicara**: \"Eh, tahu nggak...\" \"Masya Allah, anak zaman sekarang.\"\n- **Interaksi**: sumber misi kecil (antar kue, cari kucing), penyebar gosip (bisa bantu atau merusak reputasi).\n- **Event**: 2 \"Kos yang Bocor\", 4 \"Gosip Salah\" (luruskan gosip tentang Om Darto), 6 \"Arisan\" (pemain jadi juru masak arisan),\n  8 \"Telinga Kampung\" (Bu Narti membela pemain di mana pun; gosip negatif di Kenanga hilang 2x lebih cepat).\n\n## Pak RT Slamet\n\n- **Penampilan**: kopiah hitam, kemeja batik lengan pendek, perut buncit, buku catatan warga.\n- **Interaksi**: kerja bakti, ronda, izin usaha warkop, rapat warga Bab 13.\n- **Event**: 2 \"Kerja Bakti\", 4 \"Ronda Pertama\", 6 \"Lomba 17 Agustus\" (pemain jadi panitia), 8 \"Suara Warga\" (warga\n  Kenanga ikut aksi damai Bab 13).\n\n## Pak Haris Megantara\n\n- **Penampilan**: setelan jas abu mahal, rambut disemir hitam rapi, cincin batu besar, kacamata tanpa bingkai, senyum dingin.\n- **Watak**: dingin, sopan di depan umum, kejam di balik layar.\n- **Cara bicara**: \"Anak muda, semua ada harganya.\"\n- **Interaksi**: tidak bisa diakrabkan (meter khusus \"Ancaman\" naik saat pemain mengganggu proyeknya). Tidak pernah berkelahi;\n  pemain melawan anak buah bayarannya (bos akhir: \"Pak Bondan\", kepala keamanan proyek).\n\n## Pak Gito\n\n- **Penampilan**: kemeja safari cokelat, tas pinggang kulit, gigi emas, rokok di telinga, dua anak buah berbadan besar.\n- **Interaksi**: menagih tiap Jumat. Bisa dilunasi, dicicil, atau dilawan (jalur buruk: warkop dirusak).\n- **Event (khusus)**: \"Lunas\" saat utang selesai: Pak Gito memberi diskon kecil dan mengakui pemain \"anak berani\".\n\n## Rio dan Kevin\n\n- **Rio**: badan besar, potongan undercut, kalung rantai, tukang pukul geng Bram. Bodoh tapi tidak jahat. Arc: ingin jadi\n  atlet tinju. Bisa dibalik jadi netral lewat misi \"Sasana Tinju\" (event 4 hati).\n- **Kevin**: kurus, kacamata bulat tipis, rambut belah tengah, selalu memegang HP. Otak licik geng, ahli fitnah lewat\n  media sosial. Bisa dibalik lewat misi \"Akun Palsu\" (pemain membuktikan Kevin juga diancam Pak Haris).\n- Keduanya punya 4 event persahabatan sederhana (2: perkenalan konflik, 4: rahasia, 6: dibalik, 8: teman epilog).\n\n## Guru & staf\n\n| Tokoh | Penampilan | Fungsi | Event 8 (bonus) |\n|---|---|---|---|\n| Bu Hartini | Kebaya kerja, kacamata rantai, sanggul | Jalur legal Bab 13 | Rekomendasi beasiswa (ending prestasi) |\n| Bu Ratna | Blazer hitam, rambut dikonde, penggaris kayu | Remedial Matematika | Nilai Matematika +5 semua ujian |\n| Pak Hendro | Kaus olahraga, peluit, topi | Futsal, liga balap resmi | Perk Kelincahan +1 |\n| Pak Wawan | Seragam PNS, kumis, buku pelanggaran | Patroli bolos | Poin pelanggaran -50% |\n| Bu Sinta | Hijab pastel, kardigan, buku | Mading, lomba menulis | Bonus lomba menulis |\n| Mr. Anton | Kemeja slim, sneakers, gaya gaul | Debat, Bahasa Inggris | Opsi dialog \"English\" |\n| Pak Gunadi | Jas lab bernoda, rambut putih berdiri | Resep racikan | Resep bom asap & kopi spesial |\n| Bu Melati | Gaun etnik, gelang kayu | Band, pensi | Mini game ritme lebih mudah |\n| Pak Ujang | Kaus abu, topi pet, sapu lidi, kunci banyak | Kunci Gedung Lama | Akses semua ruang sekolah |\n| Mak Iyah | Daster, celemek, kain di kepala | Warung bolos, utang gorengan | Makan gratis 1x sehari |\n| Ama | Rambut putih disanggul, kacamata tebal, kipas | Nenek Mei, penjaga toko | Bakpao gratis tiap minggu (kado) |\n\nSetiap guru punya 4 event dengan pola: 2 = kenal di kelas, 4 = membantu urusan pribadi guru, 6 = membela guru dari masalah\n(sering terkait proyek relokasi), 8 = bonus permanen di tabel.\n"}, {"id": "31-npc-pengisi", "file": "31-npc-pengisi.md", "title": "31. NPC Pengisi Dunia", "md": "# 31. NPC Pengisi Dunia\n\n48 NPC latar membuat kota terasa hidup. **Tanpa portrait**, interaksi hanya **bubble chat** di atas kepala (1-2 baris).\nMasing-masing punya jadwal sederhana (2-3 lokasi), satu baris sapaan acak dari 3 variasi, dan reaksi singkat terhadap\naksi pemain. Beberapa memberi misi kecil satu langkah.\n\n## Aturan bubble\n\n- Bubble muncul saat pemain lewat dalam jarak 3 petak, sekali per 30 detik per NPC.\n- Ada 4 jenis bubble: **sapaan** (putih), **reaksi** (kuning), **gosip** (ungu, menyebar info), **misi** (hijau dengan \"!\").\n- Warna nama NPC mengikuti reputasi pemain di wilayah itu (hijau ramah, abu netral, merah takut/benci).\n\n## Daftar per wilayah\n\n### Perkampungan Kenanga (10)\n\n| NPC | Sosok | Jadwal | Bubble contoh |\n|---|---|---|---|\n| Mbah Karto | Kakek bersarung, tongkat | Teras rumah, pos ronda | \"Le, jaman Mbah dulu sekolah jalan kaki 5 kilo.\" |\n| Bu Sum | Penjual sayur gerobak | Keliling 06.00-09.00 | \"Sayur, sayur! Kangkung dua ribu!\" |\n| Pak Darmin | Tukang ojek pangkalan | Pangkalan ujung gang | \"Ojek, Dek? Eh, kamu kan punya sepeda.\" |\n| Dodi & Didi | Anak SD kembar | Gang, lapangan kecil | \"Kak, main layangan yuk!\" (misi: layangan nyangkut) |\n| Mbak Rini | Ibu muda menggendong bayi | Warung, posyandu | \"Ssst, bayinya baru tidur.\" |\n| Pak Joko | Tukang las | Bengkel las | \"Awas matanya, jangan lihat apinya!\" |\n| Teh Euis | Penjual pecel | Lapak pecel 06.00-10.00 | \"Pecel pedas atau sedang, Kasep?\" |\n| Koh Ahong | Pemilik toko kelontong | Toko | \"Ada uang ada barang, hehe.\" |\n| Uda Rizki | Penjual nasi Padang | Rumah makan | \"Rendang baru matang!\" |\n| Ustaz Hasan | Imam musala | Musala | \"Jangan lupa salat, Nak.\" |\n\n### Perumahan Bukit Asri (8)\n\n| NPC | Sosok | Jadwal | Bubble contoh |\n|---|---|---|---|\n| Pak Satpam Bambang | Satpam kompleks | Pos gerbang | \"Mau ke rumah siapa, Dek? Tulis di buku tamu.\" |\n| Bu Veronika | Ibu senam pagi | Jalan kompleks 06.00 | \"Satu, dua, tiga... eh, permisi ya.\" |\n| Mbak Yuni | ART menyapu halaman | Halaman rumah | \"Majikan saya galak, jangan berisik ya.\" |\n| Kak Raffi | Mahasiswa pulang kampung | Kafe, jogging | \"Lagi skripsi, jangan tanya kapan lulus.\" |\n| Opa Willem | Pensiunan pecinta anggrek | Taman rumah | \"Anggrek ini umurnya lebih tua dari kamu.\" |\n| Nyonya Lita | Sosialita teman ibu Sasha | Mobil, kafe | \"Kamu anak siapa? Oh... anak warkop.\" |\n| Kurir Bayu | Kurir paket | Keliling | \"Paket! Paket!\" (misi: antar paket salah alamat) |\n| Kevin kecil | Bocah dengan drone | Taman kompleks | \"Drone-ku nyangkut! Tolong!\" |\n\n### Pusat Kota (12)\n\n| NPC | Sosok | Jadwal | Bubble contoh |\n|---|---|---|---|\n| Pak Polisi Sugeng | Polantas | Simpang lampu merah | \"Helmnya dipakai, Mas!\" |\n| Mas Barista Kevin | Barista kafe modern | Kafe | \"Single origin, mau coba?\" (saingan warkop) |\n| Bu Lastri | Penjual jamu gendong | Keliling alun-alun | \"Jamu, Nak? Kunyit asam biar seger.\" |\n| Pak Tarno | Tukang parkir | Depan ruko | \"Priiit! Kiri, kiri, terus!\" |\n| Mbak SPG Dewi | SPG pulsa | Depan mal | \"Paket data murah, Kak!\" |\n| Pengamen Dul | Pengamen ukulele | Angkot, alun-alun | \"Satu lagu buat yang lagi kasmaran...\" |\n| Om Hendrik | Penjual koran | Kios koran | \"Berita hari ini: proyek superblok!\" (gosip cerita) |\n| Bu Wati | Pegawai bank | Bank | \"Mau buka tabungan pelajar?\" (tutorial tabungan) |\n| Mas Ilham | Ojek online | Keliling | \"Orderan sepi, Bro.\" |\n| Kak Nana | Kasir minimarket | Minimarket | \"Ada tambahan pulsa? Poinnya?\" |\n| Pak Darsono | Tukang sol sepatu | Trotoar | \"Sepatumu jebol. Sini, sepuluh ribu.\" |\n| Gerombolan Turis | 3 turis bule | Alun-alun (Sabtu) | \"Excuse me, where is... warkop?\" (misi kecil Bahasa Inggris) |\n\n### Kampung Bantaran (8)\n\n| NPC | Sosok | Jadwal | Bubble contoh |\n|---|---|---|---|\n| Wak Udin | Nelayan sungai | Tepi Kali Cendana | \"Ikannya lagi malas.\" |\n| Bu Inah | Buruh cuci | Tepi kali, jemuran | \"Jangan lewat jemuran!\" |\n| Bang Ucok | Tukang becak | Pangkalan becak | \"Becak, Dek? Murah, sambil curhat.\" |\n| Anak-anak layangan (4) | Anak kampung | Tanggul | \"Putus! Putus! Kejar!\" |\n| Mak Ijah | Penjual kue subuh | Pasar subuh | \"Kue lupis, kue lapis!\" |\n| Pak Roni | Pemulung | Keliling | \"Ada botol bekas, Dek?\" (misi: kumpulkan botol) |\n| Teh Lilis | Penjahit pasar (ibunya Nadia bekerja dengan dia) | Kios jahit | \"Celanamu robek, mau dijahit?\" |\n| Mas Tejo | Penjaga pintu air | Pintu air | \"Kalau hujan deras, jangan ke sini!\" |\n\n### Kawasan Sekolah & selatan (10)\n\n| NPC | Sosok | Jadwal | Bubble contoh |\n|---|---|---|---|\n| Pak Satpam Udin | Satpam sekolah | Gerbang | \"Tiga, dua, satu... tutup!\" |\n| Bu Kantin Ningsih | Penjual soto kantin | Kantin | \"Soto lagi? Pakai nasi atau lontong?\" |\n| Mas Cilok | Penjual cilok gerobak | Gerbang 14.00 | \"Cilok! Cilok bumbu kacang!\" |\n| Siswa X-1 Andi | Kutu buku | Perpustakaan | \"Ssst.\" |\n| Siswi X-3 Fitri & Rina | Duo gosip kelas | Koridor | \"Eh, tahu nggak sih...\" (gosip) |\n| Siswa XI Bayu \"Si Telat\" | Selalu telat | Lompat pagar | \"Bantuin naik pagar, cepet!\" |\n| Anak Paskibra Maya | Disiplin | Lapangan | \"Kiri, kanan, kiri!\" |\n| Anak STM Bejo | Anggota Serigala Besi kecil | Jembatan selatan | \"Ngapain anak SMA ke sini?\" |\n| Mandor Proyek Sutris | Mandor proyek PT Graha | Pagar proyek | \"Dilarang masuk! Proyek!\" |\n| Penjual Bakso Pak Pras | Ayah Bimo, gerobak bakso | Depan sekolah sore | \"Bakso! Temennya Bimo gratis kuahnya.\" |\n\n## Reaksi umum NPC pengisi\n\n| Aksi pemain | Bubble reaksi (acak) |\n|---|---|\n| Berlari menabrak | \"Aduh! Lihat jalan!\" / \"Hati-hati, Dek!\" |\n| Berantem di dekatnya | \"Woy! Jangan berantem!\" / \"Panggil satpam!\" (NPC lari menjauh) |\n| Naik motor kencang | \"Pelan-pelan! Ada anak kecil!\" |\n| Membantu NPC lain | \"Anak baik...\" / \"Siapa namanya itu?\" |\n| Pakai seragam sekolah saat jam pelajaran | \"Lho, bolos ya?\" (Pak Wawan mendapat info gosip) |\n| Membawa gerobak kopi | \"Kopi, Mas/Mbak! Satu!\" (pembeli) |\n| Reputasi pemain tinggi (pahlawan kampung) | \"Itu dia anak yang nolongin pasar!\" |\n| Reputasi preman tinggi | \"Ssst, jangan cari masalah sama dia.\" |\n| Hujan | \"Neduh, neduh!\" (NPC lari ke teras) |\n| Malam | \"Kok belum pulang, Nak?\" |\n"}, {"id": "32-tempat-tinggal", "file": "32-tempat-tinggal.md", "title": "32. Tempat Tinggal Tokoh", "md": "# 32. Tempat Tinggal Tokoh\n\nPeta Wirabumi punya 7 wilayah (lihat `04-peta.md`). Tokoh yang tinggal **di luar peta** hanya terlihat saat mereka datang\nke kota (lewat terminal, gerbang timur, atau jalan utara), dan rumahnya muncul sebagai **scene khusus** (perjalanan dengan\nlayar transisi bus/motor) saat event hati.\n\n## Peta tinggal\n\n| Wilayah | Tokoh | Jenis rumah |\n|---|---|---|\n| Perkampungan Kenanga | Pemain, Om Darto, Cici, **Uti**, Bimo, Bu Narti, Pak RT, Pak Wawan | Rumah kampung bata & warkop, rumah bata ekspos dengan garasi seng (Uti) |\n| Perumahan Bukit Asri | **Sekar**, **Sasha**, **Tegar**, **Bram**, Pak Haris, Rio, Bu Ratna, Bu Melati | Rumah minimalis (Sekar), klasik putih (Sasha), modern abu (Tegar), rumah kaca puncak bukit (Bram) |\n| Pusat Kota | **Nadia**, **Mei**, **Rizal**, **Jojo**, Kevin, Bu Hartini, Bu Sinta, Mr. Anton, Pak Gito, Ama | Rumah mint belakang masjid, ruko Toko Buku Pena, kontrakan belakang Ruko Pelita, atas studio Foto Kilat |\n| Kampung Bantaran | **Laras**, **Gilang**, Mas Fajar, Pak Gunadi | Rumah papan biru dekat jembatan, rumah panggung hijau, kamar bengkel |\n| Kawasan Sekolah | **Arga**, Pak Ujang, Pak Hendro, Mak Iyah | Rumah dinas penjaga di belakang Gedung Lama, mes guru, warung |\n| Kali Cendana (pinggir) | Bang Jaka | Gudang markas Lampu Kota |\n| Selatan (Jalan Lingkar & sawah) | **Kirana**, **Andra**, Kobar | Rumah di belakang bengkel Wijaya Motor, rumah nenek bata merah dekat sawah |\n| **Luar peta: Asrama Batalyon (timur)** | **Dimas** | Rumah dinas tentara, lapangan apel. Scene: lari subuh, event 8 hati |\n| **Luar peta: Desa Sukamekar (utara)** | **Wulan** | Rumah panggung kayu di kebun teh, pendopo perguruan. Scene: perjalanan bus 40 menit |\n| **Luar peta: Desa Lereng Wangi** | Ibu pemain | Kampung halaman pemain. Scene: mudik Lebaran, ending |\n| **Luar peta: Medan** | Orang tua Jojo | Hanya lewat telepon |\n\n## Akses rumah\n\n| Tahap hati | Akses |\n|---|---|\n| 0-1 | Hanya sampai pagar / pintu depan, NPC keluar menemui |\n| 2-3 | Teras dan ruang tamu |\n| 4-5 | Ruang keluarga, makan bersama keluarga |\n| 6-8 | Kamar/tempat pribadi (pintu terbuka, keluarga ada) dan tempat rahasia (atap, garasi, studio) |\n\n## Rumah pemain (kamar belakang Om Darto)\n\nKamar 2.5 x 3 petak, bisa di-upgrade (lihat `60-upgrade.md`). Isi awal: kasur tipis, kipas angin kecil, meja lipat, paku\nuntuk gantung seragam, jendela ke gang. Tempat simpan, tidur (simpan game), belajar, dan membuat Gelang Benang.\n"}, {"id": "40-obrolan-reaksi", "file": "40-obrolan-reaksi.md", "title": "40. Obrolan & Reaksi NPC", "md": "# 40. Obrolan & Reaksi NPC\n\n## Sistem dialog\n\n- **Tiga tingkat bicara**:\n  1. **Bubble** (NPC pengisi, sapaan cepat NPC utama saat lewat): 1 baris, tidak menghentikan permainan.\n  2. **Dialog pendek** (tekan tombol bicara): kotak dialog di bawah, portrait 480px di kiri, 1-4 baris, 2-4 pilihan nada.\n  3. **Adegan** (event hati, cerita): kamera mendekat, latar diblur, musik khusus, pilihan berbobot.\n- **Nada jawaban pemain**: **Sopan**, **Santai**, **Lucu**, **Tegas**. Tiap NPC punya nada favorit (+5 bonus) dan nada\n  yang dibenci (-5). Contoh: Nadia suka Sopan, benci Lucu saat serius; Gilang suka Lucu; Kirana suka Tegas; Sekar suka\n  Santai.\n- **Topik obrolan**: setiap hari tersedia 3 topik acak dari 10 kategori (sekolah, keluarga, hobi, makanan, gosip, cuaca,\n  cita-cita, geng, cinta, kota). Topik yang disukai NPC diketahui dari obrolan sebelumnya dan ditandai bintang di HP.\n- **Ingatan NPC**: NPC mengingat 5 hal terakhir yang pemain lakukan di dekatnya (menang berantem, kasih kado, bolos,\n  kencan dengan orang lain) dan bisa membahasnya.\n\n## Obrolan per tahap hubungan\n\n| Tahap | Contoh pembuka (NPC) | Isi |\n|---|---|---|\n| Kenalan (0-1) | \"Oh, kamu anak baru itu ya?\" | Basa-basi, tanya asal, nama |\n| Teman (2-3) | \"Eh, kemarin kamu ke mana? Nggak kelihatan.\" | Hobi, cerita sekolah, gosip ringan |\n| Teman dekat (4-5) | \"Aku mau cerita sesuatu, tapi jangan ketawa.\" | Masalah keluarga, cita-cita, curhat |\n| Spesial (6-7) | \"Kok aku seneng ya tiap kamu dateng.\" | Godaan, cemburu, rencana bersama |\n| Pacar / sahabat sejati (8) | \"Kangen. Padahal baru ketemu tadi siang.\" | Rencana masa depan, panggilan sayang |\n\n## Obrolan antar tokoh (yang bisa dilihat pemain)\n\nNPC saling bicara saat bertemu sesuai jadwal. Pemain yang berdiri dekat bisa **menguping** (bubble ungu muncul di atas\nkeduanya), kadang mendapat petunjuk kado atau info event.\n\n| Pasangan | Lokasi | Contoh obrolan |\n|---|---|---|\n| Nadia & Tegar | Kelas X-2 pagi | T: \"Secara statistik aku datang 3 menit lebih awal.\" / N: \"Aku sudah di sini dari tadi, kamu nggak lihat.\" |\n| Uti & Jojo | Kantin | J: \"Bah, oli di pipimu itu tren baru?\" / U: \"Mau gue tambahin di muka lu?\" |\n| Laras & Gilang | Kampung Bantaran sore | G: \"Uduk sisa, Ras?\" / L: \"Bayar! Tetangga bukan berarti gratis!\" |\n| Sekar & Andra | Studio musik | A: \"Bassnya selow aja ya.\" / S: \"Hmm. Kurang pelan.\" |\n| Bram & Sasha | Meja pojok kantin | B: \"Lu belakangan sering ilang malem-malem.\" / S: \"Bukan urusan lu.\" (petunjuk event Sasha) |\n| Kirana & Kobar | Bengkel Wijaya | K: \"Gue mau daftar balap resmi.\" / Kb: \"Ayah bakal ngamuk.\" |\n| Mei & Rizal | Toko Buku Pena | R: \"Buku yang kemarin udah datang?\" / M: \"Aku simpenin! Eh, tapi aku baca duluan, maaf!\" |\n| Dimas & Tegar | Lapangan | D: \"Main yuk sekali aja.\" / T: \"Peluang aku kena bola di muka 87 persen.\" |\n| Arga & Pak Ujang | Belakang Gedung Lama | PU: \"Bunganya ibumu mekar, Ga.\" / A: \"...Iya, Kek.\" |\n| Wulan & Kirana | Terminal | W: \"Kuda-kudamu di atas motor bagus.\" / K: \"Hmph. Makasih.\" |\n| Om Darto & Bang Jaka | Warkop malam | J: \"Om, anak itu punya nyali.\" / D: \"Jangan kamu tarik ke jalan, Jak.\" |\n| Bimo & Laras | Pasar | B: \"Resep sambelmu ditambah terasi bakar!\" / L: \"Ealah, sok koki!\" |\n\n## Reaksi NPC terhadap aksi pemain\n\nSetiap NPC utama dan pendukung punya tabel reaksi. Pola umumnya:\n\n| Aksi pemain | Reaksi umum | Pengecualian |\n|---|---|---|\n| Menyapa | Sapaan sesuai tahap hati | Bram sebelum 2 hati: mengabaikan |\n| Memberi kado | Ekspresi sesuai kategori (favorit `jatuhcinta`/`tertawa`, suka `senyum`, biasa `biasa`, benci `marah`) | Sasha di depan geng: semua kado jadi \"benci\" kecuali saat sepi |\n| Memberi kado kedua di hari yang sama | `bingung` \"Kok kasih lagi?\" (poin 0) | |\n| Berantem di depannya | Nadia, Rizal, Mei `marah`/`cemas`; Uti, Kirana, Arga `senyum` kalau pemain membela orang | Wulan menilai teknik |\n| Menang berantem membela orang | +20 untuk tokoh yang melihat, reputasi pahlawan + | |\n| Memukul yang sudah jatuh / mengeroyok | -40 untuk semua yang melihat kecuali geng Bram | |\n| Bolos | Nadia/Tegar `marah`, Bram/Gilang `tertawa`, Laras `marah` | Tegar 4+ hati menutupi |\n| Telat sekolah | Pak Satpam Udin bubble, Nadia `sinis` | |\n| Seragam dikeluarkan | Guru tegur, Bram/Uti suka (+gaya) | |\n| Datang bau keringat/kotor (Kebersihan rendah) | Sasha `sinis`, Mei `bingung`, Uti tidak peduli | |\n| Kencan dengan orang lain (terlihat) | Tokoh 6+ hati: `cemburu` (pakai `sinis` atau `sedih`), -20 | Uti menjauh 3 hari |\n| Membantu orang tua menyeberang, memungut sampah | Bubble pujian, Pesona/reputasi warga + | |\n| Menjual kopi di dekatnya | NPC suka kopi membeli; Tegar menolak | |\n| Naik motor ugal-ugalan | Warga marah, polisi mengejar, Kirana `tertawa` | |\n| Membuat Cici menangis (pilihan buruk) | Om Darto `marah`, satu hari tanpa uang saku | |\n| Mendapat nilai bagus | Guru `senyum`, Nadia rival, Ibu bangga di telepon | |\n| Ulang tahun NPC | NPC menunggu sapaan; kalau dilupakan dan hati 6+, `sedih` dan -30 | |\n\n## Panggilan & chat HP\n\n- HP punya aplikasi chat \"Obrol\". NPC dengan 4+ hati mengirim chat malam (19.00-22.00): sapaan, foto, ajakan.\n- Pemain memilih balasan (3 pilihan). Membalas dalam 1 jam game: +5, mengabaikan 3x berturut: -10.\n- Grup chat kelas X-2: info ulangan, bocoran gosip, ajakan kerja kelompok.\n- Grup Lampu Kota (kalau masuk geng): misi malam, peringatan razia.\n"}, {"id": "41-feedback-konsekuensi", "file": "41-feedback-konsekuensi.md", "title": "41. Feedback & Konsekuensi", "md": "# 41. Feedback & Konsekuensi\n\nSetiap tindakan memberi **feedback langsung** (angka melayang, suara, ekspresi NPC, getar layar ringan) dan\n**konsekuensi jangka panjang** (reputasi, hubungan, cerita, ending).\n\n## Feedback visual & suara\n\n| Jenis | Tampilan |\n|---|---|\n| Hati naik | Ikon hati merah muda melayang + angka \"+20\", suara \"ting\" lembut, partikel kelopak |\n| Hati turun | Hati retak abu-abu, angka merah \"-40\", suara \"dung\" rendah |\n| Uang masuk/keluar | Koin kuning \"+Rp 8.000\" / merah \"-Rp 15.000\", suara gemerincing |\n| Statistik naik | Panah hijau + nama stat (\"Kelincahan +1\"), jingle singkat |\n| Reputasi berubah | Ikon wilayah dengan bar warna (hijau/merah) di pojok kanan atas 2 detik |\n| Pelanggaran sekolah | Stempel merah \"PELANGGARAN +10\" ala buku BK |\n| Gosip menyebar | Ikon telinga ungu di peta HP, notifikasi \"Ada gosip baru tentang kamu\" |\n| Energi rendah | Layar sedikit desaturasi, langkah pemain melambat, animasi menguap |\n| Mood rendah | Awan kecil di atas kepala, bonus mini game -10% |\n\n## Reputasi\n\nLima reputasi terpisah, masing-masing -100 sampai +100:\n\n| Reputasi | Naik dari | Turun dari | Efek |\n|---|---|---|---|\n| **Sekolah** (guru) | Nilai, tepat waktu, OSIS, sopan | Bolos, berantem di sekolah, telat, menyontek | Remedial lebih mudah, guru membantu Bab 13 |\n| **Siswa** (teman) | Membela teman, menang berantem adil, traktir, ramah | Menyontek ketahuan, pengadu, pelit | Teman ikut misi, gosip positif |\n| **Jalanan** (geng) | Menang balap, misi geng, setia | Kabur saat teman dikeroyok, melanggar aturan | Akses balap, bantuan keroyokan, harga motor |\n| **Warga** (kampung/kota) | Membantu warga, kerja bakti, ronda, warkop jujur | Ugal-ugalan, berantem di kampung, mencuri | Diskon, info, dukungan aksi Bab 13 |\n| **Usaha** | Kualitas kopi, ketepatan, pelanggan puas | Basi, telat buka, kasar ke pelanggan | Pelanggan lebih banyak, harga jual naik |\n\n## Tabel tindakan dan akibat\n\n| Tindakan | Akibat langsung | Akibat jangka panjang |\n|---|---|---|\n| **Bolos 1 pelajaran** | Waktu luang 1 slot, Mood +5 | Nilai pelajaran itu -5, risiko ketahuan Pak Wawan 30% (pelanggaran +10) |\n| **Bolos sehari** | Waktu luang penuh | Surat panggilan orang tua (Om Darto) setelah 3x, Nadia/Tegar -20 |\n| **Telat** | Berdiri di depan kelas atau push-up 10x (mini game) | 5x telat = hukuman menyapu (animasi sapu, 1 slot sore hilang) |\n| **Menyontek** | Nilai ulangan +15 | Ketahuan 40%: nilai 0, pelanggaran +25, reputasi Sekolah -15 |\n| **Berantem di sekolah** | Statistik Nyali +, uang palakan kembali | Pelanggaran +20, skors 3 hari kalau poin > 100 |\n| **Berantem membela orang** | Reputasi Siswa +10, hati yang dibela +40 | Pelaku dendam (misi balasan) |\n| **Mengeroyok / memukul yang jatuh** | Menang cepat | Reputasi Siswa & Warga -15, Wulan/Nadia -40 |\n| **Kabur dari berantem** | Aman | Reputasi Jalanan -10, kalau meninggalkan teman: -25 dan teman itu -60 |\n| **Balap liar** | Uang taruhan, Nyali + | Razia 25%: motor ditahan 3 hari, denda Rp 100.000, Om marah |\n| **Kecelakaan balap** | Pingsan, bangun di klinik | Biaya Rp 150.000, kehilangan 2 hari, Bimo bisa celaka (Bab 9) |\n| **Ngebut di kampung** | Cepat sampai | Reputasi Warga -5 per kejadian, Pak RT menegur |\n| **Tidak bayar Pak Gito** | Uang aman minggu itu | Bunga +10%, 3x = warkop dirusak (level turun 1) |\n| **Menolak masuk Lampu Kota** | Jalur \"anak lurus\" | Misi OSIS & warga lebih banyak, sekutu Bab 13 lebih sedikit |\n| **Pacaran ganda ketahuan** | Event konfrontasi kantin | Semua pacar -2 hati, gosip seminggu |\n| **Lupa janji kencan** | - | -150 hati, NPC tidak mau diajak 7 hari |\n| **Lupa ulang tahun Cici / NPC 6+ hati** | - | -30, ekspresi `sedih` saat bertemu |\n| **Tidur larut (lewat 00.00)** | Waktu ekstra | Energi besok maks 70, ngantuk di kelas (mini game lebih sulit) |\n| **Tidak makan seharian** | Hemat uang | Kenyang 0: pingsan di sekolah, dibawa ke UKS, Mood -20 |\n| **Mandi & ganti baju** | Kebersihan penuh | Pesona +1 sementara untuk hari itu |\n| **Membantu warga (misi kecil)** | Uang kecil atau item | Reputasi Warga +5, gosip positif |\n| **Kerja bakti / ronda** | Uang Rp 0, tapi Pak RT senang | Reputasi Warga +10, event warga |\n| **Menjawab telepon Ibu dengan jujur** | Kadang Ibu sedih soal nilai | Mood stabil; berbohong 3x = event Ibu datang ke kota mendadak |\n\n## Konsekuensi cerita dan ending\n\n| Akumulasi | Pengaruh |\n|---|---|\n| Rata-rata nilai < 60 di semester | Tidak naik kelas: ulang setahun (konten tambahan, Bram ikut seangkatan lagi) |\n| Poin pelanggaran > 200 | Dikeluarkan sekolah: ending \"Anak Jalanan\" (kecuali Bu Hartini 6+) |\n| Reputasi Jalanan > 70 dan Sekolah < 0 | Ending \"Raja Jalanan\" |\n| Warkop level 5 & utang lunas | Ending \"Juragan Kopi\" |\n| Nilai rata-rata > 90 & Bu Hartini 8 | Ending \"Beasiswa\" |\n| Sekolah terselamatkan (Bab 13) dengan semua sekutu | Ending \"Lonceng Pulang\" (ending terbaik) |\n| Pacaran di event 8 hati | Epilog romance khusus tokoh tersebut ditambahkan ke ending apa pun |\n"}, {"id": "50-pelajaran-minigame", "file": "50-pelajaran-minigame.md", "title": "50. Pelajaran & Mini Game", "md": "# 50. Pelajaran & Mini Game\n\n## Jadwal pelajaran kelas X-2\n\n| Jam | Senin | Selasa | Rabu | Kamis | Jumat |\n|---|---|---|---|---|---|\n| 07.00-07.45 | Upacara | Matematika | Pramuka (seragam cokelat) | Bahasa Inggris | Jumat bersih |\n| 07.45-09.30 | Matematika | Fisika | Biologi | Sejarah | Agama |\n| 09.30-10.00 | Istirahat | Istirahat | Istirahat | Istirahat | Istirahat |\n| 10.00-12.00 | Bahasa Indonesia | Kimia | Penjaskes | Seni Budaya | Prakarya |\n| 12.00-12.30 | Istirahat & salat | Istirahat | Istirahat | Istirahat | Jumatan |\n| 12.30-14.00 | Bahasa Inggris | Ekonomi | Geografi | Matematika | Pulang 11.30 |\n\nSetiap jam pelajaran = 1 mini game **1-2 menit**. Pemain boleh memilih 2 pelajaran per hari untuk dimainkan penuh; sisanya\notomatis berdasarkan Kecerdasan (nilai rata-rata) supaya hari tidak terlalu panjang. Kelas XI memilih jurusan IPA/IPS yang\nmengubah 3 mata pelajaran.\n\n## 12 mini game kelas\n\n| Pelajaran | Mini game | Cara main | Perk dunia luar (nilai tinggi) |\n|---|---|---|---|\n| **Matematika** | \"Hitung Cepat\" | Angka jatuh, ketik/klik jawaban sebelum menyentuh dasar. Combo menambah poin | Kembalian warkop otomatis, harga tawar lebih baik |\n| **Fisika** | \"Lempar Parabola\" | Atur sudut dan tenaga untuk melempar kapur ke target | Lemparan senjata improvisasi lebih jauh |\n| **Kimia** | \"Racik Larutan\" | Tuang 3 cairan ke gelas ukur sesuai rasio, warna harus pas | Resep racikan: bom asap, kopi spesial |\n| **Biologi** | \"Bedah Daun\" | Cocokkan bagian tumbuhan/tubuh dengan nama (drag & drop berwaktu) | Obat herbal, penyembuhan lebih cepat |\n| **Bahasa Indonesia** | \"Susun Kalimat\" | Kata acak disusun jadi kalimat/pantun yang benar | Opsi dialog puitis (Rizal, Gilang), lomba menulis |\n| **Bahasa Inggris** | \"Spelling Bee\" | Dengar kata, eja dengan huruf melayang | Turis membayar lebih, opsi dialog \"English\" |\n| **Sejarah** | \"Garis Waktu\" | Urutkan kartu peristiwa sesuai tahun | Petunjuk rahasia Gedung Lama dan akta tanah |\n| **Geografi**
