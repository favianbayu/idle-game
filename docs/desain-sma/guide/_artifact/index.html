<script>
const SEGS=[{"id": "00-ringkasan", "file": "00-ringkasan.md", "title": "Lonceng Pulang: Guide Desain", "md": "# Lonceng Pulang: Guide Desain\n\nGuide ini adalah sumber utama untuk membangun game SMA \"Lonceng Pulang\" (judul kerja). Tiap segmen berdiri sendiri\nsebagai file `.md` supaya gampang dibuka lagi dan diubah satu per satu.\n\n## Isi guide\n\n| No | Segmen | Isi |\n|---|---|---|\n| 00 | Ringkasan | Halaman ini: premis, pilar, daftar segmen, ringkasan tokoh |\n| 01 | Tokoh utama (pemain) | Raka / Rani: penampilan, baju, statistik, gaya |\n| 02 | Gaya portrait & prompt | Aturan gaya portrait 480x480, prompt dasar, 12 ekspresi |\n| 03 | Sistem hati | Aturan 8 hati, kado, kencan, pacaran, cemburu |\n| 10-17 | NPC utama cewek (8) | Nadia, Sekar, Laras, Uti, Sasha, Kirana, Mei, Wulan |\n| 20-27 | NPC utama cowok (8) | Dimas, Arga, Rizal, Tegar, Jojo, Bram, Andra, Gilang |\n| 30 | NPC pendukung cerita | Keluarga, sahabat, guru, geng, antagonis: detail + 4 event hati persahabatan |\n| 31 | NPC pengisi dunia | 48 NPC latar dengan bubble chat |\n| 32 | Tempat tinggal | Semua tokoh dan wilayahnya, di dalam atau di luar peta |\n| 40 | Obrolan & reaksi | Sistem dialog, obrolan antar tokoh, reaksi NPC terhadap aksi pemain |\n| 41 | Feedback & konsekuensi | Akibat setiap tindakan pemain |\n| 50 | Pelajaran & mini game | Jadwal pelajaran, 12 mini game kelas, ujian, mini game luar sekolah |\n| 60 | Upgrade | Sepeda, motor, HP, kamar, warkop, bengkel, outfit |\n| 61 | Keuangan | Mata uang, pemasukan, pengeluaran, tabungan, utang, harga |\n| 70 | Animasi berantem | Kontrol, combo, kuncian, senjata improvisasi, keroyokan, bos |\n| 71 | Animasi game | Semua gerakan: jalan, kerja, sekolah, sosial, kendaraan, emosi |\n\nDokumen yang sudah ada sebelumnya (`01-cerita.md` sampai `06-event.md`, peta, bangunan, sprite) tetap berlaku. Guide ini\nmemperdalam dan, kalau ada yang beda, **guide ini yang dipakai**.\n\n## Premis singkat\n\nPemain (Raka atau Rani, 15 tahun) pindah dari desa ke kota fiktif **Wirabumi** untuk tinggal bersama **Om Darto**, pemilik\nWarkop Simpang yang terlilit utang. Tiga tahun di **SMA Negeri 3 Wirabumi**: belajar lewat mini game, cari uang, membesarkan\nwarkop, masuk klub motor **Lampu Kota**, jatuh cinta, dan akhirnya ikut menyelamatkan sekolah dari rencana relokasi oleh\n**PT Graha Megantara**. Di loteng Gedung Lama tersimpan lonceng sekolah pertama dan akta tanah yang jadi kunci cerita.\n\n## Perubahan dari versi sebelumnya\n\n- NPC utama jadi **16 tokoh romanceable**: 8 cewek dan 8 cowok. Pemain cowok bisa memacari 8 tokoh cewek, pemain cewek bisa\n  memacari 8 tokoh cowok. Semua 16 tetap bisa jadi sahabat untuk pemain mana pun (sistem hati yang sama, event ke-8 berubah\n  jadi \"sahabat sejati\"). Satu flag `romanceTerbuka` bisa membuka semua opsi untuk semua pemain.\n- **Uti, Tegar, Jojo, dan Bram** sekarang termasuk tokoh romance. **Sasha** (geng Bram) punya jalur penebusan.\n- Tokoh baru dari luar sekolah: **Kirana** (STM, adik Kobar), **Mei** (toko buku), **Wulan** (pesilat dari desa di luar peta),\n  **Andra** (pelukis mural STM), **Gilang** (pengantar galon & skater).\n- Semua tokoh romance seumuran pemain (15-18 tahun). Tokoh dewasa hanya jadi pendukung, tidak pernah romance.\n\n## Ringkasan 16 NPC utama\n\n| Tokoh | Umur | Sekolah / kerja | Peran singkat | Tinggal |\n|---|---|---|---|---|\n| Nadia Kusuma | 15 | SMA 3, X-2 | Calon ketua OSIS, perfeksionis | Pusat Kota (belakang Masjid Agung) |\n| Sekar Ayuningtyas | 15 | SMA 3, X-3 | Gitaris pendiam, penulis lagu | Perumahan Bukit Asri |\n| Laras Wibisana | 16 | SMA 3, X-2 | Penjual nasi uduk subuh | Kampung Bantaran |\n| Uti (Putri Maharani) | 15 | SMA 3, X-1 | Tomboi, montir, pemain futsal | Perkampungan Kenanga |\n| Sasha Aurelia | 16 | SMA 3, X-1 | Anak elite geng Bram, ingin bebas | Perumahan Bukit Asri |\n| Kirana Wijaya | 16 | STM Karya Bangsa, Otomotif | Adik Kobar, pembalap jalanan | Selatan (rumah di belakang bengkel ayahnya) |\n| Mei Lestari | 15 | SMA Bina Bangsa (swasta) | Anak toko buku, ilustrator | Pusat Kota (lantai 2 Toko Buku Pena) |\n| Wulan Sari | 16 | SMK Pariwisata | Pesilat juara, pemandu wisata kebun teh | **Luar peta**: Desa Sukamekar (utara) |\n| Dimas Aditya | 16 | SMA 3, X-3 | Kapten basket, pemalu | **Luar peta**: Asrama Batalyon (timur kota) |\n| Arga | 16 | SMA 3, X-1 | Anggota muda Lampu Kota, pendiam | Kawasan Sekolah (rumah Pak Ujang) |\n| Rizal Pratama | 15 | SMA 3, X-2 | Penulis cerpen, sekretaris OSIS | Pusat Kota (kontrakan belakang Ruko Pelita) |\n| Tegar Hutomo | 15 | SMA 3, X-2 | Ketua kelas, juara umum, tertekan | Perumahan Bukit Asri |\n| Jojo (Yohanes) | 15 | SMA 3, X-2 | Fotografer mading, tukang gosip | Pusat Kota (atas studio Foto Kilat) |\n| Bram Megantara | 17 | SMA 3, XI-1 lalu seangkatan | Rival, anak developer, jalur penebusan | Perumahan Bukit Asri |\n| Andra Pamungkas | 16 | STM Karya Bangsa, Bangunan | Pelukis mural, anggota Serigala Besi | Selatan (rumah nenek dekat sawah) |\n| Gilang Ramadhan | 17 | Putus sekolah, ikut paket C | Pengantar galon, skater, jenaka | Kampung Bantaran (rumah panggung) |\n"}, {"id": "01-pemain", "file": "01-pemain.md", "title": "01. Tokoh Utama (Pemain)", "md": "# 01. Tokoh Utama (Pemain)\n\n## Identitas\n\n| | Raka (cowok) | Rani (cewek) |\n|---|---|---|\n| Umur awal | 15 (kelas X) | 15 (kelas X) |\n| Asal | Desa Lereng Wangi, kaki gunung, 6 jam kereta dari Wirabumi (**luar peta**) | sama |\n| Tinggal | Rumah Om Darto, Perkampungan Kenanga, kamar belakang 2.5 x 3 petak | sama |\n| Keluarga | Ibu (di desa, rutin telepon), Ayah (merantau kerja ke luar pulau), Om Darto, sepupu Cici | sama |\n| Bisa diubah di awal | Nama, warna kulit (5), rambut (8 gaya), warna rambut (6), hijab opsional untuk Rani | |\n\n## Penampilan default\n\n- **Raka**: tinggi sedang (skala voxel 1.3), kulit sawo matang, rambut pendek hitam agak berantakan, alis tebal, sedikit\n  belang matahari di tulang pipi dari kerja di sawah. Senyum lebar.\n- **Rani**: tinggi 1.24, kulit kuning langsat, rambut hitam dikuncir kuda, poni tipis, mata besar.\n\n## Pakaian\n\n| Situasi | Raka | Rani |\n|---|---|---|\n| Sekolah Senin-Selasa, Kamis | Kemeja putih, celana abu, ikat pinggang hitam, sepatu hitam | Kemeja putih, rok abu panjang, sepatu hitam |\n| Rabu | Seragam pramuka cokelat + hasduk merah-putih | sama |\n| Jumat | Batik sekolah cokelat-krem motif parang kecil | sama |\n| Di rumah | Kaus oblong kuning pudar, celana pendek, sandal jepit | Kaus longgar + celana training |\n| Kerja kopi keliling | Kaus + celemek hijau Warkop Simpang + topi | sama |\n| Malam / nongkrong | Hoodie abu, celana jeans | Jaket denim, jeans |\n| Klub motor | Jaket hitam berlis kuning Lampu Kota + helm | sama |\n| Olahraga | Kaus olahraga sekolah biru + celana training | sama |\n\nSeragam bisa \"dikeluarkan\" (keren, +gaya, tapi ditegur guru) atau \"dimasukkan\" (rapi, guru senang).\n\n## Statistik pemain\n\n| Statistik | Rentang | Naik dari | Dipakai untuk |\n|---|---|---|---|\n| Energi | 0-100 | Tidur, makan, kopi | Semua aktivitas |\n| Kenyang | 0-100 | Makan | Fokus mini game |\n| Mood | 0-100 | Hal menyenangkan, teman | Bonus semua mini game ±10% |\n| Kekuatan | 1-10 | Latihan di markas, Penjaskes, silat | Damage berantem |\n| Kelincahan | 1-10 | Futsal, basket, lari | Menghindar, guling, balap sepeda |\n| Nyali | 1-10 | Menang berantem, balapan, berani menolong | Membuka jurus spesial, dialog berani |\n| Pesona | 1-10 | Gaya, kebersihan, Seni, kencan | Hati naik lebih cepat |\n| Kecerdasan | 1-10 | Rata-rata nilai pelajaran | Opsi dialog pintar, kecepatan belajar |\n| Keterampilan | 1-10 | Bengkel, Prakarya, memasak | Upgrade lebih murah, menu warkop |\n\n## Gaya khas pemain\n\n- Logat desa sedikit di awal (\"Nggih\", \"Mboten\", \"Lho kok gitu?\"), lama-lama ikut gaya kota (\"gue/lu\") tergantung siapa\n  yang paling sering diajak ngobrol. Pemain bisa memilih nada jawaban: **Sopan**, **Santai**, **Lucu**, **Tegas**.\n- Pemain tidak bicara di luar pilihan dialog (pilihan muncul sebagai 2-4 tombol).\n"}, {"id": "02-portrait-prompt", "file": "02-portrait-prompt.md", "title": "02. Gaya Portrait & Prompt", "md": "# 02. Gaya Portrait & Prompt\n\nSemua portrait dialog memakai satu gaya, mengikuti lembar ekspresi Indah dan Arya (proyek Rimbasari):\n**pixel art anime, bust-up, menghadap 3/4 ke kanan, cel shading hangat, garis tepi cokelat gelap, mata besar berkilau,\nrambut per helai**. Ukuran akhir **480 x 480** per ekspresi, satu lembar = 12 ekspresi dalam grid 4 x 3.\n\n## 12 ekspresi standar (urutan di grid)\n\n| No | Kode | Ekspresi | Dipakai saat |\n|---|---|---|---|\n| 1 | `biasa` | Senyum tipis, mata terbuka | Dialog netral |\n| 2 | `senyum` | Mata tertutup melengkung, senyum lembut | Senang, terima kasih |\n| 3 | `tertawa` | Mata tertutup, mulut terbuka lebar | Lucu, sangat senang |\n| 4 | `sedih` | Alis turun, mata berkaca-kaca | Kabar buruk, ditolak |\n| 5 | `marah` | Alis menukik, bibir rapat | Tersinggung, kado dibenci |\n| 6 | `kaget` | Mata membulat, mulut \"o\" | Kejutan |\n| 7 | `malu` | Pipi merah, melirik ke samping, senyum kecil | Digoda, dipuji, romance |\n| 8 | `bingung` | Satu alis naik, melirik ke atas | Pertanyaan aneh |\n| 9 | `jatuhcinta` | Mata berbentuk hati, pipi merah | Event 6 & 8 hati, kado favorit |\n| 10 | `cemas` | Alis naik, mulut bergelombang, setetes keringat | Takut, gugup |\n| 11 | `sinis` | Mata setengah tertutup, senyum miring | Mengejek, curiga, cemburu |\n| 12 | `lelah` | Mata terpejam, mulut menguap | Ngantuk, capek, malam |\n\n## Prompt dasar (dipakai untuk semua tokoh)\n\nTempel prompt dasar ini, lalu tambahkan bagian **\"Tokoh\"** dari halaman tiap NPC.\n\n```\nPixel art character portrait sheet, 12 expressions in a 4x3 grid, each cell a bust-up portrait of the SAME character,\n3/4 view facing slightly right, shoulders visible. Style: detailed modern pixel art like a cozy life-sim RPG,\nwarm cel shading with 3-4 tones per color, dark brown pixel outlines, large expressive anime eyes with two white\nhighlights, hair drawn in clumps of strands with highlight streaks, soft blush. Plain dark charcoal background.\nIndonesian high school setting. Consistent face, hair, clothes and colors in all 12 cells.\nExpressions in order: 1 neutral slight smile, 2 eyes-closed gentle smile, 3 laughing open mouth, 4 sad teary,\n5 angry furrowed brows, 6 surprised round mouth, 7 shy blushing looking away, 8 confused one brow raised,\n9 heart eyes blushing, 10 anxious wavy mouth with sweat drop, 11 smug half-lidded smirk, 12 sleepy yawning.\nTokoh: <deskripsi tokoh>\n```\n\n## Aturan pakai\n\n- Tiap tokoh punya **warna kunci** (2-3 warna) yang sama dengan sprite voxel-nya, supaya portrait dan sprite terasa satu orang.\n- Seragam SMA 3: kemeja putih krem (di portrait dibuat krem hangat, bukan putih abu-abu), badge OSIS kecil di saku kiri\n  kecuali disebut lain.\n- Setelah generate: potong per sel, skala ke 480 x 480 tanpa anti-alias (nearest neighbour), simpan sebagai\n  `portrait/<id>_<kode>.png`, contoh `portrait/nadia_malu.png`.\n- Tokoh pendukung dewasa cukup 6 ekspresi (`biasa`, `senyum`, `tertawa`, `sedih`, `marah`, `kaget`).\n"}, {"id": "03-sistem-hati", "file": "03-sistem-hati.md", "title": "03. Sistem Hati", "md": "# 03. Sistem Hati\n\nSetiap NPC utama dan pendukung punya **meter hati 0-8**. Satu hati = 100 poin (total 800). Setiap kali mencapai hati\n**2, 4, 6, dan 8** muncul **event hati** khusus (4 event per tokoh). Event tidak jalan otomatis: pemain harus datang ke\nlokasi dan waktu yang tertulis, dan ikon hati merah muda muncul di peta HP.\n\n## Cara menaikkan hati\n\n| Aksi | Poin | Batas |\n|---|---|---|\n| Menyapa / ngobrol | +10 | 1x per hari per tokoh |\n| Ngobrol topik yang disukai (ditebak dari obrolan sebelumnya) | +20 | 1x per hari |\n| Kado biasa | +20 | 2x per minggu per tokoh |\n| Kado disukai | +45 | |\n| Kado favorit | +80 | |\n| Kado dibenci | -40 | |\n| Kado di hari ulang tahun | poin x4 | |\n| Membantu permintaan (misi kecil) | +60 sampai +120 | |\n| Ikut kegiatan kesukaannya bareng (futsal, belajar, ngamen) | +30 | 1x per hari |\n| Kencan (setelah 4 hati) | +60 sampai +150 | 1x per minggu |\n| Pilihan dialog yang tepat di event hati | +50 sampai +100 | |\n| Pilihan buruk di event hati | -50 | |\n| Mengabaikan janji kencan | -150 | |\n| Tidak bertemu 7 hari | -10 per hari | Tidak turun di bawah batas hati yang sudah membuka event |\n\n## Tahap hubungan\n\n| Hati | Tahap | Yang terbuka |\n|---|---|---|\n| 0-1 | Kenalan | Sapaan pendek, nama di daftar kontak HP |\n| 2-3 | Teman | Event 2 hati, obrolan pribadi, bisa diajak nongkrong |\n| 4-5 | Teman dekat | Event 4 hati, kencan biasa, chat malam, bantuan di misi |\n| 6-7 | Spesial | Event 6 hati, kencan khusus, cemburu aktif, ikut membantu di Bab 13 |\n| 8 | Pacaran (romance) / Sahabat sejati (non-romance) | Event 8 hati = nembak atau ikrar sahabat, epilog khusus |\n\n## Pacaran, cemburu, dan putus\n\n- Nembak hanya bisa di event 8 hati dan butuh item **Gelang Benang** (dibuat sendiri di kelas Prakarya atau dibeli di\n  pasar malam, Rp 15.000). Ditolak tidak mungkin di event 8 hati, karena hatinya sudah penuh.\n- Pacaran dengan lebih dari satu tokoh bisa, tapi **gosip** menyebar dalam 1-3 hari kalau terlihat berdua di tempat ramai.\n  Ketahuan: semua pacar -2 hati dan event konfrontasi di kantin. Ketahuan dua kali: putus otomatis dengan yang paling\n  rendah hatinya.\n- **Putus** sendiri lewat HP (\"Kita temenan aja ya\"): hati turun ke 4, tokoh menjauh 14 hari, setelah itu bisa\n  berteman lagi.\n- Setelah pacaran ada event lanjutan tanpa hati: kencan malam Minggu, ulang tahun, LDR di epilog.\n\n## Kado\n\nTiap tokoh punya daftar kado di halamannya. Kado umum:\n\n| Kado | Harga | Disukai oleh kebanyakan | Dibenci oleh |\n|---|---|---|---|\n| Es kopi susu Warkop Simpang | Rp 8.000 (atau buat sendiri) | Hampir semua | Tegar (tidak minum kopi) |\n| Cokelat batang | Rp 12.000 | Tokoh cewek, Bimo | Laras (sayang uang dihabiskan) |\n| Gorengan sebungkus | Rp 5.000 | Bimo, Gilang, Arga | Sasha |\n| Bunga dari pasar | Rp 10.000 | Nadia, Mei, Sekar | Uti, Kirana |\n| Stiker motor | Rp 7.000 | Uti, Kirana, Arga | Nadia |\n| Buku | Rp 35.000 | Rizal, Mei, Tegar | Gilang |\n| Sampah / barang rusak | - | Tidak ada | Semua |\n"}, {"id": "10-nadia", "file": "10-nadia.md", "title": "10. Nadia Kusuma", "md": "# 10. Nadia Kusuma\n\n| | |\n|---|---|\n| Umur / kelas | 15, SMA 3 kelas X-2 (sekelas pemain) |\n| Peran | Calon ketua OSIS, perfeksionis, penggerak jalur \"legal\" melawan relokasi |\n| Tinggal | **Dalam peta**: Pusat Kota, rumah dua lantai cat hijau mint di gang belakang Masjid Agung |\n| Keluarga | Ayah imam masjid & guru ngaji, ibu penjahit, dua adik kembar (SD) |\n| Romance | Pemain cowok (sahabat untuk pemain cewek) |\n| Warna kunci | Abu-biru muda `#d8e2ea` (hijab), krem `#efe3c8`, hijau mint `#9fd3b5` |\n| Gaya voxel | `hijab`, seragam rapi dimasukkan, tas ransel kotak |\n\n## Penampilan\n\nTinggi 1.22, wajah oval, kulit kuning langsat, alis rapi tipis, mata cokelat tajam yang melunak saat tersenyum. Hijab\nsegi empat abu-biru dilipat rapi, peniti mutiara kecil di bawah dagu. Pipi gampang merah kalau dipuji. Pulpen selalu\nterselip di saku, jam tangan kecil tali kulit cokelat yang selalu dilirik.\n\n## Pakaian\n\n| Situasi | Pakaian |\n|---|---|\n| Sekolah | Kemeja putih krem lengan panjang, rok abu panjang, hijab abu-biru, badge OSIS, sepatu pantofel hitam mengilap |\n| Rabu / Jumat | Pramuka lengkap dengan tanda kecakapan penuh / batik sekolah disetrika licin |\n| Rapat OSIS | Jas almamater biru tua di atas seragam, map plastik bening |\n| Di rumah | Gamis rumahan hijau mint, hijab instan, kaus kaki |\n| Jalan-jalan | Tunik krem, celana kulot cokelat susu, tas selempang kanvas, sepatu kets putih |\n| Hujan | Jas hujan ponco kuning, payung lipat biru selalu di tas |\n\n## Watak\n\n- Tegas, terorganisir, punya jadwal sampai per 15 menit. Benci terlambat.\n- Di balik itu takut mengecewakan ayahnya; merasa harus jadi contoh untuk adik-adiknya.\n- **Kelemahan**: susah minta tolong, gampang menghakimi anak \"nakal\" (awalnya benci geng motor).\n- **Rahasia**: koleksi komik romantis dan menggambar komik sendiri di buku bersampul \"Catatan Fisika\".\n\n## Hobi & kesukaan\n\n- Hobi: menyusun rencana, membaca komik diam-diam, kaligrafi, main bulu tangkis Minggu pagi.\n- Makanan: martabak manis keju-cokelat, es teh tawar (tidak suka manis kecuali martabak).\n- Tempat favorit: perpustakaan pojok jendela, ruang OSIS, bangku taman kota dekat air mancur.\n\n| Kado | Item |\n|---|---|\n| Favorit (+80) | Komik edisi khusus (Toko Buku Pena, Rp 45.000), set pulpen kaligrafi |\n| Disukai (+45) | Martabak manis, bunga, buku catatan bagus, cokelat batang |\n| Biasa (+20) | Es teh, roti, alat tulis |\n| Dibenci (-40) | Stiker motor, rokok/korek, barang bekas geng, gorengan berminyak di tas |\n\n## Cara bicara\n\n- Aku/kamu ke semua orang, kalimat lengkap dan cepat. Suka menghitung poin: \"Pertama... kedua...\".\n- Kata khas: \"Fokus.\", \"Itu nggak efisien.\", \"Ya Allah...\" (saat kesal), \"Oke, catat.\"\n- Saat malu kalimatnya patah-patah dan pura-pura melihat jam.\n\n> \"Rapat jam tiga lewat lima. Bukan jam tiga lewat enam. Oke? Oke.\"\n> \"Kamu... ikut geng motor? Aku nggak marah. Aku cuma... kecewa sedikit. Banyak, sih.\"\n\n## Kebiasaan & jadwal\n\n| Waktu | Hari sekolah | Akhir pekan |\n|---|---|---|\n| 05.00-06.30 | Subuh berjamaah, bantu ibu menyiapkan adik | Bulu tangkis di alun-alun (Minggu) |\n| 06.30-14.00 | Datang paling awal, kelas X-2, istirahat di perpustakaan | Pasar bersama ibu (Sabtu) |\n| 14.00-16.30 | Ruang OSIS (Senin, Rabu, Kamis), perpustakaan | Taman kota, membaca |\n| 16.30-18.00 | Pulang, mengajar ngaji adik-adik di masjid | Toko Buku Pena |\n| 19.00-21.30 | Belajar di kamar, chat grup OSIS | Rumah |\n\nKebiasaan: merapikan meja orang lain tanpa sadar, mengetuk pulpen 3x saat berpikir, selalu membawa plester dan permen jahe.\n\n## Interaksi dengan pemain\n\n- Awalnya menilai pemain dari reputasi. Reputasi \"Pembuat onar\" tinggi = hati naik setengah.\n- Senang kalau pemain datang tepat waktu, nilai bagus, dan membantu acara OSIS.\n- Menolak ikut kencan ke balap liar; suka kencan perpustakaan, pasar malam (bianglala), dan bazar buku.\n- Bisa diajak belajar bareng: +5% nilai ulangan berikutnya.\n- Bantuan misi: di Bab 13 menyiapkan petisi dan rapat warga (jalur legal).\n\n## Hubungan dengan tokoh lain\n\nRival ramah dengan **Tegar** (berebut juara umum), partner kerja **Rizal** di OSIS, tidak suka **Bram** dan **Sasha**,\ndiam-diam akrab dengan **Mei** karena komik. Menghormati **Bu Hartini**.\n\n## Event hati\n\n### 2 hati: \"Rapat yang Kacau\"\n- **Syarat**: 2 hati, hari Senin/Rabu/Kamis, 14.30, ruang OSIS.\n- **Adegan**: Rapat persiapan MPLS kacau, Rizal belum datang, proyektor mati. Nadia panik kecil tapi menolak dibantu.\n- **Pilihan**: \"Sini aku pegang proyektornya\" (+60, perbaiki kabel lewat mini game sambung kabel) / \"Kamu boleh\n  minta tolong, lho\" (+80, Nadia terdiam lalu bilang \"...makasih\") / \"Ya udah, aku pulang ya\" (-50).\n- **Hasil**: membuka obrolan pribadi dan opsi \"Belajar bareng\".\n\n### 4 hati: \"Buku Catatan Fisika\"\n- **Syarat**: 4 hati, perpustakaan, istirahat kedua.\n- **Adegan**: Buku \"Catatan Fisika\" Nadia jatuh, pemain memungutnya dan melihat halaman komik buatannya.\n- **Pilihan**: \"Ini kamu yang gambar? Keren banget!\" (+100) / Tutup buku, pura-pura tidak lihat (+50, rahasia\n  dibuka belakangan) / Tertawa \"Kirain anak OSIS nggak baca ginian\" (-50).\n- **Hasil**: kencan \"Toko Buku Pena\" terbuka. Nadia mulai menunjukkan halaman komik baru tiap minggu.\n\n### 6 hati: \"Pemilihan Ketua OSIS\"\n- **Syarat**: 6 hati, Bab 4-5, hari debat calon di aula.\n- **Adegan**: Bram menyebar gosip Nadia \"menyontek\". Sebelum debat Nadia gemetar di belakang panggung.\n- **Pilihan**: Kumpulkan bukti dengan Jojo dulu (misi 1 hari, +100, gosip dibalik) / Temani dan latih jawaban\n  (+80) / Hadapi Bram langsung (berantem; menang +50 tapi Nadia kecewa soal kekerasan, kalah +30).\n- **Hasil**: Nadia menang (atau kalah tipis). Ekspresi `jatuhcinta` pertama. Cemburu aktif.\n\n### 8 hati: \"Langit di Atap Masjid\" (romance) / \"Dua Kursi di Ruang OSIS\" (sahabat)\n- **Syarat**: 8 hati, Gelang Benang di inventori, malam Jumat setelah ngaji, 20.00, atap masjid (diizinkan ayahnya).\n- **Adegan (romance)**: Nadia menunjukkan halaman terakhir komiknya: dua tokoh di atap masjid, tokoh cowok mirip pemain.\n  Halaman berikutnya kosong. \"Aku nggak tahu akhirnya. Kamu tahu?\"\n- **Pilihan**: Ikat gelang di tangannya (pacaran) / \"Akhirnya mereka teman selamanya\" (jalur sahabat, tanpa penalti).\n- **Adegan (sahabat)**: Nadia memasang kursi kedua di ruang OSIS bertuliskan nama pemain: \"Wakil gue. Nggak boleh nolak.\"\n- **Hasil**: epilog khusus (Nadia kuliah hukum, pemain di kursi depan saat dia dilantik ketua BEM).\n\n## Contoh obrolan & reaksi\n\n| Situasi | Bubble / dialog |\n|---|---|\n| Sapaan pagi | \"Pagi. Kamu telat 2 menit kemarin. Hari ini jangan.\" |\n| Pemain pakai seragam dikeluarkan | `sinis` \"Masukin. Sekarang.\" |\n| Pemain menang berantem di dekatnya | `marah` \"Puas? Itu nyelesaiin apa?\" (-20 kecuali membela orang) |\n| Pemain dapat nilai 100 | `senyum` \"Lumayan. Jangan sombong, minggu depan aku 100 juga.\" |\n| Hujan, pemain tak bawa payung | Menyodorkan payung lipat: \"Balikin besok. Kering.\" |\n| Ulang tahun (14 Maret) | Tidak mau ada pesta, tapi senang diberi kue kecil di perpustakaan |\n\n## Prompt portrait\n\n```\nTokoh: 15-year-old Indonesian girl, oval face, warm light skin, neat thin eyebrows, sharp brown eyes, wearing a neatly\nfolded pale blue-grey square hijab with a small pearl pin, cream long-sleeve school shirt with small OSIS badge,\na pen clipped to the pocket, small brown leather watch. Tidy, disciplined look. Key colors pale blue-grey, cream, mint.\n```\n"}, {"id": "11-sekar", "file": "11-sekar.md", "title": "11. Sekar Ayuningtyas", "md": "# 11. Sekar Ayuningtyas\n\n| | |\n|---|---|\n| Umur / kelas | 15, SMA 3 kelas X-3 |\n| Peran | Gitaris band sekolah \"Lantai Dua\", penulis lagu, pendiam |\n| Tinggal | **Dalam peta**: Perumahan Bukit Asri, rumah minimalis abu-putih Blok C-7, kamar loteng |\n| Keluarga | Ayah dokter gigi, ibu notaris (sering lembur), kakak laki-laki kuliah di luar kota |\n| Romance | Pemain cowok |\n| Warna kunci | Biru jeans `#5b7fa8`, ungu lavender `#b9a3d6`, hitam |\n| Gaya voxel | `twintail`, jaket jeans, gitar di punggung |\n\n## Penampilan\n\nTinggi 1.2, kurus, kulit putih pucat karena jarang keluar siang, rambut hitam panjang dikuncir dua rendah dengan ikat\nrambut ungu. Poni menutupi alis, mata sayu agak mengantuk. Ujung jari kiri kapalan karena senar. Plester motif bintang\nhampir selalu ada di salah satu jari.\n\n## Pakaian\n\n| Situasi | Pakaian |\n|---|---|\n| Sekolah | Seragam standar, lengan digulung sekali, jaket jeans kebesaran di atasnya (ditegur Pak Wawan), kets kanvas hitam |\n| Latihan band | Kaus band indie pudar, celana kargo hitam, gelang karet warna-warni |\n| Di rumah | Sweater lavender kebesaran, celana piama kotak-kotak, kaus kaki tebal |\n| Jalan-jalan | Kemeja flanel ungu terbuka di atas kaus putih, rok jeans, sling bag kecil |\n| Pentas | Gaun hitam sederhana + jaket jeans penuh pin, sepatu boots |\n| Hujan | Hoodie dengan tudung, gitar dibungkus kantong plastik besar |\n\n## Watak\n\n- Pendiam, mengamati, bicara lebih jujur lewat lagu daripada mulut.\n- Humor kering, kadang mengejutkan dengan satu kalimat tajam.\n- **Kelemahan**: menghindari konflik, gampang menyerah kalau dilarang orang tua.\n- **Rahasia**: sudah 47 lagu di buku kecil bersampul cokelat, tapi tak satu pun pernah dinyanyikan di depan orang.\n\n## Hobi & kesukaan\n\n- Hobi: main gitar, menulis lirik, merekam suara hujan di HP, naik ke atap Gedung B saat sore.\n- Makanan: mi ayam tanpa sayur, susu kotak stroberi.\n- Tempat favorit: studio musik sekolah, atap Gedung B, toko kaset bekas di Pusat Kota.\n\n| Kado | Item |\n|---|---|\n| Favorit (+80) | Senar gitar baru (Rp 25.000), kaset/piringan bekas langka (pasar loak) |\n| Disukai (+45) | Susu stroberi, buku lirik kosong, pick gitar, bunga |\n| Biasa (+20) | Permen, es kopi susu |\n| Dibenci (-40) | Sesuatu yang berisik (terompet mainan), barang bermerek mahal (\"nanti mamaku nanya\") |\n\n## Cara bicara\n\n- Pelan, pendek, banyak \"hmm\" dan jeda. Pakai aku/kamu.\n- Kata khas: \"Hmm.\", \"Boleh.\", \"Nggak apa-apa kok.\", \"Itu nadanya F minor.\"\n- Saat bersemangat soal musik tiba-tiba bicara panjang lalu malu sendiri.\n\n> \"Hujannya... ada ritmenya. Dengerin. Tik, tik-tik, tik.\"\n> \"...Kamu orang pertama yang dengerin lagu ini. Jangan bilang siapa-siapa.\"\n\n## Kebiasaan & jadwal\n\n| Waktu | Hari sekolah | Akhir pekan |\n|---|---|---|\n| 06.30-14.00 | Kelas X-3, istirahat di tangga belakang dengan earphone | Tidur sampai siang |\n| 14.00-17.00 | Studio musik (Selasa, Kamis latihan band), atap Gedung B | Toko kaset Pusat Kota (Sabtu) |\n| 17.00-19.00 | Pulang naik angkot, kamar loteng | Les piano yang dia benci (Minggu 15.00) |\n| 19.00-23.00 | Menulis lagu, kadang memposting cover anonim | Pasar malam, duduk dekat panggung dangdut |\n\nKebiasaan: mengetuk ritme di meja, menyanyi lirih saat menyangka sendirian, selalu duduk dekat jendela.\n\n## Interaksi dengan pemain\n\n- Hati naik dari mini game **Seni Budaya**, menonton latihan, dan membawakan susu stroberi.\n- Tidak suka keramaian: kencan terbaik di atap sekolah, taman kota malam, toko kaset.\n- Pemain bisa membantu band (jadi drummer atau manajer). Membuka mini game ritme \"Manggung\".\n- Bantuan misi: di Bab 13 memimpin konser amal penggalangan dana untuk gugatan.\n\n## Hubungan dengan tokoh lain\n\nSatu band dengan **Andra** (kadang jadi bassist tamu) dan **Jojo** (fotografer band). Akrab dengan **Mei**. Dekat dengan\n**Bu Melati**. Tetangga **Sasha** dan **Tegar** di Bukit Asri, kenal sejak kecil.\n\n## Event hati\n\n### 2 hati: \"Lagu di Tangga Belakang\"\n- **Syarat**: 2 hati, istirahat pertama, tangga belakang Gedung B.\n- **Adegan**: Pemain mendengar Sekar menyanyi pelan. Dia kaget dan menjatuhkan buku lagunya.\n- **Pilihan**: \"Suaramu bagus\" (+50) / Duduk diam dan minta dia lanjutkan (+80) / \"Nyanyi apaan sih?\" (+10).\n- **Hasil**: opsi \"Nonton latihan band\" dan \"Dengerin lagu baru\" terbuka.\n\n### 4 hati: \"Atap Gedung B\"\n- **Syarat**: 4 hati, sore setelah 15.00, atap Gedung B (kunci dari Pak Ujang atau lewat jendela gudang).\n- **Adegan**: Sekar mengajak pemain melihat senja dan menunjukkan rekaman suara hujan. Dia bercerita orang tuanya\n  memaksa berhenti band setelah kelas X.\n- **Pilihan**: \"Kamu mau berhenti?\" (+80, Sekar menjawab jujur \"nggak\") / \"Orang tua kamu benar, sih\" (-50) / Mainkan\n  rekaman hujan berdua tanpa bicara (+100).\n- **Hasil**: kencan \"Atap sekolah\" dan chat malam terbuka.\n\n### 6 hati: \"Lagu Ke-48\"\n- **Syarat**: 6 hati, Bab 8 (pensi kelas XI dekat), studio musik malam.\n- **Adegan**: Ibu Sekar datang menjemput paksa saat latihan. Sekar diam, gitar ditinggal.\n- **Pilihan**: Bawakan gitarnya ke rumah malam itu (+100, jendela loteng) / Bicara sopan pada ibunya (butuh Pesona 6,\n  +80, ibunya mengizinkan \"sekali ini\") / Biarkan (+0, event pensi lebih sulit).\n- **Hasil**: Sekar menulis lagu ke-48 untuk pemain. Tampil di pensi.\n\n### 8 hati: \"Panggung Pensi\" (romance) / \"Duet\" (sahabat)\n- **Syarat**: 8 hati, Gelang Benang, malam pensi kelas XI, belakang panggung lalu atap Gedung B.\n- **Adegan (romance)**: Sekar menyanyikan lagu ke-48 di depan seluruh sekolah, tidak melihat penonton kecuali pemain.\n  Setelahnya di atap: \"Judulnya belum ada. Kamu mau kasih nama?\"\n- **Pilihan**: Ikat gelang dan beri judul \"Lonceng Pulang\" (pacaran) / Jadi sahabat: diajak jadi member band tetap.\n- **Hasil**: epilog: Sekar merilis album indie; lagu itu jadi lagu penutup credit game.\n\n## Contoh obrolan & reaksi\n\n| Situasi | Bubble / dialog |\n|---|---|\n| Sapaan | `biasa` \"Hai.\" (kalau hati tinggi: \"Hai. Tadi aku nulis bait baru.\") |\n| Pemain berantem | `cemas` \"...Kamu nggak apa-apa?\" |\n| Pemain nyanyi buruk di mini game | `tertawa` pertama kalinya, lalu langsung menutup mulut |\n| Pemain kasih susu stroberi | `senyum` \"Kok tahu?\" |\n| Ulang tahun (2 Juli) | Ingin diberi lagu atau rekaman, bukan barang mahal |\n\n## Prompt portrait\n\n```\nTokoh: 15-year-old Indonesian girl, slim, pale skin, long straight black hair in two low twin tails tied with lavender\nhair ties, blunt bangs covering eyebrows, sleepy half-lidded dark eyes, oversized faded denim jacket over cream school\nshirt, a star-pattern bandage on one finger, guitar strap across the chest. Quiet, dreamy look.\nKey colors denim blue, lavender, black.\n```\n"}, {"id": "12-laras", "file": "12-laras.md", "title": "12. Laras Wibisana", "md": "# 12. Laras Wibisana\n\n| | |\n|---|---|\n| Umur / kelas | 16, SMA 3 kelas X-2 (sekelas pemain; telat masuk sekolah setahun karena kerja) |\n| Peran | Penjual nasi uduk subuh di pasar, lucu, keras kepala |\n| Tinggal | **Dalam peta**: Kampung Bantaran, rumah papan biru muda dekat jembatan Kali Cendana |\n| Keluarga | Ibu (sakit pinggang, berhenti jualan), adik laki-laki Doni (11). Ayah meninggal saat Laras SMP |\n| Romance | Pemain cowok |\n| Warna kunci | Oranye bata `#d9774a`, kuning kunyit `#e8b84a`, hijau daun pisang `#6c9a4a` |\n| Gaya voxel | `ponytail`, celemek oranye, bakul di tangan |\n\n## Penampilan\n\nTinggi 1.22, kulit sawo matang terang, pipi bulat, gigi gingsul yang terlihat saat tertawa. Rambut hitam tebal dikuncir\ntinggi dengan karet gelang biasa, anak rambut berantakan. Tangan cekatan dengan bekas luka kecil kena minyak. Selalu ada\njepit rambut jepitan kayu di poni.\n\n## Pakaian\n\n| Situasi | Pakaian |\n|---|---|\n| Subuh jualan | Kaus oranye pudar, celemek kunyit bergambar daun, celana training, sandal karet, handuk kecil di bahu |\n| Sekolah | Seragam agak kusut (disetrika malamnya, tapi ngantuk), sepatu hitam yang solnya sudah ditambal |\n| Di rumah | Daster batik peninggalan ibu yang dipotong pendek |\n| Jalan-jalan | Kemeja kotak hijau yang diikat di pinggang, jeans, kets putih bekas yang dicuci bersih |\n| Pasar malam | Jaket parasut oranye, tas pinggang berisi uang receh |\n| Hujan | Plastik sewa payung (dia juga ojek payung kalau hujan) |\n\n## Watak\n\n- Ceria, cepat, pintar menawar, pantang dikasihani.\n- Keras kepala: menolak bantuan uang, hanya mau \"kerja sama\".\n- **Kelemahan**: menanggung semua sendiri, sering ketiduran di kelas, nilai pas-pasan.\n- **Rahasia**: ingin kuliah tata boga dan punya rumah makan sendiri, tapi merasa itu mimpi kemewahan.\n\n## Hobi & kesukaan\n\n- Hobi: memasak, menghitung untung di buku kas, nonton lomba masak di HP retak, main karambol dengan Doni.\n- Makanan: nasi uduk buatan sendiri (tentu), rujak cingur, es cendol.\n- Tempat favorit: lapak pasar, jembatan Kali Cendana saat senja, alun-alun malam.\n\n| Kado | Item |\n|---|---|\n| Favorit (+80) | Pisau dapur bagus (Rp 40.000), buku resep tata boga |\n| Disukai (+45) | Bahan dagangan (kelapa, telur sekilo), es cendol, celemek baru, gorengan |\n| Biasa (+20) | Es kopi susu, bunga (\"cantik, tapi nggak bisa dimakan\") |\n| Dibenci (-40) | Cokelat mahal (\"sayang uangnya\"), uang tunai langsung (merasa dikasihani) |\n\n## Cara bicara\n\n- Cepat, logat Jawa-pasar, campur \"gue/lu\" saat bercanda, \"aku/kamu\" saat serius.\n- Kata khas: \"Lima ribu, nggak bisa kurang!\", \"Ealah...\", \"Hayuk!\", \"Aku bisa sendiri.\"\n- Suka mengubah apa pun jadi hitungan untung-rugi.\n\n> \"Kamu bangun jam empat? Hayuk, bantuin aku angkut termos. Bayarannya nasi uduk plus senyum.\"\n> \"Ealah, jangan liatin aku gitu. Aku nggak capek. ...Dikit.\"\n\n## Kebiasaan & jadwal\n\n| Waktu | Hari sekolah | Akhir pekan |\n|---|---|---|\n| 03.30-06.30 | Masak dan jualan nasi uduk di Pasar Wirabumi | Jualan sampai 09.00 |\n| 06.40-14.00 | Kelas X-2, tidur saat istirahat pertama | Belanja bahan di pasar induk (Sabtu) |\n| 14.00-17.00 | Pulang, mengurus ibu dan Doni | Membantu katering hajatan |\n| 17.00-21.00 | Belajar sebentar, jualan es teh di alun-alun (Sabtu) | Pasar malam |\n\nKebiasaan: menguap lebar lalu menutupnya dengan dua tangan, mencatat semua pengeluaran, memberi bonus kerupuk ke anak kecil.\n\n## Interaksi dengan pemain\n\n- Hati naik dari **kerja bareng di pasar subuh** (mini game bungkus nasi), traktir es cendol, membantu belajar.\n- Menolak traktiran mahal; kencan terbaik: pasar malam, jembatan Kali Cendana, masak bareng.\n- Pemain bisa mengajak Laras bekerja di Warkop Simpang (menu sarapan, penghasilan pagi +).\n- Bantuan misi: di Bab 13 menggerakkan pedagang pasar yang lapaknya juga terancam proyek.\n\n## Hubungan dengan tokoh lain\n\nBersahabat dengan **Gilang** (tetangga rumah panggung), dekat dengan **Bimo** (sesama tukang masak, kadang rival resep).\nLangganan **Om Darto**. Tidak tahan dengan **Sasha** di awal, akhirnya berteman lewat jalur penebusan Sasha.\n\n## Event hati\n\n### 2 hati: \"Termos Tumpah\"\n- **Syarat**: 2 hati, 05.00, Pasar Wirabumi.\n- **Adegan**: Preman pasar menyenggol termos nasi Laras. Laras marah-marah tapi matanya berkaca-kaca.\n- **Pilihan**: Bantu memungut dan jual sisanya (+60) / Tegur preman (Nyali 3, berantem kecil, +80) / Bayar semua\n  nasinya (-20, \"Aku bukan pengemis\").\n- **Hasil**: membuka \"Kerja bareng subuh\".\n\n### 4 hati: \"Buku Kas\"\n- **Syarat**: 4 hati, istirahat kedua, kelas X-2 kosong.\n- **Adegan**: Laras ketiduran di atas buku kas. Pemain melihat halaman terakhir: \"Target: kuliah tata boga. Sisa: 14 juta.\"\n- **Pilihan**: Selimuti dengan jaket dan biarkan tidur (+100) / Bangunkan sebelum guru datang (+60) / Baca keras\n  \"Empat belas juta?\" (-50).\n- **Hasil**: kencan \"Masak bareng\" terbuka. Laras mulai belajar bareng pemain (nilai naik).\n\n### 6 hati: \"Penggusuran Lapak\"\n- **Syarat**: 6 hati, Bab 10, pasar subuh.\n- **Adegan**: Satpol dan orang PT Graha Megantara menyegel deretan lapak. Laras berdiri di depan lapaknya.\n- **Pilihan**: Tawarkan sudut Warkop Simpang untuk jualan (+100, butuh warkop level 2) / Ajak pedagang protes\n  bersama (+80, misi warga) / Lawan petugas (reputasi -, Laras menahanmu: +30).\n- **Hasil**: Laras pertama kali menangis di depan pemain, lalu tertawa \"Muka aku jelek ya?\". Cemburu aktif.\n\n### 8 hati: \"Jembatan Kali Cendana\" (romance) / \"Rumah Makan Bareng\" (sahabat)\n- **Syarat**: 8 hati, Gelang Benang, Sabtu 18.00 (senja), jembatan Kali Cendana.\n- **Adegan (romance)**: Laras membawa dua bungkus nasi uduk \"edisi spesial\" dengan telur berbentuk hati. \"Ini bukan\n  promosi. Ini... ya pokoknya makan.\"\n- **Pilihan**: Ikat gelang (pacaran) / \"Kita bikin rumah makan bareng nanti\" (sahabat, partner usaha).\n- **Hasil**: epilog Laras membuka \"Uduk Laras\" di sebelah warkop; kalau pacaran, namanya jadi \"Uduk Laras & (nama pemain)\".\n\n## Contoh obrolan & reaksi\n\n| Situasi | Bubble / dialog |\n|---|---|\n| Sapaan subuh | \"Uduk! Uduk! Eh kamu. Mau? Lima ribu. Buat kamu... tetap lima ribu.\" |\n| Pemain bolos | `marah` \"Aku sekolah sambil jualan, kamu malah bolos?!\" |\n| Pemain beli banyak | `tertawa` \"Pelanggan teladan bulan ini!\" |\n| Pemain kasih uang | `marah` \"Simpen.\" |\n| Ulang tahun (17 Agustus) | \"Ulang tahunku barengan negara, jadi nggak ada yang inget.\" Kue kecil = +80 x4 |\n\n## Prompt portrait\n\n```\nTokoh: 16-year-old Indonesian girl, light tan skin, round cheeks, cute snaggletooth visible when smiling, thick black hair\nin a high messy ponytail with loose strands, a wooden clip in the bangs, faded orange t-shirt with a turmeric-yellow\napron printed with leaves, small towel over one shoulder. Energetic market-girl look.\nKey colors brick orange, turmeric yellow, banana-leaf green.\n```\n"}, {"id": "13-uti", "file": "13-uti.md", "title": "13. Uti (Putri Maharani)", "md": "# 13. Uti (Putri Maharani)\n\n| | |\n|---|---|\n| Umur / kelas | 15, SMA 3 kelas X-1 |\n| Peran | Tomboi, montir, kapten futsal putri, sahabat sejak hari pertama |\n| Tinggal | **Dalam peta**: Perkampungan Kenanga, rumah bata ekspos dengan garasi seng, tiga rumah dari Om Darto |\n| Keluarga | Bapak sopir truk (sering pergi), ibu jualan pulsa. Kakak laki-laki, Mas Danu, meninggal 2 tahun lalu |\n| Romance | Pemain cowok (sahabat untuk pemain cewek, tetap tokoh terdekat) |\n| Warna kunci | Merah marun `#8c2f39`, hitam oli `#2a2a2a`, kuning helm `#f2c230` |\n| Gaya voxel | `bob`, jaket marun, kunci pas di saku |\n\n## Penampilan\n\nTinggi 1.24, atletis, kulit sawo matang, rambut bob pendek berantakan yang dipotong sendiri, alis tebal, ada coretan oli di\npipi hampir setiap sore. Bekas luka kecil di dagu (jatuh motor waktu SMP). Mata berbinar, senyum lebar, suka menyeringai.\n\n## Pakaian\n\n| Situasi | Pakaian |\n|---|---|\n| Sekolah | Seragam dengan celana panjang abu (izin khusus), lengan digulung, jaket marun milik almarhum kakak |\n| Futsal | Jersey putri SMA 3 nomor 7, decker, sepatu futsal merah |\n| Bengkel | Wearpack biru tua kebesaran, lengan diikat di pinggang, kaus hitam, sarung tangan kain |\n| Jalan-jalan | Kaus band motor, jeans robek lutut, sepatu boots kerja, topi terbalik |\n| Malam | Jaket marun + helm half-face kuning bergambar petir |\n| Acara resmi | Kebaya sederhana yang dipaksa ibunya, terlihat sangat tidak nyaman (momen lucu) |\n\n## Watak\n\n- Blak-blakan, setia kawan, gampang tertawa dan gampang marah.\n- Merasa harus \"jadi Mas Danu\" untuk orang tuanya.\n- **Kelemahan**: menolak terlihat lemah atau \"cewek\", cemburu tanpa sadar.\n- **Rahasia**: menyimpan surat terakhir Mas Danu yang belum berani dia baca.\n\n## Hobi & kesukaan\n\n- Hobi: membongkar mesin, futsal, nonton balap di HP, memelihara ayam jago namanya \"Rossi\".\n- Makanan: bakso urat, es teh jumbo, kacang rebus.\n- Tempat favorit: garasi rumahnya, bengkel Mas Fajar, lapangan futsal, Jalan Lingkar malam.\n\n| Kado | Item |\n|---|---|\n| Favorit (+80) | Kunci set lengkap (Rp 60.000), suku cadang langka untuk motor Mas Danu |\n| Disukai (+45) | Stiker motor, bakso, sarung tangan bengkel, kaos kaki futsal |\n| Biasa (+20) | Es kopi susu, gorengan |\n| Dibenci (-40) | Bunga (\"lu kira gue apaan?\"), boneka, make-up |\n\n## Cara bicara\n\n- Gue/lu ke semua orang termasuk pemain. Keras, cepat, sering menepuk punggung.\n- Kata khas: \"Gas!\", \"Santuy.\", \"Lu tuh ya...\", \"Ahelah.\", \"Gue jitak lu.\"\n- Saat malu: marah-marah pura-pura atau mengalihkan ke soal motor.\n\n> \"Gas! Telat dikit, ditinggal!\"\n> \"Nggak, gue nggak nangis. Ini keringet. Dari... mata.\"\n\n## Kebiasaan & jadwal\n\n| Waktu | Hari sekolah | Akhir pekan |\n|---|---|---|\n| 06.00 | Mampir ke rumah Om Darto, nebeng atau ngajak berangkat bareng | Kasih makan Rossi |\n| 06.30-14.00 | Kelas X-1, istirahat di lapangan | Liga futsal kampung (Minggu) |\n| 15.00-17.00 | Futsal (Senin, Rabu, Jumat), bengkel Mas Fajar (hari lain) | Bengkel seharian |\n| 19.00-22.00 | Garasi, merakit motor Mas Danu | Nonton balap di Jalan Lingkar |\n\nKebiasaan: mengunyah karet gelang, memutar kunci pas di jari, memeriksa ban motor setiap orang yang lewat.\n\n## Interaksi dengan pemain\n\n- Sahabat sejak hari pertama: hati awal **1** (bukan 0).\n- Hati naik dari futsal bareng, bantu di bengkel, ikut balap, makan bakso.\n- Bonus: upgrade motor -10% saat 4 hati, -20% saat 6 hati.\n- Cemburu yang paling terlihat: kalau pemain pacaran dengan orang lain, Uti menjauh 3 hari lalu kembali biasa.\n- Bantuan misi: mekanik di semua balapan; di Bab 13 menyabotase truk proyek (opsional).\n\n## Hubungan dengan tokoh lain\n\nRekan bengkel **Mas Fajar** dan **Arga**, rival-teman **Kirana** (balap), sering ribut dengan **Jojo** (diganggu gosip).\nMenganggap **Bimo** adik.\n\n## Event hati\n\n### 2 hati: \"Motor Mas Danu\"\n- **Syarat**: 2 hati, malam, garasi Uti.\n- **Adegan**: Uti memperlihatkan motor tua tertutup terpal. Bapaknya mau menjualnya ke pengepul.\n- **Pilihan**: \"Kita rakit bareng\" (+80, membuka arc motor) / \"Jual aja, Ti, biar nggak sedih\" (-50) / \"Mau gue\n  temenin ngomong ke bapak lu?\" (+60).\n- **Hasil**: misi \"Kumpulkan suku cadang\" (5 komponen) terbuka.\n\n### 4 hati: \"Hujan di Garasi\"\n- **Syarat**: 4 hati, malam hujan, garasi Uti, setelah 3 komponen.\n- **Adegan**: Listrik padam. Di cahaya senter, Uti bercerita kecelakaan Mas Danu.\n- **Pilihan**: Dengarkan saja (+100) / \"Lu nggak harus jadi kakak lu\" (+80, Uti kaget) / Bercanda menghibur (+30).\n- **Hasil**: kencan \"Keliling malam naik motor\" terbuka. Uti pertama memanggil nama asli pemain, bukan \"bro\".\n\n### 6 hati: \"Surat yang Belum Dibuka\"\n- **Syarat**: 6 hati, motor selesai dirakit, makam di luar kota (perjalanan motor 1 malam).\n- **Adegan**: Di makam Mas Danu, Uti mengeluarkan surat. Dia minta pemain membacakannya.\n- **Pilihan**: Bacakan pelan (+100, isinya: \"Ti, jangan jadi gue. Jadi lu aja.\") / Kembalikan, \"Ini buat lu\" (+80, Uti\n  membaca sendiri dan menangis).\n- **Hasil**: Uti ikut balap resmi (Bab 9). Ekspresi `malu` mulai muncul di dekat pemain.\n\n### 8 hati: \"Garis Finis\" (romance) / \"Partner Pit\" (sahabat)\n- **Syarat**: 8 hati, Gelang Benang, setelah balap resmi, Jalan Lingkar 23.00.\n- **Adegan (romance)**: Uti melepas helm dan bilang dengan muka merah: \"Gue nggak ngerti cara ngomong ginian. Jadi... gue\n  tantang lu balap. Kalau gue menang, lu jadi cowok gue.\" (Dia sengaja kalah.)\n- **Pilihan**: Ikat gelang di setang motornya lalu di tangannya (pacaran) / \"Lu partner pit gue selamanya\" (sahabat).\n- **Hasil**: epilog bengkel \"Danu Motor\" milik Uti, pemain jadi pembalap atau partner.\n\n## Contoh obrolan & reaksi\n\n| Situasi | Bubble / dialog |\n|---|---|\n| Sapaan | \"Woy! Udah sarapan? Belum? Bakso yuk.\" |\n| Pemain kalah berantem | `marah` \"Siapa? Kasih tau gue namanya.\" |\n| Pemain kasih bunga | `sinis` \"...Lu salah orang kali.\" (Kalau 6+ hati: diam-diam disimpan, `malu`) |\n| Pemain menang balap | `tertawa` sambil memukul helm pemain |\n| Ulang tahun (9 November) | Suka dikasih kue di garasi, benci dirayakan di kelas |\n\n## Prompt portrait\n\n```\nTokoh: 15-year-old Indonesian tomboy girl, athletic, warm tan skin, short messy self-cut bob haircut, thick eyebrows, small\nscar on chin, oil smudge on cheek, wide grin, oversized maroon jacket over cream school shirt with sleeves rolled up, a\nwrench sticking out of the jacket pocket. Key colors maroon, oil black, helmet yellow.\n```\n"}, {"id": "14-sasha", "file": "14-sasha.md", "title": "14. Sasha Aurelia", "md": "# 14. Sasha Aurelia\n\n| | |\n|---|---|\n| Umur / kelas | 16, SMA 3 kelas X-1 |\n| Peran | Anak elite di geng Bram, populer, ingin bebas. Punya **jalur penebusan** |\n| Tinggal | **Dalam peta**: Perumahan Bukit Asri, rumah besar putih bergaya klasik Blok A-1 dengan pagar emas |\n| Keluarga | Ayah pejabat dinas tata kota (rekan Pak Haris), ibu sosialita pemilik butik. Anak tunggal |\n| Romance | Pemain cowok |\n| Warna kunci | Merah muda pastel `#f2b8c6`, putih gading `#f7f1e6`, emas `#c9a24a` |\n| Gaya voxel | `long` bergelombang, cardigan pink, tas mahal |\n\n## Penampilan\n\nTinggi 1.24, kulit putih bersih, rambut cokelat kemerahan panjang bergelombang (dicat, ditegur guru, tidak peduli).\nWajah tirus, bulu mata lentik, lip tint merah muda. Kuku rapi dengan kuteks bening. Postur tegak, langkah seperti\nperagawati. Saat sendiri bahunya turun dan terlihat jauh lebih kecil.\n\n## Pakaian\n\n| Situasi | Pakaian |\n|---|---|\n| Sekolah | Seragam dipermak pas badan, rok sedikit lebih pendek dari aturan, cardigan rajut pink, jam tangan emas |\n| Bersama geng | Kacamata hitam di kepala, tas tangan putih, sepatu loafers mengilap |\n| Di rumah | Piama satin putih, sandal bulu |\n| Jalan-jalan | Dress bunga pastel, jaket denim putih, tas mini |\n| Rahasia (malam) | Hoodie hitam polos, celana training, masker, sepatu kets lusuh: penyamaran ke tempat yang \"tidak pantas\" |\n| Hujan | Diantar sopir, payung transparan |\n\n## Watak\n\n- Di depan umum: sinis, menilai orang dari merek, tajam lidahnya.\n- Sebenarnya: kesepian, lucu, suka hal sederhana (gorengan pinggir jalan, kucing liar).\n- **Kelemahan**: takut ditinggal geng, takut ayahnya, sering ikut menyakiti orang supaya tidak jadi sasaran.\n- **Rahasia**: malam hari kabur ke alun-alun untuk memberi makan kucing liar dan belajar menjahit ke penjahit pasar\n  (ibunya Nadia), cita-citanya desainer baju, bukan \"menikah dengan anak pejabat\".\n\n## Hobi & kesukaan\n\n- Hobi: menggambar desain baju, merawat kucing liar, belanja (tapi lebih suka melihat daripada membeli).\n- Makanan: salad (di depan orang), cilok pedas dan seblak (diam-diam).\n- Tempat favorit: kafe Pusat Kota, alun-alun malam (rahasia), ruang jahit penjahit pasar.\n\n| Kado | Item |\n|---|---|\n| Favorit (+80) | Buku sketsa fashion, kain batik tulis (pasar, Rp 50.000) |\n| Disukai (+45) | Makanan kucing, cokelat, bunga, cilok (hanya kalau diberikan saat sepi) |\n| Biasa (+20) | Es kopi susu |\n| Dibenci (-40) | Gorengan di depan teman-temannya (\"Ih, berminyak!\"), barang palsu bermerek |\n\n## Cara bicara\n\n- Gue/lu, nada malas memanjangkan kata: \"Seriuuus?\". Bahasa campur Inggris: \"Literally\", \"Whatever\", \"So cringe\".\n- Saat sendirian dengan pemain berubah jadi aku/kamu dan bicara biasa.\n- Kata khas: \"Ew.\", \"Whatever.\", \"Jangan ge-er.\", \"...Makasih. Jangan bilang Bram.\"\n\n> \"Ew, sepatu lu. Itu warisan ya?\"\n> (malam, alun-alun) \"Namanya Mochi. Dia nggak peduli gue anak siapa. Enak, ya.\"\n\n## Kebiasaan & jadwal\n\n| Waktu | Hari sekolah | Akhir pekan |\n|---|---|---|\n| 06.45 | Datang diantar mobil hitam | Tidur, perawatan |\n| 06.45-14.00 | Kelas X-1, istirahat di meja geng kantin (pojok AC) | Mal/kafe dengan geng (Sabtu siang) |\n| 14.00-17.00 | Nongkrong dengan geng Bram, les bahasa Prancis | Butik ibunya |\n| 20.00-21.30 | Kabur ke alun-alun (penyamaran), memberi makan kucing | Ruang jahit pasar (Minggu pagi, rahasia) |\n\nKebiasaan: memutar ujung rambut saat bosan, memotret makanan tapi tidak memakannya, menyimpan sobekan kain di saku.\n\n## Interaksi dengan pemain\n\n- Tahun 1: lawan. Ikut menghina pemain, terlibat beberapa misi geng Bram.\n- Hati hanya bisa naik dengan cepat lewat **pertemuan malam di alun-alun** (rahasia). Di sekolah, menyapa Sasha di depan\n  geng: +10 tapi Bram curiga.\n- **Jalur penebusan** (event 4 dan 6 hati) membuat Sasha keluar dari geng Bram. Kalau tidak, dia tetap di geng sampai\n  Bab 13 dan bisa jadi pengkhianat atau pembocor dokumen tergantung hati.\n- Bantuan misi: di Bab 13 mencuri salinan rapat ayahnya yang membuktikan izin palsu (kalau 6+ hati).\n\n## Hubungan dengan tokoh lain\n\nTumbuh bersama **Bram** (dikira pacaran, padahal seperti saudara yang saling mengekang), bersama **Rio** dan **Kevin**.\nDiam-diam belajar jahit ke ibu **Nadia**. Tetangga **Sekar** dan **Tegar**. Awalnya bermusuhan dengan **Laras**.\n\n## Event hati\n\n### 2 hati: \"Kucing di Alun-alun\"\n- **Syarat**: 2 hati (atau bertemu tak sengaja di alun-alun setelah 20.00), bangku dekat beringin.\n- **Adegan**: Pemain melihat sosok berhoodie memberi makan kucing. Ternyata Sasha. Dia panik: \"Lu nggak lihat apa-apa.\"\n- **Pilihan**: \"Kucingnya lucu. Namanya siapa?\" (+80) / \"Tenang, rahasia aman\" (+60) / Foto dan ancam (hati -50,\n  bisa dipakai memeras geng Bram, reputasi jahat +).\n- **Hasil**: jadwal malam Sasha muncul di HP. Dia mulai menyapa pemain secara rahasia lewat chat.\n\n### 4 hati: \"Buku Sketsa\"\n- **Syarat**: 4 hati, Minggu pagi, ruang jahit di pasar.\n- **Adegan**: Sasha belajar memotong pola. Ibunya menelepon, Sasha berbohong sedang di gym.\n- **Pilihan**: \"Desainmu bagus. Ikut lomba desain sekolah aja\" (+100, misi lomba) / \"Kenapa nggak jujur ke ibumu?\" (+50)\n- **Hasil**: kencan rahasia terbuka. Mulai jalur penebusan: Sasha menolak ikut satu aksi bully Bram.\n\n### 6 hati: \"Keluar dari Meja Pojok\"\n- **Syarat**: 6 hati, Bab 6-7, kantin.\n- **Adegan**: Bram menyuruh Sasha menumpahkan jus ke Laras. Seisi kantin melihat. Sasha melirik pemain.\n- **Pilihan**: Berdiri di samping Sasha (+100, Sasha menolak dan pergi dari meja geng; Bram marah, misi bentrok) /\n  Mengangguk kecil dari jauh (+80) / Tidak peduli (Sasha menurut, hati -50, jalur penebusan tertutup sampai Bab 10).\n- **Hasil**: Sasha keluar dari geng, duduk di meja pemain. Gosip besar seminggu.\n\n### 8 hati: \"Peragaan di Pasar Malam\" (romance) / \"Desainer & Model\" (sahabat)\n- **Syarat**: 8 hati, Gelang Benang, Sabtu malam, panggung kecil pasar malam.\n- **Adegan (romance)**: Sasha mengadakan peragaan baju dari batik pasar, modelnya Laras, Uti, dan Cici. Penutupnya: Sasha\n  turun panggung dan memberikan jaket buatannya kepada pemain. \"Ukurannya pas. Aku ngukur pakai mata. Tiap hari.\"\n- **Pilihan**: Ikat gelang (pacaran) / Jadi model tetap koleksinya (sahabat).\n- **Hasil**: epilog Sasha kuliah desain dengan beasiswa, putus hubungan dengan cara hidup ayahnya, butik kecil \"Mochi\".\n\n## Contoh obrolan & reaksi\n\n| Situasi | Bubble / dialog |\n|---|---|\n| Di sekolah, hati rendah | `sinis` \"Minggir. Lu ngalangin cahaya.\" |\n| Di sekolah, hati tinggi | Bisik lewat: \"Nanti malem, jam sembilan.\" |\n| Pemain kasih gorengan di depan geng | `marah` \"Ew!\" (malam itu chat: \"Sorry. Gorengannya enak.\") |\n| Pemain berantem dengan Bram | `cemas`, setelah 6 hati ikut menarik pemain kabur |\n| Ulang tahun (24 Desember) | Pesta mewah yang dia benci; dia lebih senang diajak makan seblak setelahnya |\n\n## Prompt portrait\n\n```\nTokoh: 16-year-old Indonesian girl, fair skin, long wavy reddish-brown dyed hair, slim face, long lashes, pink lip tint,\nfitted cream school shirt with a soft pink knit cardigan, thin gold watch, sunglasses pushed up on her head. Elegant\nbut guarded look. Key colors pastel pink, ivory, gold.\n```\n"}, {"id": "15-kirana", "file": "15-kirana.md", "title": "15. Kirana Wijaya", "md": "# 15. Kirana Wijaya\n\n| | |\n|---|---|\n| Umur / sekolah | 16, STM Karya Bangsa jurusan Otomotif kelas X |\n| Peran | Adik Kobar (ketua Serigala Besi), pembalap jalanan paling cepat di selatan |\n| Tinggal | **Dalam peta, pinggir selatan**: rumah di belakang bengkel \"Wijaya Motor\" milik ayahnya, dekat Jalan Lingkar |\n| Keluarga | Ayah pemilik bengkel (keras, mantan pembalap), kakak Kobar (19). Ibu pergi saat Kirana kecil |\n| Romance | Pemain cowok |\n| Warna kunci | Hijau toska `#2fa39a`, hitam `#1f1f1f`, oranye neon `#ff7a2f` |\n| Gaya voxel | `long` diikat rendah, jaket balap toska-hitam, helm full-face |\n\n## Penampilan\n\nTinggi 1.26, ramping, kulit kuning langsat agak gelap karena matahari. Rambut hitam lurus panjang diikat rendah dengan\nujung dicat toska. Mata tajam sedikit sipit, anting tindik kecil di satu telinga. Plester di siku dan lutut hampir selalu ada.\n\n## Pakaian\n\n| Situasi | Pakaian |\n|---|---|\n| Sekolah STM | Kemeja putih dengan logo STM, celana abu (STM putri boleh celana), sepatu safety |\n| Bengkel | Wearpack hitam dengan lis oranye neon, handuk kecil di leher |\n| Balapan | Jaket balap toska-hitam dengan nomor 21, sarung tangan, helm full-face hitam bergambar ombak toska |\n| Jalan-jalan | Crop hoodie hitam, celana kargo, sneakers tinggi putih |\n| Acara keluarga | Kemeja kotak ayahnya yang kebesaran |\n| Hujan | Jas hujan setelan motor, tetap balapan |\n\n## Watak\n\n- Kompetitif, dingin di awal, irit kata, respek hanya pada yang berani.\n- Diam-diam lembut pada anak kecil dan motor tua.\n- **Kelemahan**: tidak bisa menolak tantangan, terlalu ingin membuktikan diri pada ayahnya yang menganggap balap \"urusan\n  cowok\".\n- **Rahasia**: menulis catatan setelan mesin dalam bentuk puisi pendek di dinding kamar.\n\n## Hobi & kesukaan\n\n- Hobi: balap, tuning mesin, menggambar di tangki motor, memelihara ikan cupang.\n- Makanan: nasi goreng pinggir jalan level pedas, kopi hitam tanpa gula.\n- Tempat favorit: Jalan Lingkar malam, jembatan layang selatan, bengkel ayahnya.\n\n| Kado | Item |\n|---|---|\n| Favorit (+80) | Sarung tangan balap (Rp 55.000), knalpot custom kecil |\n| Disukai (+45) | Stiker motor, kopi hitam, nasi goreng, ikan cupang |\n| Biasa (+20) | Es kopi susu, gorengan |\n| Dibenci (-40) | Bunga, cokelat (\"gue bukan anak SD\"), apa pun berwarna merah muda |\n\n## Cara bicara\n\n- Gue/lu, singkat, suka mengakhiri dengan tantangan.\n- Kata khas: \"Buktiin.\", \"Lambat.\", \"Hmph.\", \"Lu lumayan.\"\n- Memanggil pemain \"Anak Warkop\" sampai 4 hati, setelahnya pakai nama.\n\n> \"Anak Warkop. Lu bisa naik motor apa cuma bisa nganter kopi?\"\n> \"...Itu tadi tikungan yang bagus. Jangan senyum, gue nggak muji.\"\n\n## Kebiasaan & jadwal\n\n| Waktu | Hari sekolah | Akhir pekan |\n|---|---|---|\n| 07.00-14.00 | STM Karya Bangsa (luar sekolah pemain, terlihat saat pulang) | Bengkel ayah |\n| 14.00-18.00 | Bengkel Wijaya Motor | Liga balap resmi (setelah Bab 9) |\n| 18.00-21.00 | Warung nasi goreng Jalan Lingkar | Pasar malam (jarang, kalau diajak) |\n| 22.00-00.00 | Balap liar Jalan Lingkar (Selasa, Jumat) | Jembatan layang selatan |\n\nKebiasaan: memukul helm dua kali sebelum start, mengusap tangki motor seperti hewan peliharaan, berjongkok di mana saja.\n\n## Interaksi dengan pemain\n\n- Muncul pertama di Bab 4 sebagai lawan balap. Kalah darinya membuka obrolan; menang darinya: hati +60 langsung.\n- Hati naik dari balapan, ngobrol mesin, membantu di bengkel ayahnya, dan membela Serigala Besi saat diadu domba.\n- Hubungan dengan geng: kalau pemain di Lampu Kota, Kobar curiga dan memberi \"ujian\" (berantem satu lawan satu).\n- Bantuan misi: di Bab 13 memimpin anak STM menghadang preman bayaran Pak Haris.\n\n## Hubungan dengan tokoh lain\n\nAdik **Kobar** (sangat protektif), satu sekolah dengan **Andra** (teman sejak kecil), rival-teman **Uti**. Mengenal\n**Mas Fajar** dari dunia bengkel.\n\n## Event hati\n\n### 2 hati: \"Rantai Putus\"\n- **Syarat**: 2 hati, malam, Jalan Lingkar setelah balap liar.\n- **Adegan**: Rantai motor Kirana putus saat razia datang. Dia harus kabur atau tertangkap.\n- **Pilihan**: Bonceng dia kabur (mini game kejar-kejaran, +80) / Bantu dorong motornya ke gang (+60) / Pergi duluan (-50).\n- **Hasil**: Kirana memberi nomor HP: \"Utang gue satu.\"\n\n### 4 hati: \"Dinding Kamar\"\n- **Syarat**: 4 hati, sore, bengkel Wijaya Motor (ayahnya keluar kota).\n- **Adegan**: Kirana memperlihatkan kamarnya penuh tulisan setelan mesin berbentuk puisi.\n- **Pilihan**: Baca satu keras-keras dengan serius (+100) / \"Ini puisi? Lu nulis puisi?\" (+40, Kirana `malu` dan\n  marah) / Tawarkan setelan baru untuk motornya (+60, mini game tuning).\n- **Hasil**: kencan \"Keliling selatan\" dan \"Ngopi tengah malam\" terbuka.\n\n### 6 hati: \"Ayah dan Garis Start\"\n- **Syarat**: 6 hati, Bab 9, sebelum balap resmi pertama.\n- **Adegan**: Ayah Kirana melarangnya mendaftar balap resmi. Kirana mengurung diri di bengkel.\n- **Pilihan**: Bicara dengan ayahnya pakai catatan setelan puisi Kirana (Kecerdasan 5, +100, ayahnya luluh) / Ajak\n  Kirana tetap daftar diam-diam (+80, konflik keluarga) / \"Nurut aja dulu\" (+20).\n- **Hasil**: Kirana ikut balap resmi dengan nomor 21. Cemburu aktif (terutama pada Uti).\n\n### 8 hati: \"Jembatan Layang Selatan\" (romance) / \"Tim Balap\" (sahabat)\n- **Syarat**: 8 hati, Gelang Benang, malam setelah final balap, jembatan layang selatan 23.30.\n- **Adegan (romance)**: Kirana menatap lampu kota: \"Gue selalu pengen cepet. Sekarang gue pengen pelan aja. Sama lu.\"\n- **Pilihan**: Ikat gelang di tangannya yang bersarung tangan (pacaran) / Bentuk tim balap berdua (sahabat).\n- **Hasil**: epilog Kirana pembalap wanita profesional pertama dari Wirabumi.\n\n## Contoh obrolan & reaksi\n\n| Situasi | Bubble / dialog |\n|---|---|\n| Sapaan | \"Hmph. Masih hidup, Anak Warkop?\" |\n| Pemain kalah balap | `sinis` \"Lambat.\" |\n| Pemain menang balap | `kaget` lalu `senyum` tipis: \"Ulang. Sekarang.\" |\n| Pemain berantem dengan anak STM | `marah` kalau tanpa alasan; netral kalau membela diri |\n| Ulang tahun (21 Mei) | Senang dibawakan kopi hitam dan diajak balap santai |\n\n## Prompt portrait\n\n```\nTokoh: 16-year-old Indonesian girl from a vocational school, slim, light-tan sun-touched skin, long straight black hair\ntied low with teal-dyed tips, sharp slightly narrow eyes, small earring, bandage on elbow, black and teal racing jacket\nwith number 21 and neon orange trim over a white vocational school shirt. Cool, competitive look.\nKey colors teal, black, neon orange.\n```\n"}, {"id": "16-mei", "file": "16-mei.md", "title": "16. Mei Lestari", "md": "# 16. Mei Lestari\n\n| | |\n|---|---|\n| Umur / sekolah | 15, SMA Bina Bangsa (swasta) kelas X |\n| Peran | Anak pemilik Toko Buku Pena, ilustrator, ceria tapi canggung |\n| Tinggal | **Dalam peta**: Pusat Kota, lantai 2 Toko Buku Pena di Jl. Merdeka (ruko tua bercat kuning) |\n| Keluarga | Ayah dan ibu pengelola toko buku (keturunan Tionghoa-Jawa), nenek (Ama) yang galak tapi lucu |\n| Romance | Pemain cowok |\n| Warna kunci | Kuning mustard `#e3b23c`, hijau tua `#3f6b4f`, krem kertas `#f4ead2` |\n| Gaya voxel | `bob` dengan jepit, kacamata bulat, apron toko |\n\n## Penampilan\n\nTinggi 1.18 (paling pendek), kulit kuning langsat, rambut bob sebahu hitam dengan jepit pensil kuning. Kacamata bulat\nbesar yang sering melorot. Pipi tembam, mata sipit yang hilang saat tertawa. Ada noda tinta di jari tengah kanan.\n\n## Pakaian\n\n| Situasi | Pakaian |\n|---|---|\n| Sekolah (Bina Bangsa) | Kemeja putih, rompi kotak hijau tua, rok kotak, dasi pita, kaus kaki putih panjang, sepatu loafers |\n| Jaga toko | Kaus kuning mustard + apron hijau bertuliskan \"PENA\", pensil di telinga |\n| Di rumah | Piama bergambar kucing, kaus kaki tidak sepasang |\n| Jalan-jalan | Overall jeans di atas kaus garis-garis, tas tote penuh pin, topi baret hijau |\n| Lomba gambar | Kemeja putih kebesaran (biar kena cat tidak masalah) |\n| Hujan | Jas hujan kuning mustard bentuk bebek |\n\n## Watak\n\n- Ceria, imajinatif, gampang antusias, canggung secara fisik (sering menabrak rak).\n- Pemalu terhadap cowok, bisa bicara lancar hanya soal buku dan gambar.\n- **Kelemahan**: tidak percaya diri dengan gambarnya, membandingkan diri dengan ilustrator online.\n- **Rahasia**: diam-diam menggambar komik tentang kota Wirabumi, dan pemain menjadi tokohnya (tahu sejak 4 hati).\n\n## Hobi & kesukaan\n\n- Hobi: menggambar, membaca novel fantasi, merawat toko, mengoleksi pembatas buku.\n- Makanan: bakpao kacang hijau buatan Ama, teh susu, roti bakar.\n- Tempat favorit: Toko Buku Pena lantai 2 (studio), taman kota, perpustakaan daerah.\n\n| Kado | Item |\n|---|---|\n| Favorit (+80) | Set cat air (Rp 65.000), buku seni ilustrasi |\n| Disukai (+45) | Buku, bunga, pembatas buku unik, cokelat, roti bakar |\n| Biasa (+20) | Es kopi susu, permen |\n| Dibenci (-40) | Gorengan berminyak (merusak kertas), buku sobek atau dilipat |\n\n## Cara bicara\n\n- Aku/kamu, cepat ketika antusias, sering memakai perumpamaan buku: \"Kayak bab tiga yang plot twist!\".\n- Kata khas: \"Eh, eh, eh!\", \"Aduh, maaf!\", \"Ini kayak di novel!\", \"Ama bilang...\"\n- Ama (nenek) sering menyela dengan logat Jawa campur Hokkien: \"Mei! Ojo pacaran ning toko!\"\n\n> \"Eh, eh, eh! Kamu suka fantasi juga? Rak tujuh, sebelah kiri, aku pernah nangis di buku yang sampul biru!\"\n> \"Aduh maaf, kacamataku... ini kamu? Kok mirip... nggak, nggak apa-apa.\"\n\n## Kebiasaan & jadwal\n\n| Waktu | Hari sekolah | Akhir pekan |\n|---|---|---|\n| 06.30-13.30 | SMA Bina Bangsa (luar sekolah pemain) | Jaga toko pagi |\n| 14.00-18.00 | Jaga kasir Toko Buku Pena, menggambar di balik meja | Lomba gambar / bazar buku (sesekali) |\n| 18.00-20.00 | Taman kota menggambar orang lewat | Pasar malam dengan sketsa |\n| 20.00-23.00 | Studio lantai 2 | Studio lantai 2 |\n\nKebiasaan: membetulkan kacamata dengan jari tengah, menggambar di tisu, menyembunyikan wajah di balik buku saat malu.\n\n## Interaksi dengan pemain\n\n- Ketemu pertama di Toko Buku Pena (Bab 2) saat pemain mencari buku pelajaran bekas.\n- Hati naik dari membeli buku, membawa roti bakar, jadi model gambar, membantu angkut kardus buku.\n- Bonus: buku pelajaran -20%, buku resep warkop dan buku keterampilan tersedia lebih awal.\n- Bantuan misi: di Bab 13 membuat ilustrasi kampanye \"Selamatkan SMA 3\" yang viral.\n\n## Hubungan dengan tokoh lain\n\nTeman komik **Nadia**, pelanggan setia **Rizal** (kadang cemburu-cemburuan soal buku), akrab dengan **Sekar** dan **Andra**\n(sesama seniman). Ama berteman dengan **Bu Narti** (sumber gosip).\n\n## Event hati\n\n### 2 hati: \"Rak Tujuh\"\n- **Syarat**: 2 hati, sore, Toko Buku Pena.\n- **Adegan**: Mei naik tangga untuk mengambil buku, tangga goyang. Buku berjatuhan.\n- **Pilihan**: Pegangi tangga (+60) / Tangkap Mei (Kelincahan 4, +80, momen `malu`) / Tangkap bukunya dulu (+30, Mei\n  tertawa).\n- **Hasil**: Mei menawarkan pembatas buku buatannya. Membuka \"Jadi model gambar\".\n\n### 4 hati: \"Komik Kota Wirabumi\"\n- **Syarat**: 4 hati, malam, studio lantai 2 (izin Ama dengan kado bakpao atau Pesona 4).\n- **Adegan**: Pemain melihat komik berjudul \"Anak Warkop\", tokohnya mirip sekali dengan pemain.\n- **Pilihan**: \"Aku jadi tokoh utama?\" dengan senang (+100) / Pura-pura tidak sadar (+50) / \"Kamu ngikutin aku?\" (-50).\n- **Hasil**: setiap minggu ada halaman baru yang menggambarkan kejadian yang benar-benar dialami pemain (catatan\n  perjalanan dalam game).\n\n### 6 hati: \"Lomba Ilustrasi Kota\"\n- **Syarat**: 6 hati, Bab 8, alun-alun.\n- **Adegan**: Mei mau mundur dari lomba karena peserta lain sudah \"profesional\".\n- **Pilihan**: Duduk di sebelahnya sampai selesai, jadi model (+100) / Beri semangat panjang (Pesona 5, +80) /\n  \"Ya udah, mundur aja\" (-50).\n- **Hasil**: Mei juara 2. Pertama kali memeluk pemain lalu panik minta maaf. Cemburu aktif (terutama pada Nadia).\n\n### 8 hati: \"Halaman Terakhir\" (romance) / \"Dua Nama di Sampul\" (sahabat)\n- **Syarat**: 8 hati, Gelang Benang, malam Minggu, studio lantai 2.\n- **Adegan (romance)**: Komik \"Anak Warkop\" sudah 80 halaman. Halaman terakhir menunjukkan tokoh Mei memberi gelang\n  pada tokoh pemain. \"Aku nggak berani ngomong. Jadi aku gambar. Kamu... baca sampai akhir?\"\n- **Pilihan**: Ikat gelang yang asli (pacaran) / Tulis nama pemain sebagai penulis cerita di sampul (sahabat).\n- **Hasil**: epilog komik diterbitkan; Toko Buku Pena memajang poster besar.\n\n## Contoh obrolan & reaksi\n\n| Situasi | Bubble / dialog |\n|---|---|\n| Sapaan di toko | \"Selamat datang di Pena! Eh, kamu. Halo! Mau buku apa? Aku punya rekomendasi delapan judul!\" |\n| Pemain datang luka habis berantem | `cemas` \"Kamu kayak tokoh yang mau mati di bab sepuluh! Duduk!\" |\n| Pemain kasih gorengan | `bingung` \"Ehh... dimakan di luar toko ya?\" |\n| Pemain beli buku pelajaran | `senyum` \"Diskon teman!\" |\n| Ulang tahun (8 Agustus) | Ama membuat bakpao; Mei suka kado yang bisa dipakai menggambar |\n\n## Prompt portrait\n\n```\nTokoh: 15-year-old Chinese-Indonesian girl, short and petite, light skin, chubby cheeks, shoulder-length black bob with\na yellow pencil hair clip, large round glasses slipping down her nose, ink stain on her finger, wearing a mustard yellow\nt-shirt with a dark green bookstore apron printed \"PENA\". Bubbly, awkward bookworm look.\nKey colors mustard yellow, dark green, paper cream.\n```\n"}, {"id": "17-wulan", "file": "17-wulan.md", "title": "17. Wulan Sari", "md": "# 17. Wulan Sari\n\n| | |\n|---|---|\n| Umur / sekolah | 16, SMK Pariwisata Wirabumi kelas X (berangkat dari desa tiap hari) |\n| Peran | Pesilat juara provinsi, pemandu wisata kebun teh, guru silat dadakan pemain |\n| Tinggal | **Luar peta**: Desa Sukamekar, 40 menit naik bus ke utara. Rumah panggung kayu di tepi kebun teh |\n| Keluarga | Kakek (guru perguruan silat \"Kembang Teh\"), ibu pemetik teh, tiga adik |\n| Romance | Pemain cowok |\n| Warna kunci | Hijau teh `#7aa35a`, cokelat kayu `#7a5233`, putih `#f3f1ea` |\n| Gaya voxel | `ponytail` dikepang, baju silat hitam, selendang hijau |\n\n## Penampilan\n\nTinggi 1.26 (tinggi untuk cewek), kulit sawo matang terbakar matahari, tubuh kuat dan lentur. Rambut hitam panjang\ndikepang satu tebal sampai pinggang. Mata besar teduh, alis lurus. Bekas memar kecil di lengan bawah dari latihan.\nSenyum tenang seperti orang yang tidak pernah terburu-buru.\n\n## Pakaian\n\n| Situasi | Pakaian |\n|---|---|\n| Sekolah SMK | Blazer biru tua jurusan pariwisata, kemeja putih, rok span, sepatu hak rendah (dia benci) |\n| Silat | Baju pangsi hitam, sabuk hijau tingkat tinggi, ikat kepala batik |\n| Pemandu wisata | Kemeja hijau seragam kebun teh, topi caping, sepatu boots karet |\n| Di desa | Kaus lengan panjang, sarung batik diikat di pinggang |\n| Ke kota | Kemeja kotak hijau, celana jeans, sepatu kanvas, tas punggung anyaman |\n| Hujan | Caping dan jas hujan plastik, tidak peduli basah |\n\n## Watak\n\n- Tenang, sabar, sopan, tetapi berani dan sangat lurus.\n- Suka mengamati orang kota dengan heran (\"Kok semuanya buru-buru?\").\n- **Kelemahan**: terlalu memikul nama perguruan kakeknya, susah menolak permintaan orang tua.\n- **Rahasia**: ingin keluar dari desa dan melihat dunia, tapi merasa itu pengkhianatan pada kakek.\n\n## Hobi & kesukaan\n\n- Hobi: silat, memetik teh, memasak di tungku, menghafal nama burung, bermain suling bambu.\n- Makanan: nasi liwet, pepes ikan, teh tubruk.\n- Tempat favorit: pendopo perguruan, bukit kebun teh saat kabut, terminal bus kota (melihat orang).\n\n| Kado | Item |\n|---|---|\n| Favorit (+80) | Buku peta/atlas dunia (Rp 40.000), sepatu lari |\n| Disukai (+45) | Bunga, teh, kain batik, makanan kota yang belum pernah dia coba (es krim, burger) |\n| Biasa (+20) | Es kopi susu, cokelat |\n| Dibenci (-40) | Senjata (pisau, gir), barang yang \"pamer\" |\n\n## Cara bicara\n\n- Aku/kamu, logat Sunda halus: \"Atuh\", \"Punten\", \"Mangga\", \"Euy\". Bicara pelan dan jelas.\n- Kata khas: \"Tarik napas dulu.\", \"Punten...\", \"Kuda-kuda kamu goyang.\", \"Atuh, jangan buru-buru.\"\n- Saat bercanda wajahnya tetap datar, membuat orang bingung.\n\n> \"Punten, kamu yang kemarin dipukuli di terminal? Kuda-kudamu goyang. Mau aku ajarin?\"\n> \"Di kota bintangnya sedikit, ya. Di desaku, kalau malam, langitnya penuh. Kamu harus lihat.\"\n\n## Kebiasaan & jadwal\n\n| Waktu | Hari sekolah | Akhir pekan |\n|---|---|---|\n| 04.30-06.00 | Latihan silat subuh di desa (luar peta) | Memandu turis di kebun teh (luar peta) |\n| 06.00-13.00 | Bus ke kota, SMK Pariwisata (luar sekolah pemain) | |\n| 13.30-16.00 | **Terminal bus & alun-alun** (terlihat di peta) menunggu bus pulang | Turnamen silat (sesekali, GOR kota) |\n| 16.00-17.00 | Melatih silat anak-anak di GOR kota (Selasa, Kamis) | |\n| 17.00 | Bus terakhir pulang ke desa | |\n\nKebiasaan: berdiri dengan kuda-kuda tanpa sadar, membungkuk sopan, membawa termos teh, menghafal jadwal bus.\n\n## Interaksi dengan pemain\n\n- Bertemu di Bab 3: Wulan menolong pemain yang dikeroyok preman terminal (tutorial jurus kuncian).\n- Jadi **guru silat**: latihan bareng di GOR menaikkan Kekuatan/Kelincahan dan membuka jurus spesial berantem\n  (\"Sapuan Kabut\", \"Kunci Daun Teh\").\n- Kencan terbatas oleh jadwal bus. Kencan spesial: perjalanan ke Desa Sukamekar (hari Minggu, luar peta, scene khusus).\n- Bantuan misi: di Bab 13 membawa murid perguruan menjaga sekolah saat penggusuran paksa.\n\n## Hubungan dengan tokoh lain\n\nKenal **Kirana** dari turnamen (saling menghormati), murid-murid kecilnya termasuk adik **Laras** (Doni). Kakeknya kenal\n**Pak Ujang** sejak muda. Pernah mengalahkan **Rio** (geng Bram) dalam satu jurus.\n\n## Event hati\n\n### 2 hati: \"Bus Terakhir\"\n- **Syarat**: 2 hati, 16.50, terminal bus.\n- **Adegan**: Bus terakhir ke Sukamekar mogok. Wulan bingung harus menginap di mana.\n- **Pilihan**: Tawarkan menginap di rumah Om Darto, tidur dengan Cici (+80) / Antar pakai sepeda/motor sampai desa\n  (perjalanan malam, +100, butuh kendaraan) / Pinjamkan uang ojek (+40).\n- **Hasil**: Wulan memberi tahu jadwal latihannya. Membuka \"Latihan silat bareng\".\n\n### 4 hati: \"Kabut Kebun Teh\"\n- **Syarat**: 4 hati, Minggu pagi, Desa Sukamekar (luar peta, scene perjalanan bus).\n- **Adegan**: Wulan mengajak pemain memetik teh lalu naik ke bukit saat kabut. Dia menunjuk jalan raya jauh di bawah.\n  \"Jalan itu ke mana aja, ya?\"\n- **Pilihan**: \"Ke mana pun kamu mau\" (+100) / \"Ke kota, ke tempatku\" (+80) / \"Ke kota yang berisik. Di sini lebih\n  enak\" (+40).\n- **Hasil**: kencan \"Desa Sukamekar\" terbuka, suling bambu dimainkan untuk pemain.\n\n### 6 hati: \"Turnamen Provinsi\"\n- **Syarat**: 6 hati, Bab 9, GOR kota.\n- **Adegan**: Kakek melarang Wulan menerima beasiswa silat ke luar provinsi. Di final, Wulan tidak fokus.\n- **Pilihan**: Teriak dari tribun \"Tarik napas dulu!\" (+100, Wulan menang) / Datangi kakeknya dan bicara (Nyali 6,\n  +80, kakek mengakui pemain sebagai murid) / Diam (+20, Wulan kalah).\n- **Hasil**: Wulan mengajarkan jurus pamungkas \"Bunga Teh Mekar\". Cemburu aktif.\n\n### 8 hati: \"Pendopo di Bawah Bulan\" (romance) / \"Saudara Seperguruan\" (sahabat)\n- **Syarat**: 8 hati, Gelang Benang, malam purnama, pendopo perguruan di Sukamekar.\n- **Adegan (romance)**: Wulan menantang sparring. Di akhir dia mengunci pemain, lalu tertawa pertama kalinya keras-keras:\n  \"Kamu kalah. Hukumannya... kamu harus nemenin aku lihat dunia.\"\n- **Pilihan**: Ikat gelang (pacaran) / Ikrar saudara seperguruan (sahabat, sabuk hijau untuk pemain).\n- **Hasil**: epilog LDR: Wulan berlatih di luar negeri, mengirim kartu pos dari tiap kota.\n\n## Contoh obrolan & reaksi\n\n| Situasi | Bubble / dialog |\n|---|---|\n| Sapaan | \"Punten. Sudah makan? Ini ada pepes.\" |\n| Pemain menang berantem bersih | `senyum` \"Kuda-kudanya sudah bagus.\" |\n| Pemain memukul lawan yang sudah jatuh | `marah` \"Itu bukan silat. Itu cuma marah.\" (-40) |\n| Pemain ketinggalan bus bareng dia | `tertawa` datar: \"Atuh, jalan kaki 40 kilo.\" |\n| Ulang tahun (1 Oktober, Hari Kesaktian) | Suka kado yang bisa dibawa bepergian |\n\n## Prompt portrait\n\n```\nTokoh: 16-year-old Sundanese Indonesian village girl, strong and lean, sun-darkened tan skin, very long thick black hair in\none heavy braid over the shoulder, large calm eyes, straight brows, wearing a black silat martial arts uniform (pangsi)\nwith a batik headband and a green tea-colored shawl. Calm, dignified look.\nKey colors tea green, wood brown, off-white.\n```\n"}, {"id": "20-dimas", "file": "20-dimas.md", "title": "20. Dimas Aditya", "md": "# 20. Dimas Aditya\n\n| | |\n|---|---|\n| Umur / kelas | 16, SMA 3 kelas X-3 |\n| Peran | Kapten basket, populer, ternyata pemalu dan takut gagal |\n| Tinggal | **Luar peta**: Asrama Batalyon di timur kota (ayahnya tentara). Terlihat di peta saat naik angkot dari gerbang timur |\n| Keluarga | Ayah sersan mayor (tegas), ibu guru TK, adik perempuan Dinda (10) |\n| Romance | Pemain cewek (sahabat untuk pemain cowok) |\n| Warna kunci | Biru royal `#2f5fb3`, putih, oranye bola `#e07b39` |\n| Gaya voxel | `short`, jersey basket biru nomor 11, sepatu tinggi |\n\n## Penampilan\n\nTinggi 1.36 (paling tinggi seangkatan), bahu lebar, kulit sawo matang, rambut cepak rapi gaya anak tentara dengan poni\nsedikit. Wajah ramah, telinga gampang merah. Selalu memakai deker lutut hitam di kaki kiri (cedera lama).\n\n## Pakaian\n\n| Situasi | Pakaian |\n|---|---|\n| Sekolah | Seragam rapi dimasukkan (kebiasaan rumah), jam tangan digital hitam, tas olahraga besar |\n| Basket | Jersey biru nomor 11, celana basket, sepatu basket putih-biru, headband putih |\n| Di rumah asrama | Kaus loreng hijau (bekas ayahnya), celana pendek |\n| Jalan-jalan | Hoodie biru polos, celana chino, sneakers putih bersih |\n| Acara resmi | Kemeja batik ayahnya yang terlalu besar di pinggang |\n| Hujan | Jaket parasut, bola dimasukkan ke kantong plastik |\n\n## Watak\n\n- Ramah, sopan, disiplin, populer tanpa berusaha.\n- Gugup luar biasa saat bicara dengan orang yang dia suka: tersandung, salah bicara.\n- **Kelemahan**: takut gagal karena tekanan ayahnya (\"Anak tentara tidak boleh kalah\").\n- **Rahasia**: sebenarnya ingin jadi guru olahraga SD, bukan masuk akademi militer.\n\n## Hobi & kesukaan\n\n- Hobi: basket, lari pagi, mengajari anak asrama main bola, memasak mi instan \"racikan\".\n- Makanan: mi rebus telur dobel, susu cokelat, pisang goreng.\n- Tempat favorit: lapangan basket sekolah, GOR kota, lapangan asrama saat subuh.\n\n| Kado | Item |\n|---|---|\n| Favorit (+80) | Bola basket kulit (Rp 70.000), sepatu basket bekas bagus |\n| Disukai (+45) | Susu cokelat, cokelat batang, headband, pisang goreng |\n| Biasa (+20) | Es kopi susu |\n| Dibenci (-40) | Buku tebal (\"Aku ketiduran nanti\"), barang mewah |\n\n## Cara bicara\n\n- Aku/kamu, sopan, \"siap\" kebiasaan rumah. Banyak \"eh, maksudnya...\" saat gugup.\n- Kata khas: \"Siap!\", \"Ayo latihan!\", \"Eh, maaf, maksudnya...\", \"Semangat!\"\n\n> \"Siap! Eh, maksudnya... iya, boleh. Mau main bareng?\"\n> \"Ayah bilang aku harus menang. Tapi kalau aku main buat anak-anak, rasanya aku udah menang duluan.\"\n\n## Kebiasaan & jadwal\n\n| Waktu | Hari sekolah | Akhir pekan |\n|---|---|---|\n| 05.00-06.00 | Lari pagi di asrama (luar peta) | Basket 3x3 Liga Minggu |\n| 06.30-14.00 | Kelas X-3, istirahat di lapangan basket | Melatih anak asrama |\n| 15.00-17.30 | Latihan basket (Senin, Selasa, Kamis) | GOR kota |\n| 17.30 | Angkot ke timur, menghilang dari peta | |\n\nKebiasaan: memutar bola di jari saat bicara, menggaruk tengkuk saat malu, membungkuk kecil ke guru.\n\n## Interaksi dengan pemain\n\n- Hati naik dari basket 3x3 bareng, menonton pertandingan, membawakan susu cokelat, membantu belajar (nilai Dimas jelek).\n- Pemain bisa jadi manajer tim basket: membuka mini game \"Strategi Pertandingan\".\n- Bantuan misi: di Bab 13 mengajak anak-anak asrama dan kenalan ayahnya membantu menjaga ketertiban saat aksi damai.\n\n## Hubungan dengan tokoh lain\n\nSahabat **Tegar** sejak SMP, rival-teman **Bram** (Bram juga pemain basket), dilatih **Pak Hendro**. Semua cewek di\nkelas X-3 naksir dia, termasuk teman Sekar.\n\n## Event hati\n\n### 2 hati: \"Bola Nyasar\"\n- **Syarat**: 2 hati, istirahat kedua, lapangan basket.\n- **Adegan**: Bola Dimas mengenai kepala pemain. Dia panik, minta maaf terus-menerus.\n- **Pilihan**: Tertawa dan lempar balik dengan three-point (mini game, +80 kalau masuk) / \"Nggak apa-apa\" (+50) /\n  Marah (-20, tapi Dimas jadi makin perhatian, +30 besoknya).\n- **Hasil**: membuka \"Main basket bareng\".\n\n### 4 hati: \"Lutut Kiri\"\n- **Syarat**: 4 hati, sore setelah latihan, ruang UKS.\n- **Adegan**: Dimas mengompres lutut sendirian, menyembunyikan cedera dari pelatih.\n- **Pilihan**: Bantu kompres dan janji rahasia (+80) / Lapor Pak Hendro \"demi kebaikan kamu\" (+60 setelah Dimas\n  tenang; awalnya `marah`) / Abaikan (-20).\n- **Hasil**: kencan \"Lari pagi\" dan \"Nonton pertandingan\" terbuka.\n\n### 6 hati: \"Final yang Hilang\"\n- **Syarat**: 6 hati, Bab 9 (kelas XI), GOR kota.\n- **Adegan**: Lutut Dimas cedera berat di final. Ayahnya di tribun hanya berkata \"Bangun.\"\n- **Pilihan**: Turun ke lapangan dan menemani di bangku cadangan (+100) / Bicara pada ayahnya (Nyali 6, +80, ayahnya\n  akhirnya menepuk bahu Dimas) / Teriakkan semangat (+50).\n- **Hasil**: Dimas absen sebulan. Selama itu dia mengajari anak SD, menyadari cita-citanya. Cemburu aktif.\n\n### 8 hati: \"Lapangan Asrama Subuh\" (romance) / \"Pelatih & Asisten\" (sahabat)\n- **Syarat**: 8 hati, Gelang Benang, Minggu subuh, lapangan asrama (luar peta, scene khusus).\n- **Adegan (romance)**: Dimas sudah bisa berlari lagi. Dia menembak bola, masuk, lalu berbalik sangat gugup: \"Kalau\n  masuk, aku mau bilang sesuatu. Udah masuk. Jadi... aku suka kamu. Siap ditolak!\"\n- **Pilihan**: Ikat gelang (pacaran) / Jadi asisten pelatih di sekolah bola anak-anaknya (sahabat).\n- **Hasil**: epilog Dimas kuliah PGSD olahraga, melatih tim SD yang menang turnamen kota.\n\n## Contoh obrolan & reaksi\n\n| Situasi | Bubble / dialog |\n|---|---|\n| Sapaan | \"Siap! Eh, pagi!\" |\n| Pemain menang mini game Penjaskes | `tertawa` \"Wah, kamu masuk tim aja!\" |\n| Pemain bolos | `cemas` \"Nanti dicariin Pak Wawan lho...\" |\n| Pemain dipalak Bram | `marah`, berdiri di depan pemain (kecuali kalah jumlah) |\n| Ulang tahun (5 Oktober, HUT TNI) | Ayahnya tidak pernah ingat karena sibuk upacara; dia senang diberi kue kecil |\n\n## Prompt portrait\n\n```\nTokoh: 16-year-old tall Indonesian boy, broad shoulders, warm brown skin, neat military-style short haircut with a small\nfringe, friendly face with ears that blush easily, royal blue basketball jersey number 11 over a white t-shirt, white\nsweatband on the wrist. Kind, shy athlete look. Key colors royal blue, white, basketball orange.\n```\n"}, {"id": "21-arga", "file": "21-arga.md", "title": "21. Arga", "md": "# 21. Arga\n\n| | |\n|---|---|\n| Umur / kelas | 16, SMA 3 kelas X-1 |\n| Peran | Anggota muda Lampu Kota, pendiam, cucu Pak Ujang penjaga sekolah |\n| Tinggal | **Dalam peta**: Kawasan Sekolah, rumah dinas kecil penjaga sekolah di belakang Gedung Lama |\n| Keluarga | Kakek Pak Ujang. Orang tua meninggal kecelakaan bus saat Arga 7 tahun |\n| Romance | Pemain cewek |\n| Warna kunci | Cokelat kulit `#5a3a28`, abu asap `#7b7f86`, kuning lampu `#f3c44a` |\n| Gaya voxel | `buzz`, jaket kulit cokelat tua, motor tua |\n\n## Penampilan\n\nTinggi 1.32, ramping berotot, kulit sawo matang gelap. Rambut cepak buzz cut, bekas luka tipis di alis kanan yang memotong\nalisnya. Mata sayu gelap yang selalu waspada. Jarang tersenyum, tapi saat tersenyum lesung pipit muncul di kiri.\n\n## Pakaian\n\n| Situasi | Pakaian |\n|---|---|\n| Sekolah | Seragam dikeluarkan, lengan digulung, jaket kulit cokelat warisan ayahnya, sepatu boots hitam |\n| Lampu Kota | Jaket hitam berlis kuning Lampu Kota, sarung tangan tanpa jari, helm retro |\n| Membantu kakek | Kaus abu, celana kerja, sapu dan kunci-kunci di pinggang |\n| Di rumah | Saru
