/* =====================================================================
   2. MEMBANGUN SLICE
   Model = grid voxel L×W×H. Slice ke-z = gambar tampak-atas dari lapisan z.
   Untuk model dari 4 sisi: voxel ada jika SEMUA tampak punya piksel di situ
   ("carving"). Warna diambil dari tampak yang benar-benar terlihat.
   ===================================================================== */
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

// Generic: solid(x,y,z) -> bool, color(x,y,z,exp) -> css color
function buildModel(L, W, H, solid, color) {
  const S = (x, y, z) => x >= 0 && y >= 0 && z >= 0 && x < L && y < W && z < H && solid(x, y, z);
  const slices = [];
  const shadow = makeCanvas(L, W), sctx = shadow.getContext('2d');
  sctx.fillStyle = '#000';
  for (let z = 0; z < H; z++) {
    const c = makeCanvas(L, W), ctx = c.getContext('2d');
    let any = false;
    for (let y = 0; y < W; y++) for (let x = 0; x < L; x++) {
      if (!S(x, y, z)) continue;
      const exp = {
        top: !S(x, y, z + 1),
        xp: !S(x + 1, y, z), xn: !S(x - 1, y, z),
        yp: !S(x, y + 1, z), yn: !S(x, y - 1, z),
      };
      const col = color(x, y, z, exp);
      if (!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(x, y, 1, 1);
      sctx.fillRect(x, y, 1, 1);
      any = true;
    }
    slices.push(c);
  }
  return { L, W, H, slices, shadow };
}

// warp(x,y,z) -> x sumber: dipakai untuk animasi (menggeser kaki/tangan per frame)
function buildFromViews(v, pal = PAL, warp = null) {
  const L = v.top[0].length, W = v.top.length, H = v.side.length;
  const sx = warp || ((x) => x);
  const at = (rows, r, c) => (rows[r] && rows[r][c]) || '.';
  const top   = (x, y)    => at(v.top, y, x);
  const side  = (x, z)    => at(v.side, H - 1 - z, x);
  const front = (y, z)    => at(v.front, H - 1 - z, W - 1 - y); // dilihat dari depan: kiri pengamat = kanan mobil
  const back  = (y, z)    => at(v.back, H - 1 - z, y);
  const solid0 = (x, y, z) => top(x, y) !== '.' && side(x, z) !== '.' && front(y, z) !== '.' && back(y, z) !== '.';
  const solid = (x, y, z) => solid0(sx(x, y, z), y, z);
  const color = (x0, y, z, e) => {
    const x = sx(x0, y, z);
    let ch;
    if (e.yp || e.yn)      ch = side(x, z);   // tepi kiri/kanan -> warna tampak samping
    else if (e.xp)         ch = front(y, z);  // tepi depan
    else if (e.xn)         ch = back(y, z);   // tepi belakang
    else if (e.top)        ch = top(x, y);    // permukaan atas -> warna tampak atas
    else                   ch = side(x, z);   // bagian dalam (hampir tak terlihat)
    return pal[ch] || pal.K;
  };
  const m = buildModel(L, W, H, solid, color);
  m.views = v;
  return m;
}

// ---------- Model prosedural lain (pohon, cone, tumpukan ban) ----------
function hash(x, y, z) {
  let h = (x * 374761393 + y * 668265263 + z * 2147483647) | 0;
  h = (h ^ (h >>> 13)) * 1274126177;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}

function makeTree(seed) {
  const N = 17, H = 22, c = (N - 1) / 2;
  const radius = z => {
    if (z < 4) return 1.4;
    const t = (z - 4) / (H - 4);
    const tier = 1 - ((z - 4) % 6) / 9;
    return Math.max(0.6, (1 - t) * 7.8 * tier + 0.5);
  };
  return buildModel(N, N, H,
    (x, y, z) => {
      const d = Math.hypot(x - c, y - c);
      return d <= radius(z) + (z >= 4 ? (hash(x + seed, y, z) - 0.5) * 0.9 : 0);
    },
    (x, y, z, e) => {
      if (z < 4) return e.top ? '#6b4a2b' : '#4a301b';
      const n = hash(x, y + seed, z);
      if (!e.top && (e.xp || e.xn || e.yp || e.yn)) return n < 0.5 ? '#1e5a2c' : '#174a24';
      return n < 0.3 ? '#4fa64a' : n < 0.8 ? '#3b8f3c' : '#2f7734';
    });
}

function makeCone() {
  const N = 7, H = 9, c = 3;
  return buildModel(N, N, H,
    (x, y, z) => z === 0 ? true : Math.hypot(x - c, y - c) <= 3.1 - z * 0.33,
    (x, y, z, e) => {
      if (z === 0) return e.xp || e.xn || e.yp || e.yn ? '#a8401a' : '#d9561f';
      if (z === 4 || z === 5) return e.top ? '#ffffff' : '#c9c9c9';
      return e.top ? '#ff7a2e' : '#d9561f';
    });
}

function makeTires() {
  const N = 11, H = 9, c = 5;
  return buildModel(N, N, H,
    (x, y, z) => { const d = Math.hypot(x - c, y - c); return d <= 5.2 && d >= 2.2; },
    (x, y, z, e) => {
      const band = Math.floor(z / 3) % 2;
      if (e.top) return band ? '#e8e8e8' : '#d33b3b';
      return band ? '#9a9a9a' : '#922828';
    });
}

const CAR = buildFromViews(CAR_VIEWS);
CAR.views = CAR_VIEWS; CAR.pal = PAL;

// Animasi jalan: 4 frame. Kaki kiri/kanan dan tangan diayun berlawanan arah (geser x).
// o = { legTop, armTop, armBot, mid, armL, armR, amp }
function makeWalkFrames(views, pal, o) {
  return [0, 1, 0, -1].map(swing => {
    const m = buildFromViews(views, pal, (x, y, z) => {
      const left = y < o.mid ? 1 : -1;
      if (z <= o.legTop)                      // kaki: makin bawah makin jauh
        return x - Math.round(swing * left * o.amp * (o.legTop + 1 - z) / (o.legTop + 1));
      if (z >= o.armBot && z <= o.armTop && (y <= o.armL || y >= o.armR))  // tangan
        return x + Math.round(swing * left * o.amp * (o.armTop + 1 - z) / (o.armTop + 1 - o.armBot));
      return x;
    });
    m.pal = pal;
    return m;
  });
}
const ROBOT_FRAMES = makeWalkFrames(ROBOT_VIEWS, ROBOT_PAL, { legTop: 7, armBot: 8, armTop: 13, mid: 7, armL: 2, armR: 11, amp: 2 });
/* ---------- Manusia organik: dibangun dari bentuk bulat, bukan dari 4 gambar ----------
   Tiap voxel diisi material lewat fungsi bentuk (bola, elipsoid, kapsul).
   Normal permukaan dihitung dari tetangga kosong, lalu diberi cahaya dan
   dikuantisasi ke 4 tingkat warna (ramp) supaya tetap terlihat pixel art. */
const RAMPS = {
  skin:  ['#a8624c', '#d99a78', '#f3c4a0', '#ffe2c8'],
  hair:  ['#24140d', '#43281a', '#673f27', '#8c5a38'],
  shirt: ['#6e1a26', '#b0303a', '#d9514e', '#f27d6a'],
  pants: ['#1b2550', '#2c4183', '#3f5fae', '#5a80cc'],
  shoe:  ['#161112', '#2e2220', '#4a3731', '#665048'],
  eye:   ['#141420', '#141420', '#1e1e30', '#2a2a40'],
  blush: ['#c96d62', '#e88a7c', '#f5a092', '#f5a092'],
  blade: ['#7d8794', '#b4bfcc', '#dde5ee', '#ffffff'],
  hilt:  ['#5a3a12', '#8a5a1c', '#c08a2a', '#e8b84a'],
  orb:   ['#49b8ff', '#7fd6ff', '#bff0ff', '#ffffff'],
};
const LIGHT = (() => { const v = [0.35, -0.45, 0.82], l = Math.hypot(...v); return v.map(c => c / l); })();

function segDist(p, a, b) {          // jarak titik ke ruas garis + posisi t (0..1)
  const ab = [b[0] - a[0], b[1] - a[1], b[2] - a[2]], ap = [p[0] - a[0], p[1] - a[1], p[2] - a[2]];
  const t = Math.max(0, Math.min(1, (ap[0] * ab[0] + ap[1] * ab[1] + ap[2] * ab[2]) / (ab[0] ** 2 + ab[1] ** 2 + ab[2] ** 2)));
  return [Math.hypot(ap[0] - ab[0] * t, ap[1] - ab[1] * t, ap[2] - ab[2] * t), t];
}
const capsule = (p, a, b, r0, r1) => { const [d, t] = segDist(p, a, b); return d <= r0 + (r1 - r0) * t ? t : -1; };
const ellip = (p, c, rx, ry, rz) => ((p[0] - c[0]) / rx) ** 2 + ((p[1] - c[1]) / ry) ** 2 + ((p[2] - c[2]) / rz) ** 2;

/* ---------- Rangka (skeleton) manusia ----------
   Pose = sudut sendi. Sudut tungkai diukur di bidang depan-atas:
   0 = lurus ke bawah, +π/2 = lurus ke depan, π = lurus ke atas, negatif = ke belakang.
   L = kiri (y kecil), R = kanan. Semua gerakan RPG hanyalah kumpulan pose ini. */
const HL = 26, HW = 18, HH = 30;                     // ukuran grid voxel manusia
const POSE0 = {
  lean: 0.03,  // condong badan (+ ke depan)
  hp: 0,       // kepala menunduk/mendongak relatif badan
  thL: 0, thR: 0, knL: 0.1, knR: 0.1,              // paha & tekukan lutut
  arL: 0.08, arR: 0.08, elL: 0.25, elR: 0.25,      // lengan atas & tekukan siku
  spL: 0.12, spR: 0.12,                            // lengan membuka ke samping
  tw: 0,       // putar bahu (pukulan)
  px: 0,       // geser badan maju/mundur di dalam grid
  jump: 0,     // tinggi lompat (voxel) -> digambar oleh renderer, bukan di voxel
  sword: 0, swa: 0,   // pedang & sudut pedang relatif lengan bawah
  orb: 0,      // radius bola sihir
};
const limb = a => [Math.sin(a), 0, -Math.cos(a)];
const add = (a, b, k = 1) => [a[0] + b[0] * k, a[1] + b[1] * k, a[2] + b[2] * k];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];

function humanShape(P) {
  P = Object.assign({}, POSE0, P);
  const cy = HW / 2;
  const up = [Math.sin(P.lean), 0, Math.cos(P.lean)], fwd = [Math.cos(P.lean), 0, -Math.sin(P.lean)];
  const pelvis = [HL / 2 - 1 + P.px, cy, 0];
  const neck = add(pelvis, up, 7.8);
  const J = { pelvis, neck };
  const ha = P.lean + P.hp;
  const hu = [Math.sin(ha), 0, Math.cos(ha)], hf = [Math.cos(ha), 0, -Math.sin(ha)];
  J.head = add(neck, hu, 4.6);
  J.arms = [-1, 1].map(s => {
    const S = s < 0 ? 'L' : 'R', a = P['ar' + S], el = P['el' + S], sp = P['sp' + S];
    const sh = add(add(pelvis, up, 6.6), [-s * 3.3 * Math.sin(P.tw), s * 3.3 * Math.cos(P.tw), 0]);
    const dir = (ang, b) => [Math.sin(ang) * Math.cos(b), s * Math.sin(b), -Math.cos(ang) * Math.cos(b)];
    const elbow = add(sh, dir(a, sp), 3.3);
    const hand = add(elbow, dir(a + el, sp * 0.5), 3.1);
    return { sh, elbow, hand, fa: a + el };
  });
  J.legs = [-1, 1].map(s => {
    const S = s < 0 ? 'L' : 'R', th = P['th' + S], kn = P['kn' + S];
    const hip = add(add(pelvis, up, -0.3), [0, s * 1.7, 0]);
    const knee = add(hip, limb(th), 4.4);
    const ankle = add(knee, limb(th - kn), 4.3);
    const toe = add(ankle, limb(th - kn + Math.PI / 2), 1.7);
    return { hip, knee, ankle, toe };
  });
  // Grounding: geser seluruh badan supaya titik terendah tepat menyentuh tanah (z=0)
  const pts = [[pelvis, 2.4], [neck, 2.4], [J.head, 4.0]];
  for (const a of J.arms) pts.push([a.elbow, 1.2], [a.hand, 1.25]);
  for (const l of J.legs) pts.push([l.knee, 1.5], [l.ankle, 1.25], [l.toe, 1.15]);
  const shift = -Math.min(...pts.map(([p, r]) => p[2] - r));
  const all = [pelvis, neck, J.head];
  for (const a of J.arms) all.push(a.sh, a.elbow, a.hand);
  for (const l of J.legs) all.push(l.hip, l.knee, l.ankle, l.toe);
  for (const p of all) p[2] += shift;

  const R = J.arms[1];
  const bladeDir = limb(R.fa + P.swa);
  const orbC = add(add(J.arms[0].hand, J.arms[1].hand), [0, 0, 0], 1).map(v => v / 2);
  const orbPos = add(orbC, fwd, 2.2);

  const mat = (x, y, z) => {
    const p = [x + 0.5, y + 0.5, z + 0.5];
    if (P.orb > 0 && ellip(p, orbPos, P.orb, P.orb, P.orb) <= 1) return 'orb';
    if (P.sword) {
      if (capsule(p, add(R.hand, bladeDir, -1.2), add(R.hand, bladeDir, 1.0), 0.65, 0.65) >= 0) return 'hilt';
      if (capsule(p, add(R.hand, bladeDir, 1.0), add(R.hand, bladeDir, 1.6), 1.6, 1.6) >= 0 && Math.abs(dot([p[0] - R.hand[0], 0, p[2] - R.hand[2]], bladeDir) - 1.3) < 0.5) return 'hilt';
      if (capsule(p, add(R.hand, bladeDir, 1.6), add(R.hand, bladeDir, 11), 1.0, 0.55) >= 0) return 'blade';
    }
    for (const l of J.legs) if (capsule(p, l.ankle, l.toe, 1.3, 1.15) >= 0) return 'shoe';
    // kepala + rambut (koordinat lokal kepala, ikut menunduk/mendongak)
    const v = [p[0] - J.head[0], p[1] - J.head[1], p[2] - J.head[2]];
    const dx = dot(v, hf), dy = v[1], dz = dot(v, hu);
    const inHead = (dx / 3.9) ** 2 + (dy / 3.7) ** 2 + (dz / 4.0) ** 2 <= 1;
    const face = dx > 0.6 && dz < 1.4 && dz > -3.6 && Math.abs(dy) < 3.0;
    if (inHead) {
      if (!face) return 'hair';
      if (dx > 2.3 && Math.abs(dz - 0.1) < 0.75 && Math.abs(Math.abs(dy) - 1.5) < 0.55) return 'eye';
      if (dx > 2.0 && Math.abs(dz + 1.0) < 0.5 && Math.abs(Math.abs(dy) - 2.2) < 0.6) return 'blush';
      return 'skin';
    }
    if (!face && ((dx + 0.4) / 4.5) ** 2 + (dy / 4.3) ** 2 + ((dz - 0.2) / 4.4) ** 2 <= 1 && dz > -3.2) return 'hair';
    for (const a of J.arms) {
      if (ellip(p, a.hand, 1.3, 1.25, 1.3) <= 1) return 'skin';
      const t1 = capsule(p, a.sh, a.elbow, 1.35, 1.15);
      if (t1 >= 0) return t1 < 0.7 ? 'shirt' : 'skin';
      if (capsule(p, a.elbow, a.hand, 1.15, 1.0) >= 0) return 'skin';
    }
    // badan: penampang elips (lebar ke samping), sumbu mengikuti condong badan
    const w = [p[0] - pelvis[0], p[1] - pelvis[1], p[2] - pelvis[2]];
    const t = (dot(w, up) + 1.0) / 9;
    if (t >= 0 && t <= 1) {
      let ry = 2.6 + 0.9 * t, rx = 1.9 + 0.35 * t;
      if (t > 0.72) { const k = Math.sqrt(Math.max(0, 1 - ((t - 0.72) / 0.3) ** 2)); ry *= 0.55 + 0.45 * k; rx *= 0.6 + 0.4 * k; }
      if ((dot(w, fwd) / rx) ** 2 + (w[1] / ry) ** 2 <= 1) return t < 0.2 ? 'pants' : 'shirt';
    }
    if (capsule(p, add(neck, up, -0.6), add(neck, hu, 1.4), 1.1, 1.1) >= 0) return 'skin';
    for (const l of J.legs) {
      if (capsule(p, l.hip, l.knee, 1.65, 1.4) >= 0) return 'pants';
      if (capsule(p, l.knee, l.ankle, 1.4, 1.2) >= 0) return 'pants';
    }
    return null;
  };
  mat.lift = P.jump;
  return mat;
}

const TAU = Math.PI * 2;
function keyed(keys) {
  // tiap key mewarisi key sebelumnya, jadi cukup tulis sendi yang berubah
  let acc = Object.assign({}, POSE0);
  const full = keys.map(([t, p]) => [t, acc = Object.assign({}, acc, p)]);
  return t => {
    let i = 0;
    while (i < full.length - 2 && t > full[i + 1][0]) i++;
    const [t0, a] = full[i], [t1, b] = full[i + 1];
    let u = Math.max(0, Math.min(1, (t - t0) / (t1 - t0 || 1)));
    u = u * u * (3 - 2 * u);
    const o = {};
    for (const k in a) o[k] = a[k] + (b[k] - a[k]) * u;
    return o;
  };
}

// Frame dibangun saat pertama dipakai (lalu disimpan)
const animCache = {};
function getAnim(name) {
  if (animCache[name]) return animCache[name];
  const A = ANIMS[name];
  return animCache[name] = [...Array(A.n).keys()].map(i => {
    const t = A.loop ? i / A.n : i / (A.n - 1);
    const mat = humanShape(A.pose(t));
    const m = buildOrganic(HL, HW, HH, mat, name === 'idle' && i === 0);
    m.lift = mat.lift || 0;
    return m;
  });
}

function buildOrganic(L, W, H, mat, withViews = false) {
  const grid = new Array(L * W * H);
  const idx = (x, y, z) => (z * W + y) * L + x;
  for (let z = 0; z < H; z++) for (let y = 0; y < W; y++) for (let x = 0; x < L; x++) grid[idx(x, y, z)] = mat(x, y, z);
  const at = (x, y, z) => (x < 0 || y < 0 || z < 0 || x >= L || y >= W || z >= H) ? null : grid[idx(x, y, z)];
  // normal = rata-rata arah ke tetangga kosong (radius 2) -> permukaan terasa halus
  const shade = (x, y, z, m) => {
    // voxel yang tertutup di 6 sisi tak terlihat -> tak perlu dihitung
    if (at(x + 1, y, z) && at(x - 1, y, z) && at(x, y + 1, z) && at(x, y - 1, z) && at(x, y, z + 1) && at(x, y, z - 1)) return RAMPS[m][1];
    let nx = 0, ny = 0, nz = 0;
    for (let k = -2; k <= 2; k++) for (let j = -2; j <= 2; j++) for (let i = -2; i <= 2; i++)
      if (!at(x + i, y + j, z + k)) { const w = 1 / (i * i + j * j + k * k || 1); nx += i * w; ny += j * w; nz += k * w; }
    const l = Math.hypot(nx, ny, nz) || 1;
    const d = (nx * LIGHT[0] + ny * LIGHT[1] + nz * LIGHT[2]) / l;
    const v = 0.38 + 0.62 * Math.max(0, d);
    return RAMPS[m][v < 0.5 ? 0 : v < 0.72 ? 1 : v < 0.9 ? 2 : 3];
  };
  const m = buildModel(L, W, H, (x, y, z) => !!at(x, y, z), (x, y, z) => shade(x, y, z, at(x, y, z)));
  if (!withViews) return m;
  // tampak 4 sisi diproyeksikan dari voxel (untuk tutorial)
  const proj = (w, h, fn) => {
    const c = makeCanvas(w, h), g = c.getContext('2d');
    for (let v = 0; v < h; v++) for (let u = 0; u < w; u++) { const col = fn(u, v); if (col) { g.fillStyle = col; g.fillRect(u, v, 1, 1); } }
    return c;
  };
  const first = (cells) => { for (const [x, y, z] of cells) { const mm = at(x, y, z); if (mm) return shade(x, y, z, mm); } return null; };
  const range = (n, rev) => [...Array(n).keys()].map(i => rev ? n - 1 - i : i);
  m.vc = {
    top:   proj(L, W, (x, y) => first(range(H, true).map(z => [x, y, z]))),
    side:  proj(L, H, (x, r) => first(range(W).map(y => [x, y, H - 1 - r]))),
    front: proj(W, H, (c, r) => first(range(L, true).map(x => [x, W - 1 - c, H - 1 - r]))),
    back:  proj(W, H, (c, r) => first(range(L).map(x => [x, c, H - 1 - r]))),
  };
  return m;
}

/* =====================================================================
   3. RENDER: inti sprite stacking.
   Gambar slice dari bawah ke atas, tiap slice digeser `spacing` px ke atas
   layar, semuanya diputar dengan sudut yang sama di sekitar pusatnya.
   ===================================================================== */
function drawStack(ctx, model, x, y, angle, spacing = 1, scale = 1) {
  // model.lift: tinggi lompat; seluruh tumpukan naik, bayangan tetap di tanah
  const sx = Math.round(x), sy = Math.round(y - (model.lift || 0) * spacing * scale);
  for (let i = 0; i < model.slices.length; i++) {
    ctx.save();
    ctx.translate(sx, sy - i * spacing * scale);
    ctx.rotate(angle);
    ctx.scale(scale, scale);
    ctx.drawImage(model.slices[i], -model.L / 2, -model.W / 2);
    ctx.restore();
  }
}

function drawShadow(ctx, model, x, y, angle, scale = 1) {
  ctx.save();
  ctx.globalAlpha = 0.28;
  ctx.translate(Math.round(x) + 2 * scale, Math.round(y) + 2 * scale);
  ctx.rotate(angle);
  ctx.scale(scale, scale);
  ctx.drawImage(model.shadow, -model.L / 2, -model.W / 2);
  ctx.restore();
}

const WW = 760, WH = 560;           // ukuran dunia (piksel low-res)
const TRACK_W = 46;
const ground = makeCanvas(WW, WH), gctx = ground.getContext('2d');
const surf = new Uint8Array(WW * WH); // 0 rumput, 1 aspal, 2 curb

const ctrl = [[130, 130], [380, 85], [620, 120], [690, 260], [610, 430], [470, 360], [340, 470], [150, 440], [85, 290]];
function spline(pts, steps) {
  const out = [], n = pts.length;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    for (let s = 0; s < steps; s++) {
      const t = s / steps, t2 = t * t, t3 = t2 * t;
      out.push([0, 1].map(k => 0.5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3)));
    }
  }
  return out;
}
const path = spline(ctrl, 24);

function buildGround() {
  // Gambar dengan warna "kunci", lalu kuantisasi per piksel supaya tetap tajam (pixel-art)
  gctx.fillStyle = '#00ff00'; gctx.fillRect(0, 0, WW, WH);
  const stroke = (w, col, dash) => {
    gctx.beginPath();
    path.forEach(([x, y], i) => i ? gctx.lineTo(x, y) : gctx.moveTo(x, y));
    gctx.closePath();
    gctx.lineWidth = w; gctx.strokeStyle = col; gctx.lineJoin = 'round';
    gctx.setLineDash(dash || []); gctx.stroke();
  };
  stroke(TRACK_W + 10, '#ffffff');
  stroke(TRACK_W + 10, '#ff0000', [7, 7]);
  stroke(TRACK_W, '#000000');
  gctx.setLineDash([]);

  const img = gctx.getImageData(0, 0, WW, WH), d = img.data;
  for (let i = 0, p = 0; i < d.length; i += 4, p++) {
    const r = d[i], g = d[i + 1], b = d[i + 2];
    const x = p % WW, y = (p / WW) | 0, n = hash(x, y, 3);
    let col, s;
    if (g > 150 && r < 120) { s = 0; col = n < 0.12 ? [92, 170, 62] : n < 0.55 ? [70, 148, 52] : n < 0.93 ? [60, 132, 46] : [44, 108, 38]; }
    else if (r > 200 && g > 200) { s = 2; col = [240, 240, 240]; }
    else if (r > 150) { s = 2; col = [214, 48, 48]; }
    else { s = 1; col = n < 0.15 ? [74, 74, 80] : n < 0.9 ? [62, 62, 68] : [52, 52, 58]; }
    surf[p] = s; d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = 255;
  }
  // Garis start kotak-kotak
  const [ax, ay] = path[0], [bx, by] = path[1];
  const tl = Math.hypot(bx - ax, by - ay), tx = (bx - ax) / tl, ty = (by - ay) / tl;
  for (let u = -TRACK_W / 2; u < TRACK_W / 2; u++) for (let v = 0; v < 6; v++) {
    const x = Math.round(ax - ty * u + tx * v), y = Math.round(ay + tx * u + ty * v);
    const k = (y * WW + x) * 4;
    const c = ((Math.floor((u + 100) / 3) + Math.floor(v / 3)) % 2) ? 240 : 25;
    d[k] = d[k + 1] = d[k + 2] = c;
  }
  gctx.putImageData(img, 0, 0);
}
buildGround();

(function placeObjects() {
  const nearTrack = (x, y, r) => {
    for (const [px, py] of path) if (Math.hypot(px - x, py - y) < r) return true;
    return false;
  };
  let tries = 0;
  while (objects.filter(o => o.kind === 'tree').length < 55 && tries++ < 4000) {
    const x = 10 + hash(tries, 1, 9) * (WW - 20), y = 14 + hash(tries, 2, 9) * (WH - 20);
    if (nearTrack(x, y, TRACK_W / 2 + 14)) continue;
    if (objects.some(o => Math.hypot(o.x - x, o.y - y) < 18)) continue;
    objects.push({ kind: 'tree', model: MODELS.tree[tries % 3], x, y, a: hash(tries, 3, 9) * 6.28, r: 4 });
  }
  // Cone di sisi dalam tikungan, tumpukan ban di sisi luar
  for (let i = 12; i < path.length; i += 34) {
    const [x0, y0] = path[i], [x1, y1] = path[(i + 1) % path.length];
    const l = Math.hypot(x1 - x0, y1 - y0), nx = -(y1 - y0) / l, ny = (x1 - x0) / l;
    const off = TRACK_W / 2 + 12;
    objects.push({ kind: 'cone', model: MODELS.cone, x: x0 + nx * off, y: y0 + ny * off, a: 0, r: 3 });
    objects.push({ kind: 'tires', model: MODELS.tires, x: x0 - nx * off, y: y0 - ny * off, a: 0, r: 5 });
  }
})();

const car = { x: path[2][0], y: path[2][1], a: Math.atan2(path[3][1] - path[2][1], path[3][0] - path[2][0]), vx: 0, vy: 0 };
const cam = { x: car.x, y: car.y, a: car.a + Math.PI / 2 };
const keys = { up: false, down: false, left: false, right: false, run: false };
const opts = { rotCam: false, shadow: true, spacing: 1, char: 'car' };
const bot = { x: 0, y: 0, a: 0, walk: 0, speed: 0, mode: 'stand', action: null, at: 0, phase: 0, anim: 'idle', frame: 0 };

const gameCanvas = document.getElementById('game'), ctx = gameCanvas.getContext('2d');
let VW = 240, VH = 320;
function resizeGame() {
  const w = innerWidth, h = innerHeight;
  const px = Math.max(1, Math.round(Math.min(w, h) / 210));
  VW = Math.ceil(w / px); VH = Math.ceil(h / px);
  gameCanvas.width = VW; gameCanvas.height = VH;
  gameCanvas.style.width = VW * px + 'px'; gameCanvas.style.height = VH * px + 'px';
}
addEventListener('resize', () => { resizeGame(); resizeTut(); });
resizeGame();

function surfAt(x, y) {
  x |= 0; y |= 0;
  if (x < 0 || y < 0 || x >= WW || y >= WH) return 0;
  return surf[y * WW + x];
}

function update(dt) {
  if (WALKERS[opts.char]) return updateRobot(dt);
  const fx = Math.cos(car.a), fy = Math.sin(car.a);
  let fwd = car.vx * fx + car.vy * fy;         // kecepatan maju
  let lat = -car.vx * fy + car.vy * fx;        // kecepatan menyamping (drift)
  const s = surfAt(car.x, car.y);
  const grass = s === 0;

  if (keys.up) fwd += (grass ? 90 : 150) * dt;
  if (keys.down) fwd -= (fwd > 0 ? 220 : 70) * dt;
  const maxF = grass ? 55 : 125;
  fwd = Math.max(-40, Math.min(maxF + (fwd > maxF ? (fwd - maxF) * 0.97 : 0), fwd));
  fwd *= Math.pow(grass ? 0.35 : 0.72, dt);
  lat *= Math.pow(grass ? 0.02 : 0.004, dt);    // grip ban

  const steer = (keys.right - keys.left);
  const turnRate = 2.6 * Math.min(1, Math.abs(fwd) / 45) * Math.sign(fwd || 1);
  car.a += steer * turnRate * dt;
  // efek drift: setir menambah slip menyamping
  lat -= steer * Math.abs(fwd) * 0.45 * dt * (keys.up ? 1.6 : 1);

  const nx = Math.cos(car.a), ny = Math.sin(car.a);
  car.vx = nx * fwd - ny * lat;
  car.vy = ny * fwd + nx * lat;
  car.x += car.vx * dt; car.y += car.vy * dt;

  // batas dunia & tabrakan sederhana
  car.x = Math.max(8, Math.min(WW - 8, car.x));
  car.y = Math.max(8, Math.min(WH - 8, car.y));
  for (const o of objects) {
    const dx = car.x - o.x, dy = car.y - o.y, dist = Math.hypot(dx, dy), min = o.r + 7;
    if (dist < min && dist > 0) {
      car.x = o.x + dx / dist * min; car.y = o.y + dy / dist * min;
      const vn = (car.vx * dx + car.vy * dy) / dist;
      if (vn < 0) { car.vx -= 1.5 * vn * dx / dist; car.vy -= 1.5 * vn * dy / dist; }
    }
  }

  // jejak ban saat drift
  if (Math.abs(lat) > 18 && !grass) {
    gctx.fillStyle = 'rgba(25,25,28,0.55)';
    for (const side of [-5, 5]) {
      const wx = car.x - nx * 8 - ny * side, wy = car.y - ny * 8 + nx * side;
      gctx.fillRect(wx | 0, wy | 0, 1, 1);
    }
  }

  // kamera
  const k = 1 - Math.pow(0.0005, dt);
  cam.x += (car.x + car.vx * 0.35 - cam.x) * k;
  cam.y += (car.y + car.vy * 0.35 - cam.y) * k;
  const target = opts.rotCam ? car.a + Math.PI / 2 : 0;
  let da = target - cam.a;
  da = Math.atan2(Math.sin(da), Math.cos(da));
  cam.a += da * (1 - Math.pow(0.02, dt));
  if (!opts.rotCam) {  // jangan tampilkan area di luar dunia
    const hw = VW / 2, hh = VH / 2;
    cam.x = WW > VW ? Math.max(hw, Math.min(WW - hw, cam.x)) : WW / 2;
    cam.y = WH > VH ? Math.max(hh, Math.min(WH - hh, cam.y)) : WH / 2;
  }

  document.getElementById('speed').textContent = Math.round(Math.abs(fwd) * 1.6) + ' km/j';
}

function updateRobot(dt) {
  // gerak 8 arah relatif terhadap layar, lalu diubah ke koordinat dunia sesuai sudut kamera
  let ix = keys.right - keys.left, iy = keys.down - keys.up;
  const moving = ix || iy;
  if (moving) {
    const l = Math.hypot(ix, iy); ix /= l; iy /= l;
    const c = Math.cos(cam.a), s = Math.sin(cam.a);
    const wx = ix * c - iy * s, wy = ix * s + iy * c;
    const target = Math.atan2(wy, wx);
    let da = Math.atan2(Math.sin(target - bot.a), Math.cos(target - bot.a));
    bot.a += da * Math.min(1, dt * 12);
    let sp = surfAt(bot.x, bot.y) === 0 ? 34 : 42;
    if (opts.char === 'human') sp *= humanSpeed();
    bot.x += wx * sp * dt; bot.y += wy * sp * dt;
    bot.walk += dt * 8;
    bot.moving = true;
  } else { bot.walk = 0; bot.moving = false; } // kembali ke pose diam
  if (opts.char === 'human') humanAnimate(dt, moving);
  bot.x = Math.max(8, Math.min(WW - 8, bot.x));
  bot.y = Math.max(8, Math.min(WH - 8, bot.y));
  for (const o of objects) {
    const dx = bot.x - o.x, dy = bot.y - o.y, d = Math.hypot(dx, dy), min = o.r + 5;
    if (d < min && d > 0) { bot.x = o.x + dx / d * min; bot.y = o.y + dy / d * min; }
  }
  const k = 1 - Math.pow(0.0005, dt);
  cam.x += (bot.x - cam.x) * k; cam.y += (bot.y - cam.y) * k;
  const ta = opts.rotCam ? bot.a + Math.PI / 2 : 0;
  cam.a += Math.atan2(Math.sin(ta - cam.a), Math.cos(ta - cam.a)) * (1 - Math.pow(0.02, dt));
  if (!opts.rotCam) {
    const hw = VW / 2, hh = VH / 2;
    cam.x = WW > VW ? Math.max(hw, Math.min(WW - hw, cam.x)) : WW / 2;
    cam.y = WH > VH ? Math.max(hh, Math.min(WH - hh, cam.y)) : WH / 2;
  }
  document.getElementById('speed').textContent = opts.char === 'human' ? ANIMS[bot.anim].name : moving ? 'berjalan' : 'diam';
}

// ---- state machine animasi manusia ----
const LOCO = { stand: ['walk', 'idle'], crouch: ['crouch', 'crouch'], crawl: ['crawl', 'crawl'] };
function humanSpeed() {
  if (bot.action && bot.action !== 'jump') return 0;          // diam saat memukul dll
  if (bot.mode === 'crawl') return 0.35;
  if (bot.mode === 'crouch') return 0.5;
  return keys.run ? 2.1 : 1;
}
function humanAnimate(dt, moving) {
  if (bot.action) {
    const A = ANIMS[bot.action];
    bot.at += dt;
    const f = Math.floor(bot.at * A.fps);
    if (f >= A.n) {
      if (A.hold) { bot.anim = bot.action; bot.frame = A.n - 1; return; }   // jatuh: tetap terbaring
      bot.action = null;
    } else { bot.anim = bot.action; bot.frame = f; return; }
  }
  let name = LOCO[bot.mode][moving ? 0 : 1];
  if (bot.mode === 'stand' && moving && keys.run) name = 'run';
  const A = ANIMS[name];
  if (moving || name === 'idle') bot.phase += dt * A.fps / A.n;
  bot.anim = name;
  bot.frame = (moving || name === 'idle') ? Math.floor(bot.phase * A.n) % A.n : 0;
}
function doAction(a) {
  if (opts.char !== 'human') return;
  if (a === 'crouch' || a === 'crawl') { bot.mode = bot.mode === a ? 'stand' : a; bot.action = null; syncActionBar(); return; }
  if (bot.action === 'fall') { bot.action = null; return; }     // bangun lagi
  if (bot.action && bot.action !== 'fall') return;
  if (bot.mode !== 'stand' && a !== 'fall') bot.mode = 'stand';
  bot.action = a; bot.at = 0; syncActionBar();
}
function syncActionBar() {
  document.querySelectorAll('#acts button[data-a]').forEach(b => b.classList.toggle('on', b.dataset.a === bot.mode || b.dataset.a === 'run' && keys.run));
}

function render() {
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#2f7734';
  ctx.fillRect(0, 0, VW, VH);
  const cx = Math.round(VW / 2), cy = Math.round(VH * (opts.rotCam ? 0.62 : 0.5));
  const ca = Math.cos(-cam.a), sa = Math.sin(-cam.a);

  // tanah (diputar bersama kamera)
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-cam.a);
  ctx.translate(-Math.round(cam.x), -Math.round(cam.y));
  ctx.drawImage(ground, 0, 0);
  ctx.restore();

  // posisi layar tiap objek; sudut objek dikurangi sudut kamera
  const player = WALKERS[opts.char]
    ? { model: opts.char === 'human' ? getAnim(bot.anim)[bot.frame] : WALKERS[opts.char][Math.floor(bot.walk) % 4], x: bot.x, y: bot.y, a: bot.a }
    : { model: CAR, x: car.x, y: car.y, a: car.a };
  const list = objects.concat([player]).map(o => {
    const dx = o.x - cam.x, dy = o.y - cam.y;
    return { o, sx: cx + dx * ca - dy * sa, sy: cy + dx * sa + dy * ca };
  }).filter(p => p.sx > -40 && p.sx < VW + 40 && p.sy > -40 && p.sy < VH + 60);

  list.sort((a, b) => a.sy - b.sy);  // urutkan dari belakang ke depan

  if (opts.shadow) for (const p of list) drawShadow(ctx, p.o.model, p.sx, p.sy, p.o.a - cam.a);
  for (const p of list) drawStack(ctx, p.o.model, p.sx, p.sy, p.o.a - cam.a, opts.spacing);
}

let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (current === 'game') { update(dt); render(); }
  else renderTut(t / 1000, dt);
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
addEventListener('keydown', e => {
  if (KEYMAP[e.code]) { keys[KEYMAP[e.code]] = true; e.preventDefault(); }
  const ACT = { Space: 'jump', KeyJ: 'punch', KeyK: 'kick', KeyL: 'slash', KeyU: 'cast', KeyH: 'fall', KeyQ: 'crouch', KeyE: 'crawl' };
  if (ACT[e.code] && !e.repeat) { doAction(ACT[e.code]); e.preventDefault(); }
  if (e.key === 'Shift') { keys.run = true; syncActionBar(); }
  if (e.code === 'KeyC') { opts.rotCam = !opts.rotCam; document.getElementById('optCam').checked = opts.rotCam; }
});
addEventListener('keyup', e => { if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = false; if (e.key === 'Shift') { keys.run = false; syncActionBar(); } });
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) document.body.classList.add('is-touch');
document.querySelectorAll('.touch button').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); keys[k] = true; b.classList.add('down'); };
  const off = e => { e.preventDefault(); keys[k] = false; b.classList.remove('down'); };
  b.addEventListener('pointerdown', on);
  b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off);
  b.addEventListener('pointerleave', off);
});
document.getElementById('optChar').onchange = e => {
  opts.char = e.target.value;
  if (WALKERS[opts.char]) { bot.x = car.x; bot.y = car.y + 16; bot.a = car.a; opts.rotCam = false; document.getElementById('optCam').checked = false; }
  updateHelp(); syncActionBar();
  e.target.blur();
};
document.querySelectorAll('#acts button').forEach(b => {
  const a = b.dataset.a;
  if (b.dataset.hold) {
    b.addEventListener('pointerdown', e => { e.preventDefault(); keys.run = true; syncActionBar(); });
    for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) b.addEventListener(ev, () => { keys.run = false; syncActionBar(); });
  } else b.addEventListener('click', () => doAction(a));
});
function updateHelp() {
  document.body.classList.toggle('human', opts.char === 'human');
  document.getElementById('help').textContent = opts.char === 'car'
    ? '← → / A D belok · ↑ / W gas · ↓ / S rem/mundur · C kamera'
    : 'Panah / WASD jalan · C kamera';
}
document.getElementById('optCam').onchange = e => opts.rotCam = e.target.checked;
document.getElementById('optShadow').onchange = e => opts.shadow = e.target.checked;
document.getElementById('optSpace').oninput = e => opts.spacing = +e.target.value;

/* =====================================================================
   5. TUTORIAL: visualisasi 3 langkah dari video
   ===================================================================== */
const STEPS = [
  { title: () => tutChar === 'human' ? 'Manusia: bentuk organik dari voxel' : `Gambar ${({ car: 'mobil', robot: 'robot' })[tutChar]} dari 4 sisi`,
    text: () => { const m = TUT_CHARS[tutChar].model; if (tutChar === 'human') return `Model organik (${m.L}×${m.W}×${m.H}): dibuat dari bola, elipsoid, dan kapsul, lalu tiap voxel diberi cahaya sesuai arah permukaannya (4 tingkat warna). Tampak 4 sisi di atas adalah hasil proyeksinya.`;
      return `Atas, samping, depan, belakang. Ukurannya harus konsisten: panjang ${m.L}, lebar ${m.W}, tinggi ${m.H} piksel. Model 3D (voxel) didapat dari irisan keempat siluet ini.`; } },
  { title: 'Tiap baris tampak samping menjadi satu slice',
    text: () => { const h = TUT_CHARS[tutChar].model.H; return `Baris ke-z dari tampak samping = lapisan ke-z. Slice itu digambar sebagai tampak ATAS dari lapisan tersebut. ${h} baris → ${h} gambar slice.` + ({ car: '', robot: ' Animasi jalan: buat beberapa set slice, kaki & tangan digeser maju-mundur tiap frame.', human: ' Gerakan: tiap frame = pose rangka (sudut sendi), dibangun ulang jadi set slice sendiri.' })[tutChar]; } },
  { title: 'Tumpuk slice berjarak 1 px lalu putar',
    text: 'Gambar slice dari bawah ke atas; tiap slice digeser 1 px ke atas layar dan diputar dengan sudut yang sama. Geser "Jarak slice" untuk melihat tumpukannya terpisah.' },
];
let step = 0, tutChar = 'car';
const tutCanvas = document.getElementById('tutCanvas'), tctx = tutCanvas.getContext('2d');
const TW = 200, TH = 170;
let tutAngle = 30 * Math.PI / 180;
function resizeTut() {
  tutCanvas.width = TW; tutCanvas.height = TH;
  const px = Math.max(1, Math.floor(Math.min((innerWidth - 24) / TW, (innerHeight - 290) / TH)));
  tutCanvas.style.width = TW * px + 'px'; tutCanvas.style.height = TH * px + 'px';
}
resizeTut();

// Render tampak (string) ke canvas
function viewCanvas(rows, pal) {
  const c = makeCanvas(rows[0].length, rows.length), x = c.getContext('2d');
  rows.forEach((r, y) => [...r].forEach((ch, i) => { if (pal[ch]) { x.fillStyle = pal[ch]; x.fillRect(i, y, 1, 1); } }));
  return c;
}
const TUT_CHARS = {
  car:   { model: CAR,   views: CAR_VIEWS,   pal: PAL },
  robot: { model: ROBOT, views: ROBOT_VIEWS, pal: ROBOT_PAL, frames: ROBOT_FRAMES },
  human: { model: HUMAN, anim: true },
};
for (const k in TUT_CHARS) {
  const tc = TUT_CHARS[k];
  if (tc.model.vc) { tc.vc = tc.model.vc; continue; }   // model organik: tampak hasil proyeksi
  tc.vc = {};
  for (const v of ['top', 'side', 'front', 'back']) tc.vc[v] = viewCanvas(tc.views[v], tc.pal);
}

function renderTut(t) {
  const c = tctx;
  c.imageSmoothingEnabled = false;
  c.fillStyle = '#ffffff'; c.fillRect(0, 0, TW, TH);
  const blit = (img, x, y, s = 1) => c.drawImage(img, Math.round(x), Math.round(y), img.width * s, img.height * s);
  const tc = TUT_CHARS[tutChar], M = tc.model, VC = tc.vc;
  const L = M.L, W = M.W, H = M.H;

  if (step === 0) {
    // atas (diputar menghadap atas seperti di video), samping, depan, belakang — berjajar
    const s = Math.min(2, Math.floor((TW - 30) / (W + L + W + W)), Math.floor((TH - 40) / Math.max(L, H)));
    const parts = [[VC.top, W, L, true], [VC.side, L, H], [VC.front, W, H], [VC.back, W, H]];
    const total = parts.reduce((a, p) => a + p[1] * s, 0) + 8 * (parts.length - 1);
    let x = Math.round((TW - total) / 2);
    const base = Math.round(TH / 2 + Math.max(L, H) * s / 2);
    for (const [img, w, h, rot] of parts) {
      if (rot) { c.save(); c.translate(x + w * s / 2, base - h * s / 2); c.rotate(-Math.PI / 2); c.drawImage(img, -h * s / 2, -w * s / 2, h * s, w * s); c.restore(); }
      else blit(img, x, base - h * s, s);
      c.fillStyle = '#bbb'; c.fillRect(x, base + 4, w * s, 1);
      x += w * s + 8;
    }
  } else if (step === 1) {
    const z = Math.floor(t * 2.5) % H;               // baris yang sedang disorot
    const row = H - 1 - z;
    const s = H * 2 <= 60 ? 2 : 1;                   // model tinggi -> skala kecil
    blit(VC.side, 8, 6, s);
    c.fillStyle = 'rgba(255,200,0,0.45)';
    c.fillRect(6, 6 + row * s, L * s + 4, s);
    const ax = 14 + L * s, ay = 6 + row * s;
    c.fillStyle = '#999';
    c.fillRect(ax, ay, 90 - ax, 1);
    c.fillRect(88, ay - 1, 1, 3);
    // slice terpilih, diperbesar
    const bs = Math.min(3, Math.floor(56 / W), Math.floor(100 / L));
    c.fillStyle = '#eee'; c.fillRect(96, 4, L * bs + 4, W * bs + 4);
    blit(M.slices[z], 98, 6, bs);
    // semua slice di bawah
    const cw = L + 4, ch = W + 6, per = Math.floor((TW - 8) / cw);
    const gy0 = Math.max(6 + H * s, 8 + W * bs) + 8;
    for (let i = 0; i < H; i++) {
      const gx = 6 + (i % per) * cw, gy = gy0 + Math.floor(i / per) * ch;
      c.fillStyle = i === z ? '#ffd24a' : '#eee';
      c.fillRect(gx - 1, gy - 1, L + 2, W + 2);
      blit(M.slices[i], gx, gy);
    }
  } else {
    if (document.getElementById('tAuto').checked) {
      tutAngle += 0.9 * (1 / 60);
      document.getElementById('tAngle').value = Math.round((tutAngle * 180 / Math.PI) % 360);
    }
    const sp = +document.getElementById('tSpace').value;
    const s = (H - 1) * sp * 2 + W * 2 > TH - 10 ? 1 : 2;
    const baseY = Math.round(TH / 2 + ((H - 1) * sp * s) / 2 + 4);
    // robot/manusia: putar frame animasi jalan
    let model = M;
    if (tc.frames) model = tc.frames[Math.floor(t * 6) % tc.frames.length];
    if (tc.anim) {                                     // manusia: mainkan gerakan yang dipilih
      const name = document.getElementById('tAnim').value, A = ANIMS[name], fr = getAnim(name);
      const total = A.n + (A.loop ? 0 : Math.round(A.fps * 0.6));   // aksi: jeda sebentar sebelum diulang
      model = fr[Math.min(A.n - 1, Math.floor(t * A.fps) % total)];
    }
    drawShadow(c, model, TW / 2, baseY, tutAngle, s);   // bayangan tetap di tanah
    drawStack(c, model, TW / 2, baseY, tutAngle, sp, s);
  }
}

function setStep(i) {
  step = i;
  document.querySelectorAll('#tutCtl .btn').forEach(b => b.classList.toggle('on', +b.dataset.step === i));
  const v = f => typeof f === 'function' ? f() : f;
  document.getElementById('tutTitle').textContent = v(STEPS[i].title);
  document.getElementById('tutText').textContent = v(STEPS[i].text);
  document.getElementById('tutSliders').style.visibility = i === 2 ? 'visible' : 'hidden';
  document.getElementById('tAnimWrap').style.display = tutChar === 'human' ? '' : 'none';
}
document.querySelectorAll('#tutCtl .btn').forEach(b => b.onclick = () => setStep(+b.dataset.step));
document.getElementById('tSpace').oninput = e => document.getElementById('tSpaceV').textContent = e.target.value;
document.getElementById('tAngle').oninput = e => { document.getElementById('tAuto').checked = false; tutAngle = e.target.value * Math.PI / 180; };
