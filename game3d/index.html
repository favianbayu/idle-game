<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lonceng Pulang 3D - base game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e2430; font-family: 'Trebuchet MS', system-ui, sans-serif; color: #fff;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
  #game { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 2px 0 #0008; }
  #area { top: max(10px, env(safe-area-inset-top)); left: 12px; font-size: 18px; font-weight: bold; background: #0006; padding: 4px 10px; border-radius: 4px; }
  #fps { bottom: 6px; left: 8px; font-size: 11px; opacity: .7; }
  #prompt { bottom: 22%; left: 50%; transform: translateX(-50%); background: #fffbe8; color: #2a2014; font-weight: bold; padding: 6px 14px;
    border: 3px solid #2a2014; border-radius: 6px; font-size: 16px; text-shadow: none; white-space: nowrap; }
  #toast { top: 18%; left: 50%; transform: translateX(-50%); max-width: 80vw; text-align: center; background: #000a; padding: 8px 14px; border-radius: 6px; opacity: 0; transition: opacity .3s; }
  #mapWrap { top: max(10px, env(safe-area-inset-top)); right: 12px; width: 132px; height: 132px; border: 3px solid #2a2014; border-radius: 50%; overflow: hidden; background: #9ab878; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #bubbles div { position: fixed; left: 0; top: 0; pointer-events: none; white-space: nowrap; font-size: 13px; }
  .tag { color: #fff; font-weight: bold; text-shadow: 0 1px 0 #000, 0 -1px 0 #000, 1px 0 0 #000, -1px 0 0 #000; }
  .bubble { background: #fff; color: #222; padding: 5px 9px; border-radius: 8px; border: 2px solid #222; max-width: 220px; white-space: normal !important; text-shadow: none; }
  #menu { position: fixed; top: max(150px, calc(env(safe-area-inset-top) + 150px)); right: 12px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  button { font: bold 13px 'Trebuchet MS', system-ui, sans-serif; color: #2a2014; background: #fffbe8; border: 3px solid #2a2014; border-radius: 6px; padding: 5px 9px; cursor: pointer; touch-action: none; }
  #menu.closed #menuItems > * { display: none !important; }
  button.on { background: #ffd84a; }
  #pad { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); display: none; gap: 10px; align-items: flex-end; }
  #pad button { width: 64px; height: 64px; border-radius: 50%; font-size: 14px; padding: 0; }
  #pad #btnAct { width: 84px; height: 84px; font-size: 16px; background: #ffd84a; }
  #camPad { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: calc(max(18px, env(safe-area-inset-bottom)) + 100px); display: none; gap: 8px; }
  #camPad button { width: 48px; height: 40px; font-size: 18px; padding: 0; }
  body.touch #pad, body.touch #camPad { display: flex; }
  body.touch #help { display: none; }
  #joy { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; background: #fff3; border: 3px solid #fff8; display: none; pointer-events: none; }
  #knob { position: absolute; left: 30px; top: 30px; width: 44px; height: 44px; border-radius: 50%; background: #fffbe8; border: 3px solid #2a2014; }
  #help { bottom: 6px; right: 10px; font-size: 12px; opacity: .85; text-align: right; line-height: 1.5; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #1e2430; font-size: 20px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="area" class="hud"></div>
<div id="mapWrap" class="hud"><canvas id="map" width="132" height="132"></canvas></div>
<div id="menu"><button id="btnMenu">⚙ Menu</button><div id="menuItems" style="display:contents">
  <button id="btnFollow" title="C">Kamera ikut</button>
  <button id="btnMap" title="M">Peta</button>
  <button id="btnQuality">Grafik</button>
  <button id="btnPx">Pixel</button>
  <div style="display:flex;gap:6px"><button id="btnZoomIn">+</button><button id="btnZoomOut">−</button></div>
</div></div>
<div id="prompt" class="hud" style="display:none"></div>
<div id="toast" class="hud"></div>
<div id="bubbles"></div>
<div id="fps" class="hud"></div>
<div id="help" class="hud">WASD/panah: jalan · Shift: lari · Spasi: aksi<br>Q/E atau seret mouse: putar kamera · roda: zoom · C: kamera ikut · M: peta</div>
<div id="joy"><div id="knob"></div></div>
<div id="camPad"><button id="btnL">⟲</button><button id="btnR">⟳</button></div>
<div id="pad"><button id="btnRun">Lari</button><button id="btnAct">Aksi</button></div>
<div id="fade"></div>
<div id="loading">Memuat Wirabumi…</div>
