# Builds game3d into one index.html and publishes it to the gh-pages branch,
# so the game can be opened on a phone at https://favianbayu.github.io/idle-game/
# One-time setup: Settings -> Pages -> Source "Deploy from a branch" -> gh-pages / (root).
name: Deploy game to GitHub Pages

on:
  push:
    branches: [main, claude/project-thread-kw6qbg]
    paths: ['game3d/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: game3d/package-lock.json
      - name: Build
        working-directory: game3d
        run: npm ci && npm run build
      - name: Publish to gh-pages
        run: |
          mkdir -p _site
          cp game3d/index.html _site/index.html
          cp -r game3d/ui _site/ui
          touch _site/.nojekyll
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
