/* =====================================================================
   0. INTI SPRITE STACKING
   Model = grid voxel L×W×H. Slice ke-z = gambar tampak-atas lapisan z.
   Render: gambar slice dari bawah ke atas, tiap slice naik 1 px, semua
   diputar dengan sudut yang sama.
   ===================================================================== */
const TAU = Math.PI * 2;
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function hash(x, y, z) {
  let h = (x * 374761393 + y * 668265263 + z * 2147483647) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function rng(seed) { let s = (seed >>> 0) || 1; return () => (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296; }
const hexRGB = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const clamp255 = v => Math.max(0, Math.min(255, Math.round(v)));
const mixc = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
// 4 tingkat warna (gelap -> terang) dari satu warna dasar
function ramp(hex) {
  const c = hexRGB(hex);
  return [mixc(c.map(v => v * 0.55), [40, 24, 64], 0.18), c.map(v => v * 0.8), c, mixc(c, [255, 248, 228], 0.3)].map(a => a.map(clamp255));
}
const RAMP_CACHE = {};
const R = hex => RAMP_CACHE[hex] || (RAMP_CACHE[hex] = ramp(hex));

/* buildVox: fill(x,y,z) -> material (atau null); color(x,y,z,m,exp,at) -> [r,g,b].
   exp = sisi mana yang terbuka (top, xp, xn, yp, yn). */
function buildVox(L, W, H, fill, color, o = {}) {
  const bb = o.bbox || [0, 0, 0, L - 1, W - 1, H - 1];
  const grid = new Array(L * W * H);
  const I = (x, y, z) => (z * W + y) * L + x;
  for (let z = bb[2]; z <= bb[5]; z++) for (let y = bb[1]; y <= bb[4]; y++) for (let x = bb[0]; x <= bb[3]; x++) {
    const m = fill(x, y, z);
    if (m) grid[I(x, y, z)] = m;
  }
  const at = (x, y, z) => (x < 0 || y < 0 || z < 0 || x >= L || y >= W || z >= H) ? null : grid[I(x, y, z)];
  const slices = [];
  const shadow = makeCanvas(L, W), sctx = shadow.getContext('2d'), sdata = sctx.createImageData(L, W);
  let top = -1;
  for (let z = 0; z <= bb[5]; z++) {
    let img = null;
    for (let y = bb[1]; y <= bb[4]; y++) for (let x = bb[0]; x <= bb[3]; x++) {
      const m = grid[I(x, y, z)];
      if (!m) continue;
      const e = { top: !at(x, y, z + 1), xp: !at(x + 1, y, z), xn: !at(x - 1, y, z), yp: !at(x, y + 1, z), yn: !at(x, y - 1, z) };
      const c = color(x, y, z, m, e, at);
      if (!img) img = new ImageData(L, W);
      const k = (y * L + x) * 4;
      img.data[k] = c[0]; img.data[k + 1] = c[1]; img.data[k + 2] = c[2]; img.data[k + 3] = 255;
      sdata.data[k + 3] = 255;
    }
    if (img) { const cv = makeCanvas(L, W); cv.getContext('2d').putImageData(img, 0, 0); slices[z] = cv; top = z; }
    else slices[z] = null;
  }
  slices.length = top + 1;
  sctx.putImageData(sdata, 0, 0);
  const model = { L, W, H: slices.length, slices, shadow };
  if (o.runs) {   // kolom-kolom voxel (untuk memanggang bayangan ke tanah)
    const runs = [];
    for (let y = bb[1]; y <= bb[4]; y++) for (let x = bb[0]; x <= bb[3]; x++) {
      let z0 = -1;
      for (let z = 0; z <= bb[5] + 1; z++) {
        const f = z <= bb[5] && grid[I(x, y, z)];
        if (f && z0 < 0) z0 = z;
        else if (!f && z0 >= 0) { runs.push(x, y, z0, z - 1); z0 = -1; }
      }
    }
    model.runs = Int16Array.from(runs);
  }
  if (o.views) model.vc = projectViews(L, W, slices.length, at, color);
  return model;
}

// Tampak 4 sisi diproyeksikan dari voxel (untuk tutorial)
function projectViews(L, W, H, at, color) {
  const proj = (w, h, fn) => {
    const c = makeCanvas(w, h), g = c.getContext('2d'), img = g.createImageData(w, h);
    for (let v = 0; v < h; v++) for (let u = 0; u < w; u++) {
      const col = fn(u, v); if (!col) continue;
      const k = (v * w + u) * 4; img.data[k] = col[0]; img.data[k + 1] = col[1]; img.data[k + 2] = col[2]; img.data[k + 3] = 255;
    }
    g.putImageData(img, 0, 0); return c;
  };
  const first = cells => {
    for (const [x, y, z] of cells) {
      const m = at(x, y, z);
      if (m) return color(x, y, z, m, { top: !at(x, y, z + 1), xp: !at(x + 1, y, z), xn: !at(x - 1, y, z), yp: !at(x, y + 1, z), yn: !at(x, y - 1, z) }, at);
    }
    return null;
  };
  const range = (n, rev) => [...Array(n).keys()].map(i => rev ? n - 1 - i : i);
  return {
    top:   proj(L, W, (x, y) => first(range(H, true).map(z => [x, y, z]))),
    side:  proj(L, H, (x, r) => first(range(W).map(y => [x, y, H - 1 - r]))),
    front: proj(W, H, (c, r) => first(range(L, true).map(x => [x, W - 1 - c, H - 1 - r]))),
    back:  proj(W, H, (c, r) => first(range(L).map(x => [x, c, H - 1 - r]))),
  };
}

function vnoise(x, y, s, seed = 5) {
  const gx = Math.floor(x / s), gy = Math.floor(y / s), fx = x / s - gx, fy = y / s - gy;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = hash(gx, gy, seed), b = hash(gx + 1, gy, seed), c = hash(gx, gy + 1, seed), d = hash(gx + 1, gy + 1, seed);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
/* Pewarnaan bangunan dengan "weathering": kotor di bagian bawah dinding, noda rembesan
   vertikal, lumut, dan variasi warna. Material diawali '!' = bersih (kaca, tulisan). */
const DIRT = [62, 52, 40], MOSS = [84, 98, 56];
function weatherColor(x, y, z, m, e, at) {
  const clean = m[0] === '!';
  const r = R(clean ? m.slice(1) : m);
  if (!(e.top || e.xp || e.xn || e.yp || e.yn)) return r[1];
  let i = e.top ? 3 : (e.xp || e.yp) ? 2 : 1;
  if (z === 0 && !e.top) i = Math.max(0, i - 1);

/* ---------- Cache frame + antrian build ----------
   Frame dibangun saat pertama dibutuhkan. NPC memakai antrian (dibangun sedikit
   demi sedikit tiap frame) supaya game tidak tersendat. */
const FR = new Map(), QUEUE = [], QSET = new Set();
function buildHumanFrame(sid, anim, i, part, views = false) {
  const A = ANIMS[anim], t = A.loop ? i / A.n : i / Math.max(1, A.n - 1), st = STYLES[sid];
  const sh = humanShape(A.pose(t), st, part);
  const m = buildVox(sh.L, sh.W, sh.H, sh.mat, st.color, { bbox: sh.bbox, views });
  m.lift = sh.lift; m.pelvisZ = sh.pelvisZ; m.yaw = sh.yaw; m.buttZ = sh.buttZ; m.shadowOff = 2;
  return m;
}
function hframe(sid, anim, i, part = 'all', sync = true) {
  const k = sid + '|' + anim + '|' + part + '|' + i;
  const m = FR.get(k);
  if (m) return m;
  if (sync) { const b = buildHumanFrame(sid, anim, i, part); FR.set(k, b); return b; }
  if (!QSET.has(k)) { QSET.add(k); QUEUE.push([k, sid, anim, i, part]); }
  return null;
}
function pumpQueue(ms) {
  const t0 = performance.now();
  while (QUEUE.length && performance.now() - t0 < ms) {
    const [k, sid, anim, i, part] = QUEUE.shift();
    QSET.delete(k);
    if (!FR.has(k)) FR.set(k, buildHumanFrame(sid, anim, i, part));
  }
}
function queueAnim(sid, anim, part = 'all') { for (let i = 0; i < ANIMS[anim].n; i++) hframe(sid, anim, i, part, false); }

// Gabungkan badan bawah (dari gerakan jalan) + badan atas (dari serangan), per slice.
// Tinggi pinggul disamakan dengan menggeser indeks slice badan atas.
const COMP = new WeakMap();
function composite(lower, upper) {
  let m1 = COMP.get(lower); if (!m1) COMP.set(lower, m1 = new Map());
  let c = m1.get(upper); if (c) return c;
  const dz = Math.round(lower.pelvisZ - upper.pelvisZ), n = Math.max(lower.slices.length, upper.slices.length + dz);
  const slices = [];
  for (let z = 0; z < n; z++) {
    const a = lower.slices[z], b = upper.slices[z - dz];
    if (!a && !b) { slices.push(null); continue; }
    const cv = makeCanvas(lower.L, lower.W), g = cv.getContext('2d');
    if (a) g.drawImage(a, 0, 0);
    if (b) g.drawImage(b, 0, 0);
    slices.push(cv);
  }
  const shadow = makeCanvas(lower.L, lower.W), g = shadow.getContext('2d');
  g.drawImage(lower.shadow, 0, 0); g.drawImage(upper.shadow, 0, 0);
  c = { L: lower.L, W: lower.W, H: n, slices, shadow, lift: 0, yaw: upper.yaw || 0, shadowOff: 2 };
  m1.set(upper, c);
  return c;
}

const CAT_KINDS = {
  oren:  { fur: '#e8913a', fur2: '#b8621e', belly: '#f6e2c8', pattern: 'stripe' },
  belang:{ fur: '#f2efe8', fur2: '#2a2a2a', belly: '#f2efe8', pattern: 'spot' },
  hitam: { fur: '#2c2a30', fur2: '#1c1a20', belly: '#efece6', pattern: 'chest' },
};
function catShape(ph, k, sit) {
  const L = 26, W = 14, H = 18, cy = 7;
  const s = Math.sin(ph), c = Math.cos(ph);
  const body = [11, cy, 7.2], head = [18.2, cy, 10.5];
  const legsP = [[14.5, -1.4, 0], [14.5, 1.4, 1], [7.5, -1.4, 1], [7.5, 1.4, 0]];
  const ramps = { fur: R(k.fur), fur2: R(k.fur2), belly: R(k.belly), eye: fixedRamp('#3a6a2a'), nose: fixedRamp('#e88a8a'), ear: R('#e8a0a0') };
  const fill = (x, y, z) => {
    const p = [x + 0.5, y + 0.5, z + 0.5];
    const furMat = () => {
      if (k.pattern === 'stripe' && x % 3 === 0) return 'fur2';
      if (k.pattern === 'spot' && hash(x >> 2, y >> 2, z >> 2) < 0.35) return 'fur2';
      if (k.pattern === 'chest' && p[0] > 15 && p[2] < 9 && Math.abs(p[1] - cy) < 1.5) return 'belly';
      return 'fur';
    };
    // kepala + telinga + mata
    const hd = sub(p, head);
    if ((hd[0] / 3.2) ** 2 + (hd[1] / 3.0) ** 2 + (hd[2] / 2.7) ** 2 <= 1) {
      if (hd[0] > 2.2 && Math.abs(hd[2] - 0.4) < 0.7 && Math.abs(Math.abs(hd[1]) - 1.2) < 0.55) return 'eye';
      if (hd[0] > 2.6 && hd[2] < -0.3 && hd[2] > -1.3 && Math.abs(hd[1]) < 0.6) return 'nose';
      return furMat();
    }
    for (const sy of [-1, 1]) if (capsule(p, [head[0], cy + sy * 1.6, head[2] + 1.8], [head[0] - 0.2, cy + sy * 1.9, head[2] + 4.2], 1.1, 0.25) >= 0) return 'fur';
    // badan
    if (((p[0] - body[0]) / 6) ** 2 + ((p[1] - body[1]) / 2.7) ** 2 + ((p[2] - body[2] - (sit ? -1 : 0)) / 2.7) ** 2 <= 1) return furMat();
    // ekor (melengkung ke atas, bergoyang)
    const sway = sit ? s * 1.2 : s * 0.8;
    if (capsule(p, [5.4, cy, 8], [2.6, cy + sway, 10.5], 0.9, 0.8) >= 0 || capsule(p, [2.6, cy + sway, 10.5], [2.4, cy + sway * 1.8, 15], 0.8, 0.6) >= 0) return 'fur';
    // kaki
    for (const [lx, ly, ph2] of legsP) {
      const sw = sit ? 0 : (ph2 ? s : -s) * 1.6;
      if (capsule(p, [lx, cy + ly, 5.5], [lx + sw, cy + ly, 0.7], 0.95, 0.85) >= 0) return p[2] < 1.6 ? 'belly' : furMat();
    }
    return null;
  };
  const m = buildVox(L, W, H, fill, organicColor(mm => ramps[mm]));
  m.shadowOff = 1;
  return m;
}
const CAT_FRAMES = {};

/* =====================================================================
   4. LINGKUNGAN: perumahan & gang Indonesia (skala mengikuti tokoh ±36 voxel)
   Pintu 44, dinding 52, pagar 27, motor dudukan ±20. Material = warna hex,
   diberi weathering (kotor, rembesan, lumut). Awalan '!' = tanpa weathering.
   m.split = tinggi pemisah lapis bawah/atas, m.body = tapak bangunan [ox, oy, hw, hh]
   untuk urutan gambar.
   ===================================================================== */
const env = (L, W, H, fill) => buildVox(L, W, H, fill, weatherColor, { runs: true });

function makeHouse(o) {
  const ov = 4, te = 18, d = o.d, w = o.w, wh = 52;
  const L = d + ov * 2, W = w + ov * 2;
  const roofN = o.gable ? Math.ceil(W / 4) : Math.ceil(Math.min(L, W) / 4);
  const topK = o.gable ? Math.floor((W - 1) / 4) : Math.floor((Math.min(L, W) - 1) / 4);
  const H = wh + roofN + (o.tank ? 18 : 1);
  const bx0 = ov, bx1 = ov + d - te - 1, by0 = ov, by1 = ov + w - 1, tx1 = ov + d - 1;
  const cyD = Math.floor((by0 + by1) / 2), tX = ov + 12, tY = ov + 12;
  const inLv = (x, y, k) => { const ins = 2 * k; return o.gable ? (y >= ins && y <= W - 1 - ins) : (x >= ins && x <= L - 1 - ins && y >= ins && y <= W - 1 - ins); };
  const kAt = (x, y) => Math.min(topK, Math.floor((o.gable ? Math.min(y, W - 1 - y) : Math.min(x, y, L - 1 - x, W - 1 - y)) / 2));
  const tZ = wh + kAt(tX, tY) + 1;
  const win = (u, v, u0, u1, v0, v1) => {
    if (u < u0 || u > u1 || v < v0 || v > v1) return null;
    if (u === u0 || u === u1 || v === v0 || v === v1 || v === v0 + 8) return o.frame;
    return ((u + v) % 6 === 0 || (u - v + 600) % 6 === 0) ? '#2a2a2a' : '!#4a6478';
  };
  const m = env(L, W, H, (x, y, z) => {
    if (o.tank && z >= tZ) {
      const dx = x - tX, dy = y - tY;
      if (z < tZ + 4) return Math.abs(dx) === 4 && Math.abs(dy) === 4 ? '#5a5a5a' : null;
      if (z === tZ + 4) return Math.abs(dx) <= 5 && Math.abs(dy) <= 5 ? '#6a6a6a' : null;
      if (z <= tZ + 14) return dx * dx + dy * dy <= 18 ? (z % 4 === 0 ? o.tankC2 : o.tankC) : null;
      if (z === tZ + 15) return dx * dx + dy * dy <= 6 ? o.tankC : null;
      return null;
    }
    if (z >= wh) {   // atap: hanya cincin luar tiap tingkat (bagian dalam tertutup tingkat di atasnya)
      const k = z - wh;
      if (k >= roofN || !inLv(x, y, k)) return null;
      if (k < topK && inLv(x, y, k + 1)) return null;
      if (k === 0 && (x === 0 || y === 0 || x === L - 1 || y === W - 1)) return '#e2dacb';
      if (k === topK) return o.ridge;
      if (o.gable && (x === 0 || x === L - 1)) return '#e2dacb';
      const u = o.gable ? x : x + y;
      if (u % 3 === 0) return o.roof2;
      return hash(u >> 1, k, 3) < 0.5 ? o.roof : o.roofB;
    }
    if (x > bx1 && x <= tx1 && y >= by0 && y <= by1) {   // teras (lantainya digambar di tanah)
      if (x >= tx1 - 3 && (y <= by0 + 3 || y >= by1 - 3)) return z % 13 === 0 ? '#d8d2c4' : '#ece7dc';
      if (x === tx1 && Math.abs(y - cyD) > 12 && z <= 9) return z === 9 ? '#d8d2c4' : o.wall;
      return null;
    }

const SUN = [0.55, 0.36];        // arah bayangan per 1 voxel tinggi
const CABLE_Z = 95;
// permukaan: 0 tanah/rumput, 1 aspal, 2 conblock, 3 keramik halaman, 4 air selokan, 5 beton, 6 lapangan, 7 lantai teras
const surf = new Uint8Array(WW * WH);
const ground = makeCanvas(WW, WH), gctx = ground.getContext('2d');
const objects = [], colliders = [], cables = [], npcs = [], cats = [], houses = [], vehicles = [];
function setSurf(x0, y0, x1, y1, t) {
  x0 = Math.max(0, Math.round(x0)); y0 = Math.max(0, Math.round(y0)); x1 = Math.min(WW, Math.round(x1)); y1 = Math.min(WH, Math.round(y1));
  for (let y = y0; y < y1; y++) surf.fill(t, y * WW + x0, y * WW + x1);
}
const surfAt = (x, y) => (x < 0 || y < 0 || x >= WW || y >= WH) ? 0 : surf[(y | 0) * WW + (x | 0)];
function addBox(cx, cy, hw, hh) { colliders.push({ t: 'b', x: cx, y: cy, hw, hh }); }
function addCircle(cx, cy, r) { colliders.push({ t: 'c', x: cx, y: cy, r }); }
// Objek statis. Jika model punya split -> dua lapis (bawah & atas) supaya tumpang tindih dengan tokoh pas.
function addObj(model, x, y, a = 0, extra = {}) {
  const o = Object.assign({ model, x, y, a }, extra);
  if (model.split && model.split < model.H) [o.base, o.top] = splitModel(model, model.split);
  else o.base = model;
  objects.push(o);
  return o;
}

function buildWorld() {
  const r = rng(20251117);
  const pick = a => a[Math.floor(r() * a.length)];
  // --- permukaan dasar ---
  setSurf(0, ROAD_Y0, WW, ROAD_Y1, 1);
  setSurf(0, ROAD_Y0 - SEL, WW, ROAD_Y0, 4); setSurf(0, ROAD_Y1, WW, ROAD_Y1 + SEL, 4);
  setSurf(0, ROAD_Y0 - SEL, WW, ROAD_Y0 - SEL + 3, 5); setSurf(0, ROAD_Y0 - 3, WW, ROAD_Y0, 5);
  setSurf(0, ROAD_Y1, WW, ROAD_Y1 + 3, 5); setSurf(0, ROAD_Y1 + SEL - 3, WW, ROAD_Y1 + SEL, 5);
  for (const hy of HGANG) setSurf(GANGS[0], hy - GW / 2, GANGS[3], hy + GW / 2, 2);
  for (const gx of GANGS) {
    for (const [y0, y1] of PARTS) setSurf(gx - GW / 2, y0, gx + GW / 2, y1, 2);
    setSurf(gx - GW / 2, ROAD_Y0 - SEL, gx + GW / 2, ROAD_Y0, 5);
    setSurf(gx - GW / 2, ROAD_Y1, gx + GW / 2, ROAD_Y1 + SEL, 5);
  }
  setSurf(FIELD[0], FIELD[1], FIELD[2], FIELD[3], 6);
  for (const yy of [ROAD_Y0 - SEL / 2, ROAD_Y1 + SEL / 2]) {   // selokan: hanya bisa lewat jembatan
    let x0 = 0;
    for (const gx of [...GANGS, WW + GW]) { const x1 = gx - GW / 2; if (x1 > x0) addBox((x0 + x1) / 2, yy, (x1 - x0) / 2, SEL / 2 - 1); x0 = gx + GW / 2; }
  }

  // --- varian rumah (warna kalem, natural) ---
  const walls = [['#b9cdb8', '#a9bda8'], ['#e2d6b4', '#d2c6a4'], ['#e0b294', '#d0a284'], ['#b4c4d4', '#a4b4c4'], ['#ddc0c0', '#cdb0b0'], ['#e0ddd2', '#d0cdc2'], ['#ddcb8a', '#cdbb7a'], ['#c4cf9e', '#b4bf8e'], ['#cbbfd6', '#bbafc6']];
  const roofs = [
    { roof: '#9c4e30', roofB: '#8e4629', roof2: '#74391f', ridge: '#5e2e1a' },
    { roof: '#8a4a34', roofB: '#7c422e', roof2: '#653524', ridge: '#4e2a1c' },
    { roof: '#4e6480', roofB: '#465a74', roof2: '#38485e', ridge: '#2c3a4c' },
    { roof: '#7a7c7e', roofB: '#6e7072', roof2: '#5c5e60', ridge: '#4a4c4e' },
    { roof: '#a8603e', roofB: '#9a5636', roof2: '#7e462c', ridge: '#663822' },
  ];
  const doors = [['#6e4a30', '#583a24'], ['#5a4030', '#463224'], ['#7e5a3e', '#664830'], ['#3a4e64', '#2e3e50']];
  const variants = [];
  for (let i = 0; i < 8; i++) {
    const dd = pick(doors), wc = walls[i % walls.length], tk = pick([['#2f62a8', '#28568f'], ['#c8702e', '#b06226'], ['#3a8a52', '#307446']]);
    variants.push({ w: pick([84, 90, 96]), d: pick([88, 96]), wall: wc[0], wall2: wc[1], ...roofs[i % roofs.length],
      door: dd[0], door2: dd[1], frame: pick(['#e8e2d4', '#7e5632', '#3a3a3a']), plinth: pick(['#7e766a', '#8a6458', '#686868']),
      tank: r() < 0.55, tankC: tk[0], tankC2: tk[1], gable: r() < 0.35 });
  }
  for (const v of variants) v.model = makeHouse(v);
  const ironCols = ['#2e5a44', '#2a2a2a', '#d8d8d4', '#7a6230', '#3a4a6a'];
  const fenceCache = {};
  const fenceModel = (w, c) => fenceCache[w + c] || (fenceCache[w + c] = makeFence(w, c, Math.floor(w / 2) - 12, Math.floor(w / 2) + 12));
  const pots = [makePot(0), makePot(1)];
  const motorModels = ['#b83a3a', '#2a50b0', '#222226', '#e2e2e0', '#d09020'].map(makeMotor);
  const bikeModels = ['#c83a3a', '#2a7ab0', '#2a9a5a', '#e0b030'].map(makeBike);
  const bins = [makeBin('#2a6a42'), makeBin('#2a5090')];

  // --- rumah di kiri-kanan tiap gang, menghadap gang ---
  for (const gx of GANGS) for (let pi = 0; pi < 2; pi++) for (const s of [-1, 1]) {
    const [p0, p1] = PARTS[pi];
    let y = pi === 0 ? p0 + 6 : p0 + 40;
    const yEnd = pi === 0 ? p1 - 40 : p1;
    while (true) {
      const v = pick(variants), w = v.w;
      if (y + w > yEnd) break;
      const hg = HGANG.find(h => y < h + GW / 2 + 6 && y + w > h - GW / 2 - 6);
      if (hg && !(s < 0 && gx === GANGS[0]) && !(s > 0 && gx === GANGS[3])) { y = hg + GW / 2 + 8; continue; }
      const a = s > 0 ? Math.PI : 0, cs = Math.cos(a);
      const hx = gx + s * (GW / 2 + YARD + v.d / 2), hy = y + w / 2;
      addObj(v.model, hx, hy, a, { body: v.model.body });
      addBox(hx + v.model.body[0] * cs, hy, v.model.body[2], w / 2);
      houses.push({ gx, s, pi, x: hx, y: hy, w, d: v.d });
      const ex = gx + s * GW / 2, fx = gx + s * (GW / 2 + YARD), tx = gx + s * (GW / 2 + YARD + 18);
      setSurf(Math.min(ex, fx), y, Math.max(ex, fx), y + w, 3);
      setSurf(Math.min(fx, tx), y, Math.max(fx, tx), y + w, 7);
      const fenceX = gx + s * (GW / 2 + 2.5), ic = pick(ironCols), gap = 12;
      addObj(fenceModel(w, ic), fenceX, hy, 0, { body: [0, 0, 1.5, w / 2] });
      addBox(fenceX, y + (w / 2 - gap) / 2, 1.5, (w / 2 - gap) / 2);
      addBox(fenceX, y + w - (w / 2 - gap) / 2, 1.5, (w / 2 - gap) / 2);
      if (r() < 0.65) { const px = gx + s * (GW / 2 + YARD - 7); for (const py of [y + 7, y + w - 7]) if (r() < 0.75) { addObj(pick(pots), px, py, r() * TAU); addCircle(px, py, 6); } }
      const vr = r();
      if (vr < 0.4) vehicles.push(newVehicle('motor', pick(motorModels), gx + s * (GW / 2 + 15), y + w * 0.2, Math.PI / 2 + (r() - 0.5) * 0.4));
      else if (vr < 0.55) vehicles.push(newVehicle('bike', pick(bikeModels), gx + s * (GW / 2 + 15), y + w * 0.2, Math.PI / 2 + (r() - 0.5) * 0.4));
      if (r() < 0.25) { const bx = gx + s * (GW / 2 - 7), by = y + 5; addObj(pick(bins), bx, by, 0); addCircle(bx, by, 6); }
      y += w + 12 + Math.floor(r() * 10);
    }
  }

  // --- bangunan khusus di tepi jalan ---
  const w1 = makeWarung('#2d62b0'), w2 = makeWarung('#c8702a');
  addObj(w1, 620, 844, Math.PI / 2, { body: w1.body }); addBox(620, 844 + w1.body[0], 38, 23); addBox(620, 878, 34, 3);
  addObj(w2, 1200, 1040, -Math.PI / 2, { body: w2.body }); addBox(1200, 1040 - w2.body[0], 38, 23); addBox(1200, 1006, 34, 3);
  const mus = makeMushola();
  addObj(mus, 1200, 820, Math.PI / 2, { body: mus.body }); addBox(1200, 820 + mus.body[0], mus.body[3], mus.body[2]);
  const pos = makePosRonda();
  const posObj = addObj(pos, 1780, 850, Math.PI / 2, { body: pos.body, id: 'pos' }); addBox(1780, 850, 22, 25);
  addObj(makeGerobak(), 702, 870, Math.PI, { body: [0, 0, 24, 12] }); addBox(702, 870, 24, 11);
  const flag = makeBendera();
  for (const [fx, fy] of [[560, 878], [1290, 878], [1700, 878], [1860, 1006]]) { addObj(flag, fx, fy, Math.PI / 2); addCircle(fx, fy, 2); }
  const goal = makeGoal();
  addObj(goal, FIELD[0] + 7, (FIELD[1] + FIELD[3]) / 2, 0, { body: [0, 0, 5, 19] }); addObj(goal, FIELD[2] - 7, (FIELD[1] + FIELD[3]) / 2, Math.PI, { body: [0, 0, 5, 19] });

  // --- gapura di mulut gang ---
  GANGS.forEach((gx, i) => {
    for (const [nm, yy, a] of [[GANG_NAMES[i][0], ROAD_Y0 - SEL - 8, Math.PI / 2], [GANG_NAMES[i][1], ROAD_Y1 + SEL + 8, -Math.PI / 2]]) {
      const g = makeGapura(nm);
      addObj(g, gx, yy, a, { body: g.body, beam: true });
      addBox(gx - 32, yy, 4, 4); addBox(gx + 32, yy, 4, 4);
    }
  });

  // --- tiang listrik + kabel ---
  const pole = makePole();
  const clear = (x, y, rad) => colliders.every(c => c.t === 'c' ? Math.hypot(c.x - x, c.y - y) > c.r + rad
    : Math.abs(c.x - x) > c.hw + rad || Math.abs(c.y - y) > c.hh + rad);
  const poleLine = (pts0, a) => {
    let prev = null;
    for (const [x, y] of pts0.filter(([x, y]) => clear(x, y, 5))) {
      addObj(pole, x, y, a); addCircle(x, y, 3);
      const ends = [-6.5, 5.5].map(o => [x - Math.sin(a) * o, y + Math.cos(a) * o]);
      if (prev) for (let k = 0; k < 2; k++) cables.push([prev[k], ends[k]]);
      prev = ends;
    }
  };
  for (const yy of [ROAD_Y0 - SEL - 6, ROAD_Y1 + SEL + 6]) {
    const pts = [];
    for (let x = 110; x < WW; x += 170) if (GANGS.every(g => Math.abs(x - g) > 50)) pts.push([x, yy]);
    poleLine(pts, 0);
  }
  for (const gx of GANGS) for (const [y0, y1] of PARTS) {
    const pts = [];
    for (let y = y0 + 80; y < y1 - 50; y += 180) if (HGANG.every(h => Math.abs(y - h) > 46)) pts.push([gx + 18, y]);
    poleLine(pts, Math.PI / 2);
  }

  // --- kendaraan tambahan ---
  vehicles.push(newVehicle('car', CAR, 420, 942, 0));
  vehicles.push(newVehicle('bike', bikeModels[1], 520, 1278, 0));
  vehicles.push(newVehicle('motor', motorModels[1], 1660, 1012, 0));

  // --- pohon & jemuran di halaman belakang ---
  const mangos = [makeMango(3), makeMango(11), makeMango(29)], bananas = [makeBanana(5), makeBanana(17)];
  const jemuran = [makeJemuran(2), makeJemuran(9)];
  const free = (x, y, rad) => clear(x, y, rad) && surfAt(x, y) === 0 && vehicles.every(v => Math.hypot(v.x - x, v.y - y) > rad + 20);
  for (let i = 0; i < 1600; i++) {
    const x = 20 + r() * (WW - 40), y = 20 + r() * (WH - 40);
    if (y > ROAD_Y0 - 160 && y < ROAD_Y1 + 130 && GANGS.some((g, k) => k < 3 && x > g + 150 && x < GANGS[k + 1] - 150)) continue;
    if (x > FIELD[0] - 14 && x < FIELD[2] + 14 && y > FIELD[1] - 14 && y < FIELD[3] + 30) continue;
    const kind = r();
    if (kind < 0.42 && free(x, y, 32)) { addObj(pick(mangos), x, y, r() * TAU, { tree: 10 }); addCircle(x, y, 5); }
    else if (kind < 0.84 && free(x, y, 22)) { addObj(pick(bananas), x, y, r() * TAU, { tree: 6 }); addCircle(x, y, 4); }
    else if (kind < 0.9 && free(x, y, 28)) { const a = r() < 0.5 ? 0 : Math.PI / 2; addObj(pick(jemuran), x, y, a, { body: [0, 0, 4, 25] }); addCircle(x - Math.sin(a) * 23, y + Math.cos(a) * 23, 2); addCircle(x + Math.sin(a) * 23, y - Math.cos(a) * 23, 2); }
  }
  paintGround();
}

// Bayangan: tiap kolom voxel diproyeksikan ke tanah searah matahari, lalu dihaluskan
function bakeShadows() {
  const mask = new Uint8Array(WW * WH), ao = new Uint8Array(WW * WH);
  for (const o of objects) {
    const m = o.model, runs = m.runs;
    if (!runs) continue;
    const c = Math.cos(o.a), s = Math.sin(o.a);
    for (let i = 0; i < runs.length; i += 4) {
      const px = runs[i] + 0.5 - m.L / 2, py = runs[i + 1] + 0.5 - m.W / 2, z0 = runs[i + 2], z1 = runs[i + 3];
      const wx = o.x + px * c - py * s, wy = o.y + px * s + py * c;
      if (z0 === 0) { const k = (wy | 0) * WW + (wx | 0); if (k >= 0 && k < ao.length) ao[k] = 1; }
      for (let z = z0; z <= z1 + 1; z += 2) {
        const zz = Math.min(z, z1), sx = (wx + zz * SUN[0]) | 0, sy = (wy + zz * SUN[1]) | 0;
        if (sx >= 0 && sy >= 0 && sx < WW - 1 && sy < WH) { const k = sy * WW + sx; mask[k] = 1; mask[k + 1] = 1; }
      }
    }
  }
  return [blur(mask, 2), blur(ao, 4)];
}
function blur(src, rad) {
  const tmp = new Float32Array(WW * WH), out = new Float32Array(WW * WH), n = rad * 2 + 1;
  for (let y = 0; y < WH; y++) { let acc = 0; const row = y * WW;
    for (let x = -rad; x < WW + rad; x++) { if (x + rad < WW) acc += src[row + x + rad] || 0; if (x - rad - 1 >= 0) acc -= src[row + x - rad - 1]; if (x >= 0 && x < WW) tmp[row + x] = acc / n; } }
  for (let x = 0; x < WW; x++) { let acc = 0;
    for (let y = -rad; y < WH + rad; y++) { if (y + rad < WH) acc += tmp[(y + rad) * WW + x]; if (y - rad - 1 >= 0) acc -= tmp[(y - rad - 1) * WW + x]; if (y >= 0 && y < WH) out[y * WW + x] = acc / n; } }
  return out;
}

function paintGround() {
  const img = gctx.createImageData(WW, WH), d = img.data;
  const C = h => hexRGB(h);
  const grass = ['#6b8a46', '#5f7f3f', '#78965a', '#56743a'].map(C), dry = ['#8e8a5c', '#9a9264'].map(C), soil = ['#86704f', '#7a654a', '#937c5a', '#6f5c44'].map(C);
  const asph = ['#56575b', '#515256', '#5c5d61'].map(C), patch = C('#47484c'), crack = C('#38393c'), worn = C('#4d4e52'), dash = C('#c8c4b4'), crumb = C('#6e6a60');
  const con = ['#a8a49a', '#9e9a90', '#b2aea4'].map(C), conRed = C('#9e7258'), mortar = C('#7e7c76'), mortarMoss = C('#6a7452'), kerb = C('#c6c0b4');
  const tile = C('#cfc7b8'), tile2 = C('#c6bead'), grout = C('#aea592'), teras = C('#d9ccb4'), teras2 = C('#cfc1a8'), terasG = C('#b9a98e');
  const water = C('#3c4636'), water2 = C('#4f5a44'), trash = ['#d84a4a', '#e8e8e0', '#4a7ad0', '#e8c040'].map(C), conc = C('#a39e93'), conc2 = C('#969186');
  const fieldC = ['#a88a5e', '#9e8256', '#b09466'].map(C), fieldG = C('#7a8a4a'), line = C('#e4e2da');
  const midY = (ROAD_Y0 + ROAD_Y1) / 2;
  for (let y = 0; y < WH; y++) for (let x = 0; x < WW; x++) {
    const p = y * WW + x, t = surf[p], n = hash(x, y, 7);
    let c;
    if (t === 0) {
      const g = vnoise(x, y, 46) + (vnoise(x, y, 9) - 0.5) * 0.35, dn = vnoise(x, y, 23, 9);
      if (g > 0.52) c = dn > 0.7 ? dry[n < 0.5 ? 0 : 1] : grass[n < 0.15 ? 0 : n < 0.75 ? 1 : n < 0.93 ? 2 : 3];
      else c = n < 0.012 ? C('#a8a090') : soil[n < 0.3 ? 0 : n < 0.8 ? 1 : n < 0.95 ? 2 : 3];
    } else if (t === 1) {
      c = asph[n < 0.7 ? 0 : n < 0.85 ? 1 : 2];
      if (Math.abs(Math.abs(y - midY) - 21) < 5 && vnoise(x, y, 30, 4) > 0.35) c = worn;          // bekas ban
      if (vnoise(x, y, 70, 8) > 0.74) c = patch;                                              // tambalan
      if (Math.abs(vnoise(x, y, 22, 6) - 0.5) < 0.012 && vnoise(x, y, 120, 12) > 0.68) c = crack;                              // retak
      if (Math.abs(y - midY) < 1.5 && x % 34 < 16 && n < 0.8) c = dash;
      if ((y - ROAD_Y0 < 3 || ROAD_Y1 - y <= 3) && n < 0.35) c = crumb;
    } else if (t === 2) {
      const row = Math.floor(y / 3), off = (row % 2) * 3;
      const edge = surf[p - 1] !== 2 || surf[p + 1] !== 2 || surf[p - WW] !== 2 || surf[p + WW] !== 2 || surf[p - 2] !== 2 || surf[p + 2] !== 2;
      if (edge) c = kerb;
      else if (y % 3 === 0 || (x + off) % 6 === 0) c = vnoise(x, y, 20, 3) > 0.6 ? mortarMoss : mortar;
      else { const b = hash(Math.floor((x + off) / 6), row, 9); c = b < 0.1 ? conRed : con[b < 0.5 ? 0 : b < 0.8 ? 1 : 2]; }
      if (vnoise(x, y, 12, 13) > 0.78) c = c.map(v => v * 0.88);
    } else if (t === 3) {
      c = (x % 8 === 0 || y % 8 === 0) ? grout : (hash(x >> 3, y >> 3, 4) < 0.5 ? tile : tile2);
      if (vnoise(x, y, 16, 21) > 0.7) c = c.map(v => v * 0.93);
    } else if (t === 7) {
      c = (x % 10 === 0 || y % 10 === 0) ? terasG : (hash(x / 10 | 0, y / 10 | 0, 6) < 0.5 ? teras : teras2);
    } else if (t === 4) c = n < 0.006 ? trash[Math.floor(n * 666) % 4] : n < 0.08 ? water2 : water;
    else if (t === 5) c = n < 0.3 ? conc2 : conc;
    else {
      const fx = x - FIELD[0], fy = y - FIELD[1], fw = FIELD[2] - FIELD[0], fh = FIELD[3] - FIELD[1];
      c = vnoise(x, y, 18, 2) > 0.62 + Math.min(fx, fy, fw - fx, fh - fy) * 0.004 ? fieldG : fieldC[n < 0.4 ? 0 : n < 0.8 ? 1 : 2];
      if (fx < 3 || fy < 3 || fw - fx <= 3 || fh - fy <= 3 || Math.abs(fx - fw / 2) < 1.5 || Math.abs(Math.hypot(fx - fw / 2, fy - fh / 2) - 30) < 1.2) c = line.map(v => v * (0.85 + 0.15 * n));
    }
    const k = p * 4; d[k] = c[0]; d[k + 1] = c[1]; d[k + 2] = c[2]; d[k + 3] = 255;
  }
  const [sh, ao] = bakeShadows();
  for (let p = 0; p < WW * WH; p++) {
    const m = Math.min(1, sh[p] * 1.3), a = Math.min(1, ao[p] * 1.6) * 0.3;
    if (m < 0.01 && a < 0.01) continue;
    const k = p * 4, f = 1 - a;
    d[k] *= (1 - 0.46 * m) * f; d[k + 1] *= (1 - 0.42 * m) * f; d[k + 2] *= (1 - 0.3 * m) * f;   // bayangan sedikit kebiruan
  }
  gctx.putImageData(img, 0, 0);
}

// Grid spasial untuk tabrakan
const CELL = 128, cgrid = new Map();
function indexColliders() {
  for (const c of colliders) {
    const hw = c.t === 'c' ? c.r : c.hw, hh = c.t === 'c' ? c.r : c.hh;
    for (let gy = Math.floor((c.y - hh) / CELL); gy <= Math.floor((c.y + hh) / CELL); gy++)
      for (let gx = Math.floor((c.x - hw) / CELL); gx <= Math.floor((c.x + hw) / CELL); gx++) {
        const k = gx + ',' + gy; if (!cgrid.has(k)) cgrid.set(k, []); cgrid.get(k).push(c);
      }
  }
}
function collide(e, r) {
  let hit = false;
  const seen = new Set();
  for (let gy = Math.floor((e.y - r) / CELL); gy <= Math.floor((e.y + r) / CELL); gy++)
    for (let gx = Math.floor((e.x - r) / CELL); gx <= Math.floor((e.x + r) / CELL); gx++) {
      for (const c of cgrid.get(gx + ',' + gy) || []) {
        if (seen.has(c)) continue; seen.add(c);
        if (c.t === 'c') {
          const dx = e.x - c.x, dy = e.y - c.y, d = Math.hypot(dx, dy), m = c.r + r;
          if (d < m && d > 0.001) { e.x = c.x + dx / d * m; e.y = c.y + dy / d * m; hit = true; }
        } else {

}

function startAction(name) {

function doAction(a) {

  if (['fall', 'jump', 'cast', 'roll', 'salute', 'wave'].includes(a)) { if (!bot.action) startAction(a === 'wave' ? 'waveOnce' : a); return; }

function updatePlayer(dt) {

/* ---------- kucing ---------- */
function spawnCats() {
  for (const k in CAT_KINDS) CAT_FRAMES[k] = { walk: [0, 1, 2, 3].map(i => catShape(i / 4 * TAU, CAT_KINDS[k], false)), sit: [0, 1].map(i => catShape(i * Math.PI, CAT_KINDS[k], true)) };

  spots.forEach(([x, y], i) => cats.push({ kind: Object.keys(CAT_KINDS)[i % 3], x, y, a: Math.random() * TAU, home: [x, y], target: null, wait: Math.random() * 3, flee: 0, t: Math.random() * 5 }));
}
function catScare(c, hit) {
  if (c.flee > 0.5) return;
  const a = Math.atan2(c.y - bot.y, c.x - bot.x) + (Math.random() - 0.5) * 0.8;
  c.target = [c.x + Math.cos(a) * 100, c.y + Math.sin(a) * 100]; c.flee = 1.6;

}
function updateCat(c, dt) {

  const dp = Math.hypot(bot.x - c.x, bot.y - c.y);
  if (dp < 36 && (bot.speed > 70 || bot.action)) catScare(c, false);
  for (const v of vehicles) if (v.rider && Math.abs(v.v) > 15 && Math.hypot(v.x - c.x, v.y - c.y) < 44) catScare(c, false);
  if (!c.target) { if ((c.wait -= dt) <= 0) { const a = Math.random() * TAU, r = Math.random() * 60; c.target = [c.home[0] + Math.cos(a) * r, c.home[1] + Math.sin(a) * r]; } return; }
  const dx = c.target[0] - c.x, dy = c.target[1] - c.y, d = Math.hypot(dx, dy);
  if (d < 3) { c.target = null; c.wait = 2 + Math.random() * 5; if (c.flee > 0) c.home = [c.x, c.y]; return; }
  const sp = c.flee > 0 ? 85 : 15;

/* =====================================================================
   7. RENDER
   Urutan gambar: tiap benda punya "kunci" = posisi y layar paling depan dari
   tapak bangunannya. Atap/kanopi/balok gapura = lapis terpisah yang digambar
   setelah tokoh yang berdiri di bawahnya, jadi tumpang tindihnya pas.
   ===================================================================== */
const gameCanvas = document.getElementById('game'), ctx = gameCanvas.getContext('2d');
let VW = 240, VH = 320, PX = 2;
function resizeGame() {
  const w = innerWidth, h = innerHeight;
  PX = Math.max(1, Math.round(Math.min(w, h) / 240));
  VW = Math.ceil(w / PX); VH = Math.ceil(h / PX);
  gameCanvas.width = VW; gameCanvas.height = VH;
  gameCanvas.style.width = VW * PX + 'px'; gameCanvas.style.height = VH * PX + 'px';
}
const bubbleLayer = document.getElementById('bubbles'), bubblePool = [];

function updateCamera(dt, tx, ty, ta) {
  const k = 1 - Math.pow(0.0008, dt);
  cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
  const want = opts.rotCam ? ta + Math.PI / 2 : 0;
  cam.a += Math.atan2(Math.sin(want - cam.a), Math.cos(want - cam.a)) * (1 - Math.pow(0.02, dt));
  if (!opts.rotCam) { const hw = VW / 2, hh = VH / 2; cam.x = Math.max(hw, Math.min(WW - hw, cam.x)); cam.y = Math.max(hh, Math.min(WH - hh, cam.y)); }
}

function drawSunShadow(m, sx, sy, a, h) {

  const c = Math.cos(a + (m.yaw || 0)), s = Math.sin(a + (m.yaw || 0));

  for (const t of [0.05, 0.3, 0.55]) {
    ctx.setTransform(c, s, -s, c, Math.round(sx + ux * h * t), Math.round(sy + uy * h * t));
    ctx.drawImage(m.shadow, -m.L / 2, -m.W / 2);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
}

function render() {
  ctx.imageSmoothingEnabled = false;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#5c7a40'; ctx.fillRect(0, 0, VW, VH);
  const cx = Math.round(VW / 2), cy = Math.round(VH * (opts.rotCam ? 0.62 : 0.5));
  const ca = Math.cos(-cam.a), sa = Math.sin(-cam.a), sp = opts.spacing;
  const toScreen = (x, y) => { const dx = x - cam.x, dy = y - cam.y; return [cx + dx * ca - dy * sa, cy + dx * sa + dy * ca]; };
  ctx.setTransform(ca, sa, -sa, ca, cx, cy);

  ctx.drawImage(ground, 0, 0);
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  const list = [];

    o.key = o.body ? boxKey(o, sy, o.body) : sy;

    if (!vd) continue;
    const rider = v.rider === 'player' ? (v.kind === 'car' ? null : { style: 'player', m: playerModel(), ent: bot }) : v.rider ? { style: v.rider.style, m: npcModel(v.rider), ent: v.rider } : null;

  for (const d of list) {
    const e = d.ent;
    if (!e || !e.bubble || e.bubble.until < bot.time) continue;
    let el = bubblePool[bi];
    if (!el) { el = document.createElement('div'); el.className = 'bubble'; bubbleLayer.appendChild(el); bubblePool.push(el); }
    if (el.textContent !== e.bubble.text) el.textContent = e.bubble.text;
    el.style.display = ''; el.style.left = d.sx * PX + 'px'; el.style.top = (d.sy - (d.model.H + d.lift + 4) * sp) * PX + 'px';

}

/* ---------- loop ---------- */
let last = performance.now(), current = 'game', ready = false;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (ready) {
    bot.time += dt;
    if (current === 'game') {
      updatePlayer(dt);
      for (const n of npcs) updateNPC(n, dt);
      for (const c of cats) updateCat(c, dt);
      const lead = bot.riding ? 0.35 : 0.2;
      updateCamera(dt, bot.x + (bot.riding ? Math.cos(bot.a) * bot.riding.v : bot.vx) * lead, bot.y + (bot.riding ? Math.sin(bot.a) * bot.riding.v : bot.vy) * lead, bot.a);
      render();
      updateRideButton();
    } else renderTut(t / 1000);

    const total = parts.reduce((a, p) => a + p[1] * s, 0) + 6 * 3;
    let x = Math.round((TW - total) / 2);
    const base = Math.round(TH / 2 + Math.max(L, H) * s / 2);
    for (const [img, w, h, rot] of parts) {
      if (rot) { c.save(); c.translate(x + w * s / 2, base - h * s / 2); c.rotate(-Math.PI / 2); c.drawImage(img, -h * s / 2, -w * s / 2, h * s, w * s); c.restore(); }
      else blit(img, x, base - h * s, s);
      c.fillStyle = '#bbb'; c.fillRect(x, base + 4, w * s, 1);
      x += w * s + 6;
    }
  } else if (step === 1) {
    const z = Math.floor(t * 3) % H, row = H - 1 - z;
    const s = H * 2 <= 90 ? 2 : 1;
    blit(VC.side, 6, 6, s);
    c.fillStyle = 'rgba(255,200,0,0.5)'; c.fillRect(4, 6 + row * s, L * s + 4, s);
    const bs = Math.max(1, Math.min(3, Math.floor(90 / W), Math.floor(100 / L)));
    const bx = TW - L * bs - 8;
    c.fillStyle = '#999'; c.fillRect(12 + L * s, 6 + row * s, bx - 16 - L * s, 1);
    c.fillStyle = '#eee'; c.fillRect(bx - 2, 4, L * bs + 4, W * bs + 4);
    if (M.slices[z]) blit(M.slices[z], bx, 6, bs);
    // contoh beberapa slice
    const gy0 = Math.max(10 + H * s, 10 + W * bs) + 6, cs = L > 30 ? 0.5 : 1;
    const cw = Math.ceil(L * cs) + 3, ch = Math.ceil(W * cs) + 3, per = Math.floor((TW - 8) / cw), rows = Math.max(1, Math.floor((TH - gy0 - 4) / ch));
    const shown = Math.min(H, per * rows), stepZ = H / shown;
    for (let i = 0; i < shown; i++) {
      const zi = Math.floor(i * stepZ), gx = 4 + (i % per) * cw, gy = gy0 + Math.floor(i / per) * ch;
      c.fillStyle = zi <= z && z < Math.floor((i + 1) * stepZ) ? '#ffd24a' : '#eee';
      c.fillRect(gx - 1, gy - 1, Math.ceil(L * cs) + 2, Math.ceil(W * cs) + 2);
      if (M.slices[zi]) c.drawImage(M.slices[zi], gx, gy, L * cs, W * cs);
    }
  } else {
    if (document.getElementById('tAuto').checked) {
      tutAngle += 0.9 / 60;
      document.getElementById('tAngle').value = Math.round((tutAngle * 180 / Math.PI) % 360);
    }
    const sp = +document.getElementById('tSpace').value;
    let model = M;
    if (tutChar === 'robot') model = ROBOT_FRAMES[Math.floor(t * 6) % 4];
    if (tutChar === 'human') {
      const name = document.getElementById('tAnim').value, A = ANIMS[name], sid = document.getElementById('tStyle').value;
      const total = A.n + (A.loop ? 0 : Math.round(A.fps * 0.6));
      model = hframe(sid, name, Math.min(A.n - 1, Math.floor(t * A.fps) % total));
    }
    const hgt = (model.H + (model.lift || 0)) * sp;
    const s = hgt * 2 + Math.max(L, W) * 2 > TH - 6 ? 1 : 2;
    const baseY = Math.round(TH / 2 + (hgt * s) / 2 - 4);
    drawShadow(c, model, TW / 2, baseY, tutAngle, s);
    drawStack(c, model, TW / 2, baseY, tutAngle, sp, s);
  }
}
function setStep(i) {
  step = i;
  document.querySelectorAll('#tutCtl .btn').forEach(b => b.classList.toggle('on', +b.dataset.step === i));
  const v = f => typeof f === 'function' ? f() : f;
  document.getElementById('tutTitle').textContent = v(STEPS[i].title);
  document.getElementById('tutText').textContent = v(STEPS[i].text);
  document.getElementById('tutSliders').style.visibility = i === 2 ? 'visible' : 'hidden';
  document.getElementById('tAnimWrap').style.display = tutChar === 'human' ? '' : 'none';
  document.getElementById('tStyleWrap').style.display = tutChar === 'human' ? '' : 'none';
}
document.querySelectorAll('#tutCtl .btn').forEach(b => b.onclick = () => setStep(+b.dataset.step));
document.getElementById('tSpace').oninput = e => document.getElementById('tSpaceV').textContent = e.target.value;
document.getElementById('tAngle').oninput = e => { document.getElementById('tAuto').checked = false; tutAngle = e.target.value * Math.PI / 180; };
for (const k in ANIMS) document.getElementById('tAnim').add(new Option(ANIMS[k].name, k));
for (const k in STYLES) document.getElementById('tStyle').add(new Option(STYLES[k].name, k));
document.getElementById('tAnim').value = 'walk';
document.getElementById('tChar').onchange = e => { tutChar = e.target.value; setStep(step); };
document.getElementById('tStyle').onchange = () => setStep(step);

function show(which) {
  current = which;
  document.getElementById('scrGame').classList.toggle('on', which === 'game');
  document.getElementById('scrTut').classList.toggle('on', which === 'tut');
  document.getElementById('tabGame').classList.toggle('on', which === 'game');
  document.getElementById('tabTut').classList.toggle('on', which === 'tut');
  if (which === 'tut') setStep(step);
}
document.getElementById('tabGame').onclick = () => show('game');
document.getElementById('tabTut').onclick = () => show('tut');
addEventListener('resize', () => { resizeGame(); resizeTut(); });

/* ---------- start ---------- */
resizeGame(); resizeTut();
requestAnimationFrame(frame);
setTimeout(() => {
  const t0 = performance.now();
  buildWorld(); indexColliders(); spawnNPCs(); spawnCats();
  hframe('player', 'idle', 0);
  for (const a of ['walk', 'idle', 'run']) queueAnim('player', a);
  for (const a of ['walk', 'run']) queueAnim('player', a, 'lower');
  console.log('world built in', Math.round(performance.now() - t0), 'ms; objects', objects.length, 'vehicles', vehicles.length);
  ready = true;
  document.getElementById('loading').style.display = 'none';
  if (location.hash === '#tut') show('tut');
}, 30);
</script>
